name: Guard release

# Builds, signs and publishes the kombify Guard artifacts the control plane
# serves. Signing is Sigstore keyless: the certificate identity of every
# signature is this workflow file on the main branch of this repository, run on a
# GitHub-hosted runner by a dispatch or the nightly schedule, which is exactly
# what each Guard's privileged executor pins (pkg/guardrelease.DefaultIdentity).
# There is no signing key to custody.
#
#   workflow_dispatch  mode "publish": builds and signs a version's published
#                      binaries once from the exact commit it runs on, publishes
#                      them as assets of the release guard-v<version> and signs a
#                      fresh manifest. Runs in the GitHub Environment
#                      guard-release; stable releases require reviewers,
#                      while fast pre-1.0 publication is automatic.
#   workflow_dispatch  mode "candidate": builds and signs the exact main source
#                      and its pinned runtime into a run-scoped Actions artifact.
#                      Uses the same guard-release Environment and identity;
#                      never publishes a release, replaces assets or delivers.
#                      Retains the declared version; identify it by source/run/
#                      artifact digests. Never serve it on Stable/Early Access;
#                      revoke an individual candidate by its binary digest.
#   schedule           mode "refresh": re-signs the manifest of the Guard version
#                      pinned in the Dockerfile from its published binaries, so
#                      the freshness window never lapses and revocations in
#                      guard-release-policy.json reach the control plane within a
#                      day. It never builds or publishes a binary. Runs in the
#                      Environment guard-release-refresh (branch-restricted, no
#                      reviewers, so the nightly run is not blocked on a person).
#
# Both Environments must exist and be restricted to the main branch; the first
# step of the job verifies this and fails the run before anything is signed
# (docs/DEPLOYMENT.md, "Release prerequisites"). An unprotected Environment that
# GitHub creates on first use does not pass.
#
# A release becomes live only when the control plane image is built with
# GUARD_RELEASE_VERSION=<version> or its default, the source's .kombify/VERSION
# (see Dockerfile, stage guard-release); the
# running control plane then refreshes the manifest of that version from this
# release (internal/routes/workers_release_refresh.go). Merging or publishing
# here changes nothing on a server.
#
# Never interpolate an expression into a shell script: untrusted or
# operator-supplied values reach a step only through `env:` and are validated
# before use.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish a prepared release, or sign a nonpublishing Preview/Stage candidate"
        required: false
        type: choice
        options:
          - publish
          - candidate
        default: publish
      version:
        description: "Declared Guard product version X.Y.Z (must match the exact source)"
        required: false
        type: string
      expected_source_sha:
        description: "Required full source SHA: candidate must equal this main run; publication admits prepared source and historical private asset reuse only"
        required: false
        type: string
      stackkits_candidate:
        description: "Internal candidate only: exact sourceSha/runId/runAttempt/artifactId/artifactSha256/indexSha256 JSON; never a public release"
        required: false
        type: string
      deliver_after_publish:
        description: "After a fresh publication of the prepared release, dispatch Delivery v2 (set only by guard-release-on-release.yml)"
        required: false
        type: boolean
        default: false
      database_gate:
        description: "Database leg of this release (set only by guard-release-on-release.yml): none, refused, or the database Delivery run ID the service leg waits for"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "41 4 * * *"

permissions: {}

# One lane per prepared source: a publication of one release never queues behind
# a run of another release (a run parked at its Environment gate held the single
# shared lane and starved every later release). The nightly refresh keeps its
# own lane. Same-source dispatches still serialise.
concurrency:
  group: guard-release-${{ github.event_name == 'workflow_run' && format('recheck-{0}', github.event.workflow_run.id) || github.event_name == 'workflow_dispatch' && inputs.mode == 'candidate' && format('candidate-{0}', inputs.expected_source_sha || github.run_id) || github.event_name == 'workflow_dispatch' && (inputs.expected_source_sha || inputs.version || github.run_id) || 'refresh' }}
  cancel-in-progress: false

jobs:
  release:
    # A run from any ref other than main cannot produce evidence Guards accept;
    # do not start it at all.
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && (github.repository == 'kombifyio/TechStack' || github.repository == 'kombifyio/TechStack')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && 'guard-release' || 'guard-release-refresh' }}
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'publish') || 'refresh' }}
      RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && 'guard-release' || 'guard-release-refresh' }}
      # cosign is the upstream release binary at this exact version, pinned by
      # its SHA-256 (cosign_checksums.txt of that release). Building it from
      # source took about 5 of the 6.5 minutes this job adds to every Techstack
      # rollout. Bump both values together in a reviewed pull request.
      COSIGN_VERSION: v3.1.3
      COSIGN_LINUX_AMD64_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      GH_TOKEN: ${{ github.token }}
    steps:
      # Resolve maturity from the exact product source, never a caller-selected
      # lower version. Environment restrictions remain required for both profiles.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve declared product version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          STACKKITS_CANDIDATE_BINDING: ${{ inputs.stackkits_candidate }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DELIVER_AFTER_PUBLISH: ${{ inputs.deliver_after_publish }}
          DATABASE_GATE: ${{ inputs.database_gate }}
        run: |
          set -euo pipefail
          if [ -n "${STACKKITS_CANDIDATE_BINDING:-}" ]; then
            [ ! -f .techstack-public-export.json ] || {
              echo '::error::Private StackKits candidates are unavailable in the public export profile.' >&2; exit 1;
            }
            [ "$RELEASE_MODE" = candidate ] && [ "$GITHUB_REPOSITORY" = kombifyio/TechStack ] || {
              echo '::error::Private StackKits candidate input is allowed only in the existing private Guard candidate mode.' >&2; exit 1;
            }
          fi
          source_sha="$GITHUB_SHA"
          reuse_private=false
          case "$GITHUB_EVENT_NAME:$RELEASE_MODE" in workflow_dispatch:publish|workflow_dispatch:candidate|schedule:refresh) ;; *) echo '::error::Unknown Guard release event/mode.' >&2; exit 1 ;; esac
          if [ "$RELEASE_MODE" = candidate ]; then
            [[ "${EXPECTED_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] &&
              [ "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA" ] && [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ] || {
              echo '::error::A Guard candidate must build the exact authenticated main run source; historical and PR sources are refused.' >&2
              exit 1
            }
            # Delayed jobs and reruns retain their original GITHUB_SHA. Read
            # current main with the job token, before the later read-token swap.
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            [ "$current_main" = "$GITHUB_SHA" ] || {
              echo '::error::Main moved since this candidate run was selected; dispatch the current main source.' >&2
              exit 1
            }
            [ "${DELIVER_AFTER_PUBLISH:-false}" != true ] && [ -z "${DATABASE_GATE:-}" ] || {
              echo '::error::A Guard candidate cannot request Delivery or a database leg.' >&2
              exit 1
            }
          fi
          if [ "$RELEASE_MODE" = publish ]; then
            [[ "${EXPECTED_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ] || {
              echo '::error::Guard publication requires an exact admitted source and authenticated main checkout.' >&2
              exit 1
            }
            source_sha="$EXPECTED_SOURCE_SHA"
            if [ "$source_sha" != "$GITHUB_SHA" ]; then
              # A later main run cannot sign or rebuild an older prepared source.
              # It may only authenticate that source's already-published bytes.
              test ! -f .techstack-public-export.json
              git cat-file -e "${source_sha}:.kombify/version-policy.json"
              history="$(git rev-list --first-parent --max-count=10001 "$GITHUB_SHA" --not "${source_sha}^@")"
              test "$(printf '%s\n' "$history" | wc -l)" -le 10000
              grep -qx "$source_sha" <<<"$history"
              test -z "$(git rev-list --first-parent "${source_sha}..${GITHUB_SHA}" -- '.kombify/VERSION' '.kombify/version-policy.json')"
              source_version="$(node scripts/release-version.mjs resolve "$source_sha")"
              test "${source_version%%.*}" = 0
              reuse_private=true
            fi
          fi
          if [ -f .techstack-public-export.json ]; then
            # The receipt is checked before any generated files or downloads.
            node scripts/verify-public-export.mjs
            version="$(tr -d '[:space:]' < VERSION)"
            echo 'public=true' >> "$GITHUB_OUTPUT"
          else
            version="$(node scripts/release-version.mjs resolve "$source_sha")"
            echo 'public=false' >> "$GITHUB_OUTPUT"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [ -n "${INPUT_VERSION:-}" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo '::error::The Guard version must match the declared version of this exact source.' >&2
            exit 1
          fi
          if [ "$RELEASE_MODE" = refresh ]; then
            if [ -f .techstack-public-export.json ]; then
              # Untagged public main may be newer than the product users run.
              # Refresh the already-published numeric product, never manufacture
              # a seed for an unreleased source/version during a schedule.
              product_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
              [[ "$product_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              version="${product_tag#v}"
            else
              version="$(tr -d '[:space:]' < .kombify/VERSION)"
            fi
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo '::error::Manifest refresh requires a numeric product version in .kombify/VERSION.' >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "reuse-private=$reuse_private" >> "$GITHUB_OUTPUT"

      - name: Require the protected release Environment
        shell: bash
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Unprotected release environment::$1" >&2; exit 1; }
          api="repos/${GITHUB_REPOSITORY}/environments/${RELEASE_ENVIRONMENT}"
          environment="$(gh api "$api")" || fail "Environment '${RELEASE_ENVIRONMENT}' cannot be read. Create it and restrict it as described in docs/DEPLOYMENT.md (Release prerequisites)."
          jq -e --arg name "$RELEASE_ENVIRONMENT" '.name == $name' <<<"$environment" >/dev/null \
            || fail "The release did not run in Environment '${RELEASE_ENVIRONMENT}'."
          jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"$environment" >/dev/null \
            || fail "Environment '${RELEASE_ENVIRONMENT}' must restrict deployments to selected branches (custom branch policy: main only)."
          branches="$(gh api "${api}/deployment-branch-policies" --jq '[.branch_policies[] | select((.type // "branch") == "branch") | .name] | sort | join(",")')"
          tags="$(gh api "${api}/deployment-branch-policies" --jq '[.branch_policies[] | select(.type == "tag")] | length')"
          [ "$branches" = "main" ] && [ "$tags" = "0" ] \
            || fail "Environment '${RELEASE_ENVIRONMENT}' must allow exactly the branch 'main' and no tag (found branches '${branches}', ${tags} tag policies)."
          if { [ "$RELEASE_MODE" = publish ] || [ "$RELEASE_MODE" = candidate ]; } && [ "${PRODUCT_VERSION%%.*}" != "0" ]; then
            jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length > 0' <<<"$environment" >/dev/null \
              || fail "Environment '${RELEASE_ENVIRONMENT}' must require reviewers before stable-version Guard publication or candidate signing."
          fi

      # No build or module cache may flow into a job that holds a signing token.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # Least privilege: Contents read on exactly the private module repos.
      - name: Mint the CI App private-module read token
        id: modules-token
        if: steps.version.outputs.public != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kombify-go-common
          permission-contents: read

      - name: Use read-only App access for private candidate reads
        if: env.RELEASE_MODE == 'candidate' && steps.version.outputs.public != 'true'
        shell: bash
        env:
          READ_TOKEN: ${{ steps.modules-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          printf 'GH_TOKEN=%s\n' "$READ_TOKEN" >> "$GITHUB_ENV"

      # The token lives only in this step's environment and a temporary git
      # config the script removes; later steps build from the verified cache.
      # Separate least-privilege token: never widen the module token. Contents
      # read fetches only the canonical trust policy at the expected source.
      - name: Mint the exact StackKits candidate read token
        id: stackkits-candidate-token
        if: env.RELEASE_MODE == 'candidate' && inputs.stackkits_candidate != '' && steps.version.outputs.public != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kombify-StackKits
          permission-actions: read
          permission-contents: read

      - name: Authenticate the exact private StackKits candidate
        id: stackkits-candidate
        if: env.RELEASE_MODE == 'candidate' && inputs.stackkits_candidate != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.stackkits-candidate-token.outputs.token }}
          STACKKITS_CANDIDATE_BINDING: ${{ inputs.stackkits_candidate }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          # Same checksum-pinned client as canonical StackKits attestation verification.
          work="$(mktemp -d)"
          curl --fail --silent --show-error --location https://github.com/cli/cli/releases/download/v2.92.0/gh_2.92.0_linux_amd64.tar.gz --output "$work/gh.tar.gz"
          echo "b57848131bdf0c229cd35e1f2a51aa718199858b2e728410b37e89a428943ec4  $work/gh.tar.gz" | sha256sum -c -
          tar -xzf "$work/gh.tar.gz" -C "$work"
          PATH="$work/gh_2.92.0_linux_amd64/bin:$PATH" python3 scripts/verify-stackkits-preview-candidate.py
          rm -rf "$work"

      - name: Download Go modules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.modules-token.outputs.token }}
          PUBLIC_PROFILE: ${{ steps.version.outputs.public }}
        run: |
          set -euo pipefail
          if [ "$PUBLIC_PROFILE" = true ]; then
            # Projected public modules are source in this tree; no private
            # credential, helper or package feed is required in this profile.
            unset GITHUB_TOKEN GOPRIVATE GONOSUMDB GONOPROXY
            go mod download
          else
            test -n "${GITHUB_TOKEN:-}" || { echo "::error::The CI App private-module read token is required" >&2; exit 1; }
            export GOPRIVATE=github.com/kombifyio/*
            node scripts/go-mod-download.mjs
          fi
          git diff --exit-code -- go.mod go.sum

      - name: Install cosign and the release tool
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/guard-release-bin"
          mkdir -p "$bin"
          # Checksum-pinned upstream binary: no unpinned action and no
          # unverified download runs in this job.
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" --output "$bin/cosign"
          echo "${COSIGN_LINUX_AMD64_SHA256}  $bin/cosign" | sha256sum -c -
          chmod 0755 "$bin/cosign"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false -o "$bin/guard-release-tool" ./cmd/guard-release-tool
          echo "$bin" >> "$GITHUB_PATH"

      # A version's published binaries are signed once. Published binaries are reused
      # byte for byte, and a release whose binaries cannot all be fetched is an
      # error: nothing is ever rebuilt into a published version. A candidate
      # builds fresh bytes into a separate run artifact and never reads a release.
      - name: Fetch published binaries or build them
        id: binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source-sha }}
          REUSE_PRIVATE: ${{ steps.version.outputs.reuse-private }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="guard-v${VERSION}"
          binary_assets="techstack-linux-amd64 techstack-linux-amd64.sigstore.json techstack-linux-arm64 techstack-linux-arm64.sigstore.json"
          release_state=absent
          if [ "$RELEASE_MODE" != candidate ]; then
            if out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1)"; then
              release_state=present
              names="$(jq -r '.assets[].name' <<<"$out")"
            elif ! grep -q 'HTTP 404' <<<"$out"; then
              echo "::error::cannot read release ${tag}: ${out}" >&2
              exit 1
            fi
          fi
          have=0
          if [ "$release_state" = present ]; then
            for asset in $binary_assets; do
              if grep -qx "$asset" <<<"$names"; then have=$((have + 1)); fi
            done
          fi
          if [ "$REUSE_PRIVATE" = true ]; then
            [ "$release_state" = present ] && [ "$have" -eq 4 ] || {
              echo '::error::The exact historical private Guard release is missing or partial; fresh signing must run while its source is current main.' >&2
              exit 1
            }
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            jq -e --arg source "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $source' <<<"$ref" >/dev/null
          fi
          if [ "$have" -eq 4 ]; then
            gh release download "$tag" --dir dist --pattern 'techstack-linux-*'
            for asset in $binary_assets; do
              [ -s "dist/$asset" ] || { echo "::error::release ${tag} lists ${asset} but it could not be downloaded" >&2; exit 1; }
            done
            gh release download "$tag" --dir dist --pattern 'release-manifest*'
            runtime_assets=0
            for arch in amd64 arm64; do
              asset="stackkit-runtime-linux-${arch}.tar.gz"
              if grep -qx "$asset" <<<"$names"; then
                gh release download "$tag" --dir dist --pattern "$asset"
                runtime_assets=$((runtime_assets + 1))
              fi
            done
            [ "$runtime_assets" -ne 1 ] || { echo '::error::Published runtime archive pair is incomplete.' >&2; exit 1; }
            # Authenticate the old manifest and any paired payload BEFORE its
            # immutable runtime identity is carried into a refreshed manifest.
            if [ "$REUSE_PRIVATE" = true ]; then
              [ "$runtime_assets" -eq 2 ] || { echo '::error::Historical private Guard reuse requires both runtime archives.' >&2; exit 1; }
              guard-release-tool verify dist --expected-source "$SOURCE_SHA" --require-runtime-bundles --require-current-policy
              source_docker="$(git show "${SOURCE_SHA}:Dockerfile")"
              source_arg() { sed -n "s/^ARG $1=\"\([^\"]*\)\"\$/\1/p" <<<"$source_docker"; }
              sk_version="$(source_arg STACKKIT_RELEASE_TAG)"
              sk_kit="$(source_arg STACKKIT_RELEASE_KIT)"
              sk_archive="$(source_arg STACKKIT_RELEASE_ARCHIVE_SHA256)"
              sk_index="$(source_arg STACKKIT_RELEASE_INDEX_SHA256)"
              sk_compat="$(source_arg STACKKIT_RELEASE_COMPATIBILITY_SHA256)"
              sk_catalog="$(source_arg STACKKIT_RELEASE_USE_CASE_CATALOG_SHA256)"
              for value in "$sk_version" "$sk_kit" "$sk_archive" "$sk_index" "$sk_compat" "$sk_catalog"; do test -n "$value"; done
              jq -e --arg version "$VERSION" --arg sk "$sk_version" --arg archive "$sk_archive" \
                '.version == $version and .stackkits.version == $sk and .stackkits.archiveSha256 == $archive' dist/release-manifest.json >/dev/null
              for arch in amd64 arm64; do
                archive="dist/stackkit-runtime-linux-${arch}.tar.gz"
                tar -xOf "$archive" .stackkit/stackkits-release-pin.json | jq -e \
                  --arg version "$sk_version" --arg kit "$sk_kit" --arg index "$sk_index" --arg arch "$arch" \
                  --slurpfile manifest dist/release-manifest.json \
                  '($manifest[0].stackkits | if $arch == "arm64" then .linuxArm64 else . end) as $runtime |
                   .schemaVersion == "techstack.stackkit-release-pin/v2" and .kit == $kit and .version == $version and
                   .platform.os == "linux" and .platform.arch == $arch and .indexSha256 == $index and
                   .archiveSha256 == $runtime.archiveSha256 and .binarySha256 == $runtime.binarySha256' >/dev/null
                test "$(tar -xOf "$archive" .stackkit/stackkits-compatibility-v1.json | sha256sum | cut -d' ' -f1)" = "$sk_compat"
                test "$(tar -xOf "$archive" .stackkit/stackkits-use-case-catalog-v1.json | sha256sum | cut -d' ' -f1)" = "$sk_catalog"
              done
            elif [ "$RELEASE_MODE" = publish ]; then
              guard-release-tool verify dist --refresh-published --expected-source "$GITHUB_SHA"
            else
              guard-release-tool verify dist --refresh-published
            fi
            jq -e --arg version "$VERSION" '.version == $version' dist/release-manifest.json >/dev/null
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "runtime_assets=$runtime_assets" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$have" -ne 0 ]; then
            echo "::error::release ${tag} holds only some of its signed binaries; it is never rebuilt. Remove the incomplete release and its tag by hand, then run again." >&2
            exit 1
          fi
          if [ "$RELEASE_MODE" != "publish" ] && [ "$RELEASE_MODE" != candidate ]; then
            echo "::error::the scheduled refresh only re-signs a manifest for a release that already holds signed binaries; release ${tag} has none. Dispatch the release first." >&2
            exit 1
          fi
          if [ "$release_state" = present ]; then
            # An empty leftover release: its tag must point at this very commit.
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::release ${tag} exists without binaries and its tag points at ${tag_sha}, not at ${GITHUB_SHA}. Remove it by hand, then run again." >&2
              exit 1
            fi
          fi
          rm -rf dist && mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -mod=readonly -buildvcs=false -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.buildRevision=${GITHUB_SHA}" \
              -o "dist/techstack-linux-${arch}" ./cmd/techstack
            # A release Guard carries no build tags: the guardqualification tag
            # links a harness-only signer identity (pkg/guardrelease).
            if go version -m "dist/techstack-linux-${arch}" | grep -Eq '^[[:space:]]+build[[:space:]]+-tags='; then
              echo "::error::dist/techstack-linux-${arch} was built with build tags; a release Guard is built without any." >&2
              exit 1
            fi
          done
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "runtime_assets=2" >> "$GITHUB_OUTPUT"

      - name: Sign new binaries
        if: steps.binaries.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            cosign sign-blob --yes \
              --bundle "dist/techstack-linux-${arch}.sigstore.json" \
              "dist/techstack-linux-${arch}"
          done

      - name: Build the release manifest
        if: steps.version.outputs.reuse-private != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILT: ${{ steps.binaries.outputs.built }}
          STACKKITS_CANDIDATE_DIR: ${{ steps.stackkits-candidate.outputs.directory }}
        run: |
          set -euo pipefail
          # The policy file carries the minimum admitted version and the
          # revocations; changing it and letting this workflow run is how a bad
          # Guard release is revoked fleet-wide.
          policy=guard-release-policy.json
          jq -e '.minimumAdmittedVersion and (.revokedVersions | type == "array") and (.revokedDigests | type == "array")' "$policy" >/dev/null
          artifacts="[]"
          for arch in amd64 arm64; do
            file="dist/techstack-linux-${arch}"
            artifacts="$(jq -c --arg arch "$arch" --arg sha "$(sha256sum "$file" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$file")" \
              '. + [{os:"linux",arch:$arch,sha256:$sha,size:$size}]' <<<"$artifacts")"
          done

          if [ "$BUILT" = false ]; then
            # The verified published identity is immutable. In particular a
            # historical release without paired assets must not acquire a new
            # runtime identity from today's compiler pins during refresh.
            stackkits="$(jq -c '.stackkits // null' dist/release-manifest.json)"
          else
          # The StackKits runtime the control plane image pins (Dockerfile stage
          # stackkit-release-cache), for both architectures. Its files run as
          # root on the node, so the signed manifest names the digest of the
          # WHOLE runtime bundle tree, not only the executables; the privileged
          # executor installs a runtime bundle only when its tree matches. The
          # tree is assembled by the same script the image build uses.
          dockerfile_arg() { sed -n "s/^ARG $1=\"\(.*\)\"\$/\1/p" Dockerfile | head -n 1; }
          sk_tag="$(dockerfile_arg STACKKIT_RELEASE_TAG)"
          sk_kit="$(dockerfile_arg STACKKIT_RELEASE_KIT)"
          sk_bootstrap_kit="$(dockerfile_arg STACKKIT_RELEASE_BOOTSTRAP_KIT)"
          sk_repo="$(dockerfile_arg STACKKIT_RELEASE_REPO)"
          sk_index_sha="$(dockerfile_arg STACKKIT_RELEASE_INDEX_SHA256)"
          sk_compat_sha="$(dockerfile_arg STACKKIT_RELEASE_COMPATIBILITY_SHA256)"
          sk_catalog_sha="$(dockerfile_arg STACKKIT_RELEASE_USE_CASE_CATALOG_SHA256)"
          sk_amd64_sha="$(dockerfile_arg STACKKIT_RELEASE_ARCHIVE_SHA256)"
          for value in "$sk_tag" "$sk_kit" "$sk_bootstrap_kit" "$sk_repo" "$sk_index_sha" "$sk_compat_sha" "$sk_catalog_sha" "$sk_amd64_sha"; do
            test -n "$value"
          done
          base="https://github.com/${sk_repo}/releases/download/${sk_tag}"
          work="$(mktemp -d)"
          # The arm64 archive digest comes from the release index, whose own
          # digest is pinned in the Dockerfile (and repinned with it), so no
          # second pin can go stale. The amd64 entry must equal the Dockerfile pin.
          curl --fail --silent --show-error --location "${base}/stackkits-release-index-v1.json" --output "$work/index.json"
          echo "${sk_index_sha}  $work/index.json" | sha256sum -c -
          index_archive_sha() {
            jq -er --arg kit "$sk_bootstrap_kit" --arg version "$sk_tag" --arg arch "$1" \
              '[.assets[] | select(.kit == $kit and .version == $version and .platform.os == "linux" and .platform.arch == $arch)] | if length == 1 then .[0].archive.sha256 else error("not exactly one asset") end' \
              "$work/index.json"
          }
          declare -A sk_archive_sha=([amd64]="$(index_archive_sha amd64)" [arm64]="$(index_archive_sha arm64)")
          test "${sk_archive_sha[amd64]}" = "$sk_amd64_sha"
          printf '%s' "${sk_archive_sha[arm64]}" | grep -Eq '^[0-9a-f]{64}$'
          curl --fail --silent --show-error --location "${base}/stackkits-compatibility-v1.json" --output "$work/compat.json"
          echo "${sk_compat_sha}  $work/compat.json" | sha256sum -c -
          curl --fail --silent --show-error --location "${base}/stackkits-use-case-catalog-v1.json" --output "$work/catalog.json"
          echo "${sk_catalog_sha}  $work/catalog.json" | sha256sum -c -

          runtime_for_arch() {
            local arch="$1" dir="$work/$1"
            mkdir -p "$dir/release" "$dir/out"
            local candidate_args=()
            if [ -n "${STACKKITS_CANDIDATE_DIR:-}" ]; then
              test "$RELEASE_MODE" = candidate
              local candidate_name
              candidate_name="$(jq -er --arg arch "$arch" '.archives[$arch].name' "$STACKKITS_CANDIDATE_DIR/verified.json")"
              sk_archive_sha[$arch]="$(jq -er --arg arch "$arch" '.archives[$arch].sha256' "$STACKKITS_CANDIDATE_DIR/verified.json")"
              sk_index_sha="$(jq -er '.candidate.indexSha256' "$STACKKITS_CANDIDATE_DIR/verified.json")"
              test "$(jq -er '.declaredVersion' "$STACKKITS_CANDIDATE_DIR/verified.json")" = "${sk_tag#v}"
              cp "$STACKKITS_CANDIDATE_DIR/package/$candidate_name" "$dir/release.tar.gz"
              candidate_args=("$STACKKITS_CANDIDATE_DIR")
            else
              curl --fail --silent --show-error --location \
                "${base}/stackkits-${sk_bootstrap_kit}_${sk_tag#v}_linux_${arch}.tar.gz" --output "$dir/release.tar.gz"
            fi
            echo "${sk_archive_sha[$arch]}  $dir/release.tar.gz" | sha256sum -c - >&2
            if [ -n "${STACKKITS_CANDIDATE_DIR:-}" ]; then
              # Only ordinary bounded paths were extracted by the authenticated
              # candidate importer. No GNU tar extraction of candidate input.
              cp -R "$STACKKITS_CANDIDATE_DIR/extracted/$arch/." "$dir/release/"
            else
            tar --extract --gzip --file "$dir/release.tar.gz" --directory "$dir/release" stackkit stackkit-server stackkit-mcp tofu terramate
            listing="$(tar --list --gzip --file "$dir/release.tar.gz")"
            # Some release archives contain only individual provider entries,
            # without a providers/ directory header. Extract the entire mirror
            # by its bounded prefix rather than assuming a directory entry.
            tar --extract --gzip --file "$dir/release.tar.gz" --directory "$dir/release" --wildcards 'providers/*'
            if grep -qx 'docs/data/advanced-operations/latest.json' <<<"$listing"; then
              tar --extract --gzip --file "$dir/release.tar.gz" --directory "$dir/release" docs/data/advanced-operations/latest.json
            fi
            fi
            STACKKIT_RELEASE_KIT="$sk_kit" STACKKIT_RELEASE_TAG="$sk_tag" \
              STACKKIT_RELEASE_ARCHIVE_SHA256="${sk_archive_sha[$arch]}" STACKKIT_RELEASE_INDEX_SHA256="$sk_index_sha" \
              sh scripts/stackkit-runtime-tree.sh "$arch" "$dir/release" "$work/compat.json" "$work/catalog.json" "$dir/out" "${candidate_args[@]}" >&2
            local tree archive
            tree="$(guard-release-tool tree-digest "$dir/out/.stackkit")"
            # The image ships the same tree as a tar.gz; its archive digest must
            # be the tree digest, or the executor would refuse the bundle.
            tar --create --gzip --file "dist/stackkit-runtime-linux-${arch}.tar.gz" --directory "$dir/out" .stackkit
            archive="$(guard-release-tool archive-digest "dist/stackkit-runtime-linux-${arch}.tar.gz")"
            test "$tree" = "$archive"
            jq -cn --arg archive "${sk_archive_sha[$arch]}" \
              --arg binary "$(sha256sum "$dir/out/.stackkit/bin/stackkit" | cut -d' ' -f1)" \
              --arg server "$(sha256sum "$dir/out/.stackkit/bin/stackkit-server" | cut -d' ' -f1)" \
              --arg bundle "$tree" \
              '{archiveSha256:$archive,binarySha256:$binary,serverSha256:$server,bundleSha256:$bundle}'
          }
          amd64_runtime="$(runtime_for_arch amd64)"
          arm64_runtime="$(runtime_for_arch arm64)"
          stackkits="$(jq -cn --arg version "$sk_tag" --argjson amd64 "$amd64_runtime" --argjson arm64 "$arm64_runtime" \
            '{version:$version} + $amd64 + {linuxArm64:$arm64}')"
          fi
          if [ -n "${STACKKITS_CANDIDATE_DIR:-}" ]; then
            test "$RELEASE_MODE" = candidate && test "$BUILT" = true
            stackkits="$(jq -c --slurpfile candidate "$STACKKITS_CANDIDATE_DIR/candidate.provenance.json" '. + {candidate:$candidate[0]}' <<<"$stackkits")"
          fi

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires="$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg version "$VERSION" --arg issued "$now" --arg expires "$expires" \
            --slurpfile policy "$policy" --argjson artifacts "$artifacts" --argjson stackkits "$stackkits" \
            '{schemaVersion:"guard.release-manifest/v1",version:$version,
              minimumAdmittedVersion:$policy[0].minimumAdmittedVersion,
              revokedVersions:$policy[0].revokedVersions,revokedDigests:$policy[0].revokedDigests,
              artifacts:$artifacts,stackkits:$stackkits,issuedAt:$issued,expiresAt:$expires}' > dist/release-manifest.json

      - name: Sign the manifest
        if: steps.version.outputs.reuse-private != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/release-manifest.sigstore.json dist/release-manifest.json

      # The Guard's own verifier, with the pinned trusted root and signer
      # identity, decides: a release a Guard would refuse is never published.
      - name: Verify what will be published as a Guard does
        if: steps.version.outputs.reuse-private != 'true'
        shell: bash
        env:
          RUNTIME_ASSETS: ${{ steps.binaries.outputs.runtime_assets }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_MODE" = candidate ]; then
            [ "$RUNTIME_ASSETS" = 2 ]
            guard-release-tool verify dist --expected-source "$GITHUB_SHA" --require-runtime-bundles --require-current-policy
            exit 0
          fi
          expected=()
          if [ "$RELEASE_MODE" = publish ]; then expected=(--expected-source "$GITHUB_SHA"); fi
          if [ "$RUNTIME_ASSETS" = 2 ]; then
            guard-release-tool verify dist --require-runtime-bundles "${expected[@]}"
          else
            guard-release-tool verify dist "${expected[@]}"
          fi

      # Only a new signed publication creates the immutable transport index
      # and seed. Candidate and refresh runs preserve the published bytes.
      - name: Prepare immutable file-delivery metadata
        if: env.RELEASE_MODE == 'publish' && steps.binaries.outputs.built == 'true' && steps.binaries.outputs.runtime_assets == '2'
        shell: bash
        run: |
          set -euo pipefail
          guard-release-tool artifact-index dist --expected-source "$GITHUB_SHA" > dist/artifact-index.json
          cp dist/release-manifest.json dist/release-manifest-seed.json
          cp dist/release-manifest.sigstore.json dist/release-manifest-seed.sigstore.json

      # Guards download only from private R2 (CI-CD "Render download
      # prohibition"). The Gateway Worker resolves the index a control plane
      # admits by its digest in R2 and streams only objects whose R2-stored
      # SHA-256 equals the index entry, so no Gateway repin follows a release.
      # The mirror runs before the index becomes a release asset: no image can
      # bake an index whose files R2 does not hold yet. Idempotent on reruns.
      - name: Mirror the delivery files to private R2
        if: env.RELEASE_MODE == 'publish' && steps.binaries.outputs.built == 'true' && steps.binaries.outputs.runtime_assets == '2' && steps.version.outputs.public != 'true'
        shell: bash
        env:
          GUARD_RELEASE_R2_ACCOUNT_ID: ${{ secrets.GUARD_RELEASE_R2_ACCOUNT_ID }}
          GUARD_RELEASE_R2_BUCKET: ${{ secrets.GUARD_RELEASE_R2_BUCKET }}
          GUARD_RELEASE_R2_ACCESS_KEY_ID: ${{ secrets.GUARD_RELEASE_R2_ACCESS_KEY_ID }}
          GUARD_RELEASE_R2_SECRET_ACCESS_KEY: ${{ secrets.GUARD_RELEASE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          guard-release-tool r2-mirror dist | tee -a "$GITHUB_STEP_SUMMARY"

      # The public installer (GET /install.sh) is streamed by the Gateway
      # Worker from private R2 after the control plane admits the digest it
      # pins. Every publication, including historical reuse, mirrors the
      # installer of its exact release source before that source can serve.
      - name: Mirror the release source's installer to private R2
        if: env.RELEASE_MODE == 'publish' && steps.version.outputs.public != 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source-sha }}
          GUARD_RELEASE_R2_ACCOUNT_ID: ${{ secrets.GUARD_RELEASE_R2_ACCOUNT_ID }}
          GUARD_RELEASE_R2_BUCKET: ${{ secrets.GUARD_RELEASE_R2_BUCKET }}
          GUARD_RELEASE_R2_ACCESS_KEY_ID: ${{ secrets.GUARD_RELEASE_R2_ACCESS_KEY_ID }}
          GUARD_RELEASE_R2_SECRET_ACCESS_KEY: ${{ secrets.GUARD_RELEASE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "${SOURCE_SHA}:install.sh"; then
            echo "::notice::Release source ${SOURCE_SHA} has no install.sh; nothing to mirror."
            exit 0
          fi
          git show "${SOURCE_SHA}:install.sh" > "$RUNNER_TEMP/install.sh"
          # A tool built from the release source itself also proves its pin.
          pinned=()
          if [ "$SOURCE_SHA" = "$GITHUB_SHA" ]; then pinned=(--require-pinned); fi
          guard-release-tool r2-mirror-installer "$RUNNER_TEMP/install.sh" "${pinned[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Creating the guard-v<version> release creates its tag, and the
      # repository now refuses a tag from any token without the workflows
      # permission (HTTP 403 "Resource not accessible by integration";
      # Guard release 39018813777). GITHUB_TOKEN can never hold workflows, so
      # the private repository publishes with a short-lived kombify-ci
      # installation token scoped to this repository; the public mirror keeps
      # github.token. The test uses the workflow's own public-profile output, not a
      # repository or owner literal: the public export rewrites or rejects those.
      - name: Mint the release publication token
        id: publish-token
        if: env.RELEASE_MODE != 'candidate' && steps.version.outputs.reuse-private != 'true' && steps.version.outputs.public != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          # The publication token is pinned to this repository. The App
          # installation covers the whole organization, so an unscoped mint
          # would reach every repository of the installation.
          repositories: kombify-Techstack
          permission-contents: write
          permission-workflows: write

      - name: Publish
        if: env.RELEASE_MODE != 'candidate' && steps.version.outputs.reuse-private != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.publish-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          tag="guard-v${VERSION}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "kombify Guard ${VERSION}" \
              --notes "Signed kombify Guard artifacts. Verify with the pinned release identity; the control plane serves these bytes once built with GUARD_RELEASE_VERSION=${VERSION}."
          fi
          names="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name')"
          # Binaries and their bundles are immutable: an asset that exists must
          # be byte-identical to what this run holds, never replaced.
          for asset in techstack-linux-amd64 techstack-linux-amd64.sigstore.json techstack-linux-arm64 techstack-linux-arm64.sigstore.json; do
            if grep -qx "$asset" <<<"$names"; then
              check="$(mktemp -d)"
              gh release download "$tag" --dir "$check" --pattern "$asset"
              cmp -s "$check/$asset" "dist/$asset" || { echo "::error::${asset} of ${tag} exists with different bytes; published binaries are immutable" >&2; exit 1; }
            else
              gh release upload "$tag" "dist/$asset"
            fi
          done
          # The runtime archive is paired with the manifest's signed whole-tree
          # identity. Refresh reuses it; compiler repins never replace it.
          for arch in amd64 arm64; do
            asset="stackkit-runtime-linux-${arch}.tar.gz"
            if [ ! -f "dist/$asset" ]; then continue; fi
            if grep -qx "$asset" <<<"$names"; then
              check="$(mktemp -d)"
              gh release download "$tag" --dir "$check" --pattern "$asset"
              cmp -s "$check/$asset" "dist/$asset" || { echo "::error::${asset} of ${tag} exists with different bytes; published runtime archives are immutable" >&2; exit 1; }
            else
              gh release upload "$tag" "dist/$asset"
            fi
          done
          metadata_count="$(grep -Ec '^(artifact-index.json|release-manifest-seed.json|release-manifest-seed.sigstore.json)$' <<<"$names" || true)"
          if [ "$metadata_count" -ne 0 ] && [ "$metadata_count" -ne 3 ]; then
            echo '::error::Guard release has only part of the immutable file-delivery metadata set' >&2
            exit 1
          fi
          for asset in artifact-index.json release-manifest-seed.json release-manifest-seed.sigstore.json; do
            if [ ! -f "dist/$asset" ]; then continue; fi
            if grep -qx "$asset" <<<"$names"; then
              check="$(mktemp -d)"
              gh release download "$tag" --dir "$check" --pattern "$asset"
              cmp -s "$check/$asset" "dist/$asset" || { echo "::error::${asset} of ${tag} exists with different bytes; immutable delivery metadata cannot be replaced" >&2; exit 1; }
            else
              gh release upload "$tag" "dist/$asset"
            fi
          done
          # Only the manifest pair is replaced: a fresh window is the point of a
          # nightly run, and the Guard accepts only a manifest newer than the
          # newest it has seen.
          gh release upload "$tag" --clobber dist/release-manifest.json dist/release-manifest.sigstore.json

      - name: Record the verified candidate
        if: env.RELEASE_MODE == 'candidate'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          files='[]'
          for asset in release-manifest.json release-manifest.sigstore.json \
                       techstack-linux-amd64 techstack-linux-amd64.sigstore.json \
                       techstack-linux-arm64 techstack-linux-arm64.sigstore.json \
                       stackkit-runtime-linux-amd64.tar.gz stackkit-runtime-linux-arm64.tar.gz; do
            test -s "dist/$asset"
            files="$(jq -c --arg name "$asset" --arg sha "$(sha256sum "dist/$asset" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "dist/$asset")" '. + [{name:$name,sha256:$sha,size:$size}]' <<<"$files")"
          done
          for arch in amd64 arm64; do
            tar -xOf "dist/stackkit-runtime-linux-${arch}.tar.gz" .stackkit/stackkits-release-pin.json > "${RUNNER_TEMP}/candidate-pin-${arch}.json"
          done
          artifact="guard-candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg source "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg workflow "$GITHUB_WORKFLOW_REF" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg version "$VERSION" --arg artifact "$artifact" --arg dockerfile "$(sha256sum Dockerfile | cut -d' ' -f1)" \
            --argjson files "$files" --slurpfile manifest dist/release-manifest.json \
            --slurpfile amd64 "${RUNNER_TEMP}/candidate-pin-amd64.json" --slurpfile arm64 "${RUNNER_TEMP}/candidate-pin-arm64.json" \
            '{schemaVersion:"guard.candidate-receipt/v1",mode:"candidate",published:false,
              sourceSha:$source,sourceTree:$tree,workflowRef:$workflow,runId:$run,runAttempt:$attempt,runUrl:$url,
              productVersion:$version,artifactName:$artifact,dockerfileSha256:$dockerfile,
              stackkits:$manifest[0].stackkits,runtimePins:{amd64:$amd64[0],arm64:$arm64[0]},files:$files}' \
            > dist/candidate-receipt.json
          {
            echo "Signed nonpublishing Guard candidate: ${artifact}"
            echo "Source ${GITHUB_SHA}; declared product ${VERSION}; StackKits $(jq -r '.stackkits.version' dist/release-manifest.json)."
            echo 'No release, tag or Delivery was requested. Native Stage acceptance remains pending.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified candidate
        id: candidate-upload
        if: env.RELEASE_MODE == 'candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-manifest.json
            dist/release-manifest.sigstore.json
            dist/techstack-linux-amd64
            dist/techstack-linux-amd64.sigstore.json
            dist/techstack-linux-arm64
            dist/techstack-linux-arm64.sigstore.json
            dist/stackkit-runtime-linux-amd64.tar.gz
            dist/stackkit-runtime-linux-arm64.tar.gz
            dist/candidate-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      - name: Record the uploaded candidate artifact
        if: env.RELEASE_MODE == 'candidate'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.candidate-upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ARTIFACT_URL"
          {
            printf 'Candidate artifact ID: %s\n\n' "$ARTIFACT_ID"
            printf 'Artifact SHA-256: `%s`\n\n' "$ARTIFACT_DIGEST"
            printf 'Artifact URL: %s\n' "$ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Continuous delivery of a prepared pre-1.0 release. Only the dispatch from
  # guard-release-on-release.yml asks for it, so a Delivery that later reuses
  # the published Guard never starts another Delivery. The job only requests the
  # normal Delivery v2 run on main; every source, version, image, environment
  # and activation gate stays in that run. Stable 1.0+ keeps its explicit
  # approval. TECHSTACK_AUTO_DELIVERY=off pauses it; TECHSTACK_AUTO_DELIVERY_SCOPE
  # selects all (default), service or public-oss.
  # Database leg first (CI-CD-PLATFORM-STANDARD.md §4.6): database_gate names
  # the database Delivery that guard-release-on-release.yml dispatched for this
  # release. The service leg is dispatched only after that run succeeded and
  # published the techstack-database group; `refused`, a missing gate, a failed
  # or foreign run, or a run that does not finish in time stops it.
  deliver:
    needs: release
    if: >-
      github.repository == 'kombifyio/TechStack' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode != 'candidate' &&
      inputs.deliver_after_publish &&
      vars.TECHSTACK_AUTO_DELIVERY != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Delivery v2 for the prepared release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.expected_source_sha }}
          SCOPE: ${{ vars.TECHSTACK_AUTO_DELIVERY_SCOPE || 'all' }}
          DATABASE_GATE: ${{ inputs.database_gate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$RELEASE_SHA" = "$GITHUB_SHA" ] || {
            echo "::error::Automatic Delivery follows only a fresh publication of the prepared release commit." >&2
            exit 1
          }
          # Only the chain's own dispatch (guard-release-on-release.yml, job
          # token) carries a trustworthy database gate.
          [ "$GITHUB_ACTOR" = "github-actions[bot]" ] || {
            echo "::error::Automatic Delivery follows only the dispatch of guard-release-on-release.yml, not one by ${GITHUB_ACTOR}." >&2
            exit 1
          }
          case "$SCOPE" in all|service|public-oss) ;; *) echo "::error::Unsupported TECHSTACK_AUTO_DELIVERY_SCOPE ${SCOPE}" >&2; exit 1 ;; esac
          # Database leg first: never dispatch the service leg ahead of an
          # unapplied forward batch.
          database_run=0
          case "$DATABASE_GATE" in
            none) ;;
            refused|"")
              echo "::error::The database leg of release ${RELEASE_SHA} is ${DATABASE_GATE:-missing}; the service leg is not dispatched (guard-release-on-release.yml decides the database leg)." >&2
              exit 1
              ;;
            *)
              [[ "$DATABASE_GATE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::database_gate must be none, refused or a Delivery run ID." >&2; exit 1; }
              database_run="$DATABASE_GATE"
              deadline=$(( $(date +%s) + 75 * 60 ))
              while :; do
                state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${database_run}" --jq '[(.path // "-"), (.event // "-"), (.head_sha // "-"), (.actor.login // "-"), ((.run_attempt // 0) | tostring), (.status // "-"), (.conclusion // "-")] | @tsv')" || state=""
                IFS=$'\t' read -r run_path run_event run_head run_actor run_attempt run_status run_conclusion <<<"$state" || true
                [ "${run_status:-}" = completed ] && break
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::error::Database Delivery ${database_run} did not complete within 75 minutes; the service leg is not dispatched." >&2
                  exit 1
                fi
                echo "Waiting for database Delivery ${database_run}: ${run_status:-unreadable}."
                sleep 30
              done
              if [[ "$run_path" != .github/workflows/delivery.yml* ]] || [ "$run_event" != workflow_dispatch ] || \
                 [ "$run_head" != "$RELEASE_SHA" ] || [ "$run_actor" != "kombify-ci[bot]" ] || [ "$run_attempt" != 1 ] || \
                 [ "$run_conclusion" != success ]; then
                echo "::error::Database Delivery ${database_run} (${run_path} ${run_event} at ${run_head} by ${run_actor}, attempt ${run_attempt}) concluded ${run_conclusion:-unknown}; the service leg is not dispatched." >&2
                exit 1
              fi
              published="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${database_run}/jobs?per_page=100" \
                --jq '.jobs[] | select((.name | test("^delivery / (Deliver · techstack-database / )?Publish · techstack-database")) and .conclusion == "success") | .id' | wc -l | tr -d '[:space:]')"
              if [ "$published" = 0 ]; then
                echo "::error::Database Delivery ${database_run} succeeded without publishing the techstack-database group; the service leg is not dispatched." >&2
                exit 1
              fi
              echo "Database Delivery ${database_run} applied the forward batch of ${RELEASE_SHA}." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          # Read the list first: under pipefail, `gh api | grep -q` fails when grep
          # exits on the first match before gh has written everything (0.41.18).
          release_files="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}" --jq '.files[].filename')"
          grep -qx '.kombify/VERSION' <<<"$release_files" || {
            echo "::error::${RELEASE_SHA} is not a prepared release commit." >&2
            exit 1
          }
          version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.kombify/VERSION?ref=${RELEASE_SHA}" --jq '.content' | base64 -d | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "${version%%.*}" != 0 ]; then
            echo "::notice::${version} is stable; its Delivery keeps the explicit approval and is not dispatched automatically."
            exit 0
          fi
          # One execution per prepared release: an active or successful run is
          # inspected and retried as a full parent rerun, never replaced by a
          # second dispatch. A failed run of another scope (public-oss is
          # refused while its group is blocked) does not count, nor does the
          # database leg awaited above.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/delivery.yml/runs?event=workflow_dispatch&branch=main&head_sha=${RELEASE_SHA}&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${database_run}) | select(.conclusion == null or .conclusion == \"success\")] | length")"
          if [ "$existing" != 0 ]; then
            echo "::notice::A Delivery run for main already exists since release ${version}; not dispatching another."
            exit 0
          fi
          gh workflow run delivery.yml --repo "$GITHUB_REPOSITORY" --ref main -f scope="$SCOPE" -f execute=true
          {
            echo "Requested Delivery v2 (scope=${SCOPE}, execute=true) for Techstack ${version} at ${RELEASE_SHA}."
            echo "Dispatch acceptance is not deployment evidence; inspect the resulting Delivery run."
          } >> "$GITHUB_STEP_SUMMARY"

