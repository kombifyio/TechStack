name: Open-Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # No Go cache: its 760 MB restore saves about 20 s, and on 2026-10-30 a
      # throttled restore ("Egress is over the account limit") held setup-go
      # for its 10 min segment timeout until the job hit its limit (0.44.5).
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Prove self-hosted source closure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-public-export.mjs
          go build ./...
          go build -trimpath -o techstack ./cmd/techstack
      - name: Build operator UI
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          PUBLIC_KOMBIFY_EDITION=selfhost-oss pnpm build
      - name: Build pre-sign source and UI closure
        run: docker build --target backend -t techstack:selfhost-source .
