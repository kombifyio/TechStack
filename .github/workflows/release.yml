name: Open-Core Release

on:
  pull_request:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Verify immutable numeric identity
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
      - name: Build exact public image
        env:
          IMAGE: ghcr.io/kombifyio/techstack
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg TECHSTACK_PRODUCT_VERSION="${GITHUB_REF_NAME#v}" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
  spec-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Generate templates with the pinned Linux StackKits release
        run: bash scripts/new-linux-stackkit-spec-templates.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-spec-templates
          path: dist/spec-templates
          if-no-files-found: error

  build-runtime-pair:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.5.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install public UI dependencies
        shell: pwsh
        run: pnpm --dir app install --frozen-lockfile
      - name: Build exact-source Windows and Linux runtimes
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          .\scripts\build-windows-runtime-pair.ps1 -Version $version -SourceRevision $env:GITHUB_SHA -WindowsOutputPath 'dist\windows-runtime-pair\techstack.exe' -LinuxOutputPath 'dist\windows-runtime-pair\techstack-linux-amd64'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-runtime-pair
          path: dist/windows-runtime-pair
          if-no-files-found: error

  windows-client:
    needs: [spec-templates, build-runtime-pair]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-runtime-pair
          path: dist/windows-runtime-pair
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-spec-templates
          path: dist/spec-templates
      - name: Install WiX and Burn extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add WixToolset.Bal.wixext/4.0.6
          wix extension add WixToolset.Firewall.wixext/4.0.6
          wix --version
      - name: Build unsigned Windows setup assets
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          pwsh -NoProfile -File .\scripts\package-windows-client.ps1 -Version $version -RuntimeExe 'dist\windows-runtime-pair\techstack.exe' -LinuxRuntimeExe 'dist\windows-runtime-pair\techstack-linux-amd64' -SpecTemplatesPath 'dist\spec-templates'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-client
          path: |
            dist/windows-client/kombify-Techstack-Setup.exe
            dist/windows-client/kombify-Techstack-x64.msi
            dist/windows-client/kombify-techstack-client_*_Windows_x86_64.zip
            dist/windows-client/kombify-techstack-client_*_Windows_x86_64.zip.sha256
            dist/windows-client/SHA256SUMS.txt
            dist/windows-client/UNSIGNED-WINDOWS-RELEASE.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, windows-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-client
          path: dist/windows-client
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          prerelease: false
          make_latest: true
          files: |
            deploy/selfhosted/docker-compose.yml
            deploy/selfhosted/.env.example
            dist/windows-client/kombify-Techstack-Setup.exe
            dist/windows-client/kombify-Techstack-x64.msi
            dist/windows-client/kombify-techstack-client_*_Windows_x86_64.zip
            dist/windows-client/kombify-techstack-client_*_Windows_x86_64.zip.sha256
            dist/windows-client/SHA256SUMS.txt
            dist/windows-client/UNSIGNED-WINDOWS-RELEASE.txt
