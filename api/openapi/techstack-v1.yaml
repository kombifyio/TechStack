        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Wallet store is not configured

  /api/v1/auth/stack-identity/conditional:
    put:
      operationId: updateStackIdentityConditional
      x-kombify-cli: { command: "stack-identity update-conditional" }
      x-kombify-mcp:
        title: Update stack identity if unchanged
        toolName: update_stack_identity_if_unchanged
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Auth]
      summary: Update the stack identity only when its local revision still matches
      description: >-
        Revision-checked variant of the stack identity update. `If-Match` carries the `local_revision` read
        from the stack identity, in double quotes (for example `"3"`); a stale revision answers 412 and a
        reused `Idempotency-Key` with different content answers 409. The edit is stored locally and marked
        pending until it is synced with kombify Cloud. The body is limited to 4096 bytes. Requires the
        Postgres control plane (503 `stack_identity_store_unavailable` otherwise).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable mutation id of 16 to 128 letters, digits, `-` or `_`.
          schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
        - name: If-Match
          in: header
          required: true
          description: Strong local revision in double quotes, for example `"3"`.
          schema: { type: string, pattern: '^"[0-9]+"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 30, description: "Trimmed, without control characters." }
                characterId: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
                animationStyle: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
                animationEnabled: { type: boolean }
                iconStyle: { type: string, enum: [filled, glass, gradient, outlined] }
                glowColorOverride: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$" }
      responses:
        "200":
          description: The updated stack identity with its new revision
          headers:
            ETag:
              description: New local revision.
              schema: { type: string, example: '"4"' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stack_identity: { type: object }
                      editable: { type: boolean }
                      sync:
                        type: object
                        properties:
                          cloud_revision: { type: integer }
                          pending: { type: boolean }
                      local_revision: { type: integer, format: int64 }
                      mutation:
                        type: object
                        properties:
                          id: { type: string }
                          tenant_id: { type: string }
                          owner_subject_id: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412":
          description: If-Match does not equal the current local revision (`stack_identity_revision_conflict`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: A strong If-Match is required (`stack_identity_if_match_required`)
          content:
            application/json:
              schema:
