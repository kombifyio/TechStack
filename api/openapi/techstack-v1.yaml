  /api/v1/monitor/availability:
    get:
      operationId: getAvailabilityReport
      x-kombify-cli: { command: "monitor availability" }
      tags: [Metrics]
      summary: Availability, downtime episodes and daily state, derived from the transition timeline
      description: >-
        A projection over the append-only server transition timeline rather
        than a sampler: every episode is bounded by two recorded transitions
        and carries the reason codes they were written with. The response
        publishes its own accounting vocabulary, so a reader can see which
        connection states were counted as downtime without reading the source.
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [24h, 7d, 30d, 90d], default: "30d" }
          description: Closed set; an unbounded window would be a denial-of-service knob.
        - name: server_id
          in: query
          required: false
          schema: { type: string }
          description: Scope the report to one server, for the server detail page.
      responses:
        "200":
          description: Availability report for the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AvailabilityReport" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/monitor/alerts:
