      x-kombify-cli: { command: "workers identity rotate", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Rotate the kombify Guard host key
      description: >-
        Authenticated by the current key (access token plus proof). The new key proves possession with its own
