    get:
      operationId: getServerSecurityAutoRepair
      x-kombify-cli: { command: "servers security auto-repair get", args: [server_id] }
      tags: [Servers]
      summary: Read the owner's approval of automatic security repair
      description: A server without an approval, or with an expired one, is observe-only.
      parameters:
