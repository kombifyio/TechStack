        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: setupApplicationConnector
      x-kombify-confirmation: "This operation issues or revokes the reviewed node-owned Home Assistant connector credential for this exact service."
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: true, openWorldHint: false }
      tags: [Services, Jobs]
      summary: Ensure or revoke one declared owned Home Assistant connector on its node
      description: >-
        Requires fresh backend ownership, positive operate authority, exact current
        inventory and Owner approval. Transports only closed correlation metadata
        through Guard to the published pinned CLI, whose local signedApply and
        Owner setup authority remain mandatory. Stores pre-send durable intent;
        unknown acknowledgement only reconciles the original operation read-only.
        Current v0.51.8 lacks the supporting catalog and returns nondispatchable
        SourcePreview. Credentials stay in node custody.
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/applicationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationConnectorRequest" }
      responses:
        "202": { $ref: "#/components/responses/ApplicationConnectorQueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/services/{serviceId}/connector/verify:
    post:
      operationId: verifyApplicationConnector
      x-kombify-mcp:
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Services, Jobs]
      summary: Refresh the current node-owned connector through a distinct read-only job
      description: Retains the original signed setup operation and exact receipt, requires current published catalog and positive backend node/resource authority, and never reissues setup. Ordinary authenticated inventory reconciliation uses the same consumer for stale projections. Current v0.51.8 remains nondispatchable SourcePreview.
      parameters:
        - $ref: "#/components/parameters/serviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202": { $ref: "#/components/responses/ApplicationConnectorQueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/services/{serviceId}/adoption-plans:
    post:
      operationId: prepareApplicationAdoption
      tags: [Services, Jobs]
