  /metrics:
    get:
      operationId: getMetrics
      tags: [Metrics]
      summary: Prometheus-compatible instance metrics (admin/infra only)
      responses:
        "200":
          description: Prometheus/OpenMetrics-compatible text metrics
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Admin or infrastructure scraper access required

  /api/v1/metrics:
    get:
      operationId: getMetricsV1
      tags: [Metrics]
      summary: Prometheus-compatible instance metrics (API path alias, admin/infra only)
      responses:
        "200":
          description: Prometheus/OpenMetrics-compatible text metrics
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Admin or infrastructure scraper access required

  # ============================================================
  # MONTHLY RUNTIME
  # ============================================================
  /api/v1/monthly-runtimes/offerings:
    get:
      operationId: listMonthlyRuntimeOfferings
      tags: [Monthly Runtime]
      summary: List monthly runtime offerings
      description: Returns public, provider-free subscription runtime offerings.
      responses:
        "200":
          description: Monthly runtime offerings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MonthlyRuntimeOffering"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/monthly-runtimes/{lease_id}:
    get:
      operationId: getMonthlyRuntimeStatus
      tags: [Monthly Runtime]
      summary: Get monthly runtime status
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Enrollment is not complete
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/start:
    post:
      operationId: startMonthlyRuntime
      tags: [Monthly Runtime]
      summary: Start a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/stop:
    post:
      operationId: stopMonthlyRuntime
      tags: [Monthly Runtime]
      summary: Stop a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/enable-ssh:
    post:
      operationId: enableMonthlyRuntimeSSH
      tags: [Monthly Runtime]
      summary: Enable SSH for a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/disable-ssh:
    post:
      operationId: disableMonthlyRuntimeSSH
      tags: [Monthly Runtime]
      summary: Disable SSH for a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/decommission:
    post:
      operationId: decommissionMonthlyRuntime
      tags: [Monthly Runtime]
      summary: Decommission a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Request exact generation-bound provider reconciliation when the
            runtime is unreachable. Force is accepted only when the control
            plane can prove restart-safe, HA-fenced durable custody before it
            cancels the lease. Also accepted as a {"force": true} JSON body. An
            empty request defaults to false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
                expected_resource_generation_digest:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: >
                    Optional optimistic concurrency claim. Provider teardown is
                    refused with 409 unless this digest still identifies the
                    current lease resource generation.
      responses:
        "200":
          description: Confirmed synchronous runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "202":
          description: >
            Durable exact-generation provider reconciliation was accepted but
            provider teardown is not yet proven. observed_state and lease_state
            are reconciliation_pending; this is not terminal success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "400":
          description: >
            Invalid, oversized, ambiguous, or schema-incompatible JSON body,
            or an invalid expected resource-generation digest.
        "409":
          description: >
            Decommission blocked because the runtime is unreachable or because
            the expected resource generation has been superseded. Unreachable
            errors carry error_code=decommission_blocked_unreachable with a
            structured user_guidance offering force=true.
        "503":
          description: >
            The Simulate runtime client is unavailable, or restart-safe and
            HA-fenced durable reconciliation custody is not available. In the
            latter case no lease cancellation, generation claim, or pending
            metadata mutation is performed.

  /api/v1/monthly-runtimes/{lease_id}/resolve-custody:
    post:
      operationId: resolveMonthlyRuntimeCustody
      tags: [Monthly Runtime]
      summary: Archive a legacy or unbound custody record after provider cleanup
      description: >
        Removes a non-executable legacy or unbound lease from the active
        dashboard only after the owner confirms that its provider resource was
        already removed. This operation never contacts or deletes a provider
        resource and is rejected for Techstack provider-controlled generations.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_cleanup_confirmed]
              properties:
                provider_cleanup_confirmed:
                  type: boolean
                  enum: [true]
      responses:
        "200":
          description: Custody record archived with owner-confirmation evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "400":
          description: Invalid or schema-incompatible confirmation body
        "409":
          description: >
            Provider cleanup was not confirmed, or the lease remains under
            Techstack provider control and must use the decommission lifecycle.

  /api/v1/monthly-runtimes/{lease_id}/reconnect:
    post:
      operationId: reconnectMonthlyRuntime
      tags: [Monthly Runtime]
      summary: Re-run enrollment for a stalled monthly runtime lease
      description: >
        Idempotently re-probes the runtime and converges a stalled enrollment
        back toward enrolled. Surfaced as the recovery action when a runtime is
        reported stalled (error_code=runtime_enrollment_stalled).
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/ssh:
    get:
      operationId: getMonthlyRuntimeSSHInfo
      tags: [Monthly Runtime]
      summary: Get SSH connection information for a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: SSH info result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/operations:
    get:
      operationId: listMonthlyRuntimeOperations
      tags: [Monthly Runtime]
      summary: List monthly runtime operation history
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
        - $ref: "#/components/parameters/monthlyRuntimeOperationLimit"
      responses:
        "200":
          description: Runtime operation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeOperationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/monthly-runtimes/{lease_id}/cleanup-readback:
    get:
      operationId: getMonthlyRuntimeCleanupReadback
      tags: [Monthly Runtime]
      summary: Read redacted managed runtime cleanup state facts
      description: >
        Returns tenant- and owner-scoped state facts for the lease's
        exact current provider-control resource generation. This read-only
        endpoint never calls a provider or a runtime agent and never returns
        provider resource handles, commands, evidence documents, or credentials.
        A terminal operation is no longer running, but is not by itself proof
        of successful cleanup: provider absence requires absence_evidence_ref,
        and capacity release requires capacity_released.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Redacted cleanup state readback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeCleanupReadbackEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Lease is not under Techstack provider-control custody
        "503":
          description: Provider-control readback authority is unavailable

  # ============================================================
  # INTERNAL APIs (SaaS mode only, legacy trust-header compatibility)
  # ============================================================
  /api/internal/sso/exchange:
    post:
      operationId: internalSSOExchange
      tags: [Internal]
      summary: Legacy exchange of edge-validated SaaS token for PocketBase session
      deprecated: true
      description: |
        Legacy internal endpoint used during the Cloudflare/Auth0 migration to
        exchange an Auth0-backed JWT for a PocketBase user session. Protected by
        the legacy trust header compatibility path.
        Only available when `KOMBIFY_SAAS_MODE=true`.
      security:
        - edgeTrustHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Auth0-backed JWT from the public edge
      responses:
        "200":
          description: Legacy PocketBase session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: PocketBase auth token
                  user_id:
                    type: string
                  email:
                    type: string
        "401":
          description: Invalid or expired token
        "403":
          description: Missing or invalid legacy trust header

  /api/internal/feature-flags/apply:
    post:
      operationId: internalFeatureFlagsApply
      tags: [Internal]
      summary: Apply feature flags from SaaS control plane (SaaS only)
      description: |
        Internal endpoint used by the SaaS control plane to push feature flag
        state to this kombify-TechStack instance. Protected by the legacy
        trust-header compatibility path.
        Only available when `KOMBIFY_SAAS_MODE=true`.
      security:
        - edgeTrustHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flags:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      enabled:
                        type: boolean
      responses:
        "200":
          description: Feature flags applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: integer
                  skipped:
                    type: integer
        "403":
          description: Missing or invalid legacy trust header

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC/JWKS bearer token. Self-hosted defaults to Pocket ID; SaaS uses Auth0 through the edge. PocketBase JWT is legacy migration compatibility only.
    runtimeAgentAuth:
      type: http
      scheme: bearer
      bearerFormat: TechStack-Runtime-Agent
      description: Runtime-agent credential bound to the exact tenant, placement, server, and worker identity. Signed, opaque, and explicit legacy compatibility tokens are validated fail-closed by the worker runtime.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service accounts and automation clients (SaaS mode via the public edge)
    edgeTrustHeader:
      type: apiKey
      in: header
      name: X-Edge-Internal-Trust
      description: Legacy trust header injected by the public edge during the migration cutover (SaaS mode only)
  parameters:
    serverId:
      name: serverId
      in: path
      required: true
      description: Canonical server runtime ID
      schema:
        type: string
    serviceId:
      name: serviceId
      in: path
      required: true
      description: Canonical service runtime ID
      schema:
        type: string
    stackId:
      name: id
      in: path
      required: true
      description: Stack ID
      schema:
        type: string
    resourceId:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: string
    monthlyRuntimeLeaseId:
      name: lease_id
      in: path
      required: true
      description: Monthly runtime lease ID
      schema:
        type: string
    monthlyRuntimeOperationLimit:
      name: limit
      in: query
      required: false
      description: Maximum operation events to return.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    page:
      name: page
      in: query
      required: false
      description: Page number (default 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    perPage:
      name: per_page
      in: query
      required: false
      description: Items per page (default 20, max 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request failed semantic validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required control-plane persistence or dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected internal error without sensitive implementation details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    InventoryFreshness:
      type: object
      required: [state, stale_after_seconds]
      properties:
        state: { type: string, enum: [fresh, stale, unavailable] }
        age_seconds: { type: integer, format: int64, minimum: 0 }
        stale_after_seconds: { type: integer, format: int64, minimum: 0 }
        reason_code: { type: string }

    InventoryAddresses:
      type: object
      required: [public_ips, private_ips, local_ips, domains]
      properties:
        public_ips: { type: array, items: { type: string } }
        private_ips: { type: array, items: { type: string } }
        local_ips: { type: array, items: { type: string } }
        domains: { type: array, items: { type: string } }

    InventoryObservedState:
      type: object
      required: [state]
      properties:
        state: { type: string }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }

    InventoryLifecycleProjection:
      type: object
      required: [state]
      properties:
        state: { type: string }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }

    InventoryDesiredProjection:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [running, stopped, absent, unknown] }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }

    InventoryLeaseProjection:
      type: object
      required: [state]
      properties:
        id: { type: string, description: Opaque runtime-lease identifier; never a credential or provider-resource reference. }
        state: { type: string }

    InventoryCleanupProjection:
      type: object
      required: [state, provider_absence_verified]
      properties:
        state: { type: string, enum: [not_requested, delete_accepted, absence_pending, absent, cleanup_required, failed, unverified] }
        provider_absence_verified: { type: boolean }
        verified_at:
          type: string
          format: date-time
          description: Provider-control evidence collection time; never inferred from a lifecycle tombstone.

    InventoryStackKit:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        variant: { type: string }

    InventoryPlatform:
      type: object
      properties:
        os: { type: string }
        os_version: { type: string }
        arch: { type: string }

    InventoryServer:
      type: object
      required: [id, name, observed_at, freshness, inventory_revision, addresses, platform, stackkit, lifecycle, desired, lease, cleanup, connection, health]
      properties:
        id: { type: string }
        stack_id: { type: string }
        name: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        addresses: { $ref: "#/components/schemas/InventoryAddresses" }
        platform: { $ref: "#/components/schemas/InventoryPlatform" }
        stackkit: { $ref: "#/components/schemas/InventoryStackKit" }
        provider: { type: string, description: Stable vendor id only; never a provider-native resource handle. }
        lifecycle: { $ref: "#/components/schemas/InventoryLifecycleProjection" }
        desired: { $ref: "#/components/schemas/InventoryDesiredProjection" }
        lease: { $ref: "#/components/schemas/InventoryLeaseProjection" }
        cleanup: { $ref: "#/components/schemas/InventoryCleanupProjection" }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        health: { $ref: "#/components/schemas/InventoryObservedState" }

    InventoryServerList:
      type: object
      required: [observed_at, freshness, inventory_revision, collection_cursor, page_size, servers]
      properties:
        observed_at: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        collection_cursor: { type: string }
        next_cursor: { type: string }
        page_size: { type: integer, minimum: 0, maximum: 200 }
        servers: { type: array, items: { $ref: "#/components/schemas/InventoryServer" } }

    RILServerSummary:
      type: object
      required: [count, has_servers, observed_at]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        has_servers: { type: boolean }
        observed_at: { type: string, format: date-time }

    InventoryServerHealth:
      type: object
      required: [server_id, observed_at, freshness, inventory_revision, connection, health]
      properties:
        server_id: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        health: { $ref: "#/components/schemas/InventoryObservedState" }

    InventoryServiceLink:
      type: object
      required: [url, mode]
      properties:
        url: { type: string, format: uri }
        mode: { type: string, enum: [direct, relay] }

    InventoryService:
      type: object
      required: [id, stack_id, server_id, key, name, desired_state, observed_state, observed_at, freshness, inventory_revision, health, stackkit, links, allowed_actions, source]
      properties:
        id: { type: string }
        stack_id: { type: string }
        server_id: { type: string }
        key: { type: string }
        name: { type: string }
        desired_state: { type: string }
        observed_state: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        health: { $ref: "#/components/schemas/InventoryObservedState" }
        stackkit: { $ref: "#/components/schemas/InventoryStackKit" }
        links: { type: array, items: { $ref: "#/components/schemas/InventoryServiceLink" } }
        allowed_actions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [start, stop, restart, logs] }
        evidence_ref: { type: string }
        source: { type: string }

    InventoryServiceList:
      type: object
      required: [observed_at, freshness, inventory_revision, collection_cursor, page_size, services]
      properties:
        observed_at: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        collection_cursor: { type: string }
        next_cursor: { type: string }
        page_size: { type: integer, minimum: 0, maximum: 200 }
        services: { type: array, items: { $ref: "#/components/schemas/InventoryService" } }

    InventoryChannel:
      type: object
      required: [type, role, state]
      properties:
        type: { type: string }
        role: { type: string }
        state: { type: string }
        observed_at: { type: string, format: date-time }

    InventoryAccessServiceLink:
      type: object
      required: [service_id, service_name, url, mode, health]
      properties:
        service_id: { type: string }
        service_name: { type: string }
        url: { type: string, format: uri }
        mode: { type: string, enum: [direct, relay] }
        health: { type: string }

    InventoryAvailability:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [available, unavailable] }
        reason_code: { type: string }

    InventoryServerAccessContext:
      type: object
      required: [server_id, observed_at, freshness, inventory_revision, availability, connection, addresses, channels, service_links]
      properties:
        server_id: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        availability: { $ref: "#/components/schemas/InventoryAvailability" }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        addresses: { $ref: "#/components/schemas/InventoryAddresses" }
        channels: { type: array, items: { $ref: "#/components/schemas/InventoryChannel" } }
        service_links: { type: array, items: { $ref: "#/components/schemas/InventoryAccessServiceLink" } }

    StackReadiness:
      type: object
      additionalProperties: false
      required:
        - status
        - can_start
        - required_servers
        - approved_servers
        - connected_servers
        - pending_servers
        - assigned_servers
        - available_servers
        - unassigned_servers
        - message
        - review_required
      properties:
        status:
          type: string
          description: Current rollout-readiness state; it is not a provider lifecycle state.
        can_start:
          type: boolean
          description: True only when the current server evidence satisfies the rollout start guard.
        required_servers: { type: integer, minimum: 0 }
        approved_servers:
          type: integer
          minimum: 0
          description: Assigned servers approved by the operator; approval alone does not mean connected.
        connected_servers:
          type: integer
          minimum: 0
          description: Assigned and approved servers with fresh canonical Guard connection and health evidence.
        pending_servers: { type: integer, minimum: 0 }
        assigned_servers: { type: integer, minimum: 0 }
        available_servers: { type: integer, minimum: 0 }
        unassigned_servers: { type: integer, minimum: 0 }
        message: { type: string }
        review_required: { type: boolean }

    StackOperationsServer:
      type: object
      required: [id, hostname, role, status, assignment, agent_id, approved, precheck_state, assignable, capabilities, health]
      additionalProperties: true
      properties:
        id: { type: string }
        server_id: { type: string }
        hostname: { type: string }
        role: { type: string }
        status: { type: string }
        assignment: { type: string }
        stack_id: { type: string }
        agent_id: { type: string }
        ip: { type: string }
        os: { type: string }
        os_version: { type: string }
        arch: { type: string }
        domains: { type: array, items: { type: string } }
        last_seen: { type: string, format: date-time }
        approved: { type: boolean }
        approved_at: { type: string, format: date-time }
        precheck_state: { type: string }
        source: { type: string }
        lease_id: { type: string }
        runtime_lane: { type: string }
        runtime_offering_id: { type: string }
        desired_state: { type: string }
        enrollment_status: { type: string }
        assignable: { type: boolean }
        capabilities: { type: object, additionalProperties: true }
        health:
          type: object
          additionalProperties: true
          required: [state, source, cpu_percent, memory_percent, disk_percent, uptime_seconds]
          properties:
            state: { type: string }
            source: { type: string }
            cpu_percent: { type: object, additionalProperties: true }
            memory_percent: { type: object, additionalProperties: true }
            disk_percent: { type: object, additionalProperties: true }
            uptime_seconds: { type: object, additionalProperties: true }
            updated_at: { type: string, format: date-time }
            notes: { type: array, items: { type: string } }

    StackOperationsService:
      type: object
      required: [name, display_name, type, status]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string }
        status: { type: string }
        url: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
        target_server: { type: string }
        target_server_id: { type: string }
        desired_state: { type: string }
        observed_state: { type: string }
        access: { type: object, additionalProperties: true }
        allowed_actions: { type: array, items: { type: string } }

    StackOperationsResponse:
      type: object
      additionalProperties: false
      required: [stack, readiness, nextSteps, kpis, servers, services, monitoring, alerts]
      properties:
        stack:
          type: object
          additionalProperties: true
          description: Existing stack summary projection; credentials and provider-native resource handles are not added by this operation.
        readiness: { $ref: "#/components/schemas/StackReadiness" }
        nextSteps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, description, status]
            properties:
              id: { type: string }
              label: { type: string }
              description: { type: string }
              status: { type: string }
              action: { type: string }
        kpis:
          type: object
          additionalProperties: false
          required: [registered_servers, healthy_servers, running_services, active_alerts]
          properties:
            registered_servers: { type: integer, minimum: 0 }
            healthy_servers: { type: integer, minimum: 0 }
            running_services: { type: integer, minimum: 0 }
            active_alerts: { type: integer, minimum: 0 }
        servers: { type: array, items: { $ref: "#/components/schemas/StackOperationsServer" } }
        services: { type: array, items: { $ref: "#/components/schemas/StackOperationsService" } }
        monitoring: { type: object, additionalProperties: true }
        alerts: { type: array, items: { type: object, additionalProperties: true } }
        currentJob: { type: object, additionalProperties: true }
        runtimeLifecycle: { type: object, additionalProperties: true }
        latestFailure: { type: object, additionalProperties: true }

    StackOperationsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/StackOperationsResponse" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ServerChannel:
      type: object
      required: [type, role, state]
      properties:
        type:
          type: string
          enum: [grpc-mtls, ssh, cloudflare-tunnel, provider-api]
        role:
          type: string
          enum: [primary, fallback, info-only]
        state:
          type: string
        endpoint_ref:
          type: string
          description: Redacted endpoint reference; never a credential.
        observed_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    ServerRuntime:
      type: object
      required: [id, name, lifecycle, connection, health, channels, inventory_revision, provider, mutations_allowed, created_at, updated_at]
      properties:
        id:
          type: string
        stack_id:
          type: string
        name:
          type: string
        lifecycle:
          type: object
          required: [state, desired_state]
          properties:
            state:
              type: string
              enum: [planned, provisioning, enrolling, active, failed, decommissioning, decommissioned]
            desired_state:
              type: string
              enum: [active, decommissioned]
            ended_at:
              type: string
              format: date-time
        connection:
          type: object
          required: [state, changed_at]
          properties:
            state:
              type: string
              enum: [pending, connecting, connected, degraded, stale, offline, revoked]
            reason_code:
              type: string
            changed_at:
              type: string
              format: date-time
            last_heartbeat_at:
              type: string
              format: date-time
            staleness_seconds:
              type: integer
              format: int64
              minimum: 0
        health:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [unknown, healthy, degraded, unhealthy]
            observed_at:
              type: string
              format: date-time
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ServerChannel"
        inventory_revision:
          type: integer
          format: int64
          minimum: 0
        provider:
          type: object
          properties:
            lease_id:
              type: string
            ref:
              type: string
        mutations_allowed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceRuntime:
      type: object
      required: [id, stack_id, server_id, service_key, service_instance, name, desired_state, observed_state, health, access, allowed_actions, source, provenance, created_at, updated_at]
      properties:
        id:
          type: string
        stack_id:
          type: string
        server_id:
          type: string
        service_key:
          type: string
        service_instance:
          type: string
        name:
          type: string
        desired_state:
          type: string
          enum: [running, stopped]
        observed_state:
          type: string
          enum: [unknown, starting, running, stopped, failed]
        health:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [unknown, healthy, degraded, unhealthy, starting]
            observed_at:
              type: string
              format: date-time
            reason_code:
              type: string
        stackkit_version:
          type: string
        access:
          $ref: "#/components/schemas/ServiceAccess"
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [start, stop, restart, logs]
        inventory_revision:
          type: integer
          format: int64
          minimum: 0
        evidence_ref:
          type: string
          description: Protected StackKits evidence reference; never inline secret material.
        source:
          type: string
        provenance:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceActionRequest:
      type: object
      additionalProperties: false
      required: [action, expected_inventory_revision, owner_approved]
      properties:
        action:
          type: string
          enum: [start, stop, restart, logs]
        expected_inventory_revision:
          type: integer
          format: int64
          minimum: 1
        owner_approved:
          type: boolean
          description: Required true for start, stop and restart; logs is read-only.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: Logs only; defaults to 100.
        cursor:
          type: string
          maxLength: 2048
          description: Logs only; opaque StackKits cursor from the prior page.

    ServiceActionResponse:
      type: object
      required: [job_id, service_id, action, status]
      properties:
        job_id: { type: string }
        service_id: { type: string }
        action: { type: string, enum: [start, stop, restart, logs] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled, canceled] }

    ServiceLogEntry:
      type: object
      required: [timestamp, message]
      properties:
        timestamp: { type: string, format: date-time }
        message: { type: string, maxLength: 16384 }

    ServiceLogsResponse:
      type: object
      required: [service_id, status, entries]
      properties:
        service_id: { type: string }
        job_id: { type: string }
        status: { type: string, enum: [queued, running, completed, empty] }
        entries:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ServiceLogEntry" }
        next_cursor: { type: string, maxLength: 2048 }

    ServiceAccess:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [direct, relay, unavailable]
        url:
          type: string
          format: uri
        access_profile_ref:
          type: string
        reason_code:
          type: string
        route_id:
          type: string
          description: Registered owner-isolated kombify.me tunnel route; never an arbitrary target address.

    # ---- Response Envelopes ----
    ClientPairingEnvelope:
      type: object
      additionalProperties: false
      required: [version, endpoint, instance_id, tls_fingerprint_sha256, one_time_code, issued_at, expires_at]
      properties:
        version:
          type: string
          const: "1"
        endpoint:
          type: string
          format: uri
          pattern: ^https://
        instance_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{2,127}$
        tls_fingerprint_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        one_time_code:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,256}$
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ClientPairingRedeemRequest:
      type: object
      additionalProperties: false
      required: [version, instance_id, tls_fingerprint_sha256, one_time_code]
      properties:
        version:
          type: string
          const: "1"
        instance_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{2,127}$
        tls_fingerprint_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        one_time_code:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,256}$

    ClientPairingRedeemResponse:
      type: object
      additionalProperties: false
      required: [version, status, instance_id, workspace_id, account_handoff]
      properties:
        version:
          type: string
          const: "1"
        status:
          type: string
          const: redeemed
        instance_id:
          type: string
        workspace_id:
          type: string
        account_handoff:
          type: object
          additionalProperties: false
          required: [kind, issuer, client_id, scopes, flow]
          properties:
            kind:
              type: string
              const: oidc
            issuer:
              type: string
              format: uri
            client_id:
              type: string
            audience:
              type: string
            scopes:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
            flow:
              type: string
              enum: [authorization_code_pkce, device_authorization]

    ClientErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error_code, reason_code, retryable, user_guidance]
      properties:
        error_code:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        reason_code:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        retryable:
          type: boolean
        user_guidance:
          type: object
          additionalProperties: false
          required: [title, body, next_steps]
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 160
            body:
              type: string
              minLength: 1
              maxLength: 2000
            next_steps:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: string
                minLength: 1
                maxLength: 500

    SuccessEnvelope:
      type: object
      properties:
        data:
          description: Response payload
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INTERNAL_ERROR
                - NOT_FOUND
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - CONFLICT
                - VALIDATION_ERROR
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - METHOD_NOT_ALLOWED
            message:
              type: string
            details:
              description: Additional error context (validation errors, etc.)

    ResponseMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        managed_runtime_inventory_complete:
          type: boolean
          description: True only when the managed RuntimeLease authority was configured and read successfully for this inventory response.
        worker_inventory_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stable digest of the complete worker identity, attachment, freshness, and managed RuntimeLease authority snapshot used for pagination.
        managed_runtime_active_lease_ids:
          type: array
          items:
            type: string
          description: Canonically sorted IDs of visible managed RuntimeLeases classified as active for inventory and cleanup. This visibility projection is not capacity reservation or release authority.
        managed_runtime_inactive_lease_ids:
          type: array
          items:
            type: string
          description: Canonically sorted IDs of visible managed RuntimeLeases classified as cancelled or archived for inventory and cleanup. Inactive state does not prove provider absence or release managed-server capacity.
        managed_runtime_lease_generation_digests:
          type: array
          items:
            type: object
            required: [lease_id, resource_generation_digest]
            properties:
              lease_id:
                type: string
              resource_generation_digest:
                type: string
                pattern: '^[0-9a-f]{64}$'
          description: Canonically sorted opaque bindings from each visible managed RuntimeLease ID to its exact provider-resource generation. Missing coverage makes destructive inventory proof invalid while leaving ordinary dashboard inventory readable.
        managed_runtime_duplicate_lease_ids:
          type: array
          items:
            type: string
          description: Managed RuntimeLease IDs represented by multiple persisted worker rows before UI projection deduplication; must be empty for destructive inventory proof.
        managed_runtime_attachment_conflict_lease_ids:
          type: array
          items:
            type: string
          description: Canonically sorted caller-visible managed RuntimeLease IDs with a conflicting tenant-wide worker attachment; must be empty for destructive inventory proof and never exposes foreign private lease or worker details.

    WorkerConnectRequest:
      type: object
      properties:
        server_id:
          type: string
        runtime_agent_id:
          type: string
        stack_id:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        mode:
          type: string
          example: advanced
        connection_mode:
          type: string
          enum: [install-command, ssh, managed, tunnel]
        provider:
          type: string

    WorkerEnrollmentResponse:
      type: object
      required: [worker_id, server_id, runtime_agent_id, accepted, credential_generation]
      properties:
        worker_id:
          type: string
        server_id:
          type: string
        runtime_agent_id:
          type: string
        accepted:
          type: boolean
        agent_token:
          type: string
          description: Stateful opaque bearer returned only for the exact enrollment/rotation attempt. Never log or expose outside the install handoff.
        credential_generation:
          type: integer
          format: int64
          minimum: 0
          description: Monotonically increasing runtime-agent credential generation; new Connect credentials start at 1.
        heartbeat_url:
          type: string
        inventory_url:
          type: string
        control_urls:
          type: array
          items:
            type: string
        channel_bootstrap:
          type: object
          additionalProperties: true

    WorkerCredentialRotateRequest:
      type: object
      required: [expected_credential_generation]
      properties:
        expected_credential_generation:
          type: integer
          format: int64
          minimum: 0
          description: Exact active generation that this request is authorized to replace.

    WorkerHeartbeatRequest:
      type: object
      properties:
        cpu_percent:
          type: number
        memory_used_bytes:
          type: integer
        memory_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
        disk_total_bytes:
          type: integer
        uptime_seconds:
          type: number
        runtime_convergence:
          $ref: "#/components/schemas/RuntimeConvergence"

    RuntimeConvergence:
      type: object
      required: [state, observed_at, components]
      properties:
        state:
          type: string
          enum: [pending, ready, degraded]
          description: Provider-neutral convergence state of the enrolled runtime packages.
        observed_at:
          type: string
          format: date-time
          description: UTC time at which the agent last evaluated runtime convergence.
        error_code:
          type: string
          enum: [runtime_convergence_incomplete]
          description: Stable aggregate code; raw executor errors are never sent.
        components:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeConvergenceComponent"

    RuntimeConvergenceComponent:
      type: object
      required: [name, state, observed_at]
      properties:
        name:
          type: string
          description: Provider-neutral runtime component identifier.
        state:
          type: string
          enum: [pending, ready, failed]
        observed_at:
          type: string
          format: date-time
        error_code:
          type: string
          enum: [techstack_runtime_unavailable, stackkits_runtime_unavailable, agent_restart_required]
          description: Stable component code; raw executor errors are never sent.

    WorkerInventoryRequest:
      type: object
      required: [source_epoch, source_sequence, observed_at, server_id, runtime_agent_id]
      properties:
        source_epoch:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable Guard boot/session epoch used with source_sequence for replay fencing.
        source_sequence:
          type: integer
          format: int64
          minimum: 1
          description: Strictly positive, monotonically increasing position within source_epoch.
        observed_at:
          type: string
          format: date-time
          description: UTC time at which the Guard observed this snapshot; observations over five minutes in the future are rejected.
        tenant_id:
          type: string
          description: Compatibility identity hint; the authenticated runtime-agent binding is authoritative.
        owner_id:
          type: string
          description: Compatibility identity hint; the authenticated runtime-agent binding is authoritative.
        stack_id:
          type: string
          description: Compatibility placement hint; the authenticated runtime-agent binding is authoritative.
        lease_id:
          type: string
          description: Compatibility lease hint; the authenticated runtime-agent binding is authoritative.
        server_id:
          type: string
        runtime_agent_id:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        agent_version:
          type: string
        stackkit:
          type: string
          description: StackKit identifier observed from the deployed access manifest, for example basement-kit or cloud-kit.
        stackkit_version:
          type: string
          description: Exact deployed StackKit release or version observed by Guard.
        stackkit_mode:
          type: string
          description: Deployed StackKit variant or mode observed by Guard.
        domain:
          type: string
          description: Primary address domain declared by the observed StackKit access manifest.
        manifest_observed:
          type: boolean
          description: >-
            True only when Guard successfully read a complete StackKit access
            manifest. False or omission is fail-safe and never authorizes
            reconciliation to delete previously observed services.
        runtime_convergence:
          $ref: "#/components/schemas/RuntimeConvergence"
        host:
          $ref: "#/components/schemas/WorkerInventoryHost"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryChannel"
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryEndpoint"
        services:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryService"

    WorkerInventoryIPAddress:
      type: string
      description: Canonical IPv4 or IPv6 address without a port, URL, or credentials.
      anyOf:
        - format: ipv4
        - format: ipv6

    WorkerInventoryHost:
      type: object
      properties:
        hostname:
          type: string
        os:
          type: string
        os_version:
          type: string
        arch:
          type: string
        public_ip:
          $ref: "#/components/schemas/WorkerInventoryIPAddress"
          x-kombify-ip-classification: public
          description: Globally routable address observed or explicitly configured by Guard; private and loopback addresses are excluded.
        private_ip:
          $ref: "#/components/schemas/WorkerInventoryIPAddress"
          x-kombify-ip-classification: private
          description: Private interface address observed by Guard, such as RFC1918 IPv4 or IPv6 ULA.
        local_ip:
          $ref: "#/components/schemas/WorkerInventoryIPAddress"
          x-kombify-ip-classification: local
          description: Route-selected local interface address; it can equal public_ip or private_ip and does not imply public reachability.
        cpu_cores:
          type: integer
        ram_mb:
          type: integer
        disk_gb:
          type: integer
        cpu_percent:
          type: number
        memory_used_bytes:
          type: integer
        memory_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
        disk_total_bytes:
          type: integer
        uptime_seconds:
          type: number

    WorkerInventoryChannel:
      type: object
      properties:
        kind:
          type: string
          enum: [https, websocket, grpc, ssh, tunnel]
        url:
          type: string
        status:
          type: string
        provenance:
          type: string

    WorkerInventoryEndpoint:
      type: object
      description: >-
        An endpoint is recorded as observation evidence, not automatically
        exposed as service access. A local direct link is trusted only when
        target_type=direct, provenance=stackkit-access-manifest, health is
        healthy, reachable, or ok, and the sanitized URL is an accepted
        home.localhost or non-private HTTP(S) address. Raw private-IP service
        URLs remain unavailable. Tunnel links additionally require an observed
        route_id and an accepted Kombify relay URL.
      properties:
        url:
          type: string
          format: uri
        address:
          type: string
        visibility:
          type: string
          enum: [public, tunnel, local, private]
        provenance:
          type: string
          enum: [custom-domain, kombify-domain, kombify-me, lan, localhost, cloudflare-tunnel, provider, stackkit-access-manifest, stackkit, stackkits, stackkit-runtime]
        kind:
          type: string
        health:
          type: string
        target_type:
          type: string
          enum: [direct, tunnel]
        route_id:
          type: string
        access_profile_ref:
          type: string

    WorkerInventoryService:
      type: object
      properties:
        id:
          type: string
        service_id:
          type: string
        key:
          type: string
        name:
          type: string
        status:
          type: string
        url:
          type: string
          format: uri
        owner_stack:
          type: string
        target_server:
          type: string
        container_id:
          type: string
        platform_id:
          type: string
        platform_type:
          type: string
        instance:
          type: string
          default: default
        stackkit_version:
          type: string
          description: StackKit version that produced this observed service.
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [start, stop, restart]
        health:
          type: object
          additionalProperties: true
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryEndpoint"

    MonthlyRuntimeOffering:
      type: object
      required: [id, name, billing_cadence]
      properties:
        id:
          type: string
          example: standard
        name:
          type: string
          example: Monthly Runtime Standard
        billing_cadence:
          type: string
          example: monthly
        image:
          type: string
          example: ubuntu-24.04
        vcpus:
          type: integer
          example: 4
        memory_mb:
          type: integer
          example: 8192
        disk_gb:
          type: integer
          example: 160
        region:
          type: string
          example: de-fra

    MonthlyRuntimeEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MonthlyRuntimeActionResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MonthlyRuntimeOperationsEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyRuntimeOperation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MonthlyRuntimeCleanupReadbackEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MonthlyRuntimeCleanupReadback"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MonthlyRuntimeCleanupReadback:
      type: object
      additionalProperties: false
      required: [lease_id, lease, server, provider_operation]
      properties:
        lease_id:
          type: string
          description: The owner-visible lease identifier supplied in the path.
        lease:
          type: object
          additionalProperties: false
          required: [desired_terminal, observed_terminal]
          properties:
            desired_terminal:
              type: boolean
            observed_terminal:
              type: boolean
        server:
          type: object
          additionalProperties: false
          required: [bound, terminal]
          properties:
            bound:
              type: boolean
              description: A canonical RuntimeServer remains exactly bound to the lease.
            terminal:
              type: boolean
              description: The bound RuntimeServer is decommissioned.
        provider_operation:
          type: object
          additionalProperties: false
          required: [found, terminal, capacity_released]
          properties:
            found:
              type: boolean
            terminal:
              type: boolean
              description: The selected operation is no longer running; this does not by itself prove successful cleanup.
            absence_evidence_ref:
              type: string
              pattern: "^provider-evidence://.+"
              description: Opaque provider-native absence-evidence reference; not an evidence document.
            capacity_released:
              type: boolean
              description: An exact generation-bound capacity-release fact exists.

    MonthlyRuntimeActionResponse:
      type: object
      properties:
        tenant_id:
          type: string
        lease_id:
          type: string
        action:
          type: string
        runtime_offering_id:
          type: string
        desired_state:
          type: string
        observed_state:
          type: string
        lease_state:
          type: string
        lease_reason:
          type: string
        enrollment_status:
          type: string
        ssh_enabled:
          type: boolean
        status:
          type: object
          additionalProperties: true
        ssh:
          type: object
          additionalProperties: true

    MonthlyRuntimeOperation:
      type: object
      required: [tenant_id, lease_id, event_type, status, created_at]
      properties:
        tenant_id:
          type: string
        lease_id:
          type: string
        event_type:
          type: string
          example: runtime_action
        status:
          type: string
          example: ssh_enabled
        actor:
          type: string
        error:
          type: string
        resource_generation_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Opaque binding to the exact lease resource generation; present on confirmed decommission events.
        created_at:
          type: string
          format: date-time

    # ---- Health ----
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Full Git commit SHA for the deployed artifact; omitted for development builds.
        service:
          type: string
          example: techstack
        time:
          type: string
          format: date-time

    InfoResponse:
      type: object
      properties:
        service:
          type: string
          example: techstack
        version:
          type: string
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Full Git commit SHA for the deployed artifact; omitted for development builds.
        go_version:
          type: string
        uptime_secs:
          type: number
        memory_mb:
          type: integer
        goroutines:
          type: integer
        pocketbase:
          type: boolean

    CapabilitiesResponse:
      type: object
      properties:
        tool:
          type: string
          example: kombify-techstack
        version:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        links:
          type: object
          properties:
            openapi:
              type: string
              example: /api/v1/openapi.yaml
            health:
              type: string
              example: /api/v1/health
            docs:
              type: string

    Capability:
      type: object
      required: [name, description, endpoint, method, requires_auth, idempotent]
      properties:
        name:
          type: string
          example: validate_spec
        description:
          type: string
        endpoint:
          type: string
          example: /api/v1/unifier/validate
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        requires_auth:
          type: boolean
        idempotent:
          type: boolean
        async:
          type: boolean
        tags:
          type: array
          items:
            type: string

    # ---- Stacks ----
    StackRoutingProvenance:
      type: object
      required: [source, dns_provider]
      additionalProperties: false
      properties:
        source:
          type: string
          minLength: 1
          description: Product or operator flow which selected the domain.
          example: kombify-cloud
        dns_provider:
          type: string
          minLength: 1
          description: DNS authority used by the StackKit routing layer.
          example: cloudflare
        zone_id:
          type: string
          description: Non-secret provider zone reference, when one is known.
        external_domain_id:
          type: string
          description: Optional external product-domain reference for provenance.

    StackRoutingPutRequest:
      type: object
      required: [server_id, mode, domain, provenance]
      additionalProperties: false
      properties:
        server_id:
          type: string
          minLength: 1
          description: >-
            Exact canonical ServerRuntime target belonging to the stack and owner.
            For a managed lease this is the server_id exposed by the operations/
            worker projection. If that read-model row is not present yet, TechStack
            may create only this deterministic ID from the validated exact lease.
        lease_id:
          type: string
          minLength: 1
          description: >-
            Exact RuntimeLease for a managed target. Omit for a local/Basement
            ServerRuntime that genuinely has no lease; invented leases are rejected.
        mode:
          type: string
          enum: [custom-domain]
        domain:
          type: string
          minLength: 1
          description: Normalized custom domain; schemes, paths, ports, and wildcards are rejected.
          example: example.com
        provenance:
          $ref: "#/components/schemas/StackRoutingProvenance"
        ensure_rollout:
          type: boolean
          default: false
          description: Request reconciliation without implying that it has already been dispatched or applied.

    StackRoutingDesired:
      type: object
      required: [stack_id, server_id, revision, mode, domain, provenance, rollout_status, created_at, updated_at]
      properties:
        stack_id: { type: string }
        server_id: { type: string }
        lease_id:
          type: string
          description: Present only when the exact target is lease-backed.
        revision: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [custom-domain] }
        domain: { type: string }
        provenance:
          $ref: "#/components/schemas/StackRoutingProvenance"
        rollout_status:
          type: string
          enum: [not_requested, pending, completed, failed]
        rollout_job_id: { type: string }
        reason_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StackRoutingObserved:
      type: object
      required: [status, applied, applied_revision]
      properties:
        status:
          type: string
          enum: [unknown, pending, applied, failed]
          description: >-
            Independent convergence state. A completed StackKit rollout remains
            pending until DNS, TLS, and runtime reachability are observed for the
            exact desired revision.
        applied:
          type: boolean
          description: False until a real observer proves this revision converged.
        applied_revision:
          type: integer
          format: int64
          minimum: 0

    StackRoutingRollout:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_requested, pending, completed, failed]
        job_id: { type: string }
        reason_code:
          type: string
          description: Present only when a rollout cannot advance or has an explicit reason.

    StackRoutingView:
      type: object
      required: [desired, observed, rollout]
      properties:
        desired:
          $ref: "#/components/schemas/StackRoutingDesired"
        observed:
          $ref: "#/components/schemas/StackRoutingObserved"
        rollout:
          $ref: "#/components/schemas/StackRoutingRollout"
        idempotent_replay:
          type: boolean
          description: True when the same Idempotency-Key and semantic request were replayed.

    StackRoutingViewEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/StackRoutingView"
        meta:
          type: object
          additionalProperties: true

    StackRoutingTarget:
      type: object
      required: [stack_id, server_id, lease_id, role, provider, lifecycle_state, connection_state]
      properties:
        stack_id: { type: string }
        server_id: { type: string, description: Deterministic canonical identity derived from the exact lease. }
        lease_id: { type: string }
        role: { type: string, enum: [foundation, control-plane, primary, main] }
        provider: { type: string }
        address: { type: string, description: Current authoritative public IP or runtime SSH host when available. }
        lifecycle_state: { type: string }
        connection_state: { type: string }

    StackRoutingTargetsEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [targets]
          properties:
            targets:
              type: array
              items:
                $ref: "#/components/schemas/StackRoutingTarget"
        meta:
          type: object
          additionalProperties: true

    ManagedRuntimeAuthorityPreflight:
      type: object
      required: [provider_id, budget_key, decision_source, request_bound, admission_preflight]
      properties:
        provider_id:
          type: string
          enum: [centron, ionos]
        budget_key:
          type: string
          const: cloud.runtime.credits
        decision_source:
          type: string
          const: edge_v2_entitlement+signed_budget:cloud.runtime.credits#managed_servers
        request_bound:
          type: boolean
          const: true
        admission_preflight:
          type: boolean
          const: true
          description: Confirms a native read-only preflight, never a capacity reservation or provider mutation.

    ManagedRuntimeAuthorityPreflightEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ManagedRuntimeAuthorityPreflight"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    AddManagedRuntimeServerRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id:
          type: string
          enum: [centron, ionos]
          description: Canonical executable provider identifier; historical display aliases are rejected.
        provider_region:
          type: string
          maxLength: 128
          description: Provider region. For IONOS this is normalized to the canonical datacenter identifier.
        ionos_datacenter:
          type: string
          maxLength: 128
          description: IONOS datacenter alias for provider_region; ignored for other canonical providers.
        node_role:
          type: string
          enum: [foundation, worker, storage]
          default: worker
        runtime_offering_id:
          type: string
          description: Canonical managed-runtime offering. Omission uses the stack's snapshotted effective default.
        stackkit:
          type: string
          description: StackKit foundation requested for this server.
        services:
          type: array
          maxItems: 128
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Service keys; duplicates and order are semantically insignificant.

    AddManagedRuntimeServer:
      type: object
      required:
        - stack_id
        - job_id
        - lease_id
        - runtime_server_id
        - resource_generation_id
        - operation_id
        - provider_id
        - node_role
        - runtime_offering_id
        - enrollment_status
        - runtime_phase
        - idempotent_replay
        - message
      properties:
        stack_id: { type: string }
        job_id:
          type: string
          description: Deterministic tenant/stack/operation/key job identity; it does not expose the raw key.
        lease_id: { type: string }
        runtime_server_id: { type: string }
        resource_generation_id:
          type: string
          format: uuid
          description: Sole generation authority for this admitted resource intent.
        operation_id:
          type: string
          description: Exact native provider-control operation correlation.
        provider_id:
          type: string
          enum: [centron, ionos]
        provider_region: { type: string }
        ionos_datacenter: { type: string }
        node_role:
          type: string
          enum: [foundation, worker, storage]
        runtime_offering_id: { type: string }
        enrollment_status:
          type: string
          const: pending
        runtime_phase:
          type: string
          const: lease_pending
        idempotent_replay:
          type: boolean
          description: True when the HTTP job or native admission was safely replayed.
        message: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: Non-terminal persistence warning; clients must retry only with the same Idempotency-Key.

    AddManagedRuntimeServerEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AddManagedRuntimeServer"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    CreateStackRequest:
      type: object
      properties:
        name:
          type: string
          description: Stack name
        mode:
          type: string
          enum: [easy, techie]
          description: Wizard mode
        stack_spec:
          type: object
          description: Canonical StackKits stack-spec.yaml shape generated by Easy or Techie Wizard. When present, this is the source of truth for provisioning and is stored as the stack user_config for compatibility.
        user_config:
          type: object
          description: Legacy structured configuration, including older kombination-style payloads. New wizard clients should send stack_spec.
        user_config_raw:
          type: string
          description: Raw YAML/JSON string
        user_config_format:
          type: string
          enum: [json, yaml]
        provider:
          type: string
          description: Infrastructure provider (direct format)
        services:
          type: array
          items:
            type: string
          description: Service names (direct format)
        options:
          type: object
          properties:
            identity_head:
              type: string
              enum: [pocket_id, pocketbase, generic_oidc]
              description: Homelab identity head selected by Wizard Round 4
            enable_pocket_id:
              type: boolean
              description: Enable Pocket ID as the identity provider
            enable_pocketbase_backend:
              type: boolean
              description: Enable optional PocketBase Homelab backend capabilities
            requires_passkeys:
              type: boolean
              description: Require passkey-capable identity flow
            enable_pocketbase:
              type: boolean
              deprecated: true
              description: Legacy alias. Use enable_pocketbase_backend instead.

    CreateStackResponse:
      type: object
      properties:
        stack_id:
          type: string
        server_id:
          type: string
          description: Canonical planned ServerRuntime created with the stack.
        job_id:
          type: string
        name:
          type: string
        state:
          type: string
          example: provisioning
        message:
          type: string
        operations_url:
          type: string
          description: Durable dashboard location for rollout, retry, diagnostics, and cleanup.
          example: /stacks?stack_id=stack_123
        idempotent_replay:
          type: boolean
          description: True when the response reuses an earlier creation attempt.
        bootstrap_token:
          type: string
          description: Short-lived bearer token for the StackKit owner-spec bootstrap endpoint. Present when the create request includes local owner bootstrap material.
        bootstrap_token_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp for bootstrap_token.
        owner_spec_endpoint:
          type: string
          example: /api/v1/stacks/stack_123/owner-spec
          description: Stack-scoped endpoint consumed by StackKit admin-bootstrap.
        owner_spec_scopes:
          type: array
          items:
            type: string
          example: [read:owner-spec]

    OwnerSpecResponse:
      type: object
      properties:
        stack_id:
          type: string
        identity:
          $ref: "#/components/schemas/OwnerSpecIdentity"
        scopes:
          type: array
          items:
            type: string
          example: [read:owner-spec]
        expires_at:
          type: string
          format: date-time

    OwnerSpecIdentity:
      type: object
      properties:
        owner:
          $ref: "#/components/schemas/OwnerSpecOwner"
        recovery:
          $ref: "#/components/schemas/OwnerSpecRecovery"

    OwnerSpecOwner:
      type: object
      properties:
        source:
          type: string
          enum: [local]
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string

    OwnerSpecRecovery:
      type: object
      properties:
        passphrase_hash:
          type: string
          description: Argon2id hash consumed by StackKit recovery bootstrap.
        passphraseHashPresent:
          type: boolean

    # ---- Jobs ----
    JobState:
      type: string
      enum: [pending, running, waiting, completed, failed, canceled]
      description: |
        `waiting` is active, non-terminal work. Clients must keep polling or
        consuming SSE and must not enable target access until completion.

    JobWait:
      type: object
      additionalProperties: false
      required: [state, reason, message]
      properties:
        state:
          type: string
          const: waiting
        reason:
          type: string
          enum: [waiting_enrollment]
        message:
          type: string
        next_resume_at:
          type: string
          format: date-time
          description: |
            The next check scheduled by the current orchestrator process.
            Clients must use the server-projected `resume_available` flag rather
            than comparing this value with a browser clock.

    JobDetail:
      type: object
      required: [id, type, state, progress]
      properties:
        id:
          type: string
        type:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        step:
          type: string
        current_step:
          type: string
        message:
          type: string
        error:
          type: string
        error_details:
          type: string
        error_message:
          type: string
        stack_id:
          type: string
        wait_reason:
          type: string
          enum: [waiting_enrollment]
        next_resume_at:
          type: string
          format: date-time
        resume_available_at:
          type: string
          format: date-time
          description: Server-authoritative earliest time for exact-target recovery.
        resume_available:
          type: boolean
          description: True only when the server-side recovery grace has elapsed.
        result:
          type: object
          additionalProperties: true
          description: |
            Persisted job result and immutable routing receipts. While legacy
            storage projects a wait as `pending`, `result.job_wait` follows
            `JobWait`; the API reconstructs canonical `state: waiting`. The
            result survives restarts. Queue-backed control-plane jobs with a
            configured durable store must win a pending-to-running claim before
            their handler starts; provider lifecycle workers use their own
            operation contracts and are not covered by that queue claim.
          properties:
            job_wait:
              $ref: "#/components/schemas/JobWait"
        logs:
          type: array
          items: {}
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobProgress:
      type: object
      required: [id, state, progress, current_step]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        wait_reason:
          type: string
          enum: [waiting_enrollment]
        next_resume_at:
          type: string
          format: date-time
        resume_available_at:
          type: string
          format: date-time
        resume_available:
          type: boolean
        progress:
          type: integer
          minimum: 0
          maximum: 100
        step:
          type: string
        current_step:
          type: string
        message:
          type: string
        error:
          type: string
        error_details:
          type: string

    JobEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/JobDetail"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    JobListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, page, per_page, total_items, total_pages]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/JobDetail"
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
              maximum: 200
            total_items:
              type: integer
              minimum: 0
            total_pages:
              type: integer
              minimum: 0
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    AsyncJobResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        job_id:
          type: string

    EnrollmentResumeRequest:
      type: object
      additionalProperties: false
      required: [job_id, lease_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Persisted source job currently projected as waiting_enrollment.
        lease_id:
          type: string
          minLength: 1
          description: Exact managed foundation lease already bound to the source job.

    EnrollmentResumeResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - stack_id
        - job_id
        - source_job_id
        - lease_id
        - server_id
        - idempotent_replay
        - provider_vm_create_requested
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        stack_id:
          type: string
        job_id:
          type: string
        source_job_id:
          type: string
        lease_id:
          type: string
        server_id:
          type: string
          description: Canonical deterministic server identity derived from lease_id.
        idempotent_replay:
          type: boolean
        provider_vm_create_requested:
          type: boolean
          const: false
        bootstrap_token:
          type: string
          description: Optional short-lived StackKit owner-spec bootstrap bearer.
        bootstrap_token_expires_at:
          type: string
          format: date-time
        owner_spec_endpoint:
          type: string
        owner_spec_scopes:
          type: array
          items:
            type: string

    EnrollmentResumeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EnrollmentResumeResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ExactRolloutRetryRequest:
      type: object
      additionalProperties: false
      required: [source_job_id, lease_id]
      properties:
        source_job_id:
          type: string
          minLength: 1
          description: Exact failed deploy job used as immutable retry evidence.
        lease_id:
          type: string
          minLength: 1
          description: Exact active managed foundation lease bound to the failed job.

    ExactRolloutRetryResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - stack_id
        - job_id
        - source_job_id
        - lease_id
        - server_id
        - idempotent_replay
        - provider_vm_create_requested
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        stack_id:
          type: string
        job_id:
          type: string
        source_job_id:
          type: string
        lease_id:
          type: string
        server_id:
          type: string
        idempotent_replay:
          type: boolean
        provider_vm_create_requested:
          type: boolean
          const: false
        bootstrap_token:
          type: string
        bootstrap_token_expires_at:
          type: string
          format: date-time
        owner_spec_endpoint:
          type: string
        owner_spec_scopes:
          type: array
          items:
            type: string

    ExactRolloutRetryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ExactRolloutRetryResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    PipelineStatusResponse:
      type: object
      properties:
        stack_id:
          type: string
        intent_exists:
          type: boolean
        requirements_exists:
          type: boolean
        unified_exists:
          type: boolean
        base_dir:
          type: string
        intent_sha256:
          type: string
        intent_byteLength:
          type: integer
        requirements_metadata:
          type: object
        unified_metadata:
          type: object
        hash_chain_valid:
          type: boolean

    # ---- Validation ----
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      properties:
        path:
          type: string
          description: JSON path to the offending field
        code:
          type: string
        message:
          type: string

    # ---- Drift ----
    DriftStatusResponse:
      type: object
      properties:
        stack_id:
          type: string
        drift_status:
          type: string
        checked_at:
          type: string
          format: date-time
        affected_count:
          type: integer
        last_job_id:
          type: string
        last_result_id:
          type: string

    DriftDetailsResponse:
      type: object
      properties:
        stack_id:
          type: string
        status:
          type: string
        checked_at:
          type: string
          format: date-time
        affected_resources:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              resource_type:
                type: string
              name:
                type: string
              action:
                type: string
              changes:
                type: object
        summary:
          type: object
          properties:
            to_create:
              type: integer
            to_update:
              type: integer
            to_delete:
              type: integer
        duration_ms:
          type: integer
        error_message:
          type: string

    DriftResultsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              stack_id:
                type: string
              stack_name:
                type: string
              status:
                type: string
              affected_count:
                type: integer
              trigger_type:
                type: string
              checked_at:
                type: string
                format: date-time
              duration_ms:
                type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # ---- Pre-Checks ----
    PreCheckRequest:
      type: object
      required: [checks]
      properties:
        worker_id:
          type: string
        stack_id:
          type: string
        checks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - docker_version
                  - gpu_available
                  - disk_space
                  - ram_available
                  - port_available
              description:
                type: string
              min_version:
                type: string
              blocking:
                type: boolean
        timeout_seconds:
          type: integer
          default: 30

    PreCheckResponse:
      type: object
      properties:
        request_id:
          type: string
        worker_id:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              worker_id:
                type: string
              stack_id:
                type: string
              check_type:
                type: string
              description:
                type: string
              blocking:
                type: boolean
              status:
                type: string
                example: pending
              request_id:
                type: string
        message:
          type: string

    # ---- Discovery ----
    ScanRequest:
      type: object
      properties:
        subnet:
          type: string
          example: "192.168.1.0/24"
        target_ips:
          type: array
          items:
            type: string
        exclude_ips:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer
          default: 30
        max_concurrent:
          type: integer
          default: 50
        profile:
          type: string
          enum: [passive, active]
          default: passive

    ScanResponse:
      type: object
      properties:
        scan_id:
          type: string
        status:
          type: string
          enum: [running, completed, cancelled, failed]
        profile:
          type: string
        subnet:
          type: string
        target_ips:
          type: array
          items:
            type: string
        exclude_ips:
          type: array
          items:
            type: string
        devices:
          type: array
          items:
            type: object
        started_at:
          type: string
          format: date-time
        progress:
          type: object
          properties:
            scanned:
              type: integer
            remaining:
              type: integer
            total:
              type: integer

    # ---- Features ----
    FeatureState:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        locked:
          type: boolean
        requires_consent:
          type: boolean
        has_consent:
          type: boolean
        risk_level:
          type: string
        description:
          type: string
        category:
          type: string

    # ---- Agents ----
    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string

    # ---- Runtime Logs ----
    RuntimeLogsEnvelope:
      type: object
      description: Standard success envelope; `data` is the runtime log slice.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeLogEntry"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    RuntimeLogEntry:
      type: object
      description: |
        A single runtime/deploy log entry. `timestamp`, `level`, and `message`
        are always present; the remaining fields are emitted only when non-empty.
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        id:
          type: string
        ingested_at:
          type: string
          format: date-time
        agent_id:
          type: string
        source:
          type: string
        stack_id:
          type: string
        job_id:
          type: string
        lease_id:
          type: string
        provider:
          type: string
        runtime_action_id:
          type: string
        service_name:
          type: string
        container_id:
          type: string
        trace_id:
          type: string
        span_id:
          type: string
        fields:
          type: object
          additionalProperties: true

    # ---- Wallet ----
    WalletItemsEnvelope:
      type: object
      description: Standard success envelope; `data.items` is the redacted item list.
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WalletItem"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    WalletItem:
      type: object
      description: |
        Redacted wallet recovery item. `secret` and `totp` are never present in
        list responses; only the `has_secret`/`has_totp` presence flags are
        exposed. Additional metadata keys may be present.
      required: [id, kind]
      additionalProperties: true
      properties:
        id:
          type: string
        kind:
          type: string
        stack_id:
          type: string
        source_type:
          type: string
        source_ref:
          type: string
        has_secret:
          type: boolean
        has_totp:
          type: boolean
        item_class:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time

    WalletReauthRequest:
      type: object
      description: |
        Fresh platform re-authentication assertion. The trusted-reauth proof may
        also be supplied via the `X-Kombify-Reauth-*` / `X-TechStack-Reauth-*`
        request headers.
      properties:
        reason:
          type: string
        reauth_timestamp:
          type: string
        reauth_signature:
          type: string
        reauth_assertion:
          type: string
        platform_reauth_at:
          type: string

    WalletReauthProofEnvelope:
      type: object
      description: Standard success envelope; `data` is the minted reauth proof.
      properties:
        data:
          $ref: "#/components/schemas/WalletReauthProof"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    WalletReauthProof:
      type: object
      required: [id, reauth_timestamp, reauth_signature, expires_at]
      properties:
        id:
          type: string
        reauth_timestamp:
          type: string
          description: Unix epoch seconds (string) the proof was minted at.
        reauth_signature:
          type: string
          description: Hex-encoded HMAC-SHA256 trusted-reauth signature.
        expires_at:
          type: string
          format: date-time
        reauth_method_hint:
          type: string
          example: kombify-cloud

    WalletRevealRequest:
      type: object
      description: |
        Reveal request gated by a fresh trusted-reauth HMAC proof. The
        timestamp/signature may instead be supplied via the
        `X-Kombify-Reauth-*` / `X-TechStack-Reauth-*` request headers.
      required: [reauth_timestamp, reauth_signature]
      properties:
        reason:
          type: string
        reauth_timestamp:
          type: string
        reauth_signature:
          type: string
        reauth_assertion:
          type: string
        platform_reauth_at:
          type: string

    WalletRevealEnvelope:
      type: object
      description: Standard success envelope; `data` is the revealed recovery values.
      properties:
        data:
          $ref: "#/components/schemas/WalletReveal"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    WalletReveal:
      type: object
      description: |
        One-time plaintext recovery values. `secret` and `totp` are omitted when
        the corresponding stored value is empty.
      required: [id, revealed_at]
      properties:
        id:
          type: string
        secret:
          type: string
        totp:
          type: string
        revealed_at:
          type: string
          format: date-time
