  /api/v1/monthly-runtimes/{lease_id}/recreate:
    post:
      operationId: recreateMonthlyRuntime
      x-kombify-cli: { command: "monthly-runtimes recreate", args: [lease_id] }
      x-kombify-confirmation: "This operation replaces the runtime's provider server with a newly provisioned one and is billed."
      x-kombify-mcp:
        requiredCapability: techstack.inventory.provision
        costBearing: true
        actionClass: cost_bearing
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: true, openWorldHint: true }
      tags: [Monthly Runtime, Stacks, Jobs]
      summary: Recreate one fully released managed server generation
      description: >
        Explicitly provisions generation N+1 for the same provider-neutral
        runtime slot after generation N has terminal lease and canonical server
        state, terminal provider operation state, opaque provider-native absence
        evidence, and exact capacity release. The immutable provider, region,
        offering, role, StackKit, and service intent is recovered from the old
        owner-scoped lease; clients cannot replace it. The endpoint delegates to
        the same managed-runtime expansion authority as Add Node, so enrollment,
        Guard evidence, endpoints, and StackKit rollout proceed through the full
        Creation flow. A standard Idempotency-Key is mandatory and safely
        replays the accepted generation.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque, retry-stable key for this confirmed recreate attempt.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyRuntimeRecreateRequest"
      responses:
        "202":
          description: New managed-runtime generation accepted through the central Creation lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddManagedRuntimeServerEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cleanup is incomplete, immutable intent is unavailable, or the slot generation changed.
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

