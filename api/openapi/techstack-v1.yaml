      tags: [Workers, RIL]
      summary: Rotate or recover one runtime-agent credential
      description: >-
        Owner-authenticated, generation-fenced credential rotation. The
        expected generation and Idempotency-Key bind one transition. An exact
        replay returns the same new token; a stale generation, changed request,
        or reused key returns 409.
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 256
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCredentialRotateRequest"
      responses:
        "200":
