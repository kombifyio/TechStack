  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      x-kombify-cli: { command: "jobs get", args: [id] }
      tags: [Jobs]
      summary: Get the current state of one owned job
      description: |
        This is the canonical polling surface for the UI, API clients, MCP
        tools, and agents. `waiting_enrollment` exposes a non-terminal wait;
        access to the target remains unavailable until the job resumes and
        reaches a terminal success state.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{id}/stream:
    get:
      operationId: streamJob
      x-kombify-cli: { command: "jobs stream", args: [id], hidden: true }
      x-kombify-mcp: false # Server-Sent Events stream; the direct invoker cannot serve a stream
      tags: [Jobs]
      summary: Stream job progress via SSE
      description: |
        Emits `progress` events whose JSON payload follows `JobProgress`.
        Waiting-state events include `wait_reason` and `next_resume_at` and
        remain non-terminal.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: SSE event stream for job progress
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/jobs/{id}/logs:
