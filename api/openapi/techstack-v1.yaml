        answers 200 with `success: false` and the error. Requires the
        `native_v2_wizard` feature for the caller.
      x-kombify-cli: { command: "wizard remote test-ssh" }
      x-kombify-mcp:
        title: Test remote SSH
        toolName: test_remote_ssh
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [host, user]
              properties:
                host: { type: string, minLength: 1 }
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                user: { type: string, minLength: 1 }
                auth_method: { type: string, enum: [ssh-key, password], default: ssh-key }
                ssh_wallet_item_id: { type: string, pattern: "^itm_[a-z2-7]{26}$", description: Wallet node access item holding the SSH key or password. }
                ssh_key_label: { type: string, description: Label of a stored SSH key; only on deployments that read the built-in wallet. }
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [success]
                    properties:
                      success: { type: boolean }
                      message: { type: string }
                      error: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

