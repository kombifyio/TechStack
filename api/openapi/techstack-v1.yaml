      responses:
        "200":
          description: Job queue stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  stats:
                    type: object
                    required:
                      [
                        total,
                        pending,
                        waiting,
                        running,
                        completed,
                        failed,
                        canceled,
                      ]
                    properties:
                      total: { type: integer, minimum: 0 }
                      pending: { type: integer, minimum: 0 }
                      waiting: { type: integer, minimum: 0 }
                      running: { type: integer, minimum: 0 }
                      completed: { type: integer, minimum: 0 }
                      failed: { type: integer, minimum: 0 }
                      canceled: { type: integer, minimum: 0 }

  /api/v1/failures/signatures:
    get:
      operationId: listFailureSignatures
      x-kombify-cli: { command: "failures signatures" }
      tags: [Jobs]
      summary: List the tenant's failure signatures
      description: |
        Returns the caller tenant's own failed operations normalized into
        failure signatures, most recently seen first. A signature is the
        SHA-256 over the normalizer version, component, phase, error code and
        a template in which every variable token (timestamps, IDs, addresses,
        host names, paths, user names, quoted values, numbers) is replaced.
        No raw error text is stored or returned, and another tenant's
        occurrences are never visible.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: window_days
          in: query
          required: false
          description: Length of the growth window; recent_occurrences counts the last window, previous_occurrences the one before it.
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: The tenant's failure signatures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureSignatureListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/failures/outcomes:
    post:
      operationId: recordFailureOutcome
      x-kombify-cli: { command: "failures outcome record" }
      tags: [Jobs]
      summary: Record the outcome of an applied failure resolution
      description: |
        Attributes a finished procedure job of the caller tenant to the
        failure resolution it applied and the failure signature it was
        applied to. The outcome is the job's terminal state (completed is
        succeeded, failed is failed), never a value the caller sends; a job
        that is still running or was canceled is refused. The context is the
        one of the tenant's own latest occurrence of that signature. The
        record stays in the tenant; repeating the call for the same
        resolution and job returns the stored record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordFailureOutcomeRequest"
      responses:
        "200":
          description: The outcome was already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureOutcomeEnvelope"
        "201":
          description: The outcome was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureOutcomeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listFailureOutcomes
      x-kombify-cli: { command: "failures outcomes" }
      tags: [Jobs]
      summary: List the tenant's failure resolution outcomes
      description: |
        Returns the caller tenant's own recorded resolution outcomes, newest
        first, and the succeeded and failed counts per resolution and
        signature. Another tenant's outcomes are never visible.
      parameters:
        - name: resolution_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: The tenant's failure resolution outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureOutcomeListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

