      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          examples:
            base:
              value: base-kit
            modern:
              value: modern-homelab
            ha:
              value: ha-homelab
      responses:
        "200":
          description: StackKit details
          content:
