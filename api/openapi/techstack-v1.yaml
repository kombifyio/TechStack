          description: Unresolved outcomes, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GuardUnresolvedOutcomeList" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/{id}/outcomes/{command_id}/resolve:
    post:
      operationId: resolveGuardUnresolvedOutcome
      x-kombify-cli: { command: "workers outcomes resolve", args: [id, command_id] }
      x-kombify-confirmation: "This operation releases the fence of an operation whose outcome was never settled, so conflicting changes may run against the server."
      x-kombify-mcp: false # operator decision with a step-up, not an agent tool
      tags: [Workers]
      summary: Release an unresolved kombify Guard operation outcome
      description: >-
        Commits an append-only operator resolution revision for an operation
        whose outcome is unknown and releases the worker's fence. `disposition`
        is `verified_applied` (the effect is in place), `verified_not_applied`
        (nothing happened) or `accept_unknown` (release without a verified
        outcome); `note` records what was verified. The actor is the
        authenticated subject and is recorded with the revision; a Guard cannot
        commit these dispositions. A fresh multi-factor sign-in (at most 300
        seconds old) is required. `expected_revision` must be the revision the
        list returned, otherwise 409 `outcome_revision_stale`. The body is
        decoded strictly: exact keys, no unknown fields.
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: command_id
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardOutcomeResolutionRequest"
      responses:
        "200":
          description: The resolution revision was committed and the fence released
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GuardOutcomeResolution" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

