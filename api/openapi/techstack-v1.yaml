      summary: Read node-owned connector status and current published transport admission
      description: Returns a secret-free projection. An unavailable supporting catalog remains nondispatchable SourcePreview; stale evidence on a supporting pin requires current read-only verification. Dispatchability additionally requires current canonical host-key, node and lease authority.
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Connector source preview and projected receipt status
          content:
            application/json:
              schema:
                type: object
                properties:
