  # ============================================================
  # RUNTIME LOGS
  # ============================================================
  /api/v1/runtime/logs:
    get:
      operationId: getRuntimeLogs
      x-kombify-cli: { command: "runtime logs" }
      tags: [Runtime]
      summary: Get recent runtime/deploy logs
      description: |
        Returns recent runtime/deploy log entries (job/deploy progress plus
        container tail) from the gRPC server's runtime log buffer, filtered by
        the supplied query parameters. Requires authentication and an available
        gRPC server.
      parameters:
        - name: stack_id
          in: query
          schema:
            type: string
        - name: job_id
          in: query
          schema:
            type: string
        - name: lease_id
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: service_name
          in: query
          description: Service name (alias `service` also accepted).
          schema:
            type: string
        - name: min_level
          in: query
          description: Minimum log level (alias `level` also accepted).
          schema:
            type: string
            enum: [debug, info, warn, error]
        - name: since
          in: query
          description: RFC3339 lower bound for log timestamps.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Runtime log entries (newest-first buffer slice).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeLogsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: gRPC server not available

  # ============================================================
  # WALLET (recovery items; redacted list + reauth-gated reveal)
  # ============================================================
  /api/v1/wallet:
    get:
      operationId: listWalletItems
      x-kombify-cli: { command: "wallet list" }
      tags: [Wallet]
      summary: List redacted wallet recovery items
      description: |
        Lists the caller's wallet recovery items for the resolved tenant. The
        `secret` and `totp` values are always stripped from this response; only
        presence flags (`has_secret`, `has_totp`) are exposed.
      parameters:
        - name: stack_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Redacted wallet item list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletItemsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Wallet store is not configured
    post:
      operationId: createWalletItem
      x-kombify-cli: { command: "wallet create" }
      x-kombify-mcp:
        title: Add wallet item
        toolName: create_wallet_item
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: false }
      tags: [Wallet]
      summary: Create a wallet item without secret values
      description: >-
        Creates a wallet item owned by the caller in the resolved tenant and returns it redacted. The server
        assigns the id. `secret` and `totp` values are entered by the person in the Wallet and are not part of
        this contract; an item created here has no secret until the person adds one, and a secret can never be
        read back through this API without the person's fresh re-authentication. Only deployments that keep
        credentials in Techstack's own Wallet serve this route; elsewhere it answers 409 `self_hosted_only`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                kind: { type: string, enum: [password, api_key, ssh_key, oauth_token, certificate, other], description: Defaults to `other`. Cannot be changed later. }
                username: { type: string }
                url: { type: string }
                notes: { type: string, description: Free text; never put credentials here. }
                stack_id: { type: string, description: Stack (kit deployment) the item belongs to. }
                service_id: { type: string }
                expires_at: { type: string, format: date-time }
                item_class: { type: string, enum: [launch, user_account, credential, recovery, machine_secret_ref, manual] }
                access_mode: { type: string, enum: [open, reveal, manage] }
                source_type: { type: string }
                source_ref: { type: string }
      responses:
        "201":
          description: The created item, redacted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WalletItem" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Wallet store is not configured

  /api/v1/wallet/{id}/reauth-proof:
    post:
      operationId: createWalletReauthProof
      x-kombify-cli: { command: "wallet reauth-proof", args: [id] }
      x-kombify-mcp: false # reveals or mints a credential behind interactive re-authentication
      tags: [Wallet]
      summary: Mint a short-lived reauth proof after a fresh platform re-auth
      description: |
        After a fresh biometric/platform re-authentication, mints a short-lived
        trusted-reauth HMAC proof (timestamp + signature) usable to authorize a
        subsequent reveal within the 5-minute window. Requires a valid fresh
        platform reauth assertion on the request.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletReauthRequest"
      responses:
        "200":
          description: Reauth proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletReauthProofEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
