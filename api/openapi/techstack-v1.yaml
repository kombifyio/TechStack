  # ============================================================
  # SANITIZED PRODUCT INVENTORY
  # ============================================================
  /api/v1/inventory/servers:
    get:
      operationId: listInventoryServers
      tags: [Inventory]
      summary: List sanitized server inventory for the authenticated owner
      description: >-
        Returns only servers owned by the authenticated subject in the trusted
        tenant context. Tenant and owner overrides are not accepted. Raw
        metadata, channel endpoints, provider-resource references, credentials,
        SSH material, tokens, and logs are never returned. The lease projection
        contains only an opaque identifier and state. Cursor pages share one
        authorization- and filter-bound collection watermark and exclude later
        inserts. Each server carries its connection and health state and a
        freshness-qualified metrics block (cpu, memory and disk percent, uptime
        seconds); a figure from a stale heartbeat is reported as stale without
        a value.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
      x-kombify-cli: { command: "inventory servers list" }
      x-kombify-mcp:
        title: List servers
        toolName: list_servers
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      responses:
        "200":
          description: Owner-scoped inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/InventoryServerList" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/ril/servers:
    $ref: "#/paths/~1api~1v1~1inventory~1servers"

  /api/v1/servers/summary:
    get:
      operationId: getRILServerSummary
      x-kombify-cli: { command: "servers summary" }
      x-kombify-mcp: false # Gateway compatibility read with a caller-supplied tenant argument; list_servers covers it
      tags: [Inventory, RIL]
      summary: Read the authenticated owner's server-presence summary
      description: >-
        Returns only a count and presence flag under the same tenant and owner
        policy scope as the canonical inventory list. The optional tenant query
        exists for Gateway compatibility and must exactly match the tenant in
        the authenticated identity; a mismatch is rejected before any store
        read. No server, tenant, or subject identifiers are returned.
      parameters:
        - name: tenant
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Owner-scoped server presence; private-cacheable for 60 seconds
          headers:
            Cache-Control:
              schema: { type: string, example: "private, max-age=60" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RILServerSummary" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/ril/servers/summary:
    $ref: "#/paths/~1api~1v1~1servers~1summary"

  /api/v1/inventory/servers/{serverId}:
    patch:
      operationId: renameInventoryServer
      tags: [Inventory]
      summary: Set or clear the owner-chosen name of one owned server
      description: >-
        Writes servers.display_name, which runtime projections never
        overwrite. `null` or an empty string clears the rename. Requires the
        signed techstack.inventory.write entitlement and the FGA server
        `caller` relation; the write is bound to the authenticated tenant and
        owner, and a server outside that scope is denied without revealing
        whether it exists. The canonical inventory `name` reports the chosen
        name when one is set.
      x-kombify-cli: { command: "inventory servers rename", args: [server_id] }
      x-kombify-mcp:
        title: Rename server
        toolName: rename_server
        resourceBinding: { argument: server_id, dimension: techstack.server }
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - $ref: "#/components/parameters/serverId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              additionalProperties: false
              properties:
                display_name: { type: [string, "null"], maxLength: 100 }
      responses:
        "200":
          description: The renamed server's inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/InventoryServer"
                      - type: object
                        required: [display_name]
                        properties:
                          display_name: { type: [string, "null"], maxLength: 100 }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

