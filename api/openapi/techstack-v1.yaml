  /api/v1/home-assistant/migrations:
    post:
      operationId: startHomeAssistantMigration
      x-kombify-cli: { command: "home-assistant migrations start" }
      x-kombify-mcp:
        title: Start Home Assistant migration
        toolName: start_home_assistant_migration
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Services]
      summary: Start a native Home Assistant migration to an isolated target
      description: >-
        Starts (or resumes) the durable migration run for an authorized local binding: archive the source,
        provision an isolated target on the owner's own substrate, restore and verify it, then wait for the
        cutover confirmation. The run id is derived from tenant, owner and target, so repeating the call resumes
        the same run. The request must match the binding's source service and authorization reference exactly
        (403 otherwise). Self-hosted installs with a configured local binding only (503
        `migration_executor_unavailable` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_service_id, target_binding_ref, authorization_ref]
              properties:
                source_service_id: { type: string, minLength: 1 }
                target_binding_ref: { type: string, minLength: 1 }
                authorization_ref: { type: string, minLength: 1, description: Opaque reference of the binding's authorization; not a secret. }
      responses:
        "202":
          description: Migration run started or resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [run_id]
                    properties:
                      run_id: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/home-assistant/migrations/{id}/confirm:
    post:
      operationId: confirmHomeAssistantMigration
      x-kombify-cli: { command: "home-assistant migrations confirm", args: [migration_id] }
      x-kombify-mcp:
        title: Confirm Home Assistant cutover
        toolName: confirm_home_assistant_cutover
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Services]
      summary: Confirm the cutover of a verified Home Assistant migration
      description: >-
        Delivers the explicit cutover confirmation to a migration run that is waiting for it. The run then stops
        the source, moves the exclusive attachments to the target and starts it; the original and its archive
        are retained and the migration can be returned with the rollback call. Answers 400 when the run is not
        awaiting confirmation and 404 for a run the caller does not own.
      parameters:
        - name: id
          in: path
          required: true
          x-kombify-name: migration_id
          description: Migration run id
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true], description: Must be true. }
      responses:
        "202":
          description: Cutover confirmation delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [run_id]
                    properties:
                      run_id: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/home-assistant/migrations/{id}/rollback:
    post:
      operationId: rollbackHomeAssistantMigration
      x-kombify-cli: { command: "home-assistant migrations rollback", args: [migration_id] }
      x-kombify-mcp:
        title: Return Home Assistant migration
        toolName: roll_back_home_assistant_migration
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Services]
      summary: Return a completed or failed Home Assistant migration to the original instance
      description: >-
        Starts the return run for an owned migration that completed or failed and kept its source archive:
        archive the target, stop it, return the exclusive attachments and start and verify the original. The
        return run id is the migration run id with `:rollback`, so repeating the call resumes it. Answers 400
        when the migration is not in a returnable state and 404 for a run the caller does not own.
      parameters:
        - name: id
          in: path
          required: true
          x-kombify-name: migration_id
          description: Migration run id
          schema: { type: string }
      responses:
        "202":
          description: Return run started or resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [run_id]
                    properties:
                      run_id: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/home-assistant/owners/attach:
    post:
      operationId: attachHomeAssistantOwner
      x-kombify-cli: { command: "home-assistant owners attach" }
      x-kombify-mcp:
        title: Attach Home Assistant to its owner
        toolName: attach_home_assistant_owner
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: true }
      tags: [Services]
      summary: Attach an owned Home Assistant instance to a pending owner enrollment
      description: >-
        Binds the instance's endpoint and the long-lived access token held in the Wallet item
        `token_wallet_item_id` (a kombify Wallet item assigned to Techstack, or a built-in wallet API key or OAuth
        token item whose URL names this instance; resolved inside Techstack, never answered; this contract accepts no
        token) to a
        pending owner enrollment of an owned stack,
        with the lifecycle grants and baseline settings the owner chooses. The token is stored encrypted and an
        existing attachment is never overwritten (409 `attachment_rejected`). Self-hosted installs only (503
        otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stack_id, binding_ref, url, token_wallet_item_id]
              properties:
                stack_id: { type: string, minLength: 1 }
                binding_ref: { type: string, minLength: 1 }
                url: { type: string }
                token_wallet_item_id: { type: string, minLength: 1, description: Wallet item holding the Home Assistant long-lived access token. }
                lease_id: { type: string, description: Managed guest lease; required for a new instance. }
                configure_granted: { type: boolean }
                lifecycle_grants:
                  type: object
                  properties:
                    Backup: { type: boolean }
                    Restore: { type: boolean }
                    Update: { type: boolean }
                dependency_assessment_ref: { type: string }
                recovery_binding_ref: { type: string }
                recovery_backup_operation_id: { type: string }
                settings:
                  type: object
                  properties:
                    language: { type: string }
                    time_zone: { type: string }
                    internal_url: { type: string }
                    external_url: { type: string }
      responses:
        "200":
          description: The instance was attached
          content:
            application/json:
              schema:
                type: object
