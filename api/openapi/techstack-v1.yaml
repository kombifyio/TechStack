      x-kombify-cli: { command: "workers outcomes list", args: [id] }
      tags: [Workers]
      summary: List the unresolved operation outcomes of one kombify Guard
      description: >-
        Lists the operations of an owned worker whose outcome is unknown: the
        kombify Guard recorded that the effect may or may not have happened and
        no observation settled it. Each one fences further changes on the server.
        `state` is `reconciling` while the Guard still tries to settle it and
        `needs_operator` once it stayed unresolved past the configured time
        (`TECHSTACK_GUARD_OUTCOME_NEEDS_OPERATOR_AFTER`, default 30 minutes).
        The time only changes how the outcome is shown; it never releases the
        fence. Another tenant's or owner's worker is 404.
      parameters:
