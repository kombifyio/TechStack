openapi: 3.1.0
info:
  title: kombify-TechStack API
  description: |
    REST API for kombify-TechStack -- the hybrid cloud control plane for homelabs.

    kombify-TechStack manages infrastructure through a spec-driven architecture:
    validate YAML specs via CUE, generate OpenTofu configurations, and manage
    nodes through a gRPC agent protocol.

    ## Authentication

    Authenticated endpoints accept an OIDC/JWKS bearer token or an API key
    where documented. Self-hosted TechStack defaults to Pocket ID as identity
    provider. SaaS routes enter through the edge with Auth0 as the platform
    identity provider. PocketBase session exchange remains legacy migration
    compatibility only.

    ## Response Format

    **Success:** `{ "data": <object>, "meta": { "total": int, "page": int, "per_page": int } }`

    **Error:** `{ "error": { "code": "<ERROR_CODE>", "message": "...", "details": <any> } }`

    ## Pagination

    List endpoints accept `page` (default: 1) and `per_page` (default: 20, max: 100) query parameters.
  version: 1.0.0
  contact:
    name: kombify
    url: https://kombify.io
  license:
    name: Apache-2.0 AND GPL-3.0
    url: https://github.com/kombifyio/TechStack/blob/main/LICENSE

# ============================================================
# SERVERS
# ============================================================
# All paths in this document are authored as /api/v1/*. The Gateway projects
# the mobile/public surface as `https://api.kombify.io/v1/techstack/<route>`
# and strip-prefixes `/v1/techstack`, re-adding `/api/v1` at TECHSTACK_ORIGIN
# (see x-kombify-route-projection below). The canonical server for clients is
# therefore `https://api.kombify.io/v1/techstack` (NOT the legacy
# `/v1/orchestrator` projection, which double-resolves against /api/v1 paths).
servers:
  - url: https://api.kombify.io/v1/techstack
    description: >-
      Production canonical (via Cloudflare edge gateway, strip-prefix). Clients
      MUST use this projection. The Gateway strips /v1/techstack and re-adds
      /api/v1 at the origin, so it resolves the /api/v1/* paths below cleanly.
  - url: http://localhost:5260
    description: Local development
  - url: https://techstack.kombify.io
    description: Production (direct, no Gateway prefix)
  - url: https://api.kombify.io/v1/orchestrator
    description: >-
      Legacy StackKit-Orchestrator projection of the same origin. RETAINED for
      backward compatibility with existing consumers only. Do NOT use for mobile
      or new clients: combined with the /api/v1/* paths it double-resolves
      (yielding /v1/orchestrator/api/v1/...). Prefer /v1/techstack.

# Gateway route projection contract for the mobile/public surface. Mirrors the
# committed mobile seed (kombify-AI-Mobile shared/contracts/techstack-mobile.v1.yaml).
x-kombify-route-projection:
  gatewayPublicPrefix: /v1/techstack
  gatewayUpstreamPrefix: /api/v1
  gatewayEnvKey: TECHSTACK_ORIGIN
  pathMode: strip-prefix
  canonicalServer: https://api.kombify.io/v1/techstack
  note: >-
    Public/mobile clients call api.kombify.io/v1/techstack/<route>; Cloudflare
    strips /v1/techstack and prepends /api/v1 at TECHSTACK_ORIGIN. The product
    origin is never called directly. /v1/orchestrator is the legacy projection of
    the same origin and MUST NOT be used by mobile.

# Agent-native surface (API-FIRST-STANDARD section 9). The generated artifacts
# api/surface/api-surface.json, api/toolmanifest/tool-manifest.json, the
# Gateway catalog fragment api/surface/mcp-catalog-fragment.json and the public
# reference api/surface/openapi.public.yaml are produced by
# `mise run api:surface`; never edit them by hand.
x-kombify-surface:
  product: techstack
  capability: techstack.inventory.read
  envelope: data
  cli:
    command: techstack
  mcp:
    transport: streamable-http
    endpoint: /api/v1/mcp
    protocolVersion: "2026-07-28"
    # Every published operation without its own x-kombify-mcp decision is a
    # derived tool (API-FIRST-STANDARD section 9.2); explicit objects and
    # reviewed `false` exclusions override it per operation.
    defaults:
      readCapability: techstack.inventory.read
      writeCapability: techstack.inventory.write
      confirmCapability: techstack.inventory.operate
    catalog:
      serverKey: techstack
      connectorFamily: techstack
      upstream: { kind: product-native, ref: techstack }
      portalVisibilityGroup: customer-build-preview
      requiredScopes: ["mcp:connect"]
      featurePrefix: mcp.customer
      quotaPrefix: mcp.usage
      auditPrefix: mcp.customer

tags:
  - name: Health
    description: Health checks and service info (no auth required)
  - name: Instance
    description: Local instance identity and enrollment metadata
  - name: Stacks
    description: Stack lifecycle management (create, provision, deploy, destroy)
  - name: Stacks - Specs
    description: Access persisted specification chain (intent, requirements, unified)
  - name: Stacks - Import/Export
    description: Import and export StackKits stack-spec.yaml configurations
  - name: Stacks - Drift
    description: Infrastructure drift detection and resolution
  - name: Unifier
    description: Spec validation, analysis, unification, and IaC generation pipeline
  - name: StackKits
    description: Infrastructure template catalog
  - name: Add-ons
    description: Add-on detection and registry
  - name: Workers
    description: Worker node registration and management
  - name: Servers
    description: Canonical server lifecycle, connection, and health state
  - name: Inventory
    description: Owner-scoped sanitized server and service read models for UI, API, and MCP clients
  - name: Agents
    description: Connected gRPC agent management and commands
  - name: Jobs
    description: Background job monitoring and SSE streaming
  - name: Discovery
    description: Network device discovery and SSH testing
  - name: Features
    description: Feature flags (read-only; managed centrally via the kombify Admin API)
  - name: Monthly Runtime
    description: Provider-free user API for subscription-backed stack runtime control
  - name: Runtime
    description: Recent runtime/deploy logs (job/deploy progress + container tail)
  - name: Wallet
    description: >-
      Redacted recovery-item wallet with biometric/platform-reauth-gated reveal.
      List responses strip secret/totp; reveal requires a fresh trusted-reauth
      HMAC proof (5-minute window) and is audited server-side.
  - name: Trust
    description: Pairing tokens for worker enrollment
  - name: Client Binding
    description: Short-lived HTTPS pairing for a second client and normal OIDC account handoff
  - name: Tunnel
    description: Cloudflare tunnel management for NAT traversal
  - name: Backups
    description: Database backup management (admin only)
  - name: Auth
    description: Authentication mode and SSO configuration
  - name: Metrics
    description: Prometheus-compatible instance metrics for admin/infra scrapers
  - name: Internal
    description: Internal SaaS-only APIs, including servicecall-protected executor contracts

security:
  - bearerAuth: []

paths:
  # ============================================================
  # HEALTH & INFO
  # ============================================================
  /api/v1/health:
    get:
      operationId: getHealth
      x-kombify-cli: { command: "health status" }
      x-kombify-mcp: false # health/readiness probe, not an agent tool
      tags: [Health]
      summary: Main health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health/live:
    get:
      operationId: getLiveness
      x-kombify-cli: { command: "health live" }
      x-kombify-mcp: false # health/readiness probe, not an agent tool
      tags: [Health]
      summary: Kubernetes liveness probe
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive

  /api/v1/health/ready:
    get:
      operationId: getReadiness
      x-kombify-cli: { command: "health ready" }
      x-kombify-mcp: false # health/readiness probe, not an agent tool
      tags: [Health]
      summary: Kubernetes readiness probe
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready, not_ready]
                  checks:
                    type: object
                    properties:
                      database:
                        type: boolean
                      grpc:
                        type: boolean
        "503":
          description: Service is not ready

  /api/v1/health/startup:
    get:
      operationId: getStartup
      x-kombify-cli: { command: "health startup" }
      x-kombify-mcp: false # health/readiness probe, not an agent tool
      tags: [Health]
      summary: Kubernetes startup probe
      security: []
      responses:
        "200":
          description: Service has started
        "503":
          description: Service still starting

  /api/v1/info:
    get:
      operationId: getInfo
      x-kombify-cli: { command: "system info" }
      x-kombify-mcp: false # static instance/client metadata; agents discover the surface through tools/list
      tags: [Health]
      summary: Service info (version, runtime stats)
      security: []
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      x-kombify-cli: { command: "system capabilities" }
      x-kombify-mcp: false # static instance/client metadata; agents discover the surface through tools/list
      tags: [Health]
      summary: Discover API capabilities for clients
      description: |
        Returns a structured list of all API capabilities for programmatic
        discovery. Native client apps use this endpoint to
        enumerate available actions, required auth, and async behavior.
      security: []
      responses:
        "200":
          description: Capabilities list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /api/v1/client/bootstrap:
    get:
      operationId: getClientBootstrap
      x-kombify-cli: { command: "system client-bootstrap" }
      x-kombify-mcp: false # static instance/client metadata; agents discover the surface through tools/list
      tags: [Health]
      summary: Public runtime config for the static SPA
      description: |
        Returns non-secret, runtime-varying public configuration for the
        embedded static frontend (edition, deployment mode, telemetry
        toggles). Values are empty unless the operator or deployer sets the
        corresponding environment variables, keeping self-hosted and local
        deployments telemetry-free by default.
      security: []
      responses:
        "200":
          description: Client bootstrap config
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      edition:
                        type: string
                      deployment_mode:
                        type: string
                      kombify_edition:
                        type: string
                      version:
                        type: string
                      public_origin:
                        type: string
                      telemetry:
                        type: object
                        properties:
                          sentry:
                            type: object
                            properties:
                              dsn: { type: string }
                              environment: { type: string }
                              release: { type: string }
                          posthog:
                            type: object
                            properties:
                              key: { type: string }
                              host: { type: string }
                              environment: { type: string }

  /api/v1/csrf:
    get:
      operationId: getCSRFToken
      x-kombify-cli: { command: "auth csrf", hidden: true }
      x-kombify-mcp: false # browser CSRF bootstrap
      tags: [Auth]
      summary: Issue a CSRF token for cookie-authenticated browser mutations
      security: []
      responses:
        "200":
          description: CSRF token
          headers:
            X-CSRF-Token:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      x-kombify-cli: { command: "system openapi" }
      x-kombify-mcp: false # the contract document itself, published separately
      tags: [Health]
      summary: Download the OpenAPI contract
      security: []
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
            text/yaml:
              schema:
                type: string

  /api/v1/instance:
    get:
      operationId: getInstanceIdentity
      x-kombify-cli: { command: "instance get" }
      tags: [Instance]
      summary: Get the stable local instance identity
      security: []
      responses:
        "200":
          description: Instance identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: string
                  created_at:
                    type: string
                    format: date-time

  /api/v1/enrollment:
    get:
      operationId: getEnrollmentRecord
      x-kombify-cli: { command: "instance enrollment" }
      tags: [Instance]
      summary: Get the local enrollment record
      security: []
      responses:
        "200":
          description: Enrollment metadata for the current instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id:
                    type: string
                  mode:
                    type: string
                    enum: [standalone, cloud_linked]
                  cloud_linked:
                    type: boolean

  # ============================================================
  # STACKS - LIFECYCLE
  # ============================================================
  /api/v1/stacks:
    get:
      operationId: listKitDeployments
      x-kombify-cli: { command: "stacks list" }
      tags: [Stacks]
      summary: List the owner's StackKit deployments
      description: |
        Returns every StackKit deployment beneath the authenticated owner's
        singleton B2C Homelab. `kit_deployment_id`, `homelab_id`, and
        `stackkit_id` are the product identities; legacy identifiers remain
        compatibility aliases on this route while consumers migrate.
      responses:
        "200":
          description: Owner-scoped StackKit deployment list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StackKitDeploymentSummary"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createStack
      x-kombify-cli: { command: "stacks create" }
      x-kombify-confirmation: "This operation creates the StackKit deployment and starts provisioning, which can order billed servers."
      x-kombify-mcp:
        requiredCapability: techstack.inventory.provision
        costBearing: true
        actionClass: cost_bearing
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: true }
      tags: [Stacks]
      summary: Create a StackKit deployment in the owner's Homelab
      description: |
        Creates an internal StackKit deployment under the authenticated B2C
        owner's singleton Homelab from the canonical StackKits stack-spec
        payload supplied as `stack_spec`. The legacy `/stacks` route and
        `stack_id` response field identify that deployment; they do not create
        or select a second Homelab product. One TechStack instance can serve
        many owners, each with their own Homelab. Legacy
        `user_config`/kombination payloads remain accepted at this compatibility
        boundary. Wizard clients should send a stable `X-Idempotency-Key`;
        retries with the same key and payload return the original deployment,
        planned server, and provisioning job.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          description: Stable wizard-attempt key. Maximum 256 characters.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStackRequest"
      responses:
        "202":
          description: StackKit deployment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: StackKit deployment conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/homelab:
    get:
      operationId: getHomelab
      tags: [Stacks]
      summary: Get the caller's homelab and its StackKit deployments
      description: >-
        Resolves the authenticated owner's canonical Homelab umbrella together
        with its StackKit deployments. `homelab` is null while a backfill has
        deployments but no Homelab row yet; with neither, the route is 404.
      x-kombify-cli: { command: "homelab get" }
      responses:
        "200":
          description: The caller's homelab
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [homelab, kit_deployments]
                    properties:
                      homelab:
                        oneOf:
                          - $ref: "#/components/schemas/Homelab"
                          - type: "null"
                      kit_deployments:
                        type: array
                        items: { type: object }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: renameHomelab
      tags: [Stacks]
      summary: Rename the caller's homelab
      description: >-
        Renames the authenticated owner's homelab. The homelab name is the
        Stack Identity name and syncs to kombify Cloud when connected.
        Reversible; the homelab is resolved from the authenticated owner, never
        from an argument.
      x-kombify-cli: { command: "homelab rename", args: [name] }
      x-kombify-mcp:
        title: Rename homelab
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
      responses:
        "200":
          description: The renamed homelab
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [homelab]
                    properties:
                      homelab: { $ref: "#/components/schemas/Homelab" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stacks/prune-orphans:
    post:
      operationId: reviewOrApplyOrphanProjectionCleanup
      x-kombify-cli: { command: "stacks prune-orphans" }
      x-kombify-confirmation: "This operation deletes the reviewed orphaned control-plane records when mode is apply."
      tags: [Stacks]
      summary: Review or apply owner-scoped test-residue cleanup
      description: |
        Two-phase cleanup for control-plane projections only. A `dry_run`
        returns the exact authenticated-owner E2E/runtime-cloud candidates and
        a stable revision-bound digest. `apply` recomputes the plan and accepts
        only that exact digest. This route never decommissions a lease, calls a
        provider, destroys infrastructure, or enqueues lifecycle work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrphanProjectionCleanupRequest"
      responses:
        "200":
          description: Reviewed plan or applied projection cleanup
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OrphanProjectionCleanupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/owner-spec:
    get:
      operationId: getStackOwnerSpec
      x-kombify-cli: { command: "stacks owner-spec", args: [stack_id] }
      tags: [Stacks]
      summary: Fetch the owner bootstrap spec for a StackKit deployment
      description: |
        StackKit admin-bootstrap endpoint for fetching local owner fields and
        the recovery passphrase hash. This route accepts only the short-lived
        bootstrap bearer token returned by `createStack`; it does not use the
        normal browser/session bearer token.
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Owner and recovery bootstrap spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSpecResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Owner spec material is not available for this StackKit deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/stacks/{id}/provision:
    post:
      operationId: provisionStack
      x-kombify-cli: { command: "stacks provision", args: [stack_id] }
      x-kombify-confirmation: "This operation starts provisioning the StackKit deployment, which can order billed servers."
      x-kombify-mcp:
        requiredCapability: techstack.inventory.provision
        costBearing: true
        actionClass: cost_bearing
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: true }
      tags: [Stacks]
      summary: Start provisioning an existing StackKit deployment
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Stable 8-256 character visible-ASCII retry key. Exact replays
            return the original provision job; reuse for changed intent fails
            with 409. The raw key is never persisted.
          schema:
            type: string
            minLength: 8
            maxLength: 256
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional custom spec overrides
      responses:
        "202":
          description: Provisioning accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key was already bound to different provision intent
        "422":
          description: Idempotency-Key is malformed

  /api/v1/stacks/{id}/deploy:
    post:
      operationId: deployStack
      x-kombify-cli: { command: "stacks deploy", args: [stack_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: true }
      tags: [Stacks]
      summary: Roll out one StackKit deployment (unify + IaC + tofu apply)
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Stable 8-256 character visible-ASCII retry key. Exact replays
            return the original deploy job; conflicting reuse fails with 409.
            The raw key is never persisted.
          schema:
            type: string
            minLength: 8
            maxLength: 256
      responses:
        "202":
          description: Deploy accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key conflicts with an existing deploy receipt
        "422":
          description: Idempotency-Key is malformed

  /api/v1/stacks/{id}/operations:
    get:
      operationId: getStackOperations
      tags: [Stacks, Inventory]
      summary: Get the post-configuration operations read model for one owned StackKit deployment
      description: >-
        Returns the exact owner- and tenant-scoped read model used by the
        TechStack operations dashboard. `approved_servers` records operator
        approval; `connected_servers` is stricter and counts only assigned,
        approved Nodes with freshness-qualified canonical Guard heartbeat,
        connection, and health evidence. The operation is read-only and never
        starts rollout, provisioning, or provider work.
      x-kombify-cli: { command: "stacks operations", args: [stack_id] }
      x-kombify-mcp:
        title: Get stack operations
        toolName: get_stack_operations
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Current StackKit deployment operations and rollout-readiness evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackOperationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/stackkit/operations:
    post:
      operationId: runStackKitLifecycleOperation
      x-kombify-confirmation: "This operation can change the node deployment, replace its services or restore its data; approve the selected operation and exact target before dispatch."
      x-kombify-cli: { command: "stacks stackkit run", args: [stack_id] }
      x-kombify-mcp:
        title: Run an admitted StackKit operation
        toolName: run_stackkit_operation
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: true, openWorldHint: true }
      tags: [Stacks, Jobs]
      summary: Queue an owned node's typed Advanced or backup operation
      description: >-
        Uses the same tenant- and owner-scoped dispatcher as the operator UI.
        The node executes through its authenticated channel, current release
        pin, native Advanced catalog and issued operation capability. Techstack
        never executes Terramate, apply, rollback, backup or restore itself.
        A mutation requires owner_approved; service locks and active server
        maintenance are checked before enqueue. Direct backup_run and
        backup_configure remain Basement-only; managed kits keep their schedule
        and sealed target-renewal authority. backup_configure derives the node's
        target and plan from existing custody and accepts no credential fields.
        advanced_change_set requires candidate_spec; rollback requires an exact
        rollback_target_ref; restore_drill may reuse a snapshot_anchor_id.
        ai_provider lets Private AI offer an external OpenAI-compatible
        provider: the kombify Wallet seals the item wallet_item_id (the
        provider's API key) to the node, which must be listed as a host target
        of that item, the node binds it to ai_provider_base_url, and a drift
        reconcile applies the setting. ai_provider_disable removes it.
        ssh_trust_recipient and ssh_trust_apply let the server trust the
        owner's kombify Wallet SSH CA: ssh_trust_recipient has the node answer
        the owner's recipient_challenge with its owner-signed recipient
        statement and returns it with the host target the owner lists on the
        CA item; the owner then asks the Wallet for the ssh-ca-trust delivery
        and ssh_trust_apply hands its sealed_delivery to the node, which
        installs TrustedUserCAKeys and the principals of each local user.
        Restore activation requires exactly one Idempotency-Key header, while
        other operations have no replay guarantee. Acceptance is not execution
        success; read the returned job and its scoped result to observe effects.
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: Required for backup_restore_activate; derived identity binds durable replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StackKitLifecycleRequest"
      responses:
        "202":
          description: Typed lifecycle job accepted; execution and evidence remain pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/StackKitLifecycleAccepted" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/managed-runtimes/authority:
    get:
      operationId: preflightManagedRuntimeAuthority
      x-kombify-cli: { command: "managed-runtimes authority" }
      tags: [Stacks, Jobs]
      summary: Verify request-bound managed-runtime authority without creating a resource
      description: |
        Read-only preflight for the Gateway-to-native-admission authority chain.
        Hosted requests must carry the Gateway's v2-signed managed-runtime,
        Cloud Kit, provider entitlement, and `cloud.runtime.credits`
        `managed_servers` decision bound to this exact request. A successful
        response never reserves capacity or creates a StackKit deployment, queue
