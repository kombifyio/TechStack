  /api/v1/auth/stack-identity/sync:
    post:
      operationId: syncStackIdentity
      x-kombify-cli: { command: "stack-identity sync" }
      x-kombify-mcp:
        title: Sync stack identity with Cloud
        toolName: sync_stack_identity
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Auth]
      summary: Apply one kombify Cloud sync step to the local stack identity
      description: >-
        Takes the kombify Cloud stack identity record (read by the caller through the Gateway with the user's
        own token; `null` when Cloud has none) and applies the sync rules to the local copy: adopt the Cloud
        record, confirm an identical one, or answer the body to push to Cloud with the `If-Match` revision.
        The call itself never writes to Cloud. When no local stack identity exists yet it only reports
        `homelab_missing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cloud]
              properties:
                cloud:
                  description: The Cloud record, or null when Cloud has no stack identity.
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [revision, name, updated_at]
                      properties:
                        revision: { type: integer, minimum: 1 }
                        name: { type: string, minLength: 1, maxLength: 30 }
                        character_id: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
                        animation_style: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
                        animation_enabled: { type: [boolean, "null"] }
                        icon_style: { type: string, enum: ["", filled, glass, gradient, outlined] }
                        glow_color_override: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$" }
                        updated_at: { type: string, format: date-time }
      responses:
        "200":
          description: The sync decision and the resulting local stack identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [action, reason]
                    properties:
                      action: { type: string, enum: [none, in_sync, adopt_cloud, push_local] }
                      reason: { type: string }
                      push:
                        type: object
                        description: Present for `push_local`; the body to send to Cloud with `If-Match`.
                        properties:
                          if_match: { type: integer }
                          body: { type: object }
                      stack_identity: { type: object }
                      editable: { type: boolean }
                      sync:
                        type: object
                        properties:
                          cloud_revision: { type: integer }
                          pending: { type: boolean }
                      local_revision: { type: integer, format: int64 }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "412":
          description: The local stack identity changed while syncing (`stack_identity_revision_conflict`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/home-assistant/instances/{binding}/backup:
    post:
      operationId: backupHomeAssistantInstance
      x-kombify-cli: { command: "home-assistant instances backup", args: [binding_ref] }
      x-kombify-mcp:
        title: Back up Home Assistant
        toolName: backup_home_assistant
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Services]
      summary: Create an encrypted off-instance backup of an owned Home Assistant instance
      description: >-
        Runs a native full backup through the instance binding, stores it encrypted off the instance and
        retains the recovery key in custody. Requires an owned instance binding with the backup grant.
        `operation_id` is a stable identity: repeating it returns the retained result instead of a second
        backup. A pending operation answers 202.
      parameters:
        - name: binding
          in: path
          required: true
          x-kombify-name: binding_ref
          description: Instance binding reference
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, minLength: 1, maxLength: 128, description: Stable operation identity. }
      responses:
        "200":
          description: Backup result with its retained evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "202":
          description: The native operation is still pending; repeat the call with the same operation_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

