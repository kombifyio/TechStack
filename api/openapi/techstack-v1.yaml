  /api/v1/registry/services:
    get:
      operationId: listRegistryServices
      x-kombify-cli: { command: "registry services list" }
      tags: [Services]
      summary: List owned services with their catalog and canonical placement
      description: >-
        Runtime records use the same state, capabilities, version and owner
        lock projection as service detail. Historical records remain readable
        with unknown observed state and no unmeasured action capabilities.
      responses:
        "200":
          description: Owned catalog, deployments, servers and services
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RegistryServices"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registry/services/{serviceId}/actions:
    post:
      operationId: runManagedServiceAction
      x-kombify-cli: { command: "services run-action", args: [service_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Services, Jobs]
      summary: Queue an owner-authorized StackKits service action
      description: >-
        Derives stack, server, agent, kit and service authority from fresh
        canonical inventory. Exact replays converge through a durable job
        receipt; the raw Idempotency-Key is never persisted. Mutations are
        followed by StackKits verify before measured state changes.
        Agent-executed actions refuse with 409 `maintenance_active` while the
        server is being rebooted or updated.
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceActionRequest"
      responses:
        "202":
          description: Action queued or exact durable replay returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServiceActionResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/registry/services/{serviceId}/logs:
    get:
      operationId: getManagedServiceLogs
      x-kombify-cli: { command: "services logs", args: [service_id] }
      tags: [Services, Jobs]
      summary: Read the latest bounded, redacted StackKits service log page
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Completed or empty service log page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServiceLogsResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "202":
          description: The requested log page is still being collected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServiceLogsResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ============================================================
  # WORKERS
  # ============================================================
  /api/v1/workers:
    get:
      operationId: listWorkers
      x-kombify-cli: { command: "workers list" }
      tags: [Workers]
      summary: List registered workers (filtered by owner)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Worker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/workers/register:
    post:
      operationId: registerWorker
      x-kombify-cli: { command: "workers register", hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Register worker via pairing token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Pairing token
                hostname:
                  type: string
                ip:
                  type: string
                guard_public_key:
                  type: object
                  description: >-
                    Public half of the kombify Guard host key (OKP/Ed25519 JWK with only kty, crv and x).
                    The control plane binds its RFC 7638 thumbprint to the worker. Send together with attempt_id.
                  additionalProperties: false
                  required: [kty, crv, x]
                  properties:
                    kty: { type: string, enum: [OKP] }
                    crv: { type: string, enum: [Ed25519] }
                    x: { type: string }
                attempt_id:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{16,64}$"
                  description: >-
                    Non-secret redemption attempt id persisted by the Guard before redemption. Repeating the same
                    pairing token, attempt and key within the bootstrap window atomically replaces the still
                    unconfirmed credential.
      responses:
        "200":
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Invalid pairing token

  /api/v1/workers/{id}/identity/token:
    post:
      operationId: exchangeWorkerIdentityToken
      x-kombify-cli: { command: "workers identity token", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Exchange the worker credential and a key proof for an access token
      description: >-
        kombify Guard host identity. The worker credential (Authorization Bearer) plus a DPoP-shaped proof
        (RFC 9449: JWS typ dpop+jwt, alg EdDSA, public jwk in the header; claims htm, htu, iat, jti) signed with
        the Guard host key yield a short-lived access token bound to the key thumbprint (cnf.jkt). The first
        successful exchange confirms an unconfirmed enrollment. Denials use the codes guard_proof_invalid,
        guard_proof_replayed, guard_identity_revoked and guard_token_expired.
      security:
        - runtimeAgentAuth: []
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: DPoP
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Credential or proof not accepted (guard_proof_invalid, guard_proof_replayed)
        "403":
          description: Identity revoked (guard_identity_revoked)

  /api/v1/workers/{id}/identity/bind:
    post:
      operationId: bindWorkerIdentityKey
      x-kombify-cli: { command: "workers identity bind", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Propose a host key for a legacy bearer worker
      description: >-
        Key bind request of an upgraded kombify Guard that still authenticates with the bearer credential alone
        (identity_binding=legacy_bearer). The bearer credential authenticates the worker and a proof signed by
        the new key proves possession, which only shows that the caller holds the bearer, which may be a copy:
        the key is held as `upgrade_pending` (202) and binds the server only once the owner approves that exact
        key (`approveWorkerIdentityUpgrade`). Until then the worker stays observe-only on its bearer credential:
        it may heartbeat, report inventory and posture and update itself, but receives no mutating command, no
        provider control and no managed operation (`guard_identity_upgrade_required`). Another key while one is
        pending is refused (409 `guard_identity_upgrade_pending`, reason `other_key_pending`). A proposal not
        approved within 24 hours expires.
      security:
        - runtimeAgentAuth: []
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: DPoP
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, attempt_id]
              properties:
                public_key:
                  type: object
                  additionalProperties: false
                  required: [kty, crv, x]
                  properties:
                    kty: { type: string, enum: [OKP] }
                    crv: { type: string, enum: [Ed25519] }
                    x: { type: string }
                attempt_id:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{16,64}$"
      responses:
        "200":
          description: The same key is already bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "202":
          description: Key held pending owner approval (identity_state=upgrade_pending, approval_required=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Credential or proof not accepted
        "409":
          description: A different key is already bound (guard_identity_already_bound) or another key awaits approval (guard_identity_upgrade_pending)
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /api/v1/workers/identity-upgrades:
    get:
      operationId: listWorkerIdentityUpgrades
      x-kombify-cli: { command: "workers identity upgrades" }
      x-kombify-mcp:
        title: List server key approvals waiting for the owner
        toolName: list_worker_identity_upgrades
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Workers]
      summary: List the owner's servers that wait for an identity key approval
      description: >-
        For the owner. Each entry is a server of theirs that proposed a key and is observe-only until that exact key
        is approved with `approveWorkerIdentityUpgrade` (fresh multi-factor sign-in required). Entries carry the hostname
        and the key fingerprint to compare with the one the Guard logs on the server. Listing grants nothing.
      responses:
        "200":
          description: Pending identity upgrades of the owner's servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [upgrades]
                    properties:
                      upgrades:
                        type: array
                        items: { $ref: "#/components/schemas/GuardIdentityUpgrade" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/{id}/identity/upgrade:
    get:
      operationId: getWorkerIdentityUpgrade
      x-kombify-cli: { command: "workers identity upgrade-status", args: [id] }
      tags: [Workers]
      summary: Show whether a server still needs its identity key approved
      description: >-
        For the owner of the worker. `identity_binding=legacy_bearer` with
        `code=guard_identity_upgrade_required` means the server authenticates with its bearer credential
        alone and is observe-only; `pending` carries the fingerprint of the key the server proposed, which the
        owner compares with the fingerprint the Guard logs on the server. A worker of another tenant or owner is 404.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: The identity upgrade state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GuardIdentityUpgrade" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/{id}/identity/upgrade/approve:
    post:
      operationId: approveWorkerIdentityUpgrade
      x-kombify-cli: { command: "workers identity upgrade approve", args: [id] }
      x-kombify-confirmation: "This operation decides which key may command the server; approve only a key whose fingerprint the Guard logs on the server."
      x-kombify-mcp:
        title: Approve the key a legacy server proposed
        toolName: approve_worker_identity_upgrade
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: true, openWorldHint: false }
      tags: [Workers]
      summary: Approve the key a legacy server proposed
      description: >-
        Binds the pending key named by `key_thumbprint`, which makes the worker key-bound (bearer-only requests
        are denied afterwards). Requires the owner and a fresh multi-factor sign-in (at most 300 seconds old). The
        approving subject and time are recorded with the identity and logged. 409 `identity_upgrade_not_pending`
        when no unexpired pending key has that fingerprint.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key_thumbprint]
              properties:
                key_thumbprint: { type: string }
      responses:
