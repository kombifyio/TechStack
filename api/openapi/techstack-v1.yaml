        - $ref: "#/components/parameters/adoptionPlanId"
      responses:
        "200":
          description: Retained plan for this exact service and Owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ApplicationAdoptionPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/services/{serviceId}/adoption-plans/{planId}/execute:
    post:
      operationId: executeApplicationAdoption
      tags: [Services, Jobs]
      summary: Execute the exact reviewed source plan with explicit Owner approval
      description: >-
        Revalidates the retained digest, source identity, revision and release.
        Only an authenticated pinned-CLI custody receipt establishes membership.
        Accounts, configuration and persistent data are preserved; no new runtime
        is created. Moving to another Node and generic adoption are not supported.
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - $ref: "#/components/parameters/adoptionPlanId"
        - $ref: "#/components/parameters/applicationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationAdoptionRequest" }
      responses:
        "202": { $ref: "#/components/responses/ApplicationLifecycleQueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/services/{serviceId}/release:
    post:
      operationId: releaseApplicationLifecycle
      tags: [Services, Jobs]
      summary: Release an adopted lifecycle binding without deleting or stopping its runtime
      parameters:
