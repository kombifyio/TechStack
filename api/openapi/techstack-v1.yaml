                  filename:
                    type: string
                    example: kombination.yaml
                  encoding:
                    type: string
                    example: base64
                  sha256:
                    type: string
                  byteLength:
                    type: integer
                  content:
                    type: string
                    description: Base64-encoded YAML content
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stacks/{id}/requirements:
    get:
      operationId: getStackRequirements
