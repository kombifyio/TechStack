                type: object
                properties:
                  data:
                    type: object
                    required: [job_id, state, resolved, source_retained]
                    properties:
                      job_id: { type: string }
                      state: { type: string, description: Job state after the settlement. }
                      node_verification: { type: object, additionalProperties: true, description: Proof read back from the source and destination nodes. }
                      source_retained: { type: boolean }
                      resolved: { type: boolean }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

