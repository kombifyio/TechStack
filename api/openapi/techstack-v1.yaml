openapi: 3.1.0
info:
  title: kombify-TechStack API
  description: |
    REST API for kombify-TechStack -- the hybrid cloud control plane for homelabs.

    kombify-TechStack manages infrastructure through a spec-driven architecture:
    validate YAML specs via CUE, generate OpenTofu configurations, and manage
    nodes through a gRPC agent protocol.

    ## Authentication

    Authenticated endpoints accept an OIDC/JWKS bearer token or an API key
    where documented. Self-hosted TechStack defaults to Pocket ID as identity
    provider. SaaS routes enter through the edge with Auth0 as the platform
    identity provider. PocketBase session exchange remains legacy migration
    compatibility only.

    ## Response Format

    **Success:** `{ "data": <object>, "meta": { "total": int, "page": int, "per_page": int } }`

    **Error:** `{ "error": { "code": "<ERROR_CODE>", "message": "...", "details": <any> } }`

    ## Pagination

    List endpoints accept `page` (default: 1) and `per_page` (default: 20, max: 100) query parameters.
  version: 1.0.0
  contact:
    name: kombify
    url: https://kombify.io
  license:
    name: Apache-2.0 AND GPL-3.0
    url: https://github.com/kombifyio/TechStack/blob/main/LICENSE

# ============================================================
# SERVERS
# ============================================================
# All paths in this document are authored as /api/v1/*. The Gateway projects
# the mobile/public surface as `https://api.kombify.io/v1/techstack/<route>`
# and strip-prefixes `/v1/techstack`, re-adding `/api/v1` at TECHSTACK_ORIGIN
# (see x-kombify-route-projection below). The canonical server for clients is
# therefore `https://api.kombify.io/v1/techstack` (NOT the legacy
# `/v1/orchestrator` projection, which double-resolves against /api/v1 paths).
servers:
  - url: https://api.kombify.io/v1/techstack
    description: >-
      Production canonical (via Cloudflare edge gateway, strip-prefix). Clients
      MUST use this projection. The Gateway strips /v1/techstack and re-adds
      /api/v1 at the origin, so it resolves the /api/v1/* paths below cleanly.
  - url: http://localhost:5260
    description: Local development
  - url: https://techstack.kombify.io
    description: Production (direct, no Gateway prefix)
  - url: https://api.kombify.io/v1/orchestrator
    description: >-
      Legacy StackKit-Orchestrator projection of the same origin. RETAINED for
      backward compatibility with existing consumers only. Do NOT use for mobile
      or new clients: combined with the /api/v1/* paths it double-resolves
      (yielding /v1/orchestrator/api/v1/...). Prefer /v1/techstack.

# Gateway route projection contract for the mobile/public surface. Mirrors the
# committed mobile seed (kombify-AI-Mobile shared/contracts/techstack-mobile.v1.yaml).
x-kombify-route-projection:
  gatewayPublicPrefix: /v1/techstack
  gatewayUpstreamPrefix: /api/v1
  gatewayEnvKey: TECHSTACK_ORIGIN
  pathMode: strip-prefix
  canonicalServer: https://api.kombify.io/v1/techstack
  note: >-
    Public/mobile clients call api.kombify.io/v1/techstack/<route>; Cloudflare
    strips /v1/techstack and prepends /api/v1 at TECHSTACK_ORIGIN. The product
    origin is never called directly. /v1/orchestrator is the legacy projection of
    the same origin and MUST NOT be used by mobile.

tags:
  - name: Health
    description: Health checks and service info (no auth required)
  - name: Instance
    description: Local instance identity and enrollment metadata
  - name: Stacks
    description: Stack lifecycle management (create, provision, deploy, destroy)
  - name: Stacks - Specs
    description: Access persisted specification chain (intent, requirements, unified)
  - name: Stacks - Import/Export
    description: Import and export StackKits stack-spec.yaml configurations
  - name: Stacks - Drift
    description: Infrastructure drift detection and resolution
  - name: Unifier
    description: Spec validation, analysis, unification, and IaC generation pipeline
  - name: StackKits
    description: Infrastructure template catalog
  - name: Add-ons
    description: Add-on detection and registry
  - name: Workers
    description: Worker node registration and management
  - name: Servers
    description: Canonical server lifecycle, connection, and health state
  - name: Inventory
    description: Owner-scoped sanitized server and service read models for UI, API, and MCP clients
  - name: Pre-Checks
    description: Pre-deployment hardware and software validation
  - name: Agents
    description: Connected gRPC agent management and commands
  - name: Jobs
    description: Background job monitoring and SSE streaming
  - name: Discovery
    description: Network device discovery and SSH testing
  - name: Features
    description: Feature flags (read-only; managed centrally via the kombify Admin API)
  - name: Monthly Runtime
    description: Provider-free user API for subscription-backed stack runtime control
  - name: Runtime
    description: Recent runtime/deploy logs (job/deploy progress + container tail)
  - name: Wallet
    description: >-
      Redacted recovery-item wallet with biometric/platform-reauth-gated reveal.
      List responses strip secret/totp; reveal requires a fresh trusted-reauth
      HMAC proof (5-minute window) and is audited server-side.
  - name: Trust
    description: Pairing tokens for worker enrollment
  - name: Client Binding
    description: Short-lived HTTPS pairing for a second client and normal OIDC account handoff
  - name: Tunnel
    description: Cloudflare tunnel management for NAT traversal
  - name: Backups
    description: Database backup management (admin only)
  - name: Auth
    description: Authentication mode and SSO configuration
  - name: Metrics
    description: Prometheus-compatible instance metrics for admin/infra scrapers
  - name: Internal
    description: Internal SaaS-only APIs, including servicecall-protected executor contracts

security:
  - bearerAuth: []

paths:
  # ============================================================
  # HEALTH & INFO
  # ============================================================
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Main health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Kubernetes liveness probe
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive

  /api/v1/health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Kubernetes readiness probe
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready, not_ready]
                  checks:
                    type: object
                    properties:
                      database:
                        type: boolean
                      grpc:
                        type: boolean
        "503":
          description: Service is not ready

  /api/v1/health/startup:
    get:
      operationId: getStartup
      tags: [Health]
      summary: Kubernetes startup probe
      security: []
      responses:
        "200":
          description: Service has started
        "503":
          description: Service still starting

  /api/v1/info:
    get:
      operationId: getInfo
      tags: [Health]
      summary: Service info (version, runtime stats)
      security: []
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Health]
      summary: Discover API capabilities for clients
      description: |
        Returns a structured list of all API capabilities for programmatic
        discovery. Native client apps use this endpoint to
        enumerate available actions, required auth, and async behavior.
      security: []
      responses:
        "200":
          description: Capabilities list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /api/v1/client/bootstrap:
    get:
      operationId: getClientBootstrap
      tags: [Health]
      summary: Public runtime config for the static SPA
      description: |
        Returns non-secret, runtime-varying public configuration for the
        embedded static frontend (edition, deployment mode, telemetry
        toggles). Values are empty unless the operator or deployer sets the
        corresponding environment variables, keeping self-hosted and local
        deployments telemetry-free by default.
      security: []
      responses:
        "200":
          description: Client bootstrap config
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      edition:
                        type: string
                      deployment_mode:
                        type: string
                      kombify_edition:
                        type: string
                      version:
                        type: string
                      public_origin:
                        type: string
                      telemetry:
                        type: object
                        properties:
                          sentry:
                            type: object
                            properties:
                              dsn: { type: string }
                              environment: { type: string }
                              release: { type: string }
                          posthog:
                            type: object
                            properties:
                              key: { type: string }
                              host: { type: string }
                              environment: { type: string }

  /api/v1/csrf:
    get:
      operationId: getCSRFToken
      tags: [Auth]
      summary: Issue a CSRF token for cookie-authenticated browser mutations
      security: []
      responses:
        "200":
          description: CSRF token
          headers:
            X-CSRF-Token:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags: [Health]
      summary: Download the OpenAPI contract
      security: []
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
            text/yaml:
              schema:
                type: string

  /api/v1/instance:
    get:
      operationId: getInstanceIdentity
      tags: [Instance]
      summary: Get the stable local instance identity
      security: []
      responses:
        "200":
          description: Instance identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: string
                  created_at:
                    type: string
                    format: date-time

  /api/v1/enrollment:
    get:
      operationId: getEnrollmentRecord
      tags: [Instance]
      summary: Get the local enrollment record
      security: []
      responses:
        "200":
          description: Enrollment metadata for the current instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id:
                    type: string
                  mode:
                    type: string
                    enum: [standalone, cloud_linked]
                  cloud_linked:
                    type: boolean

  # ============================================================
  # STACKS - LIFECYCLE
  # ============================================================
  /api/v1/stacks:
    post:
      operationId: createStack
      tags: [Stacks]
      summary: Create stack and start provisioning
      description: |
        Creates a new stack from the canonical StackKits stack-spec payload
        supplied as `stack_spec`. Multiple stacks and homelabs can belong to
        one TechStack instance; clients must not assume the former
        single-homelab framing. Legacy `user_config`/kombination payloads are
        still accepted for compatibility. Wizard clients should send a stable
        `X-Idempotency-Key`; retries with the same key and payload return the
        original stack, planned server, and provisioning job.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          description: Stable wizard-attempt key. Maximum 256 characters.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStackRequest"
      responses:
        "202":
          description: Stack creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Stack conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/stacks/{id}/owner-spec:
    get:
      operationId: getStackOwnerSpec
      tags: [Stacks]
      summary: Fetch StackKit owner bootstrap spec
      description: |
        StackKit admin-bootstrap endpoint for fetching local owner fields and
        the recovery passphrase hash. This route accepts only the short-lived
        bootstrap bearer token returned by `createStack`; it does not use the
        normal browser/session bearer token.
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Owner and recovery bootstrap spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSpecResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Owner spec material is not available for this stack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/stacks/{id}/provision:
    post:
      operationId: provisionStack
      tags: [Stacks]
      summary: Start provisioning existing stack
      parameters:
        - $ref: "#/components/parameters/stackId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional custom spec overrides
      responses:
        "202":
          description: Provisioning accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stacks/{id}/deploy:
    post:
      operationId: deployStack
      tags: [Stacks]
      summary: Full rollout (unify + IaC + tofu apply)
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "202":
          description: Deploy accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stacks/{id}/operations:
    get:
      operationId: getStackOperations
      tags: [Stacks, Inventory]
      summary: Get the post-configuration operations read model for one owned stack
      description: >-
        Returns the exact owner- and tenant-scoped read model used by the
        TechStack operations dashboard. approved_servers records operator
        approval; connected_servers is stricter and counts only assigned,
        approved servers with freshness-qualified canonical Guard heartbeat,
        connection, and health evidence. The operation is read-only and never
        starts rollout, provisioning, or provider work.
      x-kombify-mcp:
        toolName: get_stack_operations
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Current stack operations and rollout-readiness evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackOperationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/managed-runtimes/authority:
    get:
      operationId: preflightManagedRuntimeAuthority
      tags: [Stacks, Jobs]
      summary: Verify request-bound managed-runtime authority without creating a resource
      description: |
        Read-only preflight for the Gateway-to-native-admission authority chain.
        Hosted requests must carry the Gateway's v2-signed managed-runtime,
        Cloud Kit, provider entitlement, and `cloud.runtime.credits`
        `managed_servers` decision bound to this exact request. A successful
        response never reserves capacity, creates a stack, queue job, lease,
        runtime server, or provider operation; the real Add-Server request
        repeats every mutable admission check atomically.
      parameters:
        - name: provider_id
          in: query
          required: true
          description: Exact canonical provider whose managed-runtime authority is being checked.
          schema:
            type: string
            enum: [centron, ionos]
      responses:
        "200":
          description: Gateway-signed budget and native read-only admission preflight verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedRuntimeAuthorityPreflightEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/managed-runtimes:
    post:
      operationId: addManagedRuntimeServer
      tags: [Stacks, Jobs]
      summary: Add one managed runtime server through native provider control
      description: |
        Creates or resumes one deterministic Add-Server job for the exact
        owned stack. The standard `Idempotency-Key` is mandatory. Replaying
        the same key with the same canonical request returns the original
        job, lease, runtime-server, resource-generation, and provider-operation
        correlations; reusing it with different intent fails with 409.

        The raw key is never persisted or returned. A lost response or an
        uncertain native-admission outcome remains resumable only with the
        same key. HTTP acceptance means native admission is durable and
        provider reconciliation is pending; it never claims that the VM is
        already provisioned or healthy. Fresh admission atomically reserves
        the authenticated tenant/owner capacity slot with the lease generation
        and provider operation. When authoritative native admission finds that
        bounded capacity full, it persists a non-retryable 403 outcome and
        replaying that denied job returns the same outcome. Exact replays of an
        already committed admission reuse its existing reservation. This version
        has no automatic reservation release: terminal or local decommission
        state alone does not free a slot. Lease inventory and feature-delivery
        flags never authorize or deny capacity.
        Hosted fresh admission also requires the v2-signed commercial runtime
        and provider entitlements plus the signed `cloud.runtime.credits`
        `managed_servers` mode/limit decision; feature flags alone never grant
        provider capacity. Self-host OSS uses its construction-fixed static
        release-manifest policy instead of a SaaS entitlement dependency.
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            One opaque, case-sensitive Add-Server attempt key. Supply exactly
            one value without leading/trailing whitespace, comma separators,
            or control characters. Maximum 256 UTF-8 bytes.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddManagedRuntimeServerRequest"
      responses:
        "202":
          description: Native managed-runtime admission accepted or safely replayed; provisioning remains pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddManagedRuntimeServerEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/resume-enrollment:
    post:
      operationId: resumeStackEnrollment
      tags: [Stacks, Jobs]
      summary: Resume one overdue enrollment wait on its exact existing VM
      description: |
        Authenticated, idempotent recovery for a persisted `waiting_enrollment`
        job whose `next_resume_at` has been overdue beyond the bounded grace
        period. The server validates the owned stack, source job, wait reason,
        exact lease, active foundation role, and canonical server as one
        operation. It atomically retires the exact source wait, creates or
        rehydrates one deterministic replacement deploy bound to the same lease
        and server, and replays that job on later calls. Before handler entry,
        queue workers atomically acquire a durable tenant/stack execution claim;
        this serializes different jobs for the same stack across Techstack
        replicas. The claim remains durable `running` until the handler exits,
        including during cancellation. This endpoint never invokes provider VM
        creation or selects a newer VM. A replacement found durable `running`
        after a crash remains fail-closed, is reported as the same job, and is
        never duplicated automatically; runtime-action reconciliation remains a
        separate operator concern.
      parameters:
        - $ref: "#/components/parameters/stackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentResumeRequest"
      responses:
        "202":
          description: Deterministic exact-target replacement accepted or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResumeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/stacks/{id}/retry-rollout:
    post:
      operationId: retryStackRollout
      tags: [Stacks, Jobs]
      summary: Retry one failed rollout on its exact existing managed VM
      description: |
        Validates the owned failed deploy, its exact active foundation lease,
        and canonical server in one server-side operation. The deterministic
        durable replacement bypasses provider VM creation, wins a durable
        tenant/stack execution claim before handler entry, and is replayed on
        repeated calls to this operation. The claim serializes different jobs
        for the same stack across replicas and remains fail-closed as `running`
        after a process crash until operator reconciliation.
      parameters:
        - $ref: "#/components/parameters/stackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExactRolloutRetryRequest"
      responses:
        "202":
          description: Exact-target rollout retry accepted or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExactRolloutRetryEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/routing:
    get:
      operationId: getStackRouting
      tags: [Stacks]
      summary: Read the desired and observed routing state for one stack
      description: >-
        Returns the tenant- and owner-bound routing overlay for the exact stack.
        Desired state and observed/applied state are reported separately so clients
        never infer a successful DNS, TLS, or StackKit rollout from persistence alone.
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Current routing desired state, observation, and rollout truth
          headers:
            ETag:
              description: Current routing revision, suitable for a later If-Match header.
              schema: { type: string, example: '"3"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackRoutingViewEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: ensureStackRouting
      tags: [Stacks]
      summary: Ensure the desired routing overlay for one exact stack and server
      description: >-
        Atomically persists an idempotent, revisioned routing overlay without
        mutating the user's immutable intent. server_id is always exact and
        mandatory. lease_id is mandatory for managed runtimes and omitted for a
        local/Basement runtime which has no lease. For a managed target, a true
        ensure_rollout request dispatches the existing deploy pipeline only after
        proving that its selected active foundation lease and canonical server equal
        this exact target. The API never reports the resulting job as already applied.
        The overlay is consumed only while deriving StackKits artifacts and this path
        never creates or selects a replacement VM.
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key for safely replaying this exact routing mutation.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: If-Match
          in: header
          required: false
          description: Optional optimistic-concurrency routing revision, for example `"3"`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StackRoutingPutRequest"
      responses:
        "200":
          description: Desired routing state persisted; no rollout was requested.
          headers:
            ETag:
              description: Persisted routing revision.
              schema: { type: string, example: '"3"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackRoutingViewEnvelope"
        "202":
          description: Desired routing state persisted and an exact-target rollout job was enqueued; application remains pending.
          headers:
            ETag:
              description: Persisted routing revision.
              schema: { type: string, example: '"3"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackRoutingViewEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          description: If-Match does not equal the current routing revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/routing/targets:
    get:
      operationId: listStackRoutingTargets
      tags: [Stacks]
      summary: List explicit primary routing targets for one stack
      description: >-
        Read-only discovery backed by active RuntimeLease authority. Returns every
        owner-visible foundation/control-plane target and never selects one, creates
        a ServerRuntime projection, or mutates the stack. Callers must send the
        complete server_id and lease_id tuple to a routing mutation.
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Owner-visible primary routing targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackRoutingTargetsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/stacks/{id}/destroy:
    post:
      operationId: destroyStack
      tags: [Stacks]
      summary: Destroy infrastructure
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "202":
          description: Destroy accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================
