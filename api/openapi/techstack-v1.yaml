        - $ref: "#/components/parameters/applicationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationAdoptionRequest" }
      responses:
        "202": { $ref: "#/components/responses/ApplicationLifecycleQueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/services/{serviceId}/metrics:
    get:
      operationId: getServiceMetrics
      x-kombify-cli: { command: "services metrics" }
