      x-kombify-confirmation: "This operation publishes a service of the server at a public kombify.me address that anyone on the internet can open."
      x-kombify-mcp: false # publishes a service to the internet behind a step-up, not an agent tool
      tags: [Servers]
      summary: Publish the server at a kombify.me address, or stop publishing it
      description: >-
