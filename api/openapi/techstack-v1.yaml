  # ============================================================
  # RUNTIME LOGS
  # ============================================================
  /api/v1/runtime/logs:
    get:
      operationId: getRuntimeLogs
      tags: [Runtime]
      summary: Get recent runtime/deploy logs
      description: |
        Returns recent runtime/deploy log entries (job/deploy progress plus
        container tail) from the gRPC server's runtime log buffer, filtered by
        the supplied query parameters. Requires authentication and an available
        gRPC server.
      parameters:
        - name: stack_id
          in: query
          schema:
            type: string
        - name: job_id
          in: query
          schema:
            type: string
        - name: lease_id
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: service_name
          in: query
          description: Service name (alias `service` also accepted).
          schema:
            type: string
        - name: min_level
          in: query
          description: Minimum log level (alias `level` also accepted).
          schema:
            type: string
            enum: [debug, info, warn, error]
        - name: since
          in: query
          description: RFC3339 lower bound for log timestamps.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: Runtime log entries (newest-first buffer slice).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeLogsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: gRPC server not available

  # ============================================================
  # WALLET (recovery items; redacted list + reauth-gated reveal)
  # ============================================================
  /api/v1/wallet:
    get:
      operationId: listWalletItems
      tags: [Wallet]
      summary: List redacted wallet recovery items
      description: |
        Lists the caller's wallet recovery items for the resolved tenant. The
        `secret` and `totp` values are always stripped from this response; only
        presence flags (`has_secret`, `has_totp`) are exposed.
      parameters:
        - name: stack_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Redacted wallet item list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletItemsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Wallet store is not configured

  /api/v1/wallet/{id}/reauth-proof:
    post:
      operationId: createWalletReauthProof
      tags: [Wallet]
      summary: Mint a short-lived reauth proof after a fresh platform re-auth
      description: |
        After a fresh biometric/platform re-authentication, mints a short-lived
        trusted-reauth HMAC proof (timestamp + signature) usable to authorize a
        subsequent reveal within the 5-minute window. Requires a valid fresh
        platform reauth assertion on the request.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletReauthRequest"
      responses:
        "200":
          description: Reauth proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletReauthProofEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Fresh platform re-authentication required
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/wallet/{id}/reveal:
    post:
      operationId: revealWalletItem
      tags: [Wallet]
      summary: Reveal a wallet recovery secret/TOTP, gated by a fresh reauth proof
      description: |
        Biometric-gated. Requires a fresh trusted-reauth HMAC proof (timestamp +
        signature, 5-minute window) supplied in the body or the
        `X-Kombify-Reauth-*` / `X-TechStack-Reauth-*` headers. Returns the
        plaintext recovery values once; the reveal is audited server-side.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRevealRequest"
      responses:
        "200":
          description: Revealed recovery values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletRevealEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Fresh re-authentication required, or item not revealable
        "404":
          $ref: "#/components/responses/NotFound"

