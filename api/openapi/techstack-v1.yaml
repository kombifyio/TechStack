# ============================================================
# COMPONENTS
# ============================================================

  /api/v1/onboarding/{journeyId}:
    put:
      operationId: applyOnboardingAction
      tags: [Stacks]
      summary: Apply one action to the caller's onboarding journey
      description: >-
        Applies one closed action (complete, skip, dismiss, resume or coach_seen)
        to the authenticated owner's progress in a journey and answers the resolved
        journey, state, step availability and revision. Steps that spend money
        complete only from server facts: a reported completion of such a step is
        refused with 403 `onboarding_derived_only`. A repeated action is a no-op,
        and a stale `If-Match` revision answers 412.
      x-kombify-cli: { command: "onboarding apply", args: [journey_id] }
      x-kombify-mcp:
        title: Apply onboarding action
        toolName: apply_onboarding_action
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - name: journeyId
          in: path
          required: true
          description: Journey id, for example `techstack.platform`.
          schema: { type: string, minLength: 1 }
        - name: If-Match
          in: header
          required: false
          description: Optional compare-and-swap revision read from the journey state, for example `"3"`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [complete, skip, dismiss, resume, coach_seen] }
                step_id: { type: string, description: "Required for complete, skip and coach_seen, for example `techstack.add_server`." }
                source: { type: string, enum: [reported, manual], description: "Who asserts the completion; empty means reported for complete and manual for skip." }
      responses:
        "200":
          description: The resolved journey after the action
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [journey, state, availability, revision]
                    properties:
                      journey: { type: object, description: The journey descriptor with its steps. }
                      state:
                        type: object
                        properties:
                          journey_id: { type: string }
                          journey_version: { type: integer }
                          completed:
                            type: array
                            items:
                              type: object
                              properties:
                                step_id: { type: string }
                                at: { type: string, format: date-time }
                                source: { type: string }
                          seen_steps: { type: array, items: { type: string } }
                          status: { type: string, enum: [active, completed, dismissed] }
                          dismissed_at: { type: [string, "null"], format: date-time }
                          reopened_at: { type: [string, "null"], format: date-time }
                          revision: { type: integer }
                          updated_at: { type: string, format: date-time }
                      availability:
                        type: object
                        description: Per-step availability; steps that are available are omitted.
                        additionalProperties:
                          type: object
                          properties:
                            status: { type: string, enum: [disabled, blocked, pending] }
                            reason_code: { type: string }
                            user_guidance: { $ref: "#/components/schemas/StructuredUserGuidance" }
                      revision: { type: integer }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412":
          description: The state moved on since the supplied `If-Match` revision was read (`onboarding_revision_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/onboarding/{journeyId}/reset:
    post:
      operationId: resetOnboarding
      tags: [Stacks]
      summary: Restart the caller's onboarding journey
      description: >-
        Clears the authenticated owner's completed and seen steps in a journey and
        reactivates it so the tour is shown again. Only the owner's own progress
        changes; no infrastructure is touched. Answers the resolved journey like
        the action route.
      x-kombify-cli: { command: "onboarding reset", args: [journey_id] }
      x-kombify-mcp:
        title: Restart onboarding
        toolName: reset_onboarding
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: false }
      parameters:
        - name: journeyId
          in: path
          required: true
          description: Journey id, for example `techstack.platform`.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The resolved journey after the reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [journey, state, availability, revision]
                    properties:
                      journey: { type: object, description: The journey descriptor with its steps. }
                      state:
                        type: object
                        properties:
                          journey_id: { type: string }
                          journey_version: { type: integer }
                          completed: { type: array, items: { type: object } }
                          seen_steps: { type: array, items: { type: string } }
                          status: { type: string, enum: [active, completed, dismissed] }
                          dismissed_at: { type: [string, "null"], format: date-time }
                          reopened_at: { type: [string, "null"], format: date-time }
                          revision: { type: integer }
                          updated_at: { type: string, format: date-time }
                      availability:
                        type: object
                        additionalProperties: { type: object }
                      revision: { type: integer }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/stacks/{id}/resume-remote-enrollment:
    post:
      operationId: resumeRemoteEnrollment
      tags: [Stacks, Jobs]
      summary: Retry SSH enrollment of a connect-remote StackKit deployment
      description: >-
        Re-runs the Guard enrollment over the SSH connection persisted for a
        connect-remote deployment without rerunning the StackKit rollout. The
        deployment must belong to the authenticated owner and use the connect-remote
        transport; the credential comes from the Wallet node access item already
        bound to it, or from `ssh_wallet_item_id` when the connection should be
        rebound first. A plaintext password is never accepted by this contract.
      x-kombify-cli: { command: "stacks resume-remote-enrollment", args: [stack_id] }
      x-kombify-mcp:
        title: Retry remote SSH enrollment
        toolName: resume_remote_enrollment
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      parameters:
        - $ref: "#/components/parameters/stackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ssh_wallet_item_id:
                  type: string
                  pattern: "^itm_[a-z2-7]{26}$"
                  description: Wallet node access item to rebind the stack's persisted SSH connection to before the retry.
      responses:
        "202":
          description: Remote SSH enrollment retry accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
                      message: { type: string }
                      kit_deployment_id: { type: string }
                      pairing_job_id: { type: string }
                      planned_server_id: { type: string }
                      server_remote_host: { type: string }
                      server_remote_user: { type: string }
                      server_remote_port: { type: integer }
                      server_remote_auth_method: { type: string }
                      server_remote_credential_item_id: { type: string }
                      server_remote_credential_ref: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/stacks/{id}/use-cases/{workload}/configure:
    post:
      operationId: configureUseCase
      tags: [Stacks]
      summary: Change the configuration of one installed use-case workload
      description: >-
        Authors a native configuration change for one installed catalog workload
        (compute, storage and accelerator profiles, public settings, secret
        references) against the baseline named by `expected_spec_hash`, saves the
        candidate and queues the StackKit lifecycle jobs that apply it. The
        `Idempotency-Key` makes a retry replay the original acceptance. Refused
        with 409 while the stack is busy, a service is locked, a server is in
        maintenance, or the baseline changed.
      x-kombify-cli: { command: "stacks use-cases configure", args: [stack_id, workload] }
      x-kombify-mcp:
        title: Configure use case
        toolName: configure_use_case
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: workload
          in: path
          required: true
          description: Installed catalog workload slug.
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
        - name: Idempotency-Key
          in: header
          required: true
          description: One opaque attempt key of at most 128 characters; exactly one value.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_spec_hash]
              properties:
                expected_spec_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$", description: Native baseline hash read from the use-case configuration view. }
                compute_profile: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
                storage_profile: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
                accelerator_profile: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,63}$" }
                settings:
                  type: object
                  maxProperties: 64
                  description: Public catalog settings by key; each value is a string, boolean or number.
                  additionalProperties:
                    oneOf:
                      - { type: string }
                      - { type: boolean }
                      - { type: number }
                secret_refs:
                  type: object
                  maxProperties: 64
                  description: Existing secret references by catalog key. Values are `secret://` references, never secret material.
                  additionalProperties: { type: string, pattern: "^secret://", maxLength: 512 }
      responses:
        "202":
          description: Configuration change accepted or replayed; jobs are queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      kit_deployment_id: { type: string }
                      run_id: { type: string }
                      job_id: { type: string }
                      job_ids: { type: array, items: { type: string } }
                      state: { type: string }
                      operation: { type: string, const: use_case_configure }
                      workload_ref: { type: string }
                      previous_spec_hash: { type: string }
                      spec_hash: { type: string }
                      accepted_at: { type: string, format: date-time }
                      idempotent_replay: { type: boolean }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

