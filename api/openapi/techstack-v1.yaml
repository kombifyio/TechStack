      summary: Verify spec hash chain integrity
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack_id:
                    type: string
                  valid:
                    type: boolean
                  message:
                    type: string

  /api/v1/stacks/{id}/pipeline-status:
    get:
      operationId: getPipelineStatus
