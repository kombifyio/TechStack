  /api/v1/wallet/{id}/reauth-proof:
    post:
      operationId: createWalletReauthProof
      x-kombify-cli: { command: "wallet reauth-proof", args: [id] }
      x-kombify-mcp: false # reveals or mints a credential behind interactive re-authentication
      tags: [Wallet]
      summary: Mint a short-lived reauth proof after a fresh platform re-auth
      description: |
        After a fresh biometric/platform re-authentication, mints a short-lived
        trusted-reauth HMAC proof (timestamp + signature) usable to authorize a
        subsequent reveal within the 5-minute window. Requires a valid fresh
        platform reauth assertion on the request.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletReauthRequest"
      responses:
        "200":
          description: Reauth proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletReauthProofEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Fresh platform re-authentication required
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/wallet/{id}/reveal:
    post:
      operationId: revealWalletItem
      x-kombify-cli: { command: "wallet reveal", args: [id] }
      x-kombify-mcp: false # reveals or mints a credential behind interactive re-authentication
      tags: [Wallet]
      summary: Reveal a wallet recovery secret/TOTP, gated by a fresh reauth proof
      description: |
        Biometric-gated. Requires a fresh trusted-reauth HMAC proof (timestamp +
        signature, 5-minute window) supplied in the body or the
        `X-Kombify-Reauth-*` / `X-TechStack-Reauth-*` headers. Returns the
        plaintext recovery values once; the reveal is audited server-side.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRevealRequest"
      responses:
        "200":
          description: Revealed recovery values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletRevealEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Fresh re-authentication required, or item not revealable
        "404":
          $ref: "#/components/responses/NotFound"

