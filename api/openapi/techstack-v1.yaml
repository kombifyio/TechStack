            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStatusResponse"

  # ============================================================
  # STACKS - IMPORT/EXPORT
  # ============================================================
  /api/v1/stacks/{id}/export:
    get:
      operationId: exportStack
      tags: [Stacks - Import/Export]
      summary: Export stack as stack-spec.yaml
      description: Returns StackKits stack-spec YAML or JSON depending on Accept header
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Exported configuration
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  stack_spec:
                    type: object
                    description: Canonical StackKits stack-spec export.
                  kombination:
                    type: object
                    deprecated: true
                    description: Legacy alias for stack_spec.
                  format:
                    type: string
                  stack_id:
                    type: string
                  exported_at:
                    type: string
                    format: date-time

  /api/v1/stacks/import:
    post:
      operationId: importStack
      tags: [Stacks - Import/Export]
      summary: Import stack-spec.yaml and create stack
      description: Imports YAML or JSON into a stack without assuming a single-homelab instance.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Stack already exists

  /api/v1/stacks/import/validate:
    post:
      operationId: validateImport
      tags: [Stacks - Import/Export]
      summary: Validate spec without importing
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  # ============================================================
  # STACKS - DRIFT
  # ============================================================
  /api/v1/stacks/{id}/drift/check:
    post:
      operationId: checkDrift
      tags: [Stacks - Drift]
      summary: Trigger drift check
      description: Rate limited to once per 5 minutes (unless force=true)
      parameters:
        - $ref: "#/components/parameters/stackId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Drift check started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "429":
          description: Rate limited (5 minute cooldown)

  /api/v1/stacks/{id}/drift/status:
    get:
      operationId: getDriftStatus
      tags: [Stacks - Drift]
      summary: Get current drift status
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Drift status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftStatusResponse"

  /api/v1/stacks/{id}/drift/details:
    get:
      operationId: getDriftDetails
      tags: [Stacks - Drift]
      summary: Get detailed drift information with affected resources
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Drift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftDetailsResponse"

  /api/v1/stacks/{id}/drift/resolve:
    post:
      operationId: resolveDrift
      tags: [Stacks - Drift]
      summary: Trigger drift resolution (re-apply)
      description: Precondition -- stack must have status "drifted"
      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "202":
          description: Resolution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "412":
          description: Stack is not in drifted state

  /api/v1/drift/results:
    get:
      operationId: listDriftResults
      tags: [Stacks - Drift]
      summary: List all drift results (paginated)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Paginated drift results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftResultsListResponse"

  /api/v1/drift/results/{id}:
    get:
      operationId: getDriftResult
      tags: [Stacks - Drift]
      summary: Get single drift result
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Drift result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDriftResult
      tags: [Stacks - Drift]
      summary: Delete drift result
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ============================================================
  # UNIFIER
  # ============================================================
  /api/v1/unifier/validate:
    post:
      operationId: validateSpec
      tags: [Unifier]
      summary: Validate a stack specification against CUE schemas
      description: Safe, idempotent. No side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: StackKits stack-spec or legacy Kombination spec to validate
          application/yaml:
            schema:
              type: string
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /api/v1/unifier/analyze:
    post:
      operationId: analyzeSpec
      tags: [Unifier]
      summary: Analyze spec to get requirements (Phase 1)
      description: Safe, idempotent. Returns hardware requirements, detected add-ons, required credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Requirements analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/unifier/unify:
    post:
      operationId: unifySpec
      tags: [Unifier]
      summary: Unify specifications (Phase 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Unified spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/unifier/pipeline:
    post:
      operationId: runPipeline
      tags: [Unifier]
      summary: Run full unifier pipeline (validate + analyze + unify + generate)
      description: Side-effecting -- generates IaC output files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Pipeline result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/unifier/pipeline/validate:
    post:
      operationId: validatePipeline
      tags: [Unifier]
      summary: Validate pipeline inputs without executing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Pipeline validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /api/v1/unifier/pipeline/preview:
    post:
      operationId: previewPipeline
      tags: [Unifier]
      summary: Preview pipeline results without side effects
      description: Safe, idempotent. Shows what would be generated. Backend validation or StackKit resolution failures return 200 with data.valid=false and structured data.errors; malformed input and auth failures remain HTTP errors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Pipeline preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/unifier/generate:
    post:
      operationId: generateIaC
      tags: [Unifier]
      summary: Generate IaC from unified spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Generated IaC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/unifier/iac:
    post:
      operationId: generateIaCDirect
      tags: [Unifier]
      summary: Generate IaC directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: IaC generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/unifier/iac/preview:
    post:
      operationId: previewIaC
      tags: [Unifier]
      summary: Preview IaC generation without writing files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: IaC preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  # ============================================================
  # STACKKITS
  # ============================================================
  /api/v1/stackkits:
    get:
      operationId: listStackKits
      tags: [StackKits]
      summary: List available StackKits
      responses:
        "200":
          description: StackKit catalog
