        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Unifier]
      summary: Read the operator's own answers about experience, goals, placement and household
      description: >-
        Returns the signed-in operator's stored self-disclosure, its source and the capability profile the Unifier
        derives from it. An operator who never answered gets an empty `disclosure`. Pass the returned `source` and
        `disclosure` as `if_unchanged` to replace it safely.
      responses:
        "200":
          description: The stored self-disclosure, or an empty one
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      disclosure:
                        type: object
                        additionalProperties: true
                        description: The stored answers, in the shape of the `disclosure` the replacement takes.
                      profile:
                        type: object
                        description: Capability profile the Unifier derives from the answers.
                      source: { type: string, enum: [link, techstack] }
                      updated_at: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: putOperatorSelfDisclosure
      x-kombify-cli: { command: "operator self-disclosure set" }
      x-kombify-mcp:
        title: Set operator self-disclosure
        toolName: set_operator_self_disclosure
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Unifier]
      summary: Store the operator's own answers about experience, goals, placement and household
      description: >-
        Replaces the signed-in operator's whole self-disclosure; an unanswered question means "not told". The body is
        decoded strictly and every answer must come from the closed vocabulary below. The capability profile in the
        answer is derived by the Unifier, never stored from the request. With `if_unchanged` the replacement is applied
        only when the stored value still equals it, otherwise the answer is 412 `self_disclosure_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, disclosure]
              properties:
                source:
                  type: string
                  enum: [link, techstack]
                  description: link when the answers arrived as URL state and the operator confirmed them; techstack when typed in a Techstack surface.
                disclosure:
                  type: object
                  additionalProperties: false
                  properties:
                    experience: { type: string, enum: [hands-off, guided, curious, techie, expert] }
                    goals: { type: array, items: { type: string, enum: [photos, media, vault, files, smart-home, ai, dev, mail, game] } }
                    placement: { type: string, enum: [home, rented, both, unsure] }
                    hardware: { type: array, items: { type: string, enum: [none-yet, old-pc, mini-pc, nas, raspberry-pi, rented-server] } }
                    household: { type: string, enum: [just-me, household, friends-family, small-team] }
                    motivations: { type: array, items: { type: string, enum: [privacy, replace-subscriptions, learning, family, projects] } }
                    notes: { type: string, maxLength: 2000 }
                if_unchanged:
                  type: object
                  additionalProperties: false
                  required: [source, disclosure]
                  description: The stored value this replacement must still match.
                  properties:
                    source: { type: string }
                    disclosure:
                      type: object
                      additionalProperties: true
                      description: Same shape as `disclosure`.
      responses:
        "200":
          description: The stored self-disclosure with its derived profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      disclosure:
                        type: object
                        additionalProperties: true
                        description: The stored answers, in the shape of the request `disclosure`.
                      profile:
                        type: object
                        description: Capability profile the Unifier derives from the answers.
                        properties:
                          score: { type: integer }
                          band: { type: string }
                          confidence: { type: number }
                          source: { type: string }
                      source: { type: string }
                      updated_at: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412":
          description: The stored value changed before this replacement (`self_disclosure_changed`)
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/servers/{serverId}/access/authorized-key:
    post:
      operationId: authorizeServerAccessKey
      x-kombify-cli: { command: "servers access authorize-key", args: [server_id] }
      x-kombify-mcp: false # needs a fresh interactive re-authentication of the signed-in person (session claim or signed Wallet re-auth assertion); an agent token can never present it
      tags: [Servers]
      summary: Install one Wallet SSH public key on a managed server for direct owner SSH
      description: >-
        Installs the public key of a Wallet SSH item on a connected managed server and records the owner SSH grant.
        The body names the Wallet item (`wallet_item_id`, never key material) and must carry `confirm: true`. A fresh
        server-access re-authentication is required, supplied by the signed-in session or as `reauth_timestamp` and
        `reauth_signature`; without it the answer is 403 `server_access_step_up_required`. Refused on the demo account,
        when owner SSH access is disabled for the server (409) and when the Wallet is unavailable (503).
      parameters:
        - $ref: "#/components/parameters/serverId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet_item_id, confirm]
              properties:
                wallet_item_id: { type: string, description: Wallet item that holds the SSH key. }
                confirm: { type: boolean, enum: [true] }
                reauth_timestamp: { type: string }
                reauth_signature: { type: string }
      responses:
        "200":
          description: The server access state after the key was installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      server_id: { type: string }
                      host: { type: string }
                      user: { type: string }
                      port: { type: integer }
                      host_key_fingerprint: { type: string }
                      user_key_fingerprint: { type: string }
                      ssh_command: { type: string }
                      terminal_enabled: { type: boolean }
                      manual_command_available: { type: boolean }
                      connect_ready: { type: boolean }
                      owner_ssh_access: { type: string, enum: [enabled, disabled] }
                      reason: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: The public key could not be installed on the server
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

