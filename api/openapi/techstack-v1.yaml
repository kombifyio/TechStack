  /api/v1/discovery/probe:
    post:
      operationId: probeDevice
      x-kombify-cli: { command: "discovery devices probe" }
      x-kombify-mcp:
        title: Probe a discovered device
        toolName: probe_discovered_device
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Discovery]
      summary: Deep probe a caller-owned device
      description: >-
        Logs in to the device over SSH with the login held in the Wallet item
        `ssh_wallet_item_id` (a kombify Wallet node access item assigned to
        Techstack and bound to this IP or to no host, or an SSH key or password
        item of the built-in wallet whose URL names this IP) and reads its system facts. The login is
        resolved inside Techstack for this probe only and never answered. This
        contract accepts no password or private key. Non-admin callers may only
        probe IPs from their own discovery results; admins may probe arbitrary
        IPs. Local control planes only (409 `lan_executor_required` on a hosted
        one).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ip, ssh_user, ssh_wallet_item_id]
              properties:
                ip: { type: string }
                ssh_user: { type: string }
                ssh_port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                ssh_wallet_item_id: { type: string, description: Wallet item holding the SSH key or password. }
                timeout_seconds: { type: integer, minimum: 1, default: 30 }
      responses:
        "200":
          description: Probe results
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/discovery/test-ssh:
    post:
      operationId: testSSH
      x-kombify-cli: { command: "discovery test-ssh" }
      x-kombify-mcp:
        title: Test SSH to a discovered device
        toolName: test_discovered_device_ssh
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Discovery]
      summary: Test SSH connectivity to a device
      description: >-
        Opens one SSH connection with the login held in the Wallet item
        `ssh_wallet_item_id` (its key when it holds one, otherwise its
        password; a built-in wallet item must name this IP as its URL), resolved inside Techstack and never answered; nothing is
        stored. This contract accepts no password. A failed connection answers
        200 with `success: false`. Non-admin callers may only test IPs from
        their own discovery results; admins may test arbitrary IPs. Local
        control planes only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ip, user, ssh_wallet_item_id]
              properties:
                ip: { type: string }
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                user: { type: string }
                ssh_wallet_item_id: { type: string, description: Wallet item holding the SSH key or password. }
      responses:
        "200":
          description: SSH test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

