        The class the Layout Planner reads for this machine (`always-on`, `part-time` or `unknown`)
        and where it came from. The observed class folds the server's connection transitions over 14 days:
        `always-on` at 97 % uptime or more, `part-time` below 90 %, `unknown` in between and whenever fewer than
