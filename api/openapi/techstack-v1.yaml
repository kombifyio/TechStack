  /api/v1/wizard/preview:
    post:
      operationId: previewWizard
      tags: [Stacks]
      summary: Preview the StackKit spec a wizard intent would produce
      description: >-
        Projects a wizard intent onto the pinned kit seed and validates the result
        with the pinned StackKits CLI. Safe and idempotent: nothing is persisted.
        An invalid projection answers 200 with `valid: false` and `validate_error`;
        join previews need `base_spec`. Requires the `native_v2_wizard` feature for
        the caller (403 `feature_not_enabled` otherwise).
      x-kombify-cli: { command: "wizard preview" }
      x-kombify-mcp:
        title: Preview wizard spec
        toolName: preview_wizard
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent:
                  type: object
                  additionalProperties: false
                  required: [schema, run_kind, name, kit_assignment]
                  description: Closed wizard intent (techstack.wizard-intent/v1). The backend projects it onto the pinned StackKits kit seed; owner identity never travels here.
                  properties:
                    schema: { type: string, const: "techstack.wizard-intent/v1" }
                    run_kind: { type: string, enum: [first-run, expansion] }
                    homelab_id: { type: string }
                    name: { type: string, minLength: 1, description: Display name of the StackKit deployment. }
                    domain_base: { type: string }
                    goals:
                      type: array
                      items: { type: string }
                      description: Selected use-case slugs from the released StackKits catalog.
                    server:
                      type: object
                      additionalProperties: false
                      properties:
                        existing_server_id: { type: string, description: "Already enrolled, unassigned canonical server for the first installation (found runs, install-command transport only)." }
                        roles:
                          type: array
                          items: { type: string, description: "controller, worker, storage or edge; the legacy names foundation, standalone, main and control-plane map to controller." }
                        purpose: { type: string }
                        transport: { type: string, enum: [install-command, connect-remote, hypervisor, kombify-cloud], description: "Provisioning lane; empty means install-command. kombify-cloud orders a billed managed server." }
                        environment_class: { type: string, enum: [local, cloud] }
                        site_ref: { type: string }
                    kit_assignment:
                      type: object
                      additionalProperties: false
                      required: [mode]
                      properties:
                        mode: { type: string, enum: [found, join, extend], description: "found creates a deployment (kit_slug required); join adds a Node and extend adds use cases to kit_deployment_id." }
                        kit_slug: { type: string, enum: [basement-kit, cloud-kit, modern-homelab] }
                        kit_deployment_id: { type: string }
                    access:
                      type: object
                      additionalProperties: false
                      properties:
                        mode: { type: string, enum: [local, remote-private] }
                        publications:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [service_id, exposure]
                            properties:
                              service_id: { type: string }
                              exposure: { type: string, const: public }
                    household:
                      type: object
                      additionalProperties: false
                      properties:
                        profile: { type: string, enum: [solo, shared] }
                        planned_people:
                          type: array
                          maxItems: 50
                          items:
                            type: object
                            additionalProperties: false
                            required: [client_ref]
                            properties:
                              client_ref: { type: string }
                              name: { type: string, maxLength: 200 }
                              email: { type: string, maxLength: 320 }
                    use_case_settings:
                      type: object
                      additionalProperties: { type: object }
                      description: Setting decisions per selected use-case slug, as the StackKits catalog declares them.
                    use_case_capabilities:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties: { type: string }
                      description: Capability option id (or "off") per capability id, per selected use-case slug.
                    use_case_setup_answers:
                      type: object
                      maxProperties: 128
                      additionalProperties:
                        type: object
                        maxProperties: 128
                        additionalProperties:
                          type: array
                          maxItems: 128
                          items: { type: string, maxLength: 128 }
                    backup:
                      type: object
                      additionalProperties: false
                      properties:
                        offsite: { type: boolean, description: "Off-site object backup; available only when founding a cloud-kit deployment." }
                    layout_recommendation:
                      type: object
                      additionalProperties: false
                      required: [id, proposal_digest]
                      description: Accepts a shown layout recommendation (join and extend runs only).
                      properties:
                        id: { type: string }
                        proposal_digest: { type: string, pattern: "^sha256:" }
                base_spec: { type: object, description: Current spec of the deployment being joined; required for join previews. }
                smart_home_context:
                  type: object
                  properties:
                    existing: { type: boolean }
                    proxmox_available: { type: boolean }
                    lan_reachable: { type: boolean }
                    cpu: { type: integer }
                    memory_mib: { type: integer }
                    disk_gib: { type: integer }
                    needs_apps: { type: boolean }
                    needs_radio: { type: boolean }
                    exclusive_radio: { type: boolean }
                    prefers_appliance_maintenance: { type: boolean }
      responses:
        "200":
          description: The projected and validated spec
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid: { type: boolean }
                      kit_slug: { type: string }
                      node_id: { type: string }
                      spec: { type: object, description: Projected StackKits stack spec. }
                      unmapped_goals: { type: array, items: { type: string } }
                      unmapped_purpose: { type: string }
                      intent_adjustments: { type: array, items: { type: object } }
                      effective_intent: { type: object }
                      smart_home_recommendation: { type: object }
                      release_version: { type: string }
                      validate_error: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/wizard/remote/test-ssh:
    post:
      operationId: testWizardRemoteSsh
      tags: [Stacks]
      summary: Test an SSH connection to a machine before connecting it
      description: >-
        Opens one SSH connection to the given host with a credential held in the
        Wallet and reports whether it succeeded; nothing is stored. The credential
        is a Wallet node access item (`ssh_wallet_item_id`, bound to the host) or,
        on deployments that read the built-in wallet, the label of a stored SSH key.
