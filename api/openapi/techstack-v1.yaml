      tags: [Services]
      summary: Start moving a service to another server of the same stack
      description: >-
        Marks the source service as migrating, creates the target copy pending verification and starts a
        migration job. The target server must belong to the same stack and differ from the source, and the
        service must be movable. Today every call answers 501 `Runtime service migration is unavailable`
        (`migration_available` is false in the registry) until a runtime executor exists; the canonical
        inventory store additionally answers 503 `service_control_server_fence_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, target_server_id]
              properties:
                service_id: { type: string, minLength: 1 }
                target_server_id: { type: string, minLength: 1 }
      responses:
        "200":
          description: Migration job created; source and target copies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string }
                      source_service: { $ref: "#/components/schemas/RegistryService" }
                      target_service: { $ref: "#/components/schemas/RegistryService" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501":
          description: Runtime service migration is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

