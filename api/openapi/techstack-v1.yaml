        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [server_id, title, action]
              properties:
                id: { type: string, maxLength: 128, description: Optional card id; generated when omitted. }
                server_id: { type: string }
                title: { type: string, minLength: 1 }
                severity: { type: string, default: info }
                action:
                  type: object
                  additionalProperties: false
                  required: [stack_id, primitive, resolved_plan_hash, target, evidence_sink_ref]
                  properties:
                    stack_id: { type: string }
                    primitive:
                      type: object
                      additionalProperties: false
                      required: [id, contract_hash, operation_class]
                      properties:
                        id: { type: string }
                        contract_hash: { type: string }
                        operation_class: { type: string, description: "For example product-apply, product-upgrade, product-rollback, mutation or drift-correction." }
                    resolved_plan_hash: { type: string }
                    grant:
                      type: object
                      additionalProperties: false
                      description: Delegated grant binding the card runs under. Without it the card waits for a grant.
                      properties:
                        binding_ref: { type: string }
                        binding_hash: { type: string }
                        audience: { type: string }
                        scopes: { type: array, maxItems: 16, items: { type: string } }
                        granted_at: { type: string, format: date-time }
                        valid_until: { type: string, format: date-time }
                    connector_binding:
                      type: object
                      additionalProperties: false
                      required: [binding_id, binding_hash]
                      properties:
                        binding_id: { type: string }
                        binding_hash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
                    target:
                      type: object
                      additionalProperties: false
                      required: [scope]
                      properties:
                        scope: { type: string, enum: [stack, module-instance, runtime-instance] }
                        site_ref: { type: string }
                        node_ref: { type: string }
                        module_instance_ref: { type: string }
                        runtime_instance_ref: { type: string }
                        execution_channel_ref: { type: string }
                    inputs:
                      type: array
                      maxItems: 16
                      items:
                        type: object
                        additionalProperties: false
                        required: [id, type]
                        properties:
                          id: { type: string }
                          type: { type: string, enum: [opaque-reference, boolean, integer, string-enum] }
                          opaque_ref: { type: string }
                          boolean: { type: boolean }
                          integer: { type: integer, format: int64 }
                          enum: { type: string }
                    evidence_sink_ref: { type: string }
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, server_id, title, status, action]
                    properties:
                      id: { type: string }
                      server_id: { type: string }
                      title: { type: string }
                      severity: { type: string }
                      status: { type: string, description: "awaiting_grant, awaiting_approval, approved, denied, executing, verifying, completed or failed." }
                      action: { type: object, additionalProperties: true, description: The action template as it was created. }
                      approval: { type: object, additionalProperties: true, description: Approval receipt once the owner approved. }
                      execution_id: { type: string }
                      trace_id: { type: string }
                      evidence: { type: object, additionalProperties: true, description: Public-safe result evidence once the action finished. }
                      error_code: { type: string }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      approved_at: { type: string, format: date-time }
                      denied_at: { type: string, format: date-time }
                      execution_started_at: { type: string, format: date-time }
                      completed_at: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/ril/action-cards/{cardId}/execute:
    post:
      operationId: executeRILActionCard
      x-kombify-cli: { command: "ril action-cards execute", args: [card_id] }
      x-kombify-mcp:
        title: Execute action card
        toolName: execute_action_card
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Inventory, RIL]
      summary: Run one approved governed action card on its server
      description: >-
        Starts the durable workflow of a card that the owner approved and that holds a live grant, after checking
        that the caller may operate the card's server. `execution_id`, `trace_id` and `idempotency_key` bind one
        execution; repeating them returns the stored result. A card of operation class `drift-correction` also needs
        `compensation_card_id`, any other card must not send it. A missing approval or grant, an expired grant and a
        connector binding that does not match answer 403 or 409 with a stable `reason_code`.
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [execution_id, trace_id, idempotency_key]
              properties:
                execution_id: { type: string }
                trace_id: { type: string }
                idempotency_key: { type: string, x-kombify-name: execution_idempotency_key }
                compensation_card_id: { type: string, description: Required for drift-correction cards; forbidden for others. }
      responses:
        "200":
          description: The card after execution started or its exact replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, server_id, title, status, action]
                    properties:
                      id: { type: string }
                      server_id: { type: string }
                      title: { type: string }
                      severity: { type: string }
                      status: { type: string, description: "awaiting_grant, awaiting_approval, approved, denied, executing, verifying, completed or failed." }
                      action: { type: object, additionalProperties: true, description: The action template as it was created. }
                      approval: { type: object, additionalProperties: true, description: Approval receipt once the owner approved. }
                      execution_id: { type: string }
                      trace_id: { type: string }
                      evidence: { type: object, additionalProperties: true, description: Public-safe result evidence once the action finished. }
                      error_code: { type: string }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      approved_at: { type: string, format: date-time }
                      denied_at: { type: string, format: date-time }
                      execution_started_at: { type: string, format: date-time }
                      completed_at: { type: string, format: date-time }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/device-readiness/probe:
    post:
      operationId: probeDeviceReadiness
      x-kombify-cli: { command: "device-readiness probe" }
      x-kombify-mcp:
        title: Check a device is ready
        toolName: probe_device_readiness
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Discovery]
      summary: Look at a not-yet-enrolled device over SSH and report whether it is ready
      description: >-
        Opens one SSH session to the named machine, reads its facts (network, proxy, virtualization,
        enrollment reachability) and answers a readiness report; nothing on the device changes. The
        login comes from the Wallet item connection.wallet_item_id, resolved inside Techstack for this
        request only and never answered or stored. Registered only on a local
        (non-SaaS) control plane and requires the signed techstack.device.prepare entitlement.
        Unknown body fields are refused. The first request may omit host_key_fingerprint; the answer
        then carries the key the device presented so it can be pinned on the next call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection]
              properties:
                connection:
                  type: object
                  additionalProperties: false
                  required: [host, user, wallet_item_id]
                  properties:
                    host: { type: string }
                    port: { type: integer }
                    user: { type: string }
                    wallet_item_id: { type: string, description: "Wallet item holding the SSH key or password; this contract accepts no key, passphrase or password." }
                    host_key_fingerprint: { type: string, description: Key the device must present; omit on the first request. }
      responses:
        "200":
          description: Readiness report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [report, device_key_fingerprint]
                    properties:
                      report: { type: object, description: Readiness evaluation of the probed facts. }
                      device_key_fingerprint: { type: string, description: SSH host-key fingerprint the device presented. }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: The device could not be reached or looked at (reason_code device_unreachable or a probe failure)

  /api/v1/device-readiness/prepare:
    post:
      operationId: prepareDeviceReadiness
      x-kombify-cli: { command: "device-readiness prepare" }
      x-kombify-mcp:
        title: Prepare a device
        toolName: prepare_device_readiness
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: true }
      tags: [Discovery]
      summary: Apply catalog fixes to a not-yet-enrolled device over SSH
      description: >-
        Connects to the named machine over SSH, runs the named catalog resolutions in order (only
        catalog ids are accepted), optionally opens a temporary egress path while they run, and
        probes again to report the result. Requires the signed techstack.device.prepare entitlement,
        and techstack.device.egress when egress is true. Registered only on a local (non-SaaS)
        control plane. The login comes from the Wallet item connection.wallet_item_id, resolved inside
        Techstack for this request only. A failing resolution stops the
        run with 409 and the receipts collected so far.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection, resolutions]
              properties:
                connection:
                  type: object
                  additionalProperties: false
                  required: [host, user, wallet_item_id]
                  properties:
                    host: { type: string }
                    port: { type: integer }
                    user: { type: string }
                    wallet_item_id: { type: string, description: "Wallet item holding the SSH key or password; this contract accepts no key, passphrase or password." }
                    host_key_fingerprint: { type: string, description: Key the device must present; omit on the first request. }
                resolutions:
                  type: array
                  minItems: 1
                  items: { type: string, description: Resolution catalog id. }
                interface: { type: string, description: "Interface a fix should act on, when one asks for it." }
                egress: { type: boolean, description: Open a temporary way out for the machine while the fixes run. }
      responses:
        "200":
          description: Receipts and the readiness report after the fixes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [receipts, report, device_key_fingerprint]
                    properties:
                      receipts: { type: array, items: { type: object } }
                      report: { type: object }
                      device_key_fingerprint: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: The device could not be reached, or could not be checked again after the fixes

  /api/v1/provider-operations/{operationId}/provision-discovery:
    post:
      operationId: discoverProviderProvision
      x-kombify-cli: { command: "provider-operations provision-discovery", args: [operation_id] }
      x-kombify-mcp:
        title: Discover a parked provider provision
        toolName: discover_provider_provision
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Servers]
      summary: Observe what the provider holds for one parked provision operation
      description: >-
        First step of operator resolution for a provision whose outcome is unknown. Reads the provider
        (read-only) and appends the immutable discovery evidence; it never creates or retries anything
        at the provider. A replay re-verifies the same observation. The answer names the confirmation
        string the second step requires. Administrator-only: a non-administrator caller is refused
        with 403, and the operation must belong to the caller's tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Provider operation id (non-empty, at most 256 characters, no whitespace or control characters).
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Discovery observation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [operation_id, observation_id, candidate_count, expected_outcome, required_confirmation]
                    properties:
                      operation_id: { type: string }
                      observation_id: { type: string }
                      observation_digest: { type: string }
                      resolution_revision: { type: integer, format: int64, minimum: 0 }
                      candidate_count: { type: integer, minimum: 0 }
                      expected_outcome:
                        type: string
                        enum: [no_candidate_observed, adopted_exact_candidate, multiple_candidates_quarantined]
                      required_confirmation: { type: string, description: "Exact string the resolution step must send: adopt-provision:<operationId>." }
                      created: { type: boolean, description: True when this call appended the observation. }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/provider-operations/{operationId}/provision-resolution:
    post:
      operationId: resolveProviderProvision
      x-kombify-cli: { command: "provider-operations provision-resolution", args: [operation_id] }
      x-kombify-mcp:
        title: Resolve a parked provider provision
        toolName: resolve_provider_provision
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Servers]
      summary: Record the operator decision for one parked provision operation
      description: >-
        Second step of operator resolution. With the exact confirmation from the discovery step it
        appends one decision against the persisted observation: no candidate, adopt the single exact
        candidate, or quarantine several. The decision is local custody state and never starts or
        retries provider creation. Replays return the original decision. Administrator-only;
        a stale or mismatching observation answers 409.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Provider operation id (non-empty, at most 256 characters, no whitespace or control characters).
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: "Must equal required_confirmation from the discovery step (adopt-provision:<operationId>)."
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [operation_id, outcome]
                    properties:
                      operation_id: { type: string }
                      outcome:
                        type: string
                        enum: [no_candidate_observed, adopted_exact_candidate, multiple_candidates_quarantined]
                      operation_phase: { type: string }
                      resource_count: { type: integer, minimum: 0 }
                      decision_digest: { type: string }
                      created: { type: boolean, description: True when this call appended the decision. }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/substrates/{id}/appliances:
    post:
      operationId: createSubstrateAppliance
      x-kombify-cli: { command: "substrates appliances create", args: [server_id] }
      x-kombify-mcp:
        title: Create a Home Assistant appliance on a substrate
        toolName: create_substrate_appliance
        resourceBinding: { argument: server_id, dimension: techstack.server }
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Servers]
      summary: Admit a Home Assistant OS guest on the owner's own hypervisor
      description: >-
        Reserves a guest on a bound substrate (the owner's own Proxmox host, customer custody, local
        billing, nothing billed by kombify) and submits its creation; the guest is not yet assessed as
        running (`application_status` is `authenticated_check_pending`). Only the `haos` profile and a
        placement on this substrate are accepted. The substrate binding must be enabled and its Guard
        inventory current, and the stack must be owned by the caller. Replaying the same intent with
        the same Idempotency-Key returns the same guest; a changed intent or a different key for the
        same stack and node answers 409 `appliance_not_admitted`.
      parameters:
        - name: id
          in: path
          required: true
          description: Substrate server id.
          x-kombify-name: server_id
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Stable retry key, 1-256 characters, no commas, control characters or surrounding
            whitespace. Pass the same key on a retry; a fresh key for an unchanged request is a conflict.
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stack_id, node_id, placement]
              properties:
                stack_id: { type: string, minLength: 1, maxLength: 512, description: Stack that owns the appliance; must belong to the caller. }
                node_id: { type: string, minLength: 1, maxLength: 512, description: Node the appliance becomes in that stack; one appliance per stack node. }
                placement:
                  type: object
                  required: [server_id, profile_id, storage, bridge, cpu, memory_mib, disk_gib]
                  properties:
                    server_id: { type: string, description: Must equal the substrate server id in the path. }
                    profile_id: { type: string, enum: [haos] }
                    storage: { type: string, description: "Active storage id on the substrate holding images, import content and vztmpl." }
                    bridge: { type: string, description: Active LAN bridge name on the substrate. }
                    cpu: { type: integer, minimum: 2, maximum: 256 }
                    memory_mib: { type: integer, minimum: 4096, maximum: 1048576 }
                    disk_gib: { type: integer, minimum: 32, maximum: 65536 }
                    isolated: { type: boolean }
                    requires_accelerator: { type: boolean }
                    accelerator:
                      type: object
                      required: [address]
                      properties:
                        address: { type: string }
                        root_port: { type: string }
                        subtree: { type: string }
                        thunderbolt_unique_id: { type: string }
      responses:
        "202":
          description: Guest admitted; creation is in progress
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [guest, application_status]
                    properties:
                      guest:
                        type: object
                        required: [lease_id, server_id, operation_id, guest_id, profile_id]
                        properties:
                          lease_id: { type: string }
                          server_id: { type: string }
                          operation_id: { type: string }
                          guest_id: { type: integer }
                          profile_id: { type: string }
                      application_status: { type: string, enum: [authenticated_check_pending] }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/substrates/{id}/binding:
    put:
      operationId: setSubstrateBinding
      x-kombify-cli: { command: "substrates binding set", args: [server_id] }
      x-kombify-mcp:
        title: Enable or disable a substrate binding
        toolName: set_substrate_binding
        resourceBinding: { argument: server_id, dimension: techstack.server }
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: false }
      tags: [Servers]
      summary: Enable or disable guest placement on one substrate
      description: >-
        Binds the substrate to the Guard's current authenticated inventory (node, guest-id range, image
        pins) and turns guest placement on or off. Optimistic concurrency: `revision` must equal the
        current binding revision (0 when none exists) and the answer carries the next one. Refused with
        409 while the substrate has no current inventory, no node-local configuration, a revision
        mismatch, or non-decommissioned guests that still hold custody.
      parameters:
        - name: id
          in: path
          required: true
          description: Substrate server id.
          x-kombify-name: server_id
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, revision]
              properties:
                enabled: { type: boolean }
                revision: { type: integer, format: int64, minimum: 0, description: Current binding revision; 0 creates the binding. }
      responses:
        "200":
          description: Binding updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [server_id, revision, enabled]
                    properties:
                      server_id: { type: string }
                      revision: { type: integer, format: int64, minimum: 1 }
                      enabled: { type: boolean }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC/JWKS bearer token. Self-hosted defaults to Pocket ID; SaaS uses Auth0 through the edge. PocketBase JWT is legacy migration compatibility only.
    runtimeAgentAuth:
      type: http
      scheme: bearer
      bearerFormat: TechStack-Runtime-Agent
      description: Runtime-agent credential bound to the exact tenant, placement, server, and worker identity. Signed, opaque, and explicit legacy compatibility tokens are validated fail-closed by the worker runtime.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service accounts and automation clients (SaaS mode via the public edge)
    edgeTrustHeader:
      type: apiKey
      in: header
      name: X-Edge-Internal-Trust
      description: Legacy trust header injected by the public edge during the migration cutover (SaaS mode only)
  parameters:
    driveHealthServerId:
      name: server_id
      in: query
      required: false
      description: Restrict evidence to one server within the authenticated tenant; an unobserved server remains explicitly missing.
      schema: { type: string, maxLength: 128 }
    applicationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    adoptionPlanId:
      name: planId
      in: path
      required: true
      schema: { type: string }
    serverId:
      name: serverId
      in: path
      required: true
      description: Canonical server runtime ID
      schema:
        type: string
    serviceId:
      name: serviceId
      in: path
      required: true
      description: Canonical service runtime ID
      schema:
        type: string
    stackId:
      name: id
      in: path
      x-kombify-name: stack_id
      required: true
      description: Stack ID
      schema:
        type: string
    resourceId:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: string
    monthlyRuntimeLeaseId:
      name: lease_id
      in: path
      required: true
      description: Monthly runtime lease ID
      schema:
        type: string
    monthlyRuntimeOperationLimit:
      name: limit
      in: query
      required: false
      description: Maximum operation events to return.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    page:
      name: page
      in: query
      required: false
      description: Page number (default 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    perPage:
      name: per_page
      in: query
      required: false
      description: Items per page (default 20, max 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    ApplicationConnectorQueued:
      description: Connector action queued or exact durable replay returned
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/ApplicationConnectorAction" }
    ApplicationLifecycleQueued:
      description: Application lifecycle queued or exact durable replay returned
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/ServiceActionResponse" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: >-
        The request body exceeds the route's bound. Worker routes cap the body before any
        decoding or authentication work; a request without a usable credential is refused
        (401) before its body is read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request failed semantic validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DriveHealthUnavailable:
      description: |
        Drive evidence cannot be read because persistence is unavailable or its
        read failed. When persistence is not configured, details.reason_code is
        drive_health_persistence_unavailable and details.retryable is true.
        Authentication and hosted organization scope are checked before this error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DriveHealthUnavailableError"
    ServiceUnavailable:
      description: Required control-plane persistence or dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected internal error without sensitive implementation details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DriveHealthResponse:
      type: object
      required: [generated_at, servers]
      properties:
        generated_at: { type: string, format: date-time }
        servers:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthServerState" }

    DriveHealthAlertsResponse:
      type: object
      required: [generated_at, alerts]
      properties:
        generated_at: { type: string, format: date-time }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthAlert" }

    DriveHealthServerState:
      type: object
      required: [server_id, worker_id, last_attempt_at, collection_status, inventory_complete, drives, alerts]
      properties:
        server_id: { type: string }
        worker_id:
          type: string
          description: Authenticated Guard identity; empty when the selected server has no observation.
        last_attempt_at:
          type: string
          format: date-time
          description: Latest accepted collection attempt; the zero timestamp 0001-01-01T00:00:00Z denotes no observation.
        collection_status: { $ref: "#/components/schemas/DriveObservationState" }
        collection_reason: { type: string }
        inventory_complete:
          type: boolean
          description: Only a complete inventory supports inference that an absent known identity disconnected.
        drives:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthState" }
        alerts:
          type: array
          description: Server collection conditions, including path-scoped anonymous availability incidents.
          items: { $ref: "#/components/schemas/DriveHealthAlert" }

    DriveObservationState:
      type: string
      enum: [available, incomplete, unsupported, inaccessible, missing, stale, disconnected]
      description: Observation availability, independently of the hardware health assessment.

    DriveHealthState:
      type: object
      required: [drive_id, device_path, observation_status, health, last_attempt_at, last_attempt, last_success, alerts]
      properties:
        drive_id:
          type: string
          description: Immutable hardware-derived identity, or an attempt-specific unidentified-* display ID with no historical continuity.
        device_path: { type: string }
        observation_status: { $ref: "#/components/schemas/DriveObservationState" }
        health:
          type: string
          enum: [healthy, warning, critical, unknown]
          description: Current supported evidence assessment; failed, incomplete or stale collection cannot establish health from absent values.
        last_attempt_at:
          type: string
          format: date-time
          description: Latest attempt, including an ambiguous identity read at a previously observed path; it may be newer than last_attempt.observed_at.
        last_attempt:
          oneOf:
            - $ref: "#/components/schemas/DriveHealthReading"
            - { type: "null" }
        last_success:
          description: Last available identified reading; retained as historical evidence across failed or incomplete attempts.
          oneOf:
            - $ref: "#/components/schemas/DriveHealthReading"
            - { type: "null" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthAlert" }

    DriveHealthReading:
      type: object
      required: [drive_id, device_path, protocol, model, serial, wwn, source, observed_at, status, missing, smart_passed, attribute_failed, temperature_celsius, temperature_warning_celsius, temperature_critical_celsius, critical_warning, percentage_used, available_spare, spare_threshold, media_errors, error_log_entries, self_test_failed, reallocated_sectors, pending_sectors, uncorrectable_sectors, power_on_hours, wear_attributes]
      properties:
        drive_id:
          type: string
          description: SHA-256 of hardware identity, or empty when identity could not be read; never derived from the path.
          pattern: '^(|[a-f0-9]{64})$'
        device_path: { type: string }
        protocol: { type: string, enum: [ATA, NVMe, SCSI, ""] }
        model: { type: string, maxLength: 256 }
        serial: { type: string, maxLength: 256 }
        wwn: { type: string, maxLength: 256 }
        source: { type: string, enum: [smartctl, nvme_cli, inventory] }
        observed_at: { type: string, format: date-time }
        status: { type: string, enum: [available, incomplete, unsupported, inaccessible, missing] }
        reason: { type: string }
        missing:
          type: [array, "null"]
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum: [identity, smart_passed, attribute_failed, temperature_celsius, critical_warning, percentage_used, available_spare, spare_threshold, media_errors, error_log_entries, self_test_failed, reallocated_sectors, pending_sectors, uncorrectable_sectors, power_on_hours]
        smart_passed: { type: [boolean, "null"] }
        attribute_failed: { type: [boolean, "null"] }
        self_test_failed:
          type: [boolean, "null"]
          description: Failed latest reported self-test result; null denotes unreported or unavailable evidence, not a passing test. Reading never starts a self-test.
        temperature_celsius: { type: [number, "null"], minimum: -273.15, maximum: 1000 }
        temperature_warning_celsius: { type: [number, "null"], minimum: -273.15, maximum: 1000 }
        temperature_critical_celsius:
          type: [number, "null"]
          minimum: -273.15
          maximum: 1000
          description: Device-reported critical limit. Missing device limits use advisory Guard policy thresholds (65 C warning, 80 C critical), identified in alert evidence as guard_policy rather than a vendor failure threshold.
        critical_warning:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: NVMe critical-warning bit mask; nonzero bits retain their device meaning.
        percentage_used:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Manufacturer estimate of consumed rated endurance, which may exceed 100. It is neither remaining life nor a precise failure forecast; crossing 90 or 100 is advisory warning absent independent failing evidence.
        available_spare: { type: [integer, "null"], minimum: 0, maximum: 100 }
        spare_threshold: { type: [integer, "null"], minimum: 0, maximum: 100 }
        media_errors: { $ref: "#/components/schemas/DriveHealthCounter" }
        error_log_entries:
          allOf:
            - $ref: "#/components/schemas/DriveHealthCounter"
          description: Cumulative NVMe error-log entries; command errors alone do not establish media failure. Increases receive an advisory inspect-log condition.
        reallocated_sectors: { $ref: "#/components/schemas/DriveHealthCounter" }
        pending_sectors: { $ref: "#/components/schemas/DriveHealthCounter" }
        uncorrectable_sectors: { $ref: "#/components/schemas/DriveHealthCounter" }
        power_on_hours: { $ref: "#/components/schemas/DriveHealthCounter" }
        wear_attributes:
          type: [array, "null"]
          maxItems: 16
          items: { $ref: "#/components/schemas/DriveHealthWearAttribute" }

    DriveHealthCounter:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]{0,38})$'
      description: Exact unsigned decimal counter bounded to 128 bits. Null means unreported; clients must preserve precision rather than convert to a floating-point number.

    DriveHealthWearAttribute:
      type: object
      required: [id, name, value, raw, interpretation]
      properties:
        id: { type: integer, minimum: 1, maximum: 255 }
        name: { type: string }
        value:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Manufacturer-normalized attribute, without universal percentage interpretation.
        raw: { $ref: "#/components/schemas/DriveHealthCounter" }
        interpretation: { type: string, enum: [vendor_specific] }

    DriveHealthAlert:
      type: object
      required: [id, worker_id, server_id, category, code, severity, message, evidence, recommended_step, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid, description: Stable condition episode identity. }
        worker_id: { type: string }
        condition_key:
          type: string
          description: Stable server/path availability key for anonymous collection incidents; does not identify physical hardware.
        server_id: { type: string }
        drive_id: { type: string, description: Attributable drive identity; absent on server or anonymous path collection conditions. }
        category: { type: string, enum: [collection, hardware] }
        code:
          type: string
          enum: [collection, stale, observation, disconnected, smart_failed, self_test_failed, attribute_failed, nvme_warning, wear, spare, temperature, media_errors, media_errors_increase, error_log_entries_increase, reallocated_sectors, reallocated_sectors_increase, pending_sectors, pending_sectors_increase, uncorrectable_sectors, uncorrectable_sectors_increase]
        severity: { type: string, enum: [info, warning, critical] }
        message: { type: string, description: Technical fallback; customer clients localize by condition code. }
        evidence:
          type: object
          additionalProperties: { type: string }
          description: Measured values, source/time/path and condition-specific interpretation or threshold_source (device or guard_policy).
        recommended_step: { type: string, description: Technical next-step guidance; clients localize recommendations by condition code. }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          description: Present only after fresh evidence resolves the episode; absence means active, including when later fields are missing.

    DriveHealthUnavailableError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: INTERNAL_ERROR }
            message: { type: string }
            details:
              type: object
              properties:
                reason_code: { type: string, const: drive_health_persistence_unavailable }
                retryable: { type: boolean, const: true }

    StorageForecastResponse:
      type: object
      required: [generated_at, window_start, window_end, resources]
      properties:
        generated_at: { type: string, format: date-time }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        resources:
          type: array
          maxItems: 384
          items:
            type: object
            required: [id, labels, forecast]
            properties:
              id: { type: string }
              labels:
                type: object
                additionalProperties: { type: string }
              forecast: { $ref: "#/components/schemas/StorageForecast" }

    StorageForecast:
      type: object
      required: [state, notes, sample_count, bucket_count, horizon_days]
      properties:
        state:
          type: string
          enum: [insufficient_data, capacity_reached, growing, flat, shrinking, beyond_horizon]
        reason: { type: string }
        notes:
          type: array
          items: { type: string }
        used_bytes: { type: number, minimum: 0 }
        capacity_bytes: { type: number, exclusiveMinimum: 0 }
        free_bytes: { type: number, minimum: 0 }
        latest_at: { type: string, format: date-time }
        observed_from: { type: string, format: date-time }
        observed_to: { type: string, format: date-time }
        sample_count: { type: integer, minimum: 0 }
        bucket_count: { type: integer, minimum: 0 }
        growth_bytes_per_day: { type: number }
        growth_low_bytes_per_day: { type: number }
        growth_high_bytes_per_day: { type: number }
        exhaustion:
          type: object
          required: [earliest_days]
          properties:
            earliest_days: { type: number, minimum: 0 }
            latest_days: { type: number, minimum: 0 }
        horizon_days: { type: number, minimum: 0 }
        capacity_changed_at: { type: string, format: date-time }

    Homelab:
      type: object
      description: The owner's Homelab umbrella (ADR-0036).
      required: [id, name, named, updated]
      properties:
        id: { type: string }
        name: { type: string }
        named:
          type: boolean
          description: Whether the owner chose the name; a generated placeholder name reports false.
        named_at: { type: string, format: date-time }
        intent: { type: object }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    OrphanProjectionCleanupRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [dry_run, apply]
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Required for apply; copied unchanged from the reviewed dry-run.
        stack_id:
          type: string
          description: Optional exact deployment scope used by E2E cleanup.

    OrphanProjectionCleanupCandidate:
      type: object
      required: [resource_type, id, name, class, reason]
      properties:
        resource_type:
          type: string
          enum: [stack_projection, worker_projection]
        id: { type: string }
        name: { type: string }
        class:
          type: string
          enum: [e2e_test_stack, runtime_cloud_test_stack, e2e_test_worker, runtime_cloud_test_worker]
        reason: { type: string }

    OrphanProjectionCleanupResponse:
      type: object
      required: [mode, message, digest, candidates, applied]
      properties:
        mode:
          type: string
          enum: [dry_run, apply]
        message: { type: string }
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/OrphanProjectionCleanupCandidate"
        applied:
          type: object
          required: [stacks, workers, total]
          properties:
            stacks: { type: integer, minimum: 0 }
            workers: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }

    StackKitDeploymentSummary:
      type: object
      description: |
        One StackKit rollout beneath an owner-scoped Homelab. Additional
        runtime projections may be present; the identity fields below are the
        stable product boundary.
      required: [id, kit_deployment_id, homelab_id, stackkit_id, name, mode, status]
      properties:
        id:
          type: string
          description: Legacy compatibility alias for kit_deployment_id.
        kit_deployment_id:
          type: string
        homelab_id:
          type: string
        stackkit_id:
          type: string
        stackkit_instance_id:
          type: string
          description: StackKits StackSpec/ResolvedPlan compatibility identity.
        name:
          type: string
        mode:
          type: string
        status:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
      additionalProperties: true

    InventoryFreshness:
      type: object
      required: [state, stale_after_seconds]
      properties:
        state: { type: string, enum: [fresh, stale, unavailable] }
        age_seconds: { type: integer, format: int64, minimum: 0 }
        stale_after_seconds: { type: integer, format: int64, minimum: 0 }
        reason_code: { type: string }

    InventoryAddresses:
      type: object
      required: [public_ips, private_ips, local_ips, domains]
      properties:
        public_ips: { type: array, items: { type: string } }
        private_ips: { type: array, items: { type: string } }
        local_ips: { type: array, items: { type: string } }
        domains: { type: array, items: { type: string } }

    InventoryObservedState:
      type: object
      required: [state]
      properties:
        state: { type: string }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }

    InventoryResourceMetric:
      type: object
      required: [status]
      description: One heartbeat-observed resource figure. A value is present only when status is ok; a figure outside the freshness window is stale and carries no value.
      properties:
        status: { type: string, enum: [ok, stale, unknown] }
        value: { type: number }
        unit: { type: string }

    InventoryResourceMetrics:
      type: object
      required: [cpu_percent, memory_percent, disk_percent, uptime_seconds]
      properties:
        cpu_percent: { $ref: "#/components/schemas/InventoryResourceMetric" }
        memory_percent: { $ref: "#/components/schemas/InventoryResourceMetric" }
        disk_percent: { $ref: "#/components/schemas/InventoryResourceMetric" }
        uptime_seconds: { $ref: "#/components/schemas/InventoryResourceMetric" }

    InventoryLifecycleProjection:
      type: object
      required: [state]
      properties:
        state: { type: string }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }

    InventoryDesiredProjection:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [running, stopped, absent, unknown] }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }

    InventoryLeaseProjection:
      type: object
      required: [state]
      properties:
        id: { type: string, description: Opaque runtime-lease identifier; never a credential or provider-resource reference. }
        state: { type: string }

    InventoryCleanupProjection:
      type: object
      required: [state, provider_absence_verified]
      properties:
        state: { type: string, enum: [not_requested, delete_accepted, absence_pending, absent, cleanup_required, failed, unverified] }
        provider_absence_verified: { type: boolean }
        verified_at:
          type: string
          format: date-time
          description: Provider-control evidence collection time; never inferred from a lifecycle tombstone.

    InventoryStackKit:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        variant: { type: string }

    InventoryPlatform:
      type: object
      properties:
        os: { type: string }
        os_version: { type: string }
        arch: { type: string }

    InventoryServer:
      type: object
      required: [id, name, observed_at, freshness, inventory_revision, addresses, platform, stackkit, lifecycle, desired, lease, cleanup, connection, health, metrics]
      properties:
        id: { type: string }
        stack_id: { type: string }
        name: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        addresses: { $ref: "#/components/schemas/InventoryAddresses" }
        platform: { $ref: "#/components/schemas/InventoryPlatform" }
        stackkit: { $ref: "#/components/schemas/InventoryStackKit" }
        provider: { type: string, description: Stable vendor id only; never a provider-native resource handle. }
        lifecycle: { $ref: "#/components/schemas/InventoryLifecycleProjection" }
        desired: { $ref: "#/components/schemas/InventoryDesiredProjection" }
        lease: { $ref: "#/components/schemas/InventoryLeaseProjection" }
        cleanup: { $ref: "#/components/schemas/InventoryCleanupProjection" }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        health: { $ref: "#/components/schemas/InventoryObservedState" }
        metrics: { $ref: "#/components/schemas/InventoryResourceMetrics" }

    InventoryServerList:
      type: object
      required: [observed_at, freshness, inventory_revision, collection_cursor, page_size, servers]
      properties:
        observed_at: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        collection_cursor: { type: string }
        next_cursor: { type: string }
        page_size: { type: integer, minimum: 0, maximum: 200 }
        servers: { type: array, items: { $ref: "#/components/schemas/InventoryServer" } }

    RILServerSummary:
      type: object
      required: [count, has_servers, observed_at]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        has_servers: { type: boolean }
        observed_at: { type: string, format: date-time }

    InventoryServerHealth:
      type: object
      required: [server_id, observed_at, freshness, inventory_revision, connection, health, metrics]
      properties:
        server_id: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        health: { $ref: "#/components/schemas/InventoryObservedState" }
        metrics: { $ref: "#/components/schemas/InventoryResourceMetrics" }

    ServerPortAllocation:
      type: object
      required: [id, transport, bind_address, port, exposure, observed_state, exposed_state, drift_state, desired]
      properties:
        id: { type: string }
        stack_id: { type: string }
        resolved_plan_hash: { type: string }
        node_ref: { type: string }
        transport: { type: string, enum: [tcp, udp] }
        bind_address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        sharing: { type: string, enum: [exclusive, virtual-host] }
        listener_group_ref: { type: string }
        exposure: { type: string, enum: [local, remote-private, public] }
        source_route_refs: { type: array, items: { type: string } }
        reservation_state: { type: string, enum: [reserved, released] }
        claim_state: { type: string, enum: [pending, mutating, active, uncertain, released] }
        observed_state: { type: string, enum: [unknown, present, missing, stale] }
        exposed_state: { type: string, enum: [unknown, present, missing, stale] }
        drift_state: { type: string, enum: [consistent, missing, unexpected, unknown] }
        desired: { type: boolean }

    ServerPortInventory:
      type: object
      required: [server_id, server_generation, inventory_revision, listeners_complete, exposures_complete, allocations]
      properties:
        server_id: { type: string }
        server_generation: { type: integer, format: int64, minimum: 1 }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        expires_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        listeners_complete: { type: boolean }
        exposures_complete: { type: boolean }
        allocations: { type: array, items: { $ref: "#/components/schemas/ServerPortAllocation" } }

    InventoryServiceLink:
      type: object
      required: [url, mode]
      properties:
        url: { type: string, format: uri }
        mode: { type: string, enum: [direct, relay] }

    InventoryService:
      type: object
      required: [id, stack_id, server_id, key, name, desired_state, observed_state, observed_at, freshness, inventory_revision, health, stackkit, links, allowed_actions, source]
      properties:
        id: { type: string }
        stack_id: { type: string }
        server_id: { type: string }
        key: { type: string }
        name: { type: string }
        management_state:
          type: string
          enum: [managed, observed]
          description: Definition ownership, independent of desired state, observed state and health. Omitted when unreported.
        desired_state: { type: string }
        observed_state: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        health: { $ref: "#/components/schemas/InventoryObservedState" }
        stackkit: { $ref: "#/components/schemas/InventoryStackKit" }
        links: { type: array, items: { $ref: "#/components/schemas/InventoryServiceLink" } }
        allowed_actions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [start, stop, restart, logs] }
        evidence_ref: { type: string }
        source: { type: string }

    InventoryServiceList:
      type: object
      required: [observed_at, freshness, inventory_revision, collection_cursor, page_size, services]
      properties:
        observed_at: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        collection_cursor: { type: string }
        next_cursor: { type: string }
        page_size: { type: integer, minimum: 0, maximum: 200 }
        services: { type: array, items: { $ref: "#/components/schemas/InventoryService" } }

    InventoryChannel:
      type: object
      required: [type, role, state]
      properties:
        type: { type: string }
        role: { type: string }
        state: { type: string }
        observed_at: { type: string, format: date-time }

    InventoryAccessServiceLink:
      type: object
      required: [service_id, service_name, url, mode, health]
      properties:
        service_id: { type: string }
        service_name: { type: string }
        url: { type: string, format: uri }
        mode: { type: string, enum: [direct, relay] }
        health: { type: string }

    InventoryAvailability:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [available, unavailable] }
        reason_code: { type: string }

    InventoryServerAccessContext:
      type: object
      required: [server_id, observed_at, freshness, inventory_revision, availability, connection, addresses, channels, service_links]
      properties:
        server_id: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        availability: { $ref: "#/components/schemas/InventoryAvailability" }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        addresses: { $ref: "#/components/schemas/InventoryAddresses" }
        channels: { type: array, items: { $ref: "#/components/schemas/InventoryChannel" } }
        service_links: { type: array, items: { $ref: "#/components/schemas/InventoryAccessServiceLink" } }

    StackReadiness:
      type: object
      additionalProperties: false
      required:
        - status
        - can_start
        - required_servers
        - approved_servers
        - connected_servers
        - pending_servers
        - assigned_servers
        - available_servers
        - unassigned_servers
        - message
        - review_required
      properties:
        status:
          type: string
          description: Current rollout-readiness state; it is not a provider lifecycle state.
        can_start:
          type: boolean
          description: True only when the current server evidence satisfies the rollout start guard.
        required_servers: { type: integer, minimum: 0 }
        approved_servers:
          type: integer
          minimum: 0
          description: Assigned servers approved by the operator; approval alone does not mean connected.
        connected_servers:
          type: integer
          minimum: 0
          description: Assigned and approved servers with fresh canonical Guard connection and health evidence.
        pending_servers: { type: integer, minimum: 0 }
        assigned_servers: { type: integer, minimum: 0 }
        available_servers: { type: integer, minimum: 0 }
        unassigned_servers: { type: integer, minimum: 0 }
        message: { type: string }
        review_required: { type: boolean }

    StackOperationsServer:
      type: object
      required: [id, hostname, role, status, assignment, agent_id, approved, precheck_state, assignable, capabilities, health]
      additionalProperties: true
      properties:
        id: { type: string }
        server_id: { type: string }
        hostname: { type: string }
        role: { type: string }
        status: { type: string }
        assignment: { type: string }
        stack_id: { type: string }
        agent_id: { type: string }
        ip: { type: string }
        os: { type: string }
        os_version: { type: string }
        arch: { type: string }
        domains: { type: array, items: { type: string } }
        last_seen: { type: string, format: date-time }
        approved: { type: boolean }
        approved_at: { type: string, format: date-time }
        precheck_state: { type: string }
        source: { type: string }
        lease_id: { type: string }
        runtime_lane: { type: string }
        runtime_offering_id: { type: string }
        desired_state: { type: string }
        enrollment_status: { type: string }
        assignable: { type: boolean }
        capabilities: { type: object, additionalProperties: true }
        health:
          type: object
          additionalProperties: true
          required: [state, source, cpu_percent, memory_percent, disk_percent, uptime_seconds]
          properties:
            state: { type: string }
            source: { type: string }
            cpu_percent: { type: object, additionalProperties: true }
            memory_percent: { type: object, additionalProperties: true }
            disk_percent: { type: object, additionalProperties: true }
            uptime_seconds: { type: object, additionalProperties: true }
            updated_at: { type: string, format: date-time }
            notes: { type: array, items: { type: string } }

    StackOperationsService:
      type: object
      required: [name, display_name, type, status]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        type: { type: string }
        status: { type: string }
        url: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
        target_server: { type: string }
        target_server_id: { type: string }
        desired_state: { type: string }
        observed_state: { type: string }
        access: { type: object, additionalProperties: true }
        allowed_actions: { type: array, items: { type: string } }

    StackOperationsResponse:
      type: object
      additionalProperties: false
      required: [stack, readiness, nextSteps, kpis, servers, services, monitoring, alerts]
      properties:
        stack:
          type: object
          additionalProperties: true
          description: Existing stack summary projection; credentials and provider-native resource handles are not added by this operation.
        readiness: { $ref: "#/components/schemas/StackReadiness" }
        nextSteps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, description, status]
            properties:
              id: { type: string }
              label: { type: string }
              description: { type: string }
              status: { type: string }
              action: { type: string }
        kpis:
          type: object
          additionalProperties: false
          required: [registered_servers, healthy_servers, running_services, active_alerts]
          properties:
            registered_servers: { type: integer, minimum: 0 }
            healthy_servers: { type: integer, minimum: 0 }
            running_services: { type: integer, minimum: 0 }
            active_alerts: { type: integer, minimum: 0 }
        servers: { type: array, items: { $ref: "#/components/schemas/StackOperationsServer" } }
        retiredServers:
          type: array
          description: Terminal managed generations excluded from current inventory, KPIs, readiness, health, and services; retained only for confirmed Recreate discovery.
          items: { $ref: "#/components/schemas/StackOperationsServer" }
        services: { type: array, items: { $ref: "#/components/schemas/StackOperationsService" } }
        monitoring: { type: object, additionalProperties: true }
        alerts: { type: array, items: { type: object, additionalProperties: true } }
        currentJob: { type: object, additionalProperties: true }
        runtimeLifecycle: { type: object, additionalProperties: true }
        latestFailure: { type: object, additionalProperties: true }

    StackOperationsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/StackOperationsResponse" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ServerChannel:
      type: object
      required: [type, role, state]
      properties:
        type:
          type: string
          enum: [grpc-mtls, ssh, cloudflare-tunnel, provider-api]
        role:
          type: string
          enum: [primary, fallback, info-only]
        state:
          type: string
        endpoint_ref:
          type: string
          description: Redacted endpoint reference; never a credential.
        observed_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    ServerRuntime:
      type: object
      required: [id, node_id, name, lifecycle, connection, health, channels, inventory_revision, provider, mutations_allowed, allowed_actions, stack_actions, created_at, updated_at]
      properties:
        id:
          type: string
          description: Compatibility alias for node_id.
        node_id:
          type: string
        kit_deployment_id:
          type: string
        worker_id:
          type: string
        name:
          type: string
        lifecycle:
          type: object
          required: [state, desired_state]
          properties:
            state:
              type: string
              enum: [planned, provisioning, enrolling, active, failed, decommissioning, decommissioned]
            desired_state:
              type: string
              enum: [running, stopped, absent]
            ended_at:
              type: string
              format: date-time
        connection:
          type: object
          required: [state, changed_at]
          properties:
            state:
              type: string
              enum: [pending, connecting, connected, degraded, stale, offline, revoked]
            reason_code:
              type: string
            changed_at:
              type: string
              format: date-time
            last_heartbeat_at:
              type: string
              format: date-time
            staleness_seconds:
              type: integer
              format: int64
              minimum: 0
        health:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [unknown, healthy, degraded, unhealthy]
            observed_at:
              type: string
              format: date-time
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ServerChannel"
        inventory_revision:
          type: integer
          format: int64
          minimum: 0
        provider:
          type: object
          properties:
            lease_id:
              type: string
            ref:
              type: string
        environment_class:
          type: string
          enum: [local, cloud, unknown]
        offering:
          type: string
          enum: [self_owned_device, external_vps, managed_vps]
        provider_id:
          type: string
        provider_target_ref:
          type: string
        availability_owner:
          type: string
          enum: [customer, provider]
        operations_owner:
          type: string
          enum: [customer, kombify]
        target_evidence:
          type: object
          required: [freshness]
          properties:
            ref:
              type: string
            observed_at:
              type: string
              format: date-time
            freshness:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [recorded, unknown]
                age_seconds:
                  type: integer
                  format: int64
                  minimum: 0
        mutations_allowed:
          type: boolean
          description: Coarse legacy gate. `allowed_actions` is the precise contract.
        allowed_actions:
          type: array
          uniqueItems: true
          description: >-
            Node-scoped operations this server's own state admits. Each id maps
            to exactly one endpoint that exists; an unknown lifecycle advertises
            nothing rather than guessing that a mutation is safe. The
            lease-scoped ids target `provider.lease_id`. There is deliberately
            no node `logs` id - no such endpoint exists.
          items:
            type: string
            enum: [connect, terminal, reconnect, rotate_credentials, ssh_enable, ssh_disable, detach, decommission, resolve_custody, reboot, os_update_plan, os_update, re_pair]
        stack_actions:
          type: array
          uniqueItems: true
          description: >-
            StackKit-deployment operations, all routed to
            POST /api/v1/stacks/{id}/stackkit/operations. Kept separate from
            `allowed_actions`: a node operation and a kit operation have
            different blast radius and different authority.
          items:
            type: string
            enum: [plan, apply, verify, upgrade, drift_detect, drift_reconcile]
        reach:
          $ref: "#/components/schemas/GuardReach"
        security:
          $ref: "#/components/schemas/ServerSecurity"
        recovery:
          $ref: "#/components/schemas/ServerRecovery"
        updates:
          $ref: "#/components/schemas/ServerUpdates"
        capabilities:
          $ref: "#/components/schemas/ServerCapabilities"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServerSecurity:
      type: object
      description: >-
        The persisted host security posture of a server with a kombify Guard: the
        StackKits `stackkit.host-security-evidence/v1` the Guard last reported, judged
        by the control plane at read time. Never derived from the heartbeat and never
        client-side: a connected, healthy server without fresh evidence is `unknown`.
        Evidence past `expires_at`, an older StackKits CLI without the command, a
        document that could not be read and an incomplete baseline are all `unknown`
        with a `reason_code`; `unknown` is never compliant. Absent on a server without a
        Guard.
      required: [state, findings]
      properties:
        state:
          type: string
          enum: [compliant, drifted, unknown, exception_only]
        reason_code:
          type: string
          description: >-
            Why the state is unknown: not_observed, evidence_stale, incomplete_evidence,
            stackkit_cli_unsupported, stackkit_runtime_unavailable, workspace_unavailable,
            executor_unavailable, observation_failed or evidence_rejected.
        baseline_version:
          type: string
        observed_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        findings:
          type: array
          description: The controls that are not compliant. Empty while the evidence is stale.
          items: { $ref: "#/components/schemas/ServerSecurityFinding" }

    ServerSecurityFinding:
      type: object
      required: [control, state, severity, expected, observed, remediation]
      properties:
        control:
          type: string
          enum:
            - firewall.default_inbound
            - ssh.password_authentication
            - ssh.root_login
            - ssh.port
            - bruteforce.fail2ban
            - updates.unattended_upgrades
            - updates.pending_security
            - updates.reboot_required
            - kernel.sysctl
            - exposure.listeners
            - exposure.published_ports
            - tls.certificate_expiry
            - ssh.user_ca_trust
            - ssh.host_certificate
        state: { type: string, enum: [drifted, unknown, exception] }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        expected: { type: string }
        observed: { type: string }
        reason_code:
          type: string
          description: A stable code for a finding that needs a specific follow-up, for example no_authorized_key or exposed_published_port.
        remediation:
          type: object
          required: [capability]
          properties:
            capability:
              type: string
              enum: [automatic, manual, none]
              description: automatic controls can be repaired through the security repair route; manual ones need another command or the owner.
            action: { type: string }
        exception:
          type: object
          description: Present when an owner-approved exception covers the control.
          required: [owner, reason, expires_at]
          properties:
            owner: { type: string }
            reason: { type: string }
            expires_at: { type: string, format: date-time }

    ServerRecovery:
      type: object
      description: >-
        Persisted recoverability evidence. A snapshot's age never proves that a restore
        works: only a verified restore-drill receipt speaks for that.
      required: [backup, restore_drill]
      properties:
        backup:
          type: object
          required: [state, policy_max_age]
          properties:
            state: { type: string, enum: [fresh, stale, unknown] }
            reason_code:
              type: string
              description: "Why it is unknown: not_observed, observation_stale, no_receipt, clock_skew or the Guard's reason."
            last_snapshot_at: { type: string, format: date-time }
            policy_max_age:
              type: string
              description: ISO 8601 duration after which a snapshot receipt is stale.
        restore_drill:
          type: object
          required: [state, policy_max_age]
          properties:
            state: { type: string, enum: [verified, stale, unknown] }
            reason_code: { type: string }
            verified_at: { type: string, format: date-time }
            policy_max_age: { type: string, description: "ISO 8601 duration after which a verified receipt is stale." }

    ServerUpdates:
      type: object
      required: [guard, os]
      properties:
        guard:
          type: object
          required: [signed, state]
          properties:
            version: { type: string }
            signed:
              type: boolean
              description: True when the Guard's update path admits only signed releases (the privilege-split layout without an unsigned-build opt-in).
            state:
              type: string
              enum: [current, staged, trial, denied, rolled_back, layout_rolled_back, recovery_needed, unknown]
        os:
          type: object
          description: Read from the security evidence controls; a field the evidence does not state is absent.
          properties:
            pending_security_updates: { type: integer, minimum: 0 }
            reboot_required: { type: boolean }
            last_unattended_run: { type: string, format: date-time }

    ServerCapabilities:
      type: object
      description: >-
        The Guard facts the control plane persisted for the server's worker, tenant scoped.
        No token hash and no key material; `credential_generation` is the integer the
        fenced credential rotation must echo as `expected_credential_generation`. Absent on
        a server without a Guard worker.
      required: [identity_binding, credential_generation]
      properties:
        identity_binding:
          type: string
          enum: [key_bound, legacy_bearer, unknown]
          description: How the Guard last proved its identity.
        credential_generation: { type: integer, format: int64, minimum: 0 }
        identity_upgrade:
          type: object
          description: >-
            Present while the server authenticates with its bearer credential alone: it reports and updates itself but
            receives no mutating command until the owner approves its identity key.
          required: [required, code]
          properties:
            required: { type: boolean }
            code: { type: string, enum: [guard_identity_upgrade_required] }
        binding_repair:
          type: object
          description: >-
            Present while mutating commands stay refused until the owner pairs this server again.
            A Guard paired before 2026-10-17 is treated as missing its binding pin until it reports one.
          required: [required, code]
          properties:
            required: { type: boolean }
            code: { type: string, enum: [guard_binding_repair_required] }
        guard_operations:
          type: object
          description: The Guard's durable operation journal health. `durable` is true only while the journal is writable and nothing is unresolved.
          required: [contract, durable, unresolved_outcome_unknown, unacked_results, in_flight]
          properties:
            contract: { type: string }
            state: { type: string, description: "The journal state." }
            durable: { type: boolean }
            unresolved_outcome_unknown: { type: integer, minimum: 0 }
            unacked_results: { type: integer, minimum: 0 }
            in_flight: { type: integer, minimum: 0 }
            journal_bytes: { type: integer, format: int64 }
            journal_budget_bytes: { type: integer, format: int64 }
            reason: { type: string }
        guard_posture:
          type: object
          description: How the Guard is isolated and how its latest update went. A Guard that reports nothing is legacy_root, never isolated.
          required: [mode, reported, deny_mutations]
          properties:
            mode: { type: string, enum: [split, legacy_root, unavailable] }
            reported: { type: boolean }
            deny_mutations: { type: boolean }
            update_state: { type: string }
            update_version: { type: string }
            update_reason: { type: string }
            binding_pin:
              type: string
              enum: [present, absent, unreadable]
              description: Whether the Guard's root pin file holds a binding signing key. No key material.

    ServerSecurityFindingLedger:
      type: object
      required: [server_id, open, history]
      properties:
        server_id: { type: string }
        open:
          type: array
          items: { $ref: "#/components/schemas/SecurityFindingRecord" }
        history:
          type: array
          items: { $ref: "#/components/schemas/SecurityFindingRecord" }

    SecurityFindingRecord:
      type: object
      required: [id, key, scope, severity, state, expected, observed, opened_at, last_seen_at]
      properties:
        id: { type: string }
        key:
          type: string
          description: control:<control id>, recovery:backup, recovery:restore_drill, guard:update_rolled_back, guard:recovery_needed or guard:outcome_needs_operator.
        scope: { type: string, enum: [security, recovery, guard] }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        state: { type: string }
        expected: { type: string }
        observed: { type: string }
        reason_code: { type: string }
        remediation_capability: { type: string, enum: [automatic, manual, none] }
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        alerted_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    SecurityRepairRequest:
      type: object
      additionalProperties: false
      required: [controls]
      properties:
        controls:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            enum:
              - firewall.default_inbound
              - ssh.password_authentication
              - ssh.root_login
              - ssh.port
              - bruteforce.fail2ban
              - updates.unattended_upgrades
              - updates.pending_security
              - updates.reboot_required
              - kernel.sysctl
              - exposure.listeners
              - exposure.published_ports
              - tls.certificate_expiry
              - ssh.user_ca_trust
              - ssh.host_certificate

    SecurityRepair:
      type: object
      required: [id, server_id, mode, requested_by, controls, status, command_id, requested_at, expires_at]
      properties:
        id: { type: string }
        server_id: { type: string }
        mode: { type: string, enum: [operator, auto, local], description: "local is a repair the Guard ran on its own under a local policy version and reported as evidence." }
        requested_by: { type: string, description: "The authenticated operator, the owner who approved automatic repair, or `guard-local-policy:<policy_id>@v<version>`." }
        controls: { type: array, items: { type: string } }
        status:
          type: string
          enum: [queued, dispatched, succeeded, manual_required, blocked, failed, expired, outcome_unknown]
          description: >-
            blocked means StackKits refused a change that would cut the management path or lock
            the owner out; nothing was changed. outcome_unknown means no result arrived; the next
            observation says what the host looks like. The next observation is requested after
            every repair, whatever its outcome.
        reason_code: { type: string }
        command_id: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [control, status]
            properties:
              control: { type: string }
              status: { type: string, enum: [planned, applied, noop, manual, blocked, failed] }
              reason_code: { type: string }
        requested_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        dispatched_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        local:
          type: object
          description: Set only for mode local.
          properties:
            operation_id: { type: string }
            policy_id: { type: string }
            policy_version: { type: integer, format: int64 }
            generation: { type: integer, format: int64 }
            revision: { type: integer, format: int64 }
            digest: { type: string }

    SecurityAutoRepairRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        controls:
          type: array
          items:
            type: string
            enum: [bruteforce.fail2ban, firewall.default_inbound, kernel.sysctl, updates.unattended_upgrades]
        expires_at: { type: string, format: date-time }

    SecurityAutoRepair:
      type: object
      required: [server_id, enabled, active, controls, allowed_controls]
      properties:
        server_id: { type: string }
        enabled: { type: boolean }
        active: { type: boolean, description: "True while the approval is enabled and unexpired." }
        controls: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
        approved_by: { type: string }
        approved_at: { type: string, format: date-time }
        allowed_controls: { type: array, items: { type: string } }

    GuardPostureReport:
      type: object
      additionalProperties: false
      required: [schema_version, source_epoch, source_sequence, observed_at]
      properties:
        schema_version: { type: string, enum: ["kombify.guard-posture/v1"] }
        check_in: { type: boolean, description: "A check-in carries no observation." }
        source_epoch: { type: string, maxLength: 64 }
        source_sequence: { type: integer, format: int64, minimum: 0 }
        observed_at: { type: string, format: date-time }
        guard_version: { type: string, maxLength: 64 }
        guard_signed: { type: boolean }
        verify_request_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: The `verify_request_id` of the directive being answered. Set only on a report whose observation the Guard started after it received that directive; a routine observation carries none.
        security:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [observed, unsupported, unavailable, failed] }
            reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
            evidence:
              type: object
              description: The stackkit.host-security-evidence/v1 document (schemas/stackkit-host-security-evidence-v1.schema.json), at most 256 KiB.
        backup:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [observed, unsupported, unavailable, failed] }
            reason_code: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
            ready: { type: boolean }
            snapshot_state: { type: string, enum: [recorded, unverified, clock-skew] }
            last_snapshot_at: { type: string, format: date-time }
            restore_state: { type: string, enum: [recorded, unverified, clock-skew] }
            last_restore_at: { type: string, format: date-time }

    GuardPostureDirective:
      type: object
      properties:
        state: { type: string, enum: [disabled], description: "Present only where posture is off." }
        verify_requested: { type: boolean }
        verify_request_id:
          type: string
          description: Opaque token of the pending request. The Guard echoes it as `verify_request_id` in the report of the fresh observation it starts for the request; only that report answers it. A Guard that does not echo it keeps working, and its second report without the token answers the request.
        verify_interval_seconds: { type: integer, minimum: 0 }
        local_policy: { $ref: "#/components/schemas/GuardLocalRepairGrant" }

    GuardLocalRepairGrant:
      type: object
      description: >-
        The control plane's Ed25519-signed grant of the owner's current repair approval
        for this Guard (contract `guard.local-repair/v1`, signed with the worker's
        binding key the Guard pinned at pairing). Absent while no approval is active:
        the Guard then only observes. The Guard holds it in memory only and drops it on
        an answer without one. It admits a repair on its own only while the control
        plane is unreachable, for at most 15 minutes after `issued_at` (the command
        authority lifetime) and never past `policy_expires_at`, on a clock that agreed
        with `issued_at` at receipt and still continues from it; after a restart it
        only observes until a fresh online answer. The privileged executor verifies
        the signature, the operation ID and the lifetime again before it runs the
        typed StackKits host-security repair, at most once per operation.
      required: [contract_version, policy_id, policy_version, tenant_id, worker_id, generation, action, controls, release, policy_expires_at, issued_at, bounds, history, key_id, signature]
      properties:
        contract_version: { type: string, enum: ["guard.local-repair/v1"] }
        policy_id: { type: string }
        policy_version: { type: integer, format: int64, minimum: 1 }
        tenant_id: { type: string }
        worker_id: { type: string }
        server_id: { type: string }
        generation: { type: integer, format: int64, minimum: 1 }
        action: { type: string, enum: [stackkit.host-security-repair] }
        controls:
          type: array
          items:
            type: string
            enum: [bruteforce.fail2ban, firewall.default_inbound, kernel.sysctl, updates.unattended_upgrades]
        release:
          type: object
          required: [version, platform_os, platform_arch, archive_sha256, release_index_sha256]
          properties:
            version: { type: string }
            platform_os: { type: string }
            platform_arch: { type: string }
            archive_sha256: { type: string }
            release_index_sha256: { type: string }
        policy_expires_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        bounds:
          type: object
          required: [cooldown_seconds, max_attempts_per_day, breaker_failures, breaker_open_seconds]
          properties:
            cooldown_seconds: { type: integer, format: int64 }
            max_attempts_per_day: { type: integer }
            breaker_failures: { type: integer }
            breaker_open_seconds: { type: integer, format: int64 }
        history:
          type: array
          maxItems: 64
          description: The server's most recent repairs, which the Guard counts toward the bounds together with its own unreported local repairs.
          items:
            type: object
            required: [controls, requested_at]
            properties:
              operation_id: { type: string }
              controls: { type: array, items: { type: string } }
              requested_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
              failed: { type: boolean }
        key_id: { type: string }
        signature: { type: string }

    GuardLocalOperationEvidence:
      type: object
      description: >-
        Evidence of one repair a Guard ran on its own under a local policy version. The
        operation ID is Guard-generated and names the policy version
        (`local:<policy_id>:v<version>:<nonce>`). Each revision is immutable; `report.digest`
        covers every other field. A first revision is `terminal` or `outcome_unknown`; a
        later revision only resolves an `outcome_unknown` and names the digest it
        supersedes.
      required: [operation_id, tenant_id, worker_id, generation, policy_id, policy_version, policy_expires_at, action, controls, started_at, report]
      properties:
        operation_id: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
        tenant_id: { type: string }
        worker_id: { type: string }
        generation: { type: integer, format: int64, minimum: 1 }
        policy_id: { type: string }
        policy_version: { type: integer, format: int64, minimum: 1 }
        policy_expires_at: { type: string, format: date-time }
        action: { type: string, enum: [stackkit.host-security-repair] }
        controls: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
        report:
          type: object
          required: [revision, state, digest]
          properties:
            revision: { type: integer, format: int64, minimum: 1 }
            state: { type: string, enum: [terminal, outcome_unknown, resolved] }
            digest: { type: string }
            prior_digest: { type: string }
            reason: { type: string, maxLength: 512 }
            resolution: { type: string, enum: [observed_converged, not_applied, operator_escalation] }
            truncated: { type: boolean }
        outcome: { type: string, pattern: "^[a-z0-9_]{1,64}$", description: "The stackkit.host-security-repair/v1 outcome of a terminal report." }
        steps:
          type: array
          items:
            type: object
            required: [control, status]
            properties:
              control: { type: string }
              status: { type: string }
              reason_code: { type: string }

    GuardLocalOperationAcknowledgement:
      type: object
      required: [command_id, revision, digest, accepted, acknowledged]
      properties:
        command_id: { type: string, description: "The operation ID of the acknowledged evidence." }
        revision: { type: integer, format: int64 }
        digest: { type: string }
        accepted: { type: boolean }
        acknowledged: { type: boolean }
        duplicate: { type: boolean, description: "True when an identical revision had already been recorded." }

    GuardTelemetryBatch:
      type: object
      additionalProperties: false
      required: [schema_version, source_epoch, records]
      properties:
        schema_version: { type: string, enum: ["kombify.guard-telemetry/v1"] }
        source_epoch: { type: string, maxLength: 64 }
        records:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [sequence, at]
            properties:
              sequence: { type: integer, format: int64, minimum: 1 }
              at: { type: string, format: date-time }
              samples:
                type: array
                maxItems: 600
                items:
                  type: object
                  additionalProperties: false
                  required: [name, value]
                  properties:
                    name:
                      type: string
                      description: A metric of the telemetry contract; anything else is dropped and counted.
                    value: { type: number }
                    labels:
                      type: object
                      additionalProperties: { type: string, maxLength: 128 }
                      description: Only core, mount, container_name and origin, each with a bounded value.
              gap:
                type: object
                additionalProperties: false
                required: [from, to, from_sequence, to_sequence, reason]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  from_sequence: { type: integer, format: int64 }
                  to_sequence: { type: integer, format: int64 }
                  reason: { type: string, enum: [spool_budget, rejected] }

    GuardTelemetryAck:
      type: object
      properties:
        state: { type: string, enum: [disabled] }
        acked_sequence: { type: integer, format: int64, description: "Every record up to this sequence is stored." }
        accepted: { type: integer, minimum: 0 }
        dropped: { type: integer, minimum: 0, description: "Samples outside the telemetry contract." }

    NetworkPoint:
      type: object
      description: One network position of a server. Every field is optional; a Guard reports what its host can observe.
      properties:
        ip: { type: string, description: The server's private address. }
        gateway: { type: string, description: The default IPv4 gateway. }
        cidr: { type: string, description: The subnet of the server's address. }
        ssid: { type: string, description: The connected WiFi network. }
        interface: { type: string }
        wireless: { type: boolean }
        fingerprint: { type: string, description: "Stable identity of the network (gateway, subnet and SSID)." }

    ServerNetwork:
      type: object
      required: [server_id, current, can_rebind, connection_state]
      properties:
        server_id: { type: string }
        current:
          $ref: "#/components/schemas/NetworkPoint"
        network_move:
          type: object
          description: Recorded once when the server turned up on a different network.
          required: [detected_at, previous, current, rebind_status]
          properties:
            detected_at: { type: string, format: date-time }
            previous: { $ref: "#/components/schemas/NetworkPoint" }
            current: { $ref: "#/components/schemas/NetworkPoint" }
            rebind_status: { type: string, enum: [queued, running, succeeded, failed] }
        rebind:
          type: object
          description: The latest re-bind attempt, automatic or requested by the owner.
          properties:
            status: { type: string, enum: [queued, running, succeeded, failed] }
            trigger: { type: string, enum: [auto, manual] }
            job_id: { type: string }
            requested_at: { type: string, format: date-time }
            reason: { type: string, description: Why a re-bind could not be queued. }
        can_rebind: { type: boolean }
        connection_state: { type: string }
        observed_at: { type: string, format: date-time }
        guidance:
          type: array
          items: { type: string }
          description: Message ids of owner guidance, for example `offline_move_hint`.

    ServerNetworkRebind:
      type: object
      required: [server_id, job_id, status]
      properties:
        server_id: { type: string }
        job_id: { type: string }
        status: { type: string, enum: [queued, running] }

    GuardReach:
      type: object
      description: >-
        kombify Guard reach, persisted and never derived client-side: whether the
        server's kombify.me address answers through the Guard relay and whether the
        server is listed as a Connect resource. `ready` is shown as "Reachable and
        governed". A reach failure never blocks Guard enrollment or execution and
        never changes the server lifecycle. Absent on deployments without a Cloud
        connection.
      required: [state, kombify_me, connect, updated_at]
      properties:
        state:
          type: string
          enum: [not_enrolled, pending, failed, ready, revoked, not_enabled]
          description: >-
            pending is reach_pending, failed is reach_failed (see the reason codes of the two targets). not_enabled is
            a server the owner has not published at a kombify.me address (the default): no route exists and nothing is served.
        generation:
          type: integer
          format: int64
          description: Binding generation, raised when the Guard key or pairing changes.
        public:
          type: object
          description: The owner's publication choice; nothing is published until it is enabled with a service and a port.
          required: [enabled]
          properties:
            enabled: { type: boolean }
            service: { type: string, description: The route label the owner chose. }
            scheme: { type: string, enum: [http, https] }
            target_port: { type: integer, minimum: 1, maximum: 65535, description: The port of the service on the Guard host's loopback. }
            enabled_by: { type: string }
            enabled_at: { type: string, format: date-time }
        kombify_me:
          $ref: "#/components/schemas/GuardReachTarget"
        connect:
          $ref: "#/components/schemas/GuardReachTarget"
        relay:
          type: object
          description: The Guard's own report of its relay connection.
          required: [state]
          properties:
            state:
              type: string
              enum: [connecting, connected, denied, stopped]
            reason_code:
              type: string
            reported_at:
              type: string
              format: date-time
        updated_at:
          type: string
          format: date-time

    GuardReachTarget:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, registered, failed, revoked, not_enabled]
        address:
          type: string
          description: kombify.me address (kombify_me target, registered only).
        node_id:
          type: string
          description: Connect techstack-node id (connect target, registered only).
        reason_code:
          type: string
          description: Stable structured reason for a pending or failed target.

    ServerAvailability:
      type: object
      required: [server_id, class, source, observed_class, uptime_ratio, observed_seconds, window_days, confirmed]
      properties:
        server_id: { type: string }
        class:
          type: string
          enum: [always-on, part-time, unknown]
          description: The class the Layout Planner reads - the owner's confirmation when there is one, otherwise the observed class.
        source: { type: string, enum: [user-confirmed, server-transitions, none] }
        observed_class:
          type: string
          enum: [always-on, part-time, unknown]
          description: What the connection history alone supports over the window.
        uptime_ratio:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Share of the observed time the server was connected; null when the window holds no observed time.
        observed_seconds: { type: integer, minimum: 0 }
        window_days: { type: integer }
        confirmed: { type: boolean }
        confirmed_at: { type: string, format: date-time }

    ServerAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [class]
      properties:
        class:
          type: [string, "null"]
          enum: [always-on, part-time, unknown, null]
          description: always-on or part-time confirms; unknown or null withdraws the confirmation.

    GuardPublicReachRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        service:
          type: string
          pattern: "^[a-z]([a-z0-9-]{0,12}[a-z0-9])?$"
          description: Required when enabling. The route label; the kombify.me route is <base>-<service>-<server suffix>.
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Required when enabling. The port the service listens on, on the Guard host's loopback (the host is fixed).
        target_scheme: { type: string, enum: [http, https], default: http }

    GuardIdentityUpgrade:
      type: object
      required: [worker_id, identity_binding]
      properties:
        worker_id: { type: string }
        identity_binding: { type: string, enum: [legacy_bearer, host_key] }
        code: { type: string, enum: [guard_identity_upgrade_required] }
        pending:
          type: object
          required: [key_thumbprint, requested_at, expires_at]
          properties:
            key_thumbprint: { type: string }
            requested_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
        approved_by: { type: string }
        approved_at: { type: string, format: date-time }
        hostname: { type: string, description: Set only by the list of pending upgrades }

    GuardUnresolvedOutcomeList:
      type: object
      required: [worker_id, outcomes]
      properties:
        worker_id: { type: string }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/GuardUnresolvedOutcome" }

    GuardUnresolvedOutcome:
      type: object
      required: [command_id, operation, state, revision, escalated, unresolved_since, needs_operator_at]
      properties:
        command_id: { type: string }
        operation: { type: string }
        state: { type: string, enum: [reconciling, needs_operator] }
        revision:
          type: integer
          format: int64
          description: The committed revision an operator resolution must supersede.
        reason: { type: string }
        escalated: { type: boolean }
        unresolved_since: { type: string, format: date-time }
        needs_operator_at: { type: string, format: date-time }

    GuardOutcomeResolutionRequest:
      type: object
      additionalProperties: false
      required: [disposition, expected_revision, note]
      properties:
        disposition: { type: string, enum: [verified_applied, verified_not_applied, accept_unknown] }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        note: { type: string, minLength: 1, maxLength: 400 }

    GuardOutcomeResolution:
      type: object
      required: [command_id, revision, disposition, actor, fence_released]
      properties:
        command_id: { type: string }
        revision: { type: integer, format: int64 }
        disposition: { type: string }
        actor: { type: string }
        fence_released: { type: boolean }

    ServerMaintenanceImpact:
      type: object
      required: [server_id, action, inventory_revision, snapshot_digest, inventory, services, stacks, confirmable]
      properties:
        server_id: { type: string }
        action: { type: string, enum: [os_update, reboot] }
        inventory_revision: { type: integer, format: int64 }
        snapshot_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        confirmable: { type: boolean }
        inventory:
          type: object
          required: [status, reason_codes]
          properties:
            status: { type: string, enum: [current, stale, incomplete, unavailable] }
            observed_at: { type: string, format: date-time }
            reason_codes: { type: array, items: { type: string } }
        services:
          type: array
          items:
            type: object
            required: [id, name, state, locked, reason_codes]
            properties:
              id: { type: string }
              name: { type: string }
              stack_id: { type: string }
              state: { type: string }
              locked: { type: boolean }
              reason_codes: { type: array, items: { type: string } }
        stacks:
          type: array
          items:
            type: object
            required: [id, name, reason_codes]
            properties:
              id: { type: string }
              name: { type: string }
              reason_codes: { type: array, items: { type: string } }

    ServerMaintenanceRequest:
      type: object
      additionalProperties: false
      required: [action, expected_inventory_revision]
      properties:
        action:
          type: string
          enum: [os_update_plan, os_update, reboot]
        expected_inventory_revision:
          type: integer
          format: int64
          minimum: 1
        owner_approved:
          type: boolean
          description: Optional legacy field; it does not grant maintenance authority.
        expected_plan_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            os_update only: the plan_digest of a completed os_update_plan for
            this server that is at most 15 minutes old.
        expected_impact_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: >-
            Required for os_update and reboot, forbidden for os_update_plan.
            snapshot_digest of the current impact preview confirmed for this
            exact server and action. Changing it under an existing Idempotency-Key
            is a conflict; a renewed confirmation uses a new key.

    ServerMaintenanceResponse:
      type: object
      required: [job_id, server_id, action, status]
      properties:
        job_id: { type: string }
        server_id: { type: string }
        action: { type: string, enum: [os_update_plan, os_update, reboot] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }

    ServerMaintenanceJob:
      type: object
      required: [job_id, server_id, action, state, status, result, created_at, updated_at]
      properties:
        job_id: { type: string }
        server_id: { type: string }
        action: { type: string, enum: [os_update_plan, os_update, reboot] }
        state:
          type: string
          enum: [queued, running, waiting, awaiting_node_return, completed, failed, cancelled]
          description: >-
            Ledger state. A reboot waiting for its node to come back is the
            state `awaiting_node_return` (never `waiting`). `waiting` is only
            an OS update whose install unit outlived the CLI's wait
            (`reason_code` apply_still_running); it is polled until it
            completes or fails.
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
          description: Coarse status of the POST receipt; waiting and awaiting_node_return report running.
        reason_code:
          type: string
          description: >-
            Stable code of the last transition, for example node_returned,
            apply_still_running, apply_finished_after_wait, or the failure code
            (apply_partial when the install unit ended with packages of the
            approved plan still at their approved starting versions; the
            result then lists them in `not_installed`).
        plan_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        impact_snapshot_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        failure:
          type: object
          description: Present when state is failed or cancelled.
          required: [code, retryable, user_guidance]
          properties:
            code:
              type: string
              description: >-
                Runner reasons (node_did_not_return, reboot_abandoned,
                deadline_exceeded, server_removed, dispatch_failed,
                dispatch_interrupted for a command no agent received,
                apply_partial) or the
                stackkit.host-maintenance/v1 refusal and failure codes; a host
                code that is not a bounded snake_case token is
                host_command_failed.
            retryable: { type: boolean }
            user_guidance:
              type: object
              required: [title, body, next_steps]
              properties:
                title: { type: string }
                body: { type: string }
                next_steps: { type: array, items: { type: string } }
        result:
          $ref: "#/components/schemas/ServerMaintenanceResult"
        reboot:
          type: object
          description: Reboot jobs, once the node acknowledged the reboot.
          required: [boot_id_changed]
          properties:
            scheduled_at: { type: string, format: date-time }
            return_deadline:
              type: string
              format: date-time
              description: Present while awaiting_node_return.
            boot_id_changed:
              type: boolean
              description: The node reports a boot id other than the one before the reboot.
        deadline_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    ServerMaintenanceResult:
      type: object
      description: >-
        Plan fields for os_update_plan, apply fields for os_update, empty for
        reboot. Lists are bounded: at most 200 packages (packages_truncated
        says whether the list was cut; the counts stay exact), 50 held names
        and 20 dpkg problems, each string at most 256 characters.
      properties:
        plan_digest: { type: string }
        pending_count: { type: integer, minimum: 0 }
        security_count: { type: integer, minimum: 0 }
        reboot_likely: { type: boolean }
        hold_scope: { type: string }
        held: { type: array, maxItems: 50, items: { type: string } }
        dpkg_problems: { type: array, maxItems: 20, items: { type: string } }
        packages:
          type: array
          maxItems: 200
          items:
            type: object
            required: [name, from, to, security]
            properties:
              name: { type: string }
              from: { type: string }
              to: { type: string }
              security: { type: boolean }
        packages_truncated: { type: boolean }
        outcome: { type: string, enum: [applied, noop, failed, running, partial] }
        reboot_required: { type: boolean }
        unit: { type: string }
        changed: { type: integer, minimum: 0 }
        remaining_pending_count: { type: integer, minimum: 0 }
        plan_digest_after: { type: string }
        not_installed:
          type: array
          maxItems: 50
          description: apply_partial only; approved packages still at their approved starting versions.
          items: { type: string }

    SelfOwnedServerDetachRequest:
      type: object
      additionalProperties: false
      required: [confirm_server_id]
      properties:
        confirm_server_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Must exactly equal the serverId path parameter.

    SelfOwnedServerDetachReceipt:
      type: object
      required: [server_id, agent_id, revision, generation, detached_at, replay]
      properties:
        server_id:
          type: string
        agent_id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        generation:
          type: integer
          format: int64
          minimum: 1
        detached_at:
          type: string
          format: date-time
        replay:
          type: boolean
        wallet_withdrawal:
          type: object
          description: >-
            Present when a kombify Wallet is configured. For the items Techstack delivered to the server,
            the Wallet drops its node from their host targets and marks those it holds as needing rotation.
            A failure never undoes the detach; detaching again retries it.
          required: [state, targets_removed, items_need_rotation]
          properties:
            state: { type: string, enum: [recorded, failed] }
            targets_removed: { type: integer, minimum: 0 }
            items_need_rotation: { type: integer, minimum: 0 }
            reason_code: { type: string }
            retryable: { type: boolean }

    RegistryServices:
      type: object
      required: [catalog, kit_deployments, servers, services, migration_available]
      properties:
        catalog:
          type: array
          items:
            type: object
            required: [id, display_name, type, description, required, recommended, foundations, icon_url]
            properties:
              id: { type: string }
              display_name: { type: string }
              type: { type: string }
              description: { type: string }
              required: { type: boolean }
              recommended: { type: boolean }
              foundations: { type: array, items: { type: string } }
              icon_url: { type: string, format: uri }
        kit_deployments: { type: array, items: { type: object } }
        servers: { type: array, items: { type: object } }
        services:
          type: array
          items:
            $ref: "#/components/schemas/RegistryService"
        migration_available: { type: boolean }
        migration_unavailable_reason: { type: string }

    RegistryService:
      type: object
      required: [id, name, display_name, kit_deployment_id, server_id, allowed_actions, inventory_revision, desired_state, observed_state, version, catalog, mutation_lock]
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        application_key: { type: string }
        application_name: { type: string }
        type: { type: string }
        status: { type: string }
        health_state: { type: string }
        observed_at: { type: string, format: date-time }
        management_state: { type: string, enum: [managed, observed] }
        kit_deployment_id: { type: string }
        stack_name: { type: string }
        server_id: { type: string, description: "Canonical server id, or empty when placement is unknown." }
        server_name: { type: string }
        environment_class: { type: string }
        port: { type: integer }
        url: { type: string }
        allowed_actions:
          $ref: "#/components/schemas/ServiceRuntime/properties/allowed_actions"
        inventory_revision: { type: integer, format: int64 }
        desired_state: { type: string }
        observed_state: { type: string }
        version:
          oneOf:
            - $ref: "#/components/schemas/ServiceRuntime/properties/version"
            - type: "null"
        catalog:
          $ref: "#/components/schemas/ServiceRuntime/properties/catalog"
        mutation_lock:
          $ref: "#/components/schemas/ServiceRuntime/properties/mutation_lock"
        provenance:
          $ref: "#/components/schemas/ServiceRuntime/properties/provenance"
        action_guard:
          $ref: "#/components/schemas/ServiceRuntime/properties/action_guard"

    ServiceRuntime:
      type: object
      required: [id, stack_id, server_id, service_key, service_instance, name, desired_state, observed_state, health, access, allowed_actions, mutation_lock, source, provenance, created_at, updated_at]
      properties:
        adoption:
          type: object
          properties:
            preview_available: { type: boolean }
            execution_available: { type: boolean }
            release_available: { type: boolean }
            profile_ref: { type: string }
            reason_code: { type: string }
        id:
          type: string
        stack_id:
          type: string
        server_id:
          type: string
        service_key:
          type: string
        service_instance:
          type: string
        name:
          type: string
        desired_state:
          type: string
          enum: [running, stopped]
        observed_state:
          type: string
          enum: [unknown, starting, running, stopped, failed]
        health:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [unknown, healthy, degraded, unhealthy, starting]
            observed_at:
              type: string
              format: date-time
            reason_code:
              type: string
        stackkit_version:
          type: string
        access:
          $ref: "#/components/schemas/ServiceAccess"
        allowed_actions:
          type: array
          uniqueItems: true
          description: >-
            Exactly what the action endpoint accepts for this service right now.
            A locked service advertises only its read path plus `unfreeze`; the
            suppressed mutations are explained by `mutation_lock`.
          items:
            type: string
            enum: [start, stop, restart, logs, update, adopt, freeze, unfreeze]
        catalog:
          type: object
          description: Recognized application facts, or category unknown with the generic Kombify icon.
          required: [id, display_name, category, icon_url]
          properties:
            id: { type: string }
            display_name: { type: string }
            category: { type: string }
            icon_url: { type: string, format: uri, description: Kombify-hosted PNG logo or generic service icon. }
            brand_domain: { type: string }
            web_port: { type: integer }
        version:
          type: object
          description: >-
            Running version and update fact. Omitted when nothing was measured;
            `latest` is only set after a real registry or release-pin comparison.
          required: [update_available, update_mode]
          properties:
            current: { type: string }
            source: { type: string, enum: [image_tag, image_label, stackkit] }
            image: { type: string }
            latest: { type: string }
            update_available: { type: boolean }
            checked_at: { type: string, format: date-time }
            update_mode: { type: string, enum: [stackkit_upgrade, adopt_required, unavailable] }
            reason_code: { type: string }
        placement_class:
          type: string
          enum: [local, cloud, managed, unknown]
          description: Evidence-backed class from the server's recorded runtime target.
        mutation_lock:
          $ref: "#/components/schemas/ServiceMutationLock"
        inventory_revision:
          type: integer
          format: int64
          minimum: 0
        evidence_ref:
          type: string
          description: Protected StackKits evidence reference; never inline secret material.
        source:
          type: string
        provenance:
          type: object
          additionalProperties: true
          description: >-
            Declared components with control_scope=application dispatch their
            start, stop, restart and logs through declared_control_service_key
            for the entire control application. Their immutable service id
            remains the job and observation identity. Superseded observed
            history exposes superseded_by_service_id and remains inspectable.
        action_guard:
          type: object
          description: A group guardrail does not change this service's own mutation_lock or grant it another service's unfreeze action.
          properties:
            reason_code: { type: string, enum: [application_control_locked] }
            unlock_required_action: { type: string, enum: [unfreeze] }
            unlock_service_ids:
              type: array
              items: { type: string }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationConnectorAction:
      type: object
      required: [job_id, service_id, action, status]
      properties:
        job_id: { type: string }
        service_id: { type: string }
        action: { type: string, enum: [application_connector, application_connector_verify] }
        status: { type: string, enum: [queued, running, waiting, completed, failed, canceled] }
    ApplicationConnectorRequest:
      type: object
      additionalProperties: false
      required: [expected_inventory_revision, action, lifespan_days, owner_approved]
      properties:
        expected_inventory_revision: { type: integer, format: int64, minimum: 1 }
        action: { type: string, enum: [ensure, revoke] }
        lifespan_days: { type: integer, minimum: 1, maximum: 365 }
        owner_approved: { type: boolean, enum: [true] }
    ApplicationConnectorStatus:
      type: object
      required: [service_id, source_preview, dispatchable, reason_code]
      properties:
        service_id: { type: string }
        source_preview: { type: boolean }
        dispatchable: { type: boolean }
        reason_code: { type: string }
        connector:
          type: object
          nullable: true
          description: Secret-free projection of node verified receipt status; contains no token, secret reference or Owner key.
          additionalProperties: true
    ApplicationAdoptionRequest:
      type: object
      additionalProperties: false
      required: [expected_inventory_revision]
      properties:
        expected_inventory_revision: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [adopt_in_place] }
        plan_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        owner_approved: { type: boolean, default: false }
    ApplicationAdoptionPlan:
      type: object
      required: [plan_id, service_id, status]
      properties:
        plan_id: { type: string }
        service_id: { type: string }
        status: { type: string }
        assessment:
          type: object
          description: Exact producer stackkit.application-adoption-plan/v1 assessment; never contains credentials.
          additionalProperties: true
        source_binding:
          type: object
          description: Tenant and source-bound retained dispatch authority.
          additionalProperties: true
        error: { type: string }
    ServiceActionRequest:
      description: >-
        Either an agent-executed runtime action bound to a fresh inventory
        revision, or an owner lock action executed entirely in the control
        plane. The lock is not bound to an inventory observation: an owner must
        be able to freeze a service whose agent is unreachable.
      oneOf:
        - $ref: "#/components/schemas/ServiceRuntimeActionRequest"
        - $ref: "#/components/schemas/ServiceLockActionRequest"

    ServiceRuntimeActionRequest:
      type: object
      additionalProperties: false
      required: [action, expected_inventory_revision, owner_approved]
      properties:
        action:
          type: string
          description: >-
            `update` runs the StackKit upgrade of the owning stack to the pinned
            release; it is accepted only while `allowed_actions` advertises it.
          enum: [start, stop, restart, logs, update]
        expected_inventory_revision:
          type: integer
          format: int64
          minimum: 1
        owner_approved:
          type: boolean
          description: Required true for start, stop and restart; logs is read-only.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: Logs only; defaults to 100.
        cursor:
          type: string
          maxLength: 2048
          description: Logs only; opaque StackKits cursor from the prior page.

    ServiceLockActionRequest:
      type: object
      additionalProperties: false
      required: [action, owner_approved]
      description: >-
        Asserts or clears the owner mutation lock. Applied synchronously by the
        control plane, so the response carries no job id and reports status
        `completed`. Repeating the same lock state is a no-op.
      properties:
        action:
          type: string
          enum: [freeze, unfreeze]
        owner_approved:
          type: boolean
          description: Required true; changing a guardrail is an owner decision.

    ServiceActionResponse:
      type: object
      required: [job_id, service_id, action, status]
      properties:
        job_id:
          type: string
          description: >-
            Durable job of an agent-executed action. Empty for freeze and
            unfreeze, which the control plane applies without a job.
        service_id: { type: string }
        action: { type: string, enum: [start, stop, restart, logs, update, freeze, unfreeze] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled, canceled] }

    AvailabilityReport:
      type: object
      required: [window, start, end, uptime_ratio, observed_seconds, down_seconds, servers, accounting]
      properties:
        window: { type: string, enum: [24h, 7d, 30d, 90d] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        uptime_ratio:
          type: [number, "null"]
          description: >-
            up / (up + down) over observed time only. Null when the window
            contains no observed time - "no evidence" and "zero percent" are
            different statements.
        observed_seconds: { type: integer, format: int64 }
        down_seconds: { type: integer, format: int64 }
        mttr_seconds:
          type: [integer, "null"]
          format: int64
          description: Mean duration of episodes that ended. An ongoing outage never shortens it.
        closed_episodes: { type: integer }
        by_cause:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityCause" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityServer" }
        accounting: { $ref: "#/components/schemas/AvailabilityAccounting" }

    AvailabilityAccounting:
      type: object
      required: [up, down, unobserved]
      description: >-
        How each connection state was counted. `stale` is downtime: the agent
        stopped reporting, so service cannot be confirmed, and the conservative
        reading is the honest one for an availability figure. `pending` and
        `connecting` leave the denominator entirely - a node that never
        connected is not having an outage.
      properties:
        up: { type: array, items: { type: string } }
        down: { type: array, items: { type: string } }
        unobserved: { type: array, items: { type: string } }

    AvailabilityCause:
      type: object
      required: [reason_code, seconds, episodes]
      properties:
        reason_code:
          type: string
          description: The reason the opening transition recorded, or `unrecorded`.
        seconds: { type: integer, format: int64 }
        episodes: { type: integer }

    AvailabilityServer:
      type: object
      required: [server_id, uptime_ratio, observed_seconds, down_seconds, episodes, days]
      properties:
        server_id: { type: string }
        name: { type: string }
        uptime_ratio: { type: [number, "null"] }
        observed_seconds: { type: integer, format: int64 }
        down_seconds: { type: integer, format: int64 }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityEpisode" }
        days:
          type: array
          items:
            type: object
            required: [day, state]
            properties:
              day: { type: string, format: date }
              state:
                type: string
                description: Worst state observed that UTC day; empty means no observation.

    AvailabilityEpisode:
      type: object
      required: [server_id, started_at, seconds, ongoing, state]
      properties:
        server_id: { type: string }
        server_name: { type: string }
        started_at: { type: string, format: date-time }
        ended_at:
          type: string
          format: date-time
          description: Absent while the outage is ongoing; never backfilled from the window edge.
        seconds: { type: integer, format: int64 }
        ongoing: { type: boolean }
        state: { type: string, description: Worst connection state the episode reached. }
        trigger_reason: { type: string }
        trigger_source: { type: string }
        recovery_reason: { type: string }
        recovery_source: { type: string }
        evidence_ref: { type: string }

    ServiceMutationLock:
      type: object
      required: [state]
      description: >-
        Owner guardrail of one service. Orthogonal to the measured dimensions: a
        locked service keeps running and keeps reporting its real observed
        state; only `allowed_actions` narrows. `reason_code` and `actor` are
        populated only while locked.
      properties:
        state: { type: string, enum: [unlocked, locked] }
        reason_code: { type: string, maxLength: 128 }
        actor: { type: string, maxLength: 256 }
        changed_at: { type: string, format: date-time }

    ServiceLogEntry:
      type: object
      required: [timestamp, message]
      properties:
        timestamp: { type: string, format: date-time }
        message: { type: string, maxLength: 16384 }

    ServiceLogsResponse:
      type: object
      required: [service_id, status, entries]
      properties:
        service_id: { type: string }
        job_id: { type: string }
        status: { type: string, enum: [queued, running, completed, empty] }
        entries:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ServiceLogEntry" }
        next_cursor: { type: string, maxLength: 2048 }

    ServiceAccess:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [direct, relay, unavailable]
        url:
          type: string
          format: uri
        access_profile_ref:
          type: string
        reason_code:
          type: string
        route_id:
          type: string
          description: Registered owner-isolated kombify.me tunnel route; never an arbitrary target address.

    # ---- Response Envelopes ----
    ClientPairingEnvelope:
      type: object
      additionalProperties: false
      required: [version, endpoint, instance_id, tls_fingerprint_sha256, one_time_code, issued_at, expires_at]
      properties:
        version:
          type: string
          const: "1"
        endpoint:
          type: string
          format: uri
          pattern: ^https://
        instance_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{2,127}$
        tls_fingerprint_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        one_time_code:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,256}$
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ClientPairingRedeemRequest:
      type: object
      additionalProperties: false
      required: [version, instance_id, tls_fingerprint_sha256, one_time_code]
      properties:
        version:
          type: string
          const: "1"
        instance_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{2,127}$
        tls_fingerprint_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        one_time_code:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,256}$

    ClientPairingRedeemResponse:
      type: object
      additionalProperties: false
      required: [version, status, instance_id, workspace_id, account_handoff]
      properties:
        version:
          type: string
          const: "1"
        status:
          type: string
          const: redeemed
        instance_id:
          type: string
        workspace_id:
          type: string
        account_handoff:
          type: object
          additionalProperties: false
          required: [kind, issuer, client_id, scopes, flow]
          properties:
            kind:
              type: string
              const: oidc
            issuer:
              type: string
              format: uri
            client_id:
              type: string
            audience:
              type: string
            scopes:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
            flow:
              type: string
              enum: [authorization_code_pkce, device_authorization]

    StructuredUserGuidance:
      type: object
      additionalProperties: false
      required: [title, body, next_steps]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 2000
        next_steps:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 500

    StructuredError:
      type: object
      additionalProperties: false
      required: [error_code, reason_code, retryable, user_guidance]
      properties:
        error_code:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        reason_code:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
        retryable:
          type: boolean
        user_guidance:
          $ref: "#/components/schemas/StructuredUserGuidance"

    SuccessEnvelope:
      type: object
      properties:
        data:
          description: Response payload
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INTERNAL_ERROR
                - NOT_FOUND
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - CONFLICT
                - VALIDATION_ERROR
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - METHOD_NOT_ALLOWED
            message:
              type: string
            details:
              description: Additional error context (validation errors, etc.)

    ResponseMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        managed_runtime_inventory_complete:
          type: boolean
          description: True only when the managed RuntimeLease authority was configured and read successfully for this inventory response.
        worker_inventory_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stable digest of the complete worker identity, attachment, freshness, and managed RuntimeLease authority snapshot used for pagination.
        managed_runtime_active_lease_ids:
          type: array
          items:
            type: string
          description: Canonically sorted IDs of visible managed RuntimeLeases classified as active for inventory and cleanup. This visibility projection is not capacity reservation or release authority.
        managed_runtime_inactive_lease_ids:
          type: array
          items:
            type: string
          description: Canonically sorted IDs of visible managed RuntimeLeases classified as cancelled or archived for inventory and cleanup. Inactive state does not prove provider absence or release managed-server capacity.
        managed_runtime_lease_generation_digests:
          type: array
          items:
            type: object
            required: [lease_id, resource_generation_digest]
            properties:
              lease_id:
                type: string
              resource_generation_digest:
                type: string
                pattern: '^[0-9a-f]{64}$'
          description: Canonically sorted opaque bindings from each visible managed RuntimeLease ID to its exact provider-resource generation. Missing coverage makes destructive inventory proof invalid while leaving ordinary dashboard inventory readable.
        managed_runtime_duplicate_lease_ids:
          type: array
          items:
            type: string
          description: Managed RuntimeLease IDs represented by multiple persisted worker rows before UI projection deduplication; must be empty for destructive inventory proof.
        managed_runtime_attachment_conflict_lease_ids:
          type: array
          items:
            type: string
          description: Canonically sorted caller-visible managed RuntimeLease IDs with a conflicting tenant-wide worker attachment; must be empty for destructive inventory proof and never exposes foreign private lease or worker details.

    WorkerConnectRequest:
      type: object
      properties:
        server_id:
          type: string
        runtime_agent_id:
          type: string
        stack_id:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        mode:
          type: string
          example: advanced
        connection_mode:
          type: string
          enum: [install-command, ssh, managed, tunnel]
        provider:
          type: string

    WorkerEnrollmentResponse:
      type: object
      required: [worker_id, server_id, runtime_agent_id, accepted, credential_generation]
      properties:
        worker_id:
          type: string
        server_id:
          type: string
        runtime_agent_id:
          type: string
        accepted:
          type: boolean
        agent_token:
          type: string
          description: Stateful opaque bearer returned only for the exact enrollment/rotation attempt. Never log or expose outside the install handoff.
        credential_generation:
          type: integer
          format: int64
          minimum: 0
          description: Monotonically increasing runtime-agent credential generation; new Connect credentials start at 1.
        heartbeat_url:
          type: string
        inventory_url:
          type: string
        identity_token_url:
          type: string
          description: Host-identity token exchange endpoint (kombify Guard).
        identity_bind_url:
          type: string
        identity_rotate_url:
          type: string
        identity:
          type: object
          description: Present when the registration bound a host key.
          additionalProperties: true
        channel_bootstrap:
          type: object
          additionalProperties: true

    WorkerCredentialRotateRequest:
      type: object
      required: [expected_credential_generation]
      properties:
        expected_credential_generation:
          type: integer
          format: int64
          minimum: 0
          description: Exact active generation that this request is authorized to replace.

    WorkerHeartbeatRequest:
      type: object
      properties:
        cpu_percent:
          type: number
        memory_used_bytes:
          type: integer
        memory_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
        disk_total_bytes:
          type: integer
        uptime_seconds:
          type: number
        runtime_convergence:
          $ref: "#/components/schemas/RuntimeConvergence"

    RuntimeConvergence:
      type: object
      required: [state, observed_at, components]
      properties:
        state:
          type: string
          enum: [pending, ready, degraded]
          description: Provider-neutral convergence state of the enrolled runtime packages.
        observed_at:
          type: string
          format: date-time
          description: UTC time at which the agent last evaluated runtime convergence.
        error_code:
          type: string
          enum: [runtime_convergence_incomplete]
          description: Stable aggregate code; raw executor errors are never sent.
        components:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeConvergenceComponent"

    RuntimeConvergenceComponent:
      type: object
      required: [name, state, observed_at]
      properties:
        name:
          type: string
          description: Provider-neutral runtime component identifier.
        state:
          type: string
          enum: [pending, ready, failed]
        observed_at:
          type: string
          format: date-time
        error_code:
          type: string
          enum: [techstack_runtime_unavailable, stackkits_runtime_unavailable, agent_restart_required]
          description: Stable component code; raw executor errors are never sent.

    WorkerInventoryRequest:
      type: object
      required: [source_epoch, source_sequence, observed_at, server_id, runtime_agent_id]
      properties:
        source_epoch:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable Guard boot/session epoch used with source_sequence for replay fencing.
        source_sequence:
          type: integer
          format: int64
          minimum: 1
          description: Strictly positive, monotonically increasing position within source_epoch.
        observed_at:
          type: string
          format: date-time
          description: UTC time at which the Guard observed this snapshot; observations over five minutes in the future are rejected.
        tenant_id:
          type: string
          description: Compatibility identity hint; the authenticated runtime-agent binding is authoritative.
        owner_id:
          type: string
          description: Compatibility identity hint; the authenticated runtime-agent binding is authoritative.
        stack_id:
          type: string
          description: Compatibility placement hint; the authenticated runtime-agent binding is authoritative.
        lease_id:
          type: string
          description: Compatibility lease hint; the authenticated runtime-agent binding is authoritative.
        server_id:
          type: string
        runtime_agent_id:
          type: string
        hostname:
          type: string
        os:
          type: string
        arch:
          type: string
        agent_version:
          type: string
        stackkit:
          type: string
          description: StackKit identifier observed from the deployed access manifest, for example basement-kit or cloud-kit.
        stackkit_version:
          type: string
          description: Exact deployed StackKit release or version observed by Guard.
        stackkit_mode:
          type: string
          description: Deployed StackKit variant or mode observed by Guard.
        domain:
          type: string
          description: Primary address domain declared by the observed StackKit access manifest.
        manifest_observed:
          type: boolean
          description: >-
            True only when Guard successfully read a complete StackKit access
            manifest. False or omission is fail-safe and never authorizes
            reconciliation to delete previously observed services.
        runtime_convergence:
          $ref: "#/components/schemas/RuntimeConvergence"
        host:
          $ref: "#/components/schemas/WorkerInventoryHost"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryChannel"
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryEndpoint"
        services:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryService"

    WorkerInventoryIPAddress:
      type: string
      description: Canonical IPv4 or IPv6 address without a port, URL, or credentials.
      anyOf:
        - format: ipv4
        - format: ipv6

    WorkerInventoryHost:
      type: object
      properties:
        hostname:
          type: string
        os:
          type: string
        os_version:
          type: string
        arch:
          type: string
        public_ip:
          $ref: "#/components/schemas/WorkerInventoryIPAddress"
          x-kombify-ip-classification: public
          description: Globally routable address observed or explicitly configured by Guard; private and loopback addresses are excluded.
        private_ip:
          $ref: "#/components/schemas/WorkerInventoryIPAddress"
          x-kombify-ip-classification: private
          description: Private interface address observed by Guard, such as RFC1918 IPv4 or IPv6 ULA.
        local_ip:
          $ref: "#/components/schemas/WorkerInventoryIPAddress"
          x-kombify-ip-classification: local
          description: Route-selected local interface address; it can equal public_ip or private_ip and does not imply public reachability.
        cpu_cores:
          type: integer
        ram_mb:
          type: integer
        disk_gb:
          type: integer
        cpu_percent:
          type: number
        memory_used_bytes:
          type: integer
        memory_total_bytes:
          type: integer
        disk_used_bytes:
          type: integer
        disk_total_bytes:
          type: integer
        uptime_seconds:
          type: number

    WorkerInventoryChannel:
      type: object
      properties:
        kind:
          type: string
          enum: [https, websocket, grpc, ssh, tunnel]
        url:
          type: string
        status:
          type: string
        provenance:
          type: string

    WorkerInventoryEndpoint:
      type: object
      description: >-
        An endpoint is recorded as observation evidence, not automatically
        exposed as service access. A local direct link is trusted only when
        target_type=direct, provenance=stackkit-access-manifest, health is
        healthy, reachable, or ok, and the sanitized URL is an accepted
        the enrolled .home zone or non-private HTTP(S) address. Raw private-IP service
        URLs remain unavailable. Tunnel links additionally require an observed
        route_id and an accepted Kombify relay URL.
      properties:
        url:
          type: string
          format: uri
        address:
          type: string
        visibility:
          type: string
          enum: [public, tunnel, local, private]
        provenance:
          type: string
          enum: [custom-domain, kombify-domain, kombify-me, lan, localhost, cloudflare-tunnel, provider, stackkit-access-manifest, stackkit, stackkits, stackkit-runtime]
        kind:
          type: string
        health:
          type: string
        target_type:
          type: string
          enum: [direct, tunnel]
        route_id:
          type: string
        access_profile_ref:
          type: string

    WorkerInventoryService:
      type: object
      properties:
        id:
          type: string
        service_id:
          type: string
        key:
          type: string
        name:
          type: string
        status:
          type: string
        url:
          type: string
          format: uri
        owner_stack:
          type: string
        target_server:
          type: string
        container_id:
          type: string
        platform_id:
          type: string
        platform_type:
          type: string
        instance:
          type: string
          default: default
        stackkit_version:
          type: string
          description: StackKit version that produced this observed service.
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [start, stop, restart]
        health:
          type: object
          additionalProperties: true
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/WorkerInventoryEndpoint"

    MonthlyRuntimeOffering:
      type: object
      required: [id, name, billing_cadence]
      properties:
        id:
          type: string
          example: standard
        name:
          type: string
          example: Monthly Runtime Standard
        billing_cadence:
          type: string
          example: monthly
        image:
          type: string
          example: ubuntu-24.04
        vcpus:
          type: integer
          example: 4
        memory_mb:
          type: integer
          example: 8192
        disk_gb:
          type: integer
          example: 160
        region:
          type: string
          example: de-fra

    MonthlyRuntimeEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MonthlyRuntimeActionResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MonthlyRuntimeOperationsEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyRuntimeOperation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MonthlyRuntimeCleanupReadbackEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MonthlyRuntimeCleanupReadback"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MonthlyRuntimeCleanupReadback:
      type: object
      additionalProperties: false
      required: [lease_id, lease, server, provider_operation]
      properties:
        lease_id:
          type: string
          description: The owner-visible lease identifier supplied in the path.
        lease:
          type: object
          additionalProperties: false
          required: [desired_terminal, observed_terminal]
          properties:
            desired_terminal:
              type: boolean
            observed_terminal:
              type: boolean
        server:
          type: object
          additionalProperties: false
          required: [bound, terminal]
          properties:
            bound:
              type: boolean
              description: A canonical RuntimeServer remains exactly bound to the lease.
            terminal:
              type: boolean
              description: The bound RuntimeServer is decommissioned.
        provider_operation:
          type: object
          additionalProperties: false
          required: [found, terminal, capacity_released]
          properties:
            found:
              type: boolean
            terminal:
              type: boolean
              description: The selected operation is no longer running; this does not by itself prove successful cleanup.
            absence_evidence_ref:
              type: string
              pattern: "^provider-evidence://.+"
              description: Opaque provider-native absence-evidence reference; not an evidence document.
            capacity_released:
              type: boolean
              description: An exact generation-bound capacity-release fact exists.

    MonthlyRuntimeRecreateRequest:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          enum: [true]
          description: Explicit acknowledgement that Recreate provisions and bills a new managed server generation.

    MonthlyRuntimeActionResponse:
      type: object
      properties:
        tenant_id:
          type: string
        lease_id:
          type: string
        action:
          type: string
        runtime_offering_id:
          type: string
        desired_state:
          type: string
        observed_state:
          type: string
        lease_state:
          type: string
        lease_reason:
          type: string
        enrollment_status:
          type: string
        ssh_enabled:
          type: boolean
        status:
          type: object
          additionalProperties: true
        ssh:
          type: object
          additionalProperties: true
        power:
          $ref: "#/components/schemas/MonthlyRuntimePowerOperation"
        ssh_access:
          $ref: "#/components/schemas/MonthlyRuntimeSSHAccess"
        reconnect:
          type: object
          description: What a reconnect did to recover the Guard session.
          properties:
            agent_restarted:
              type: boolean
            connection_state:
              type: string
            observed_at:
              type: string
              format: date-time

    MonthlyRuntimePowerOperation:
      type: object
      description: >
        Redacted ledger view of one generation-bound power reconcile. Stop and
        start keep the same resource generation, provider graph, bound IPv4,
        lease, capacity reservation and monthly billing; decommission is the
        only destroy. A pending status is accepted, not converged.
      properties:
        operation_id:
          type: string
        desired_power_state:
          type: string
          enum: [running, stopped]
        status:
          type: string
          enum: [pending, succeeded, failed]
        phase:
          type: string
        reason_code:
          type: string
        retryable:
          type: boolean
        replay:
          type: boolean
        resource_generation_id:
          type: string
        receipt_sequence:
          type: integer
        receipt_digest:
          type: string
        requested_at:
          type: string
          format: date-time

    MonthlyRuntimeSSHAccess:
      type: object
      description: >
        Node-verified outcome of the generation-bound owner SSH grant. Disable
        removes every owner-authorized key while keeping Kombify's execution
        channel; enable reinstalls the keys the owner authorized for this
        generation through the re-authenticated authorize-key route.
      properties:
        enabled:
          type: boolean
        resource_generation_id:
          type: string
        owner_keys_installed:
          type: integer
        owner_keys_removed:
          type: integer
        owner_keys_present:
          type: integer
        changed_at:
          type: string
          format: date-time

    MonthlyRuntimeOperation:
      type: object
      required: [tenant_id, lease_id, event_type, status, created_at]
      properties:
        tenant_id:
          type: string
        lease_id:
          type: string
        event_type:
          type: string
          example: runtime_action
        status:
          type: string
          example: ssh_enabled
        actor:
          type: string
        error:
          type: string
        resource_generation_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Opaque binding to the exact lease resource generation; present on confirmed decommission events.
        created_at:
          type: string
          format: date-time

    # ---- Health ----
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Full Git commit SHA for the deployed artifact; omitted for development builds.
        service:
          type: string
          example: techstack
        time:
          type: string
          format: date-time

    InfoResponse:
      type: object
      properties:
        service:
          type: string
          example: techstack
        version:
          type: string
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Full Git commit SHA for the deployed artifact; omitted for development builds.
        go_version:
          type: string
        uptime_secs:
          type: number
        memory_mb:
          type: integer
        goroutines:
          type: integer
        pocketbase:
          type: boolean

    CapabilitiesResponse:
      type: object
      properties:
        tool:
          type: string
          example: kombify-techstack
        version:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        links:
          type: object
          properties:
            openapi:
              type: string
              example: /api/v1/openapi.yaml
            health:
              type: string
              example: /api/v1/health
            docs:
              type: string

    Capability:
      type: object
      required: [name, description, endpoint, method, requires_auth, idempotent]
      properties:
        name:
          type: string
          example: validate_spec
        description:
          type: string
        endpoint:
          type: string
          example: /api/v1/unifier/validate
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        requires_auth:
          type: boolean
        idempotent:
          type: boolean
        async:
          type: boolean
        tags:
          type: array
          items:
            type: string

    # ---- Stacks ----
    StackRoutingProvenance:
      type: object
      required: [source, dns_provider]
      additionalProperties: false
      properties:
        source:
          type: string
          minLength: 1
          description: Product or operator flow which selected the domain.
          example: kombify-cloud
        dns_provider:
          type: string
          minLength: 1
          description: DNS authority used by the StackKit routing layer.
          example: cloudflare
        zone_id:
          type: string
          description: Non-secret provider zone reference, when one is known.
        external_domain_id:
          type: string
          description: Optional external product-domain reference for provenance.

    StackRoutingExpectations:
      type: object
      additionalProperties: false
      properties:
        dns:
          type: array
          maxItems: 64
          items:
            type: object
            required: [type, values]
            additionalProperties: false
            properties:
              name:
                type: string
                description: Exact routing domain or child name; defaults to the routing domain. Wildcards are rejected.
              type: { type: string, enum: [A, AAAA, CNAME, NS, TXT] }
              values:
                type: array
                minItems: 1
                maxItems: 32
                items: { type: string }
              proxied:
                type: boolean
                default: false
                description: Public edge addresses cannot verify this origin value; valid for A, AAAA or CNAME only.
        tls:
          type: object
          additionalProperties: false
          properties:
            hostname:
              type: string
              description: Additional expected hostname; defaults to the endpoint domain, which is always independently verified.
            issuer: { type: string, maxLength: 512 }
            fingerprint_sha256:
              type: string
              description: Optional SHA-256 leaf certificate pin, normalized to 64 hexadecimal characters.

    DomainExpiryEvidence:
      type: object
      required: [state, freshness]
      properties:
        state: { type: string, enum: [known, unknown] }
        source: { type: string }
        observed_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        expires_at:
          type: string
          format: date-time
          description: An unknown fact may retain its last recorded date as historical evidence.
        remaining_seconds: { type: integer, format: int64 }
        reason_code: { type: string }

    DomainDriftEvidence:
      type: object
      required: [state, freshness, differences]
      properties:
        state: { type: string, enum: [matching, drifted, unknown] }
        source: { type: string }
        expected_source: { type: string, enum: [stack_routing_desired, inventory_endpoint] }
        observed_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        detected_at: { type: string, format: date-time }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        reason_code: { type: string }
        differences:
          type: array
          items:
            type: object
            required: [field, expected, observed]
            properties:
              field: { type: string }
              expected: { type: array, items: { type: string } }
              observed: { type: array, items: { type: string } }
              state: { type: string, enum: [matching, drifted, unknown] }
              reason_code: { type: string }

    DomainMonitoringReport:
      type: object
      required: [generated_at, domains]
      properties:
        generated_at: { type: string, format: date-time }
        domains:
          type: array
          items:
            type: object
            required: [id, stack_id, server_id, domain, registered_domain, services, registration, tls, dns, tls_drift, conditions]
            properties:
              id: { type: string }
              stack_id: { type: string }
              server_id: { type: string }
              domain: { type: string }
              registered_domain: { type: string }
              routing_revision: { type: integer, format: int64 }
              tls_port: { type: integer, minimum: 1, maximum: 65535 }
              tls_disabled: { type: boolean }
              check_started_at: { type: string, format: date-time }
              services:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
              registration: { $ref: "#/components/schemas/DomainExpiryEvidence" }
              tls:
                allOf:
                  - $ref: "#/components/schemas/DomainExpiryEvidence"
                  - type: object
                    properties:
                      subject: { type: string }
                      issuer: { type: string }
                      fingerprint_sha256: { type: string }
                      valid: { type: boolean }
              dns: { $ref: "#/components/schemas/DomainDriftEvidence" }
              tls_drift: { $ref: "#/components/schemas/DomainDriftEvidence" }
              conditions:
                type: array
                items:
                  type: object
                  required: [id, kind, state, severity, first_detected_at, last_observed_at, freshness, episode]
                  properties:
                    id: { type: string }
                    kind: { type: string }
                    state: { type: string, enum: [active, resolved] }
                    severity: { type: string, enum: [warning, critical] }
                    first_detected_at: { type: string, format: date-time }
                    last_observed_at: { type: string, format: date-time }
                    resolved_at: { type: string, format: date-time }
                    freshness: { type: string, enum: [fresh, stale, unknown] }
                    evidence_ref: { type: string }
                    episode: { type: integer, format: int64, minimum: 1 }

    StackRoutingPutRequest:
      type: object
      required: [server_id, mode, domain, provenance]
      additionalProperties: false
      properties:
        server_id:
          type: string
          minLength: 1
          description: >-
            Exact canonical ServerRuntime target belonging to the stack and owner.
            For a managed lease this is the server_id exposed by the operations/
            worker projection. If that read-model row is not present yet, TechStack
            may create only this deterministic ID from the validated exact lease.
        lease_id:
          type: string
          minLength: 1
          description: >-
            Exact RuntimeLease for a managed target. Omit for a local/Basement
            ServerRuntime that genuinely has no lease; invented leases are rejected.
        mode:
          type: string
          enum: [custom-domain]
        domain:
          type: string
          minLength: 1
          description: Normalized custom domain; schemes, paths, ports, and wildcards are rejected.
          example: example.com
        provenance:
          $ref: "#/components/schemas/StackRoutingProvenance"
        expectations:
          $ref: "#/components/schemas/StackRoutingExpectations"
          description: Omission preserves expectations for the same domain/server/lease. An explicit empty object clears optional DNS and TLS pins.
        ensure_rollout:
          type: boolean
          default: false
          description: Request reconciliation without implying that it has already been dispatched or applied.

    StackRoutingDesired:
      type: object
      required: [stack_id, server_id, revision, mode, domain, provenance, rollout_status, created_at, updated_at]
      properties:
        stack_id: { type: string }
        server_id: { type: string }
        lease_id:
          type: string
          description: Present only when the exact target is lease-backed.
        revision: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [custom-domain] }
        domain: { type: string }
        provenance:
          $ref: "#/components/schemas/StackRoutingProvenance"
        expectations:
          $ref: "#/components/schemas/StackRoutingExpectations"
        rollout_status:
          type: string
          enum: [not_requested, pending, completed, failed]
        rollout_job_id: { type: string }
        reason_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StackRoutingObserved:
      type: object
      required: [status, applied, applied_revision]
      properties:
        status:
          type: string
          enum: [unknown, pending, applied, failed]
          description: >-
            Independent convergence state. A completed StackKit rollout remains
            pending until DNS, TLS, and runtime reachability are observed for the
            exact desired revision.
        applied:
          type: boolean
          description: False until a real observer proves this revision converged.
        applied_revision:
          type: integer
          format: int64
          minimum: 0

    StackRoutingRollout:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_requested, pending, completed, failed]
        job_id: { type: string }
        reason_code:
          type: string
          description: Present only when a rollout cannot advance or has an explicit reason.

    StackRoutingView:
      type: object
      required: [desired, observed, rollout]
      properties:
        desired:
          $ref: "#/components/schemas/StackRoutingDesired"
        observed:
          $ref: "#/components/schemas/StackRoutingObserved"
        rollout:
          $ref: "#/components/schemas/StackRoutingRollout"
        idempotent_replay:
          type: boolean
          description: True when the same Idempotency-Key and semantic request were replayed.

    StackRoutingViewEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/StackRoutingView"
        meta:
          type: object
          additionalProperties: true

    StackRoutingTarget:
      type: object
      required: [stack_id, server_id, lease_id, role, provider, lifecycle_state, connection_state]
      properties:
        stack_id: { type: string }
        server_id: { type: string, description: Deterministic canonical identity derived from the exact lease. }
        lease_id: { type: string }
        role: { type: string, enum: [foundation, control-plane, primary, main] }
        provider: { type: string }
        address: { type: string, description: Current authoritative public IP or runtime SSH host when available. }
        lifecycle_state: { type: string }
        connection_state: { type: string }

    StackRoutingTargetsEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [targets]
          properties:
            targets:
              type: array
              items:
                $ref: "#/components/schemas/StackRoutingTarget"
        meta:
          type: object
          additionalProperties: true

    ManagedRuntimeAuthorityPreflight:
      type: object
      required: [provider_id, budget_key, decision_source, request_bound, admission_preflight]
      properties:
        provider_id:
          type: string
          enum: [centron, ionos]
        budget_key:
          type: string
          const: cloud.runtime.credits
        decision_source:
          type: string
          const: edge_v2_entitlement+signed_budget:cloud.runtime.credits#managed_servers
        request_bound:
          type: boolean
          const: true
        admission_preflight:
          type: boolean
          const: true
          description: Confirms a native read-only preflight, never a capacity reservation or provider mutation.

    ManagedRuntimeAuthorityPreflightEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ManagedRuntimeAuthorityPreflight"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    AddManagedRuntimeServerRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id:
          type: string
          enum: [centron, ionos]
          description: Canonical executable provider identifier; historical display aliases are rejected.
        provider_region:
          type: string
          maxLength: 128
          description: Provider region. For IONOS this is normalized to the canonical datacenter identifier.
        ionos_datacenter:
          type: string
          maxLength: 128
          description: IONOS datacenter alias for provider_region; ignored for other canonical providers.
        node_role:
          type: string
          enum: [foundation, worker, storage]
          default: worker
        runtime_offering_id:
          type: string
          description: Canonical managed-runtime offering. Omission uses the stack's snapshotted effective default.
        stackkit:
          type: string
          description: StackKit foundation requested for this server.
        services:
          type: array
          maxItems: 128
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: Service keys; duplicates and order are semantically insignificant.

    AddManagedRuntimeServer:
      type: object
      required:
        - stack_id
        - job_id
        - lease_id
        - runtime_server_id
        - resource_generation_id
        - operation_id
        - provider_id
        - node_role
        - runtime_offering_id
        - enrollment_status
        - runtime_phase
        - idempotent_replay
        - message
      properties:
        stack_id: { type: string }
        job_id:
          type: string
          description: Deterministic tenant/stack/operation/key job identity; it does not expose the raw key.
        lease_id: { type: string }
        runtime_server_id: { type: string }
        resource_generation_id:
          type: string
          format: uuid
          description: Sole generation authority for this admitted resource intent.
        operation_id:
          type: string
          description: Exact native provider-control operation correlation.
        provider_id:
          type: string
          enum: [centron, ionos]
        provider_region: { type: string }
        ionos_datacenter: { type: string }
        node_role:
          type: string
          enum: [foundation, worker, storage]
        runtime_offering_id: { type: string }
        enrollment_status:
          type: string
          const: pending
        runtime_phase:
          type: string
          const: lease_pending
        idempotent_replay:
          type: boolean
          description: True when the HTTP job or native admission was safely replayed.
        message: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: Non-terminal persistence warning; clients must retry only with the same Idempotency-Key.

    AddManagedRuntimeServerEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AddManagedRuntimeServer"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    CreateStackRequest:
      type: object
      properties:
        name:
          type: string
          description: Stack name
        mode:
          type: string
          enum: [easy, techie]
          description: Wizard mode
        stack_spec:
          type: object
          description: Canonical StackKits stack-spec.yaml shape generated by the creation wizard. When present, this is the source of truth for provisioning and is stored as the stack user_config for compatibility.
        user_config:
          type: object
          description: Legacy structured configuration, including older kombination-style payloads. New wizard clients should send stack_spec.
        user_config_raw:
          type: string
          description: Raw YAML/JSON string
        user_config_format:
          type: string
          enum: [json, yaml]
        provider:
          type: string
          description: Infrastructure provider (direct format)
        services:
          type: array
          items:
            type: string
          description: Service names (direct format)
        options:
          type: object
          properties:
            identity_head:
              type: string
              enum: [pocket_id, pocketbase, generic_oidc]
              description: Homelab identity head selected by Wizard Round 4
            enable_pocket_id:
              type: boolean
              description: Enable Pocket ID as the identity provider
            enable_pocketbase_backend:
              type: boolean
              description: Enable optional PocketBase Homelab backend capabilities
            requires_passkeys:
              type: boolean
              description: Require passkey-capable identity flow
            enable_pocketbase:
              type: boolean
              deprecated: true
              description: Legacy alias. Use enable_pocketbase_backend instead.

    CreateStackResponse:
      type: object
      properties:
        stack_id:
          type: string
        server_id:
          type: string
          description: Canonical planned ServerRuntime created with the stack.
        job_id:
          type: string
        name:
          type: string
        state:
          type: string
          example: provisioning
        message:
          type: string
        operations_url:
          type: string
          description: Durable dashboard location for rollout, retry, diagnostics, and cleanup.
          example: /stacks?stack_id=stack_123
        idempotent_replay:
          type: boolean
          description: True when the response reuses an earlier creation attempt.
        bootstrap_token:
          type: string
          description: Short-lived bearer token for the StackKit owner-spec bootstrap endpoint. Present when the create request includes local owner bootstrap material.
        bootstrap_token_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp for bootstrap_token.
        owner_spec_endpoint:
          type: string
          example: /api/v1/stacks/stack_123/owner-spec
          description: Stack-scoped endpoint consumed by StackKit admin-bootstrap.
        owner_spec_scopes:
          type: array
          items:
            type: string
          example: [read:owner-spec]

    OwnerSpecResponse:
      type: object
      properties:
        stack_id:
          type: string
        identity:
          $ref: "#/components/schemas/OwnerSpecIdentity"
        scopes:
          type: array
          items:
            type: string
          example: [read:owner-spec]
        expires_at:
          type: string
          format: date-time

    OwnerSpecIdentity:
      type: object
      properties:
        owner:
          $ref: "#/components/schemas/OwnerSpecOwner"
        recovery:
          $ref: "#/components/schemas/OwnerSpecRecovery"

    OwnerSpecOwner:
      type: object
      properties:
        source:
          type: string
          enum: [local]
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string

    OwnerSpecRecovery:
      type: object
      properties:
        passphrase_hash:
          type: string
          description: Argon2id hash consumed by StackKit recovery bootstrap.
        passphraseHashPresent:
          type: boolean

    # ---- Jobs ----
    JobState:
      type: string
      enum: [pending, running, waiting, completed, failed, canceled]
      description: |
        `waiting` is active, non-terminal work. Clients must keep polling or
        consuming SSE and must not enable target access until completion.

    JobWait:
      type: object
      additionalProperties: false
      required: [state, reason, message]
      properties:
        state:
          type: string
          const: waiting
        reason:
          type: string
          enum: [waiting_enrollment]
        message:
          type: string
        next_resume_at:
          type: string
          format: date-time
          description: |
            The next check scheduled by the current orchestrator process.
            Clients must use the server-projected `resume_available` flag rather
            than comparing this value with a browser clock.

    JobDetail:
      type: object
      required: [id, type, state, progress]
      properties:
        id:
          type: string
        type:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        phase:
          type: string
          description: Stable lifecycle phase reported by the job authority.
        failure_class:
          type: string
          description: Stable machine-readable failure classification when the job failed.
        reason_code:
          type: string
          description: Stable outcome reason for support and client recovery policy.
        retryable:
          type: boolean
          description: Explicit server decision; false forbids automatic retry.
        user_guidance:
          $ref: "#/components/schemas/StructuredUserGuidance"
        step:
          type: string
        current_step:
          type: string
        message:
          type: string
        error:
          type: string
        error_details:
          type: string
        error_message:
          type: string
        stack_id:
          type: string
        wait_reason:
          type: string
          enum: [waiting_enrollment]
        next_resume_at:
          type: string
          format: date-time
        resume_available_at:
          type: string
          format: date-time
          description: Server-authoritative earliest time for exact-target recovery.
        resume_available:
          type: boolean
          description: True only when the server-side recovery grace has elapsed.
        superseded_by_job_id:
          type: string
          description: |
            Present when exact-target recovery (enrollment resume or rollout
            retry) handed this job over to a deterministic replacement job.
            Clients follow it to keep tracking the live work.
        result:
          type: object
          additionalProperties: true
          description: |
            Persisted job result and immutable routing receipts. While legacy
            storage projects a wait as `pending`, `result.job_wait` follows
            `JobWait`; the API reconstructs canonical `state: waiting`. The
            result survives restarts. Queue-backed control-plane jobs with a
            configured durable store must win a pending-to-running claim before
            their handler starts; provider lifecycle workers use their own
            operation contracts and are not covered by that queue claim.
          properties:
            job_wait:
              $ref: "#/components/schemas/JobWait"
        logs:
          type: array
          items: {}
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobProgress:
      type: object
      required: [id, state, progress, current_step]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        wait_reason:
          type: string
          enum: [waiting_enrollment]
        next_resume_at:
          type: string
          format: date-time
        resume_available_at:
          type: string
          format: date-time
        resume_available:
          type: boolean
        progress:
          type: integer
          minimum: 0
          maximum: 100
        step:
          type: string
        current_step:
          type: string
        message:
          type: string
        error:
          type: string
        error_details:
          type: string
        superseded_by_job_id:
          type: string
          description: Replacement job that took over this job through exact-target recovery.

    JobEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/JobDetail"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    JobListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, page, per_page, total_items, total_pages]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/JobDetail"
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
              maximum: 200
            total_items:
              type: integer
              minimum: 0
            total_pages:
              type: integer
              minimum: 0
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    FailureSignature:
      type: object
      required:
        [
          signature,
          normalizer_version,
          component,
          phase,
          error_code,
          latest_template,
          latest_exit_status,
          occurrences,
          targets,
          first_seen,
          last_seen,
          recent_occurrences,
          previous_occurrences,
          latest_stackkit_module,
        ]
      properties:
        signature:
          type: string
          pattern: "^[0-9a-f]{64}$"
        normalizer_version:
          type: string
          example: fk-normalizer/v2
        component:
          type: string
          description: Failing capability, for example techstack.stackkit.deploy.
        phase:
          type: string
          description: Step in which the operation failed; empty when unknown.
        error_code:
          type: string
          description: Most specific recorded reason code; empty when unknown.
        latest_template:
          type: string
          maxLength: 512
          description: Normalized error template of the most recent occurrence.
        latest_exit_status:
          type: integer
          nullable: true
        occurrences:
          type: integer
          minimum: 1
        targets:
          type: integer
          minimum: 0
          description: Distinct StackKit deployments with this signature.
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        recent_occurrences:
          type: integer
          minimum: 0
          description: Occurrences within the last window_days.
        previous_occurrences:
          type: integer
          minimum: 0
          description: Occurrences within the window_days before the last window.
        latest_stackkit_module:
          type: string
          description: StackKit module of the most recent occurrence; empty when unknown.

    FailureSignatureListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, normalizer_version]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FailureSignature"
            normalizer_version:
              type: string
            window_days:
              type: integer
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    RecordFailureOutcomeRequest:
      type: object
      required: [resolution_id, signature, procedure, job_id]
      properties:
        resolution_id:
          type: string
          format: uuid
          description: Id of the failure resolution that was applied (find_similar_failures).
        signature:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Failure signature the resolution was applied to; the tenant must have an occurrence of it.
        procedure:
          type: string
          pattern: "^(stackkits|techstack):[a-z0-9][a-z0-9._:/@#-]{1,199}$"
          example: stackkits:nextcloud/repair-data-permissions
          description: Product procedure reference of the applied fix step.
        job_id:
          type: string
          maxLength: 128
          description: The tenant's job that ran the procedure.

    FailureOutcome:
      type: object
      required: [resolution_id, signature, procedure, job_id, outcome, context, completed_at, recorded_at]
      properties:
        resolution_id:
          type: string
          format: uuid
        signature:
          type: string
          pattern: "^[0-9a-f]{64}$"
        procedure:
          type: string
        job_id:
          type: string
        stack_id:
          type: string
        outcome:
          type: string
          enum: [succeeded, failed]
        context:
          type: object
          description: Coarse context dimensions of the failure (stackkit_module, os, provider, ...); absent when unknown.
          additionalProperties:
            type: string
        completed_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time

    FailureOutcomeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [outcome, created]
          properties:
            outcome:
              $ref: "#/components/schemas/FailureOutcome"
            created:
              type: boolean
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    FailureOutcomeListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, resolutions]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FailureOutcome"
            resolutions:
              type: array
              items:
                type: object
                required: [resolution_id, signature, succeeded, failed, last_outcome]
                properties:
                  resolution_id:
                    type: string
                    format: uuid
                  signature:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  succeeded:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  last_outcome:
                    type: string
                    format: date-time
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    AsyncJobResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        job_id:
          type: string

    EnrollmentResumeRequest:
      type: object
      additionalProperties: false
      required: [job_id, lease_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: Persisted source job currently projected as waiting_enrollment.
        lease_id:
          type: string
          minLength: 1
          description: Exact managed foundation lease already bound to the source job.

    EnrollmentResumeResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - stack_id
        - job_id
        - source_job_id
        - lease_id
        - server_id
        - idempotent_replay
        - provider_vm_create_requested
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        stack_id:
          type: string
        job_id:
          type: string
        source_job_id:
          type: string
        lease_id:
          type: string
        server_id:
          type: string
          description: Canonical deterministic server identity derived from lease_id.
        idempotent_replay:
          type: boolean
        provider_vm_create_requested:
          type: boolean
          const: false
        bootstrap_token:
          type: string
          description: Optional short-lived StackKit owner-spec bootstrap bearer.
        bootstrap_token_expires_at:
          type: string
          format: date-time
        owner_spec_endpoint:
          type: string
        owner_spec_scopes:
          type: array
          items:
            type: string

    EnrollmentResumeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EnrollmentResumeResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    StackKitLifecycleRequest:
      type: object
      additionalProperties: false
      required: [agent_id, operation]
      properties:
        agent_id: { type: string, minLength: 1 }
        operation:
          type: string
          enum: [plan, apply, verify, upgrade, drift_detect, drift_reconcile, advanced_change_set, rollback, restore_drill, backup_run, backup_configure, backup_status, backup_restore, backup_restore_activate, backup_restore_recover, ai_provider, ssh_trust_recipient, ssh_trust_apply]
        owner_approved: { type: boolean }
        target_release: { type: string }
        dry_run:
          type: boolean
          x-kombify-name: operation_dry_run
        offline: { type: boolean }
        stackkit:
          type: string
          description: Optional execution binding; normally derived from the stack's managed rollout.
        candidate_spec:
          type: object
          additionalProperties: true
          description: Canonical candidate StackSpec validated by the pinned node executor; required for advanced_change_set.
        rollback_target_ref:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Exact executor-state snapshot or change-set digest.
        snapshot_anchor_id: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        restore_result_id: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        activation_operation_id: { type: string }
        restore_plan_hash: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        ai_provider_base_url:
          type: string
          maxLength: 512
          description: https base URL of the OpenAI-compatible provider API for ai_provider.
        wallet_item_id:
          type: string
          pattern: '^itm_[a-z2-7]{26}$'
          description: kombify Wallet item holding the provider's API key for ai_provider.
        wallet_item_rotate:
          type: boolean
          description: Deliver a rotated item that replaces the version the node holds.
        ai_provider_disable:
          type: boolean
          description: Remove the external provider instead of setting it.
        recipient_challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,128}$'
          description: The owner's fresh challenge the node's recipient statement answers; ssh_trust_recipient only.
        sealed_delivery:
          type: string
          maxLength: 65536
          description: The kombify Wallet's sealed ssh-ca-trust, ssh-ca-revoke or ssh-host-certificate envelope (JSON text, public material only); ssh_trust_apply only.

    StackKitLifecycleAccepted:
      type: object
      required: [job_id, kit_deployment_id, agent_id, operation, status]
      properties:
        job_id: { type: string }
        kit_deployment_id: { type: string }
        agent_id: { type: string }
        operation: { type: string }
        status: { type: string }

    ExactRolloutRetryRequest:
      type: object
      additionalProperties: false
      required: [source_job_id, lease_id]
      properties:
        source_job_id:
          type: string
          minLength: 1
          description: Exact failed deploy job used as immutable retry evidence.
        lease_id:
          type: string
          minLength: 1
          description: Exact active managed foundation lease bound to the failed job.
        owner_approved:
          type: boolean
          description: Required true when supplying a canonical initial-rollout repair candidate.
        candidate_spec:
          type: object
          additionalProperties: true
          description: Optional canonical StackSpec repairing missing route, access and data dependencies of already admitted modules. The pinned CLI validates it; revision CAS and candidate digest bind retries. Applied installations must use their existing change-set authority.
        current_spec_hash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Normalized current node intent hash for an exact failed INIT whose immutable retry lineage proves a prior failed APPLY on this runtime. Required only for that partial INIT recovery; rejected on other paths. This is solely the CLI atomic CAS precondition, never authorization. Obtain through the pinned CLI resolve on the same current canonical node document. The durable receipt seals this value and lineage against changed replay.

    ExactRolloutRetryResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - stack_id
        - job_id
        - source_job_id
        - lease_id
        - server_id
        - idempotent_replay
        - provider_vm_create_requested
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        stack_id:
          type: string
        job_id:
          type: string
        source_job_id:
          type: string
        lease_id:
          type: string
        server_id:
          type: string
        idempotent_replay:
          type: boolean
        provider_vm_create_requested:
          type: boolean
          const: false
        bootstrap_token:
          type: string
        bootstrap_token_expires_at:
          type: string
          format: date-time
        owner_spec_endpoint:
          type: string
        owner_spec_scopes:
          type: array
          items:
            type: string

    StackComponentRepairRequest:
      type: object
      additionalProperties: false
      required: [component]
      properties:
        component:
          type: string
          enum: [public_tls]

    StackComponentRepairResponse:
      type: object
      required: [job_id, stack_id, component, status]
      properties:
        job_id:
          type: string
        stack_id:
          type: string
        component:
          type: string
          enum: [public_tls]
        status:
          type: string
          enum: [queued]

    StackComponentRepairEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StackComponentRepairResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ExactRolloutRetryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ExactRolloutRetryResponse"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    PipelineStatusResponse:
      type: object
      properties:
        stack_id:
          type: string
        intent_exists:
          type: boolean
        requirements_exists:
          type: boolean
        unified_exists:
          type: boolean
        base_dir:
          type: string
        intent_sha256:
          type: string
        intent_byteLength:
          type: integer
        requirements_metadata:
          type: object
        unified_metadata:
          type: object
        hash_chain_valid:
          type: boolean

    # ---- Validation ----
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      properties:
        path:
          type: string
          description: JSON path to the offending field
        code:
          type: string
        message:
          type: string

    # ---- Drift ----
    DriftStatusResponse:
      type: object
      properties:
        stack_id:
          type: string
        drift_status:
          type: string
        checked_at:
          type: string
          format: date-time
        affected_count:
          type: integer
        last_job_id:
          type: string
        last_result_id:
          type: string

    DriftDetailsResponse:
      type: object
      properties:
        stack_id:
          type: string
        status:
          type: string
        checked_at:
          type: string
          format: date-time
        affected_resources:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              resource_type:
                type: string
              name:
                type: string
              action:
                type: string
              changes:
                type: object
        summary:
          type: object
          properties:
            to_create:
              type: integer
            to_update:
              type: integer
            to_delete:
              type: integer
        duration_ms:
          type: integer
        error_message:
          type: string

    DriftResultsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              stack_id:
                type: string
              stack_name:
                type: string
              status:
                type: string
              affected_count:
                type: integer
              trigger_type:
                type: string
              checked_at:
                type: string
                format: date-time
              duration_ms:
                type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # ---- Discovery ----
    ScanRequest:
      type: object
      properties:
        subnet:
          type: string
          example: "192.168.1.0/24"
        target_ips:
          type: array
          items:
            type: string
        exclude_ips:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer
          default: 30
        max_concurrent:
          type: integer
          default: 50
        profile:
          type: string
          enum: [passive, active]
          default: passive

    ScanResponse:
      type: object
      properties:
        scan_id:
          type: string
        status:
          type: string
          enum: [running, completed, cancelled, failed]
        profile:
          type: string
        subnet:
          type: string
        target_ips:
          type: array
          items:
            type: string
        exclude_ips:
          type: array
          items:
            type: string
        devices:
          type: array
          items:
            type: object
        started_at:
          type: string
          format: date-time
        progress:
          type: object
          properties:
            scanned:
              type: integer
            remaining:
              type: integer
            total:
              type: integer

    # ---- Features ----
    FeatureState:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        locked:
          type: boolean
        requires_consent:
          type: boolean
        has_consent:
          type: boolean
        risk_level:
          type: string
        description:
          type: string
        category:
          type: string

    # ---- Agents ----
    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string

    # ---- Runtime Logs ----
    RuntimeLogsEnvelope:
      type: object
      description: Standard success envelope; `data` is the runtime log slice.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeLogEntry"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    RuntimeLogEntry:
      type: object
      description: |
        A single runtime/deploy log entry. `timestamp`, `level`, and `message`
        are always present; the remaining fields are emitted only when non-empty.
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        id:
          type: string
        ingested_at:
          type: string
          format: date-time
        agent_id:
          type: string
        source:
          type: string
        stack_id:
          type: string
        job_id:
          type: string
        lease_id:
          type: string
        provider:
          type: string
        runtime_action_id:
          type: string
        service_name:
          type: string
        container_id:
          type: string
        trace_id:
          type: string
        span_id:
          type: string
        fields:
          type: object
          additionalProperties: true

    # ---- Wallet ----
    WalletItemsEnvelope:
      type: object
      description: Standard success envelope; `data.items` is the redacted item list.
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WalletItem"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    WalletItem:
      type: object
      description: |
        Redacted wallet recovery item. `secret` and `totp` are never present in
        list responses; only the `has_secret`/`has_totp` presence flags are
        exposed. Additional metadata keys may be present.
      required: [id, kind]
      additionalProperties: true
      properties:
        id:
          type: string
        kind:
          type: string
        stack_id:
          type: string
        source_type:
          type: string
        source_ref:
          type: string
        has_secret:
          type: boolean
        has_totp:
          type: boolean
        item_class:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time

    WalletReauthRequest:
      type: object
      description: |
        Fresh platform re-authentication assertion. The trusted-reauth proof may
        also be supplied via the `X-Kombify-Reauth-*` / `X-TechStack-Reauth-*`
        request headers.
      properties:
        reason:
          type: string
        reauth_timestamp:
          type: string
        reauth_signature:
          type: string
        reauth_assertion:
          type: string
        platform_reauth_at:
          type: string

    WalletReauthProofEnvelope:
      type: object
      description: Standard success envelope; `data` is the minted reauth proof.
      properties:
        data:
          $ref: "#/components/schemas/WalletReauthProof"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    WalletReauthProof:
      type: object
      required: [id, reauth_timestamp, reauth_signature, expires_at]
      properties:
        id:
          type: string
        reauth_timestamp:
          type: string
          description: Unix epoch seconds (string) the proof was minted at.
        reauth_signature:
          type: string
          description: Hex-encoded HMAC-SHA256 trusted-reauth signature.
        expires_at:
          type: string
          format: date-time
        reauth_method_hint:
          type: string
          example: kombify-cloud

    WalletRevealRequest:
      type: object
      description: |
        Reveal request gated by a fresh trusted-reauth HMAC proof. The
        timestamp/signature may instead be supplied via the
        `X-Kombify-Reauth-*` / `X-TechStack-Reauth-*` request headers.
      required: [reauth_timestamp, reauth_signature]
      properties:
        reason:
          type: string
        reauth_timestamp:
          type: string
        reauth_signature:
          type: string
        reauth_assertion:
          type: string
        platform_reauth_at:
          type: string

    WalletRevealEnvelope:
      type: object
      description: Standard success envelope; `data` is the revealed recovery values.
      properties:
        data:
          $ref: "#/components/schemas/WalletReveal"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    WalletReveal:
      type: object
      description: |
        One-time plaintext recovery values. `secret` and `totp` are omitted when
        the corresponding stored value is empty.
      required: [id, revealed_at]
      properties:
        id:
          type: string
        secret:
          type: string
        totp:
          type: string
        revealed_at:
          type: string
          format: date-time
