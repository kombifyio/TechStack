  /api/v1/monthly-runtimes/{lease_id}/start:
    post:
      operationId: startMonthlyRuntime
      x-kombify-cli: { command: "monthly-runtimes start", args: [lease_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Monthly Runtime]
      summary: Start a stopped managed server of the same generation
      description: >
        Admits one generation-bound provider-control reconcile toward running.
        The provider power-on runs once under an at-most-once claim; a repeated
        request while it converges replays the same operation. Requires the
        managed runtime entitlement before any provider call.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: The power reconcile converged; power.status is succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "202":
          description: The power reconcile is durable and still converging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "403":
          description: Entitlement denial with error_code, reason_code, missing features and user_guidance.
        "409":
          description: >
            A different power transition is still converging
            (managed_power_transition_in_progress) or the runtime does not
            admit an in-place power change (managed_power_not_admitted).

  /api/v1/monthly-runtimes/{lease_id}/stop:
    post:
      operationId: stopMonthlyRuntime
      x-kombify-cli: { command: "monthly-runtimes stop", args: [lease_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Monthly Runtime]
      summary: Stop a managed server without destroying it
      description: >
        Admits one generation-bound provider-control reconcile toward stopped.
        centron uses its graceful guest shutdown action; IONOS shuts the guest
        down over the execution channel because the IONOS provider stop
        releases the bound DHCP IPv4. The server keeps its disk, address,
        lease, capacity reservation and monthly billing.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: The power reconcile converged; power.status is succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "202":
          description: The power reconcile is durable and still converging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "403":
          description: Entitlement denial with error_code, reason_code, missing features and user_guidance.
        "409":
          description: A power transition is converging or the runtime does not admit a pause.

  /api/v1/monthly-runtimes/{lease_id}/enable-ssh:
    post:
      operationId: enableMonthlyRuntimeSSH
      x-kombify-cli: { command: "monthly-runtimes ssh enable", args: [lease_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Monthly Runtime]
      summary: Enable owner SSH access for this generation
      description: >
        Re-enables the generation-bound owner SSH grant over the pinned
        execution channel and reinstalls the keys the owner authorized for this
        generation. New keys are authorized only through the re-authenticated
        server access route.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Node-verified grant change; see ssh_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "403":
          description: Entitlement or demo-account denial.
        "409":
          description: The runtime is stopped (managed_runtime_stopped).
        "503":
          description: The execution channel could not reach the node; no node change was made.

  /api/v1/monthly-runtimes/{lease_id}/disable-ssh:
    post:
      operationId: disableMonthlyRuntimeSSH
      x-kombify-cli: { command: "monthly-runtimes ssh disable", args: [lease_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Monthly Runtime]
      summary: Disable owner SSH access for this generation
      description: >
        Removes every owner-authorized key from the node while keeping
        Kombify's execution-channel key, and records the disabled grant so new
        owner keys are refused until SSH is enabled again.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Node-verified grant change; see ssh_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "403":
          description: Entitlement denial.
        "409":
          description: The runtime is stopped (managed_runtime_stopped).
        "503":
          description: The execution channel could not reach the node; no node change was made.

  /api/v1/monthly-runtimes/{lease_id}/decommission:
    post:
      operationId: decommissionMonthlyRuntime
      x-kombify-cli: { command: "monthly-runtimes decommission", args: [lease_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: true, openWorldHint: true }
      x-kombify-confirmation: "This operation decommissions the monthly runtime and tears down its provider resources."
      tags: [Monthly Runtime]
      summary: Decommission a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
        - name: force
          in: query
          required: false
          x-kombify-name: force_query
          schema:
            type: boolean
            default: false
          description: >
            Request exact generation-bound provider reconciliation when the
            runtime is unreachable. Force is accepted only when the control
            plane can prove restart-safe, HA-fenced durable custody before it
            cancels the lease. Also accepted as a {"force": true} JSON body. An
            empty request defaults to false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
                expected_resource_generation_digest:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: >
                    Optional optimistic concurrency claim. Provider teardown is
                    refused with 409 unless this digest still identifies the
                    current lease resource generation.
      responses:
        "200":
          description: Confirmed synchronous runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "202":
          description: >
            Durable exact-generation provider reconciliation was accepted but
            provider teardown is not yet proven. observed_state and lease_state
            are reconciliation_pending; this is not terminal success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "400":
          description: >
            Invalid, oversized, ambiguous, or schema-incompatible JSON body,
            or an invalid expected resource-generation digest.
        "409":
          description: >
            Decommission blocked because the runtime is unreachable or because
            the expected resource generation has been superseded. Unreachable
            errors carry error_code=decommission_blocked_unreachable with a
            structured user_guidance offering force=true.
        "503":
          description: >
            The Simulate runtime client is unavailable, or restart-safe and
            HA-fenced durable reconciliation custody is not available. In the
            latter case no lease cancellation, generation claim, or pending
            metadata mutation is performed.

  /api/v1/monthly-runtimes/{lease_id}/resolve-custody:
    post:
      operationId: resolveMonthlyRuntimeCustody
      x-kombify-cli: { command: "monthly-runtimes resolve-custody", args: [lease_id] }
      x-kombify-confirmation: "This operation records that the provider resources were cleaned up and releases the lease custody."
      tags: [Monthly Runtime]
      summary: Archive a legacy or unbound custody record after provider cleanup
      description: >
        Removes a non-executable legacy or unbound lease from the active
        dashboard only after the owner confirms that its provider resource was
        already removed. This operation never contacts or deletes a provider
        resource and is rejected for Techstack provider-controlled generations.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_cleanup_confirmed]
              properties:
                provider_cleanup_confirmed:
                  type: boolean
                  enum: [true]
      responses:
        "200":
          description: Custody record archived with owner-confirmation evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "400":
          description: Invalid or schema-incompatible confirmation body
        "409":
          description: >
            Provider cleanup was not confirmed, or the lease remains under
            Techstack provider control and must use the decommission lifecycle.

  /api/v1/monthly-runtimes/{lease_id}/reconnect:
    post:
      operationId: reconnectMonthlyRuntime
      x-kombify-cli: { command: "monthly-runtimes reconnect", args: [lease_id] }
      x-kombify-mcp:
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Monthly Runtime]
      summary: Recover the Guard session of a managed runtime
      description: >
        Probes the canonical aggregate; when it cannot prove a Guard
        connection, restarts Guard over the pinned execution channel for an
        entitled owner of a running server and re-observes the connection
        within a bounded window, then converges enrollment to enrolled. A
        stopped runtime is refused (managed_runtime_stopped). No provider
        resource is touched.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Runtime action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/ssh:
    get:
      operationId: getMonthlyRuntimeSSHInfo
      x-kombify-cli: { command: "monthly-runtimes ssh get", args: [lease_id] }
      tags: [Monthly Runtime]
      summary: Get SSH connection information for a monthly runtime lease
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: SSH info result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeEnvelope"
        "503":
          description: Simulate runtime client is unavailable

  /api/v1/monthly-runtimes/{lease_id}/operations:
    get:
      operationId: listMonthlyRuntimeOperations
      x-kombify-cli: { command: "monthly-runtimes operations", args: [lease_id] }
      tags: [Monthly Runtime]
      summary: List monthly runtime operation history
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
        - $ref: "#/components/parameters/monthlyRuntimeOperationLimit"
      responses:
        "200":
          description: Runtime operation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeOperationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/monthly-runtimes/{lease_id}/cleanup-readback:
    get:
      operationId: getMonthlyRuntimeCleanupReadback
      x-kombify-cli: { command: "monthly-runtimes cleanup-readback", args: [lease_id] }
      tags: [Monthly Runtime]
      summary: Read redacted managed runtime cleanup state facts
      description: >
        Returns tenant- and owner-scoped state facts for the lease's
        exact current provider-control resource generation. This read-only
        endpoint never calls a provider or a runtime agent and never returns
        provider resource handles, commands, evidence documents, or credentials.
        A terminal operation is no longer running, but is not by itself proof
        of successful cleanup: provider absence requires absence_evidence_ref,
        and capacity release requires capacity_released.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
      responses:
        "200":
          description: Redacted cleanup state readback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyRuntimeCleanupReadbackEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Lease is not under Techstack provider-control custody
        "503":
          description: Provider-control readback authority is unavailable

  /api/v1/monthly-runtimes/{lease_id}/recreate:
    post:
      operationId: recreateMonthlyRuntime
      x-kombify-cli: { command: "monthly-runtimes recreate", args: [lease_id] }
      x-kombify-confirmation: "This operation replaces the runtime's provider server with a newly provisioned one and is billed."
      x-kombify-mcp:
        requiredCapability: techstack.inventory.provision
        costBearing: true
        actionClass: cost_bearing
        annotations: { readOnlyHint: false, idempotentHint: false, destructiveHint: true, openWorldHint: true }
      tags: [Monthly Runtime, Stacks, Jobs]
      summary: Recreate one fully released managed server generation
      description: >
        Explicitly provisions generation N+1 for the same provider-neutral
        runtime slot after generation N has terminal lease and canonical server
        state, terminal provider operation state, opaque provider-native absence
        evidence, and exact capacity release. The immutable provider, region,
        offering, role, StackKit, and service intent is recovered from the old
        owner-scoped lease; clients cannot replace it. The endpoint delegates to
        the same managed-runtime expansion authority as Add Node, so enrollment,
        Guard evidence, endpoints, and StackKit rollout proceed through the full
        Creation flow. A standard Idempotency-Key is mandatory and safely
        replays the accepted generation.
      parameters:
        - $ref: "#/components/parameters/monthlyRuntimeLeaseId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Opaque, retry-stable key for this confirmed recreate attempt.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyRuntimeRecreateRequest"
      responses:
        "202":
          description: New managed-runtime generation accepted through the central Creation lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddManagedRuntimeServerEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cleanup is incomplete, immutable intent is unavailable, or the slot generation changed.
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ============================================================
  # INTERNAL APIs (SaaS mode only, legacy trust-header compatibility)
  # ============================================================
  /api/internal/sso/exchange:
    post:
      operationId: internalSSOExchange
      x-kombify-internal: true
      tags: [Internal]
      summary: Legacy exchange of edge-validated SaaS token for PocketBase session
      deprecated: true
      description: |
        Legacy internal endpoint used during the Cloudflare/Auth0 migration to
        exchange an Auth0-backed JWT for a PocketBase user session. Protected by
        the legacy trust header compatibility path.
        Only available when `KOMBIFY_SAAS_MODE=true`.
      security:
        - edgeTrustHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Auth0-backed JWT from the public edge
      responses:
        "200":
          description: Legacy PocketBase session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: PocketBase auth token
                  user_id:
                    type: string
                  email:
                    type: string
        "401":
          description: Invalid or expired token
        "403":
          description: Missing or invalid legacy trust header

  /api/internal/feature-flags/apply:
    post:
      operationId: internalFeatureFlagsApply
      x-kombify-internal: true
      tags: [Internal]
      summary: Apply feature flags from SaaS control plane (SaaS only)
      description: |
        Internal endpoint used by the SaaS control plane to push feature flag
        state to this kombify-TechStack instance. Protected by the legacy
        trust-header compatibility path.
        Only available when `KOMBIFY_SAAS_MODE=true`.
      security:
        - edgeTrustHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flags:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      enabled:
                        type: boolean
      responses:
        "200":
          description: Feature flags applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: integer
                  skipped:
                    type: integer
        "403":
          description: Missing or invalid legacy trust header

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC/JWKS bearer token. Self-hosted defaults to Pocket ID; SaaS uses Auth0 through the edge. PocketBase JWT is legacy migration compatibility only.
    runtimeAgentAuth:
      type: http
      scheme: bearer
      bearerFormat: TechStack-Runtime-Agent
      description: Runtime-agent credential bound to the exact tenant, placement, server, and worker identity. Signed, opaque, and explicit legacy compatibility tokens are validated fail-closed by the worker runtime.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service accounts and automation clients (SaaS mode via the public edge)
    edgeTrustHeader:
      type: apiKey
      in: header
      name: X-Edge-Internal-Trust
      description: Legacy trust header injected by the public edge during the migration cutover (SaaS mode only)
  parameters:
    driveHealthServerId:
      name: server_id
      in: query
      required: false
      description: Restrict evidence to one server within the authenticated tenant; an unobserved server remains explicitly missing.
      schema: { type: string, maxLength: 128 }
    applicationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    adoptionPlanId:
      name: planId
      in: path
      required: true
      schema: { type: string }
    serverId:
      name: serverId
      in: path
      required: true
      description: Canonical server runtime ID
      schema:
        type: string
    serviceId:
      name: serviceId
      in: path
      required: true
      description: Canonical service runtime ID
      schema:
        type: string
    stackId:
      name: id
      in: path
      x-kombify-name: stack_id
      required: true
      description: Stack ID
      schema:
        type: string
    resourceId:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: string
    monthlyRuntimeLeaseId:
      name: lease_id
      in: path
      required: true
      description: Monthly runtime lease ID
      schema:
        type: string
    monthlyRuntimeOperationLimit:
      name: limit
      in: query
      required: false
      description: Maximum operation events to return.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    page:
      name: page
      in: query
      required: false
      description: Page number (default 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    perPage:
      name: per_page
      in: query
      required: false
      description: Items per page (default 20, max 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    ApplicationConnectorQueued:
      description: Connector action queued or exact durable replay returned
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/ApplicationConnectorAction" }
    ApplicationLifecycleQueued:
      description: Application lifecycle queued or exact durable replay returned
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/ServiceActionResponse" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: >-
        The request body exceeds the route's bound. Worker routes cap the body before any
        decoding or authentication work; a request without a usable credential is refused
        (401) before its body is read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request failed semantic validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DriveHealthUnavailable:
      description: |
        Drive evidence cannot be read because persistence is unavailable or its
        read failed. When persistence is not configured, details.reason_code is
        drive_health_persistence_unavailable and details.retryable is true.
        Authentication and hosted organization scope are checked before this error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DriveHealthUnavailableError"
    ServiceUnavailable:
      description: Required control-plane persistence or dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected internal error without sensitive implementation details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DriveHealthResponse:
      type: object
      required: [generated_at, servers]
      properties:
        generated_at: { type: string, format: date-time }
        servers:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthServerState" }

    DriveHealthAlertsResponse:
      type: object
      required: [generated_at, alerts]
      properties:
        generated_at: { type: string, format: date-time }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthAlert" }

    DriveHealthServerState:
      type: object
      required: [server_id, worker_id, last_attempt_at, collection_status, inventory_complete, drives, alerts]
      properties:
        server_id: { type: string }
        worker_id:
          type: string
          description: Authenticated Guard identity; empty when the selected server has no observation.
        last_attempt_at:
          type: string
          format: date-time
          description: Latest accepted collection attempt; the zero timestamp 0001-01-01T00:00:00Z denotes no observation.
        collection_status: { $ref: "#/components/schemas/DriveObservationState" }
        collection_reason: { type: string }
        inventory_complete:
          type: boolean
          description: Only a complete inventory supports inference that an absent known identity disconnected.
        drives:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthState" }
        alerts:
          type: array
          description: Server collection conditions, including path-scoped anonymous availability incidents.
          items: { $ref: "#/components/schemas/DriveHealthAlert" }

    DriveObservationState:
      type: string
      enum: [available, incomplete, unsupported, inaccessible, missing, stale, disconnected]
      description: Observation availability, independently of the hardware health assessment.

    DriveHealthState:
      type: object
      required: [drive_id, device_path, observation_status, health, last_attempt_at, last_attempt, last_success, alerts]
      properties:
        drive_id:
          type: string
          description: Immutable hardware-derived identity, or an attempt-specific unidentified-* display ID with no historical continuity.
        device_path: { type: string }
        observation_status: { $ref: "#/components/schemas/DriveObservationState" }
        health:
          type: string
          enum: [healthy, warning, critical, unknown]
          description: Current supported evidence assessment; failed, incomplete or stale collection cannot establish health from absent values.
        last_attempt_at:
          type: string
          format: date-time
          description: Latest attempt, including an ambiguous identity read at a previously observed path; it may be newer than last_attempt.observed_at.
        last_attempt:
          oneOf:
            - $ref: "#/components/schemas/DriveHealthReading"
            - { type: "null" }
        last_success:
          description: Last available identified reading; retained as historical evidence across failed or incomplete attempts.
          oneOf:
            - $ref: "#/components/schemas/DriveHealthReading"
            - { type: "null" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/DriveHealthAlert" }

    DriveHealthReading:
      type: object
      required: [drive_id, device_path, protocol, model, serial, wwn, source, observed_at, status, missing, smart_passed, attribute_failed, temperature_celsius, temperature_warning_celsius, temperature_critical_celsius, critical_warning, percentage_used, available_spare, spare_threshold, media_errors, error_log_entries, self_test_failed, reallocated_sectors, pending_sectors, uncorrectable_sectors, power_on_hours, wear_attributes]
      properties:
        drive_id:
          type: string
          description: SHA-256 of hardware identity, or empty when identity could not be read; never derived from the path.
          pattern: '^(|[a-f0-9]{64})$'
        device_path: { type: string }
        protocol: { type: string, enum: [ATA, NVMe, SCSI, ""] }
        model: { type: string, maxLength: 256 }
        serial: { type: string, maxLength: 256 }
        wwn: { type: string, maxLength: 256 }
        source: { type: string, enum: [smartctl, nvme_cli, inventory] }
        observed_at: { type: string, format: date-time }
        status: { type: string, enum: [available, incomplete, unsupported, inaccessible, missing] }
        reason: { type: string }
        missing:
          type: [array, "null"]
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum: [identity, smart_passed, attribute_failed, temperature_celsius, critical_warning, percentage_used, available_spare, spare_threshold, media_errors, error_log_entries, self_test_failed, reallocated_sectors, pending_sectors, uncorrectable_sectors, power_on_hours]
        smart_passed: { type: [boolean, "null"] }
        attribute_failed: { type: [boolean, "null"] }
        self_test_failed:
          type: [boolean, "null"]
          description: Failed latest reported self-test result; null denotes unreported or unavailable evidence, not a passing test. Reading never starts a self-test.
        temperature_celsius: { type: [number, "null"], minimum: -273.15, maximum: 1000 }
        temperature_warning_celsius: { type: [number, "null"], minimum: -273.15, maximum: 1000 }
        temperature_critical_celsius:
          type: [number, "null"]
          minimum: -273.15
          maximum: 1000
          description: Device-reported critical limit. Missing device limits use advisory Guard policy thresholds (65 C warning, 80 C critical), identified in alert evidence as guard_policy rather than a vendor failure threshold.
        critical_warning:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: NVMe critical-warning bit mask; nonzero bits retain their device meaning.
        percentage_used:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Manufacturer estimate of consumed rated endurance, which may exceed 100. It is neither remaining life nor a precise failure forecast; crossing 90 or 100 is advisory warning absent independent failing evidence.
        available_spare: { type: [integer, "null"], minimum: 0, maximum: 100 }
        spare_threshold: { type: [integer, "null"], minimum: 0, maximum: 100 }
        media_errors: { $ref: "#/components/schemas/DriveHealthCounter" }
        error_log_entries:
          allOf:
            - $ref: "#/components/schemas/DriveHealthCounter"
          description: Cumulative NVMe error-log entries; command errors alone do not establish media failure. Increases receive an advisory inspect-log condition.
        reallocated_sectors: { $ref: "#/components/schemas/DriveHealthCounter" }
        pending_sectors: { $ref: "#/components/schemas/DriveHealthCounter" }
        uncorrectable_sectors: { $ref: "#/components/schemas/DriveHealthCounter" }
        power_on_hours: { $ref: "#/components/schemas/DriveHealthCounter" }
        wear_attributes:
          type: [array, "null"]
          maxItems: 16
          items: { $ref: "#/components/schemas/DriveHealthWearAttribute" }

    DriveHealthCounter:
      type: [string, "null"]
      pattern: '^(0|[1-9][0-9]{0,38})$'
      description: Exact unsigned decimal counter bounded to 128 bits. Null means unreported; clients must preserve precision rather than convert to a floating-point number.

    DriveHealthWearAttribute:
      type: object
      required: [id, name, value, raw, interpretation]
      properties:
        id: { type: integer, minimum: 1, maximum: 255 }
        name: { type: string }
        value:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Manufacturer-normalized attribute, without universal percentage interpretation.
        raw: { $ref: "#/components/schemas/DriveHealthCounter" }
        interpretation: { type: string, enum: [vendor_specific] }

    DriveHealthAlert:
      type: object
      required: [id, worker_id, server_id, category, code, severity, message, evidence, recommended_step, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid, description: Stable condition episode identity. }
        worker_id: { type: string }
        condition_key:
          type: string
          description: Stable server/path availability key for anonymous collection incidents; does not identify physical hardware.
        server_id: { type: string }
        drive_id: { type: string, description: Attributable drive identity; absent on server or anonymous path collection conditions. }
        category: { type: string, enum: [collection, hardware] }
        code:
          type: string
          enum: [collection, stale, observation, disconnected, smart_failed, self_test_failed, attribute_failed, nvme_warning, wear, spare, temperature, media_errors, media_errors_increase, error_log_entries_increase, reallocated_sectors, reallocated_sectors_increase, pending_sectors, pending_sectors_increase, uncorrectable_sectors, uncorrectable_sectors_increase]
        severity: { type: string, enum: [info, warning, critical] }
        message: { type: string, description: Technical fallback; customer clients localize by condition code. }
        evidence:
          type: object
          additionalProperties: { type: string }
          description: Measured values, source/time/path and condition-specific interpretation or threshold_source (device or guard_policy).
        recommended_step: { type: string, description: Technical next-step guidance; clients localize recommendations by condition code. }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          description: Present only after fresh evidence resolves the episode; absence means active, including when later fields are missing.

    DriveHealthUnavailableError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: INTERNAL_ERROR }
            message: { type: string }
            details:
              type: object
              properties:
                reason_code: { type: string, const: drive_health_persistence_unavailable }
                retryable: { type: boolean, const: true }

    StorageForecastResponse:
      type: object
      required: [generated_at, window_start, window_end, resources]
      properties:
        generated_at: { type: string, format: date-time }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        resources:
          type: array
          maxItems: 384
          items:
            type: object
            required: [id, labels, forecast]
            properties:
              id: { type: string }
              labels:
                type: object
                additionalProperties: { type: string }
              forecast: { $ref: "#/components/schemas/StorageForecast" }

    StorageForecast:
      type: object
      required: [state, notes, sample_count, bucket_count, horizon_days]
      properties:
        state:
          type: string
          enum: [insufficient_data, capacity_reached, growing, flat, shrinking, beyond_horizon]
        reason: { type: string }
        notes:
          type: array
          items: { type: string }
        used_bytes: { type: number, minimum: 0 }
        capacity_bytes: { type: number, exclusiveMinimum: 0 }
        free_bytes: { type: number, minimum: 0 }
        latest_at: { type: string, format: date-time }
        observed_from: { type: string, format: date-time }
        observed_to: { type: string, format: date-time }
        sample_count: { type: integer, minimum: 0 }
        bucket_count: { type: integer, minimum: 0 }
        growth_bytes_per_day: { type: number }
        growth_low_bytes_per_day: { type: number }
        growth_high_bytes_per_day: { type: number }
        exhaustion:
          type: object
          required: [earliest_days]
          properties:
            earliest_days: { type: number, minimum: 0 }
            latest_days: { type: number, minimum: 0 }
        horizon_days: { type: number, minimum: 0 }
        capacity_changed_at: { type: string, format: date-time }

    Homelab:
      type: object
      description: The owner's Homelab umbrella (ADR-0036).
      required: [id, name, named, updated]
      properties:
        id: { type: string }
        name: { type: string }
        named:
          type: boolean
          description: Whether the owner chose the name; a generated placeholder name reports false.
        named_at: { type: string, format: date-time }
        intent: { type: object }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    OrphanProjectionCleanupRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [dry_run, apply]
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Required for apply; copied unchanged from the reviewed dry-run.
        stack_id:
          type: string
          description: Optional exact deployment scope used by E2E cleanup.

    OrphanProjectionCleanupCandidate:
      type: object
      required: [resource_type, id, name, class, reason]
      properties:
        resource_type:
          type: string
          enum: [stack_projection, worker_projection]
        id: { type: string }
        name: { type: string }
        class:
          type: string
          enum: [e2e_test_stack, runtime_cloud_test_stack, e2e_test_worker, runtime_cloud_test_worker]
        reason: { type: string }

    OrphanProjectionCleanupResponse:
      type: object
      required: [mode, message, digest, candidates, applied]
      properties:
        mode:
          type: string
          enum: [dry_run, apply]
        message: { type: string }
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/OrphanProjectionCleanupCandidate"
        applied:
          type: object
          required: [stacks, workers, total]
          properties:
            stacks: { type: integer, minimum: 0 }
            workers: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }

    StackKitDeploymentSummary:
      type: object
      description: |
        One StackKit rollout beneath an owner-scoped Homelab. Additional
        runtime projections may be present; the identity fields below are the
        stable product boundary.
      required: [id, kit_deployment_id, homelab_id, stackkit_id, name, mode, status]
      properties:
        id:
          type: string
          description: Legacy compatibility alias for kit_deployment_id.
        kit_deployment_id:
          type: string
        homelab_id:
          type: string
        stackkit_id:
          type: string
        stackkit_instance_id:
          type: string
          description: StackKits StackSpec/ResolvedPlan compatibility identity.
        name:
          type: string
        mode:
          type: string
        status:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
      additionalProperties: true

    InventoryFreshness:
      type: object
      required: [state, stale_after_seconds]
      properties:
        state: { type: string, enum: [fresh, stale, unavailable] }
        age_seconds: { type: integer, format: int64, minimum: 0 }
        stale_after_seconds: { type: integer, format: int64, minimum: 0 }
        reason_code: { type: string }

    InventoryAddresses:
      type: object
      required: [public_ips, private_ips, local_ips, domains]
      properties:
        public_ips: { type: array, items: { type: string } }
        private_ips: { type: array, items: { type: string } }
        local_ips: { type: array, items: { type: string } }
        domains: { type: array, items: { type: string } }

    InventoryObservedState:
      type: object
      required: [state]
      properties:
        state: { type: string }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }

    InventoryResourceMetric:
      type: object
      required: [status]
      description: One heartbeat-observed resource figure. A value is present only when status is ok; a figure outside the freshness window is stale and carries no value.
      properties:
        status: { type: string, enum: [ok, stale, unknown] }
        value: { type: number }
        unit: { type: string }

    InventoryResourceMetrics:
      type: object
      required: [cpu_percent, memory_percent, disk_percent, uptime_seconds]
      properties:
        cpu_percent: { $ref: "#/components/schemas/InventoryResourceMetric" }
        memory_percent: { $ref: "#/components/schemas/InventoryResourceMetric" }
        disk_percent: { $ref: "#/components/schemas/InventoryResourceMetric" }
        uptime_seconds: { $ref: "#/components/schemas/InventoryResourceMetric" }

    InventoryLifecycleProjection:
      type: object
      required: [state]
      properties:
        state: { type: string }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }

    InventoryDesiredProjection:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [running, stopped, absent, unknown] }
        reason_code: { type: string }
        changed_at: { type: string, format: date-time }

    InventoryLeaseProjection:
      type: object
      required: [state]
      properties:
        id: { type: string, description: Opaque runtime-lease identifier; never a credential or provider-resource reference. }
        state: { type: string }

    InventoryCleanupProjection:
      type: object
      required: [state, provider_absence_verified]
      properties:
        state: { type: string, enum: [not_requested, delete_accepted, absence_pending, absent, cleanup_required, failed, unverified] }
        provider_absence_verified: { type: boolean }
        verified_at:
          type: string
          format: date-time
          description: Provider-control evidence collection time; never inferred from a lifecycle tombstone.

    InventoryStackKit:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        variant: { type: string }

    InventoryPlatform:
      type: object
      properties:
        os: { type: string }
        os_version: { type: string }
        arch: { type: string }

    InventoryServer:
      type: object
      required: [id, name, observed_at, freshness, inventory_revision, addresses, platform, stackkit, lifecycle, desired, lease, cleanup, connection, health, metrics]
      properties:
        id: { type: string }
        stack_id: { type: string }
        name: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        addresses: { $ref: "#/components/schemas/InventoryAddresses" }
        platform: { $ref: "#/components/schemas/InventoryPlatform" }
        stackkit: { $ref: "#/components/schemas/InventoryStackKit" }
        provider: { type: string, description: Stable vendor id only; never a provider-native resource handle. }
        lifecycle: { $ref: "#/components/schemas/InventoryLifecycleProjection" }
        desired: { $ref: "#/components/schemas/InventoryDesiredProjection" }
        lease: { $ref: "#/components/schemas/InventoryLeaseProjection" }
        cleanup: { $ref: "#/components/schemas/InventoryCleanupProjection" }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        health: { $ref: "#/components/schemas/InventoryObservedState" }
        metrics: { $ref: "#/components/schemas/InventoryResourceMetrics" }

    InventoryServerList:
      type: object
      required: [observed_at, freshness, inventory_revision, collection_cursor, page_size, servers]
      properties:
        observed_at: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        collection_cursor: { type: string }
        next_cursor: { type: string }
        page_size: { type: integer, minimum: 0, maximum: 200 }
        servers: { type: array, items: { $ref: "#/components/schemas/InventoryServer" } }

    RILServerSummary:
      type: object
      required: [count, has_servers, observed_at]
      properties:
        count: { type: integer, format: int64, minimum: 0 }
        has_servers: { type: boolean }
        observed_at: { type: string, format: date-time }

    InventoryServerHealth:
      type: object
      required: [server_id, observed_at, freshness, inventory_revision, connection, health, metrics]
      properties:
        server_id: { type: string }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        freshness: { $ref: "#/components/schemas/InventoryFreshness" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        connection: { $ref: "#/components/schemas/InventoryObservedState" }
        health: { $ref: "#/components/schemas/InventoryObservedState" }
        metrics: { $ref: "#/components/schemas/InventoryResourceMetrics" }

    ServerPortAllocation:
      type: object
      required: [id, transport, bind_address, port, exposure, observed_state, exposed_state, drift_state, desired]
      properties:
        id: { type: string }
        stack_id: { type: string }
        resolved_plan_hash: { type: string }
        node_ref: { type: string }
        transport: { type: string, enum: [tcp, udp] }
        bind_address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        sharing: { type: string, enum: [exclusive, virtual-host] }
        listener_group_ref: { type: string }
        exposure: { type: string, enum: [local, remote-private, public] }
        source_route_refs: { type: array, items: { type: string } }
        reservation_state: { type: string, enum: [reserved, released] }
        claim_state: { type: string, enum: [pending, mutating, active, uncertain, released] }
        observed_state: { type: string, enum: [unknown, present, missing, stale] }
        exposed_state: { type: string, enum: [unknown, present, missing, stale] }
        drift_state: { type: string, enum: [consistent, missing, unexpected, unknown] }
        desired: { type: boolean }

    ServerPortInventory:
      type: object
      required: [server_id, server_generation, inventory_revision, listeners_complete, exposures_complete, allocations]
      properties:
        server_id: { type: string }
        server_generation: { type: integer, format: int64, minimum: 1 }
        observed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        expires_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        inventory_revision: { type: integer, format: int64, minimum: 0 }
        listeners_complete: { type: boolean }
        exposures_complete: { type: boolean }
        allocations: { type: array, items: { $ref: "#/components/schemas/ServerPortAllocation" } }

    InventoryServiceLink:
      type: object
      required: [url, mode]
      properties:
        url: { type: string, format: uri }
        mode: { type: string, enum: [direct, relay] }

    InventoryService:
      type: object
      required: [id, stack_id, server_id, key, name, desired_state, observed_state, observed_at, freshness, inventory_revision, health, stackkit, links, allowed_actions, source]
      properties:
        id: { type: string }
        stack_id: { type: string }
        server_id: { type: string }
        key: { type: string }
        name: { type: string }
        management_state:
          type: string
          enum: [managed, observed]
