          schema:
            type: string
        - name: service_id
          in: query
          required: false
          description: Return only jobs whose recorded service target matches this id.
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
