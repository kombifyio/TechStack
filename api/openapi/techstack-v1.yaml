                      job_id: { type: string }
                      job_ids: { type: array, items: { type: string } }
                      state: { type: string }
                      operation: { type: string, const: use_case_remove }
                      selector_kind: { type: string }
                      selector_ref: { type: string }
                      removed_workload_refs: { type: array, items: { type: string } }
                      data_disposition: { type: string, const: retain }
                      previous_spec_hash: { type: string }
                      spec_hash: { type: string }
                      accepted_at: { type: string, format: date-time }
                      idempotent_replay: { type: boolean }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

