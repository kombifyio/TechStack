  /api/v1/servers/{serverId}/security/repairs:
    get:
      operationId: listServerSecurityRepairs
      x-kombify-cli: { command: "servers security repairs list", args: [server_id] }
      tags: [Servers]
      summary: List the recent security repairs of one server
      parameters:
        - $ref: "#/components/parameters/serverId"
      responses:
        "200":
          description: Recent repairs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [server_id, repairs]
                    properties:
                      server_id: { type: string }
                      repairs:
                        type: array
                        items: { $ref: "#/components/schemas/SecurityRepair" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: requestServerSecurityRepair
      x-kombify-cli: { command: "servers security repairs request", args: [server_id] }
      x-kombify-confirmation: "This operation restores the named host security controls (firewall, ssh, brute-force protection, automatic updates) on the server through its kombify Guard."
      x-kombify-mcp: false # changes the host's security configuration behind a step-up, not an agent tool
      tags: [Servers]
      summary: Repair named drifted host security controls
      description: >-
        Requests a bounded repair of controls the fresh host security evidence
        reports as drifted and automatically repairable. Requires the server's
        owner, the Edge-signed `techstack.servers.maintenance` entitlement and a
        fresh multi-factor sign-in (at most 300 seconds old). The repair travels
        as a typed, journaled Guard command that runs `stackkit host security
        repair --apply` for exactly the named controls; StackKits refuses, before
        changing anything, a change that would cut the management path or lock the
        owner out. Bounds: one repair per server at a time (409
        `repair_in_progress`), a per-control cooldown (429 `repair_cooldown`), a
        daily attempt budget per control (429 `repair_attempts_exhausted`) and a
        circuit breaker after consecutive failures (429 `repair_circuit_open`); the
        429 answers carry `retry_after`. A control that is compliant (409
        `control_not_drifted`), under an approved exception (`control_has_exception`),
        manual (`control_not_repairable`), blocked on an authorized SSH key
        (`needs_authorized_key`) or not observed is refused. The body is decoded
        strictly.
      parameters:
        - $ref: "#/components/parameters/serverId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityRepairRequest"
      responses:
        "202":
          description: The repair was admitted and is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SecurityRepair" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: A repair bound was reached; `retry_after` names when to try again
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

