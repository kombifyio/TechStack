  /api/v1/workers/{id}/tenant-handoff:
    post:
      operationId: confirmWorkerTenantHandoff
      x-kombify-cli: { command: "workers tenant-handoff confirm", args: [id] }
      x-kombify-mcp: false # owner decision that releases a retired server's command evidence, not an agent tool
      tags: [Workers]
      summary: Confirm the handoff of a retired server's command evidence
      description: >-
        The owner, as custodian of a detached or retired server, confirms that the command evidence its Guard still
        holds (journal entries, outcomes and identity state) may leave the server by `export` (an archive the operator
        takes off the server) or `quarantine` (a root-only directory outside the Guard state). The response shows a
        one-time `confirmation` exactly once and is valid for 72 hours. It is bound to the host key the worker used. The
        operator passes it to `techstack agent handoff --server --confirmation-file`, which has the control plane verify
        it for this server's key, then moves and securely removes the evidence and records a receipt. Pairing a server whose host key served another tenant, or that declares another tenant's evidence,
        is refused (409 `tenant_handoff_required`) until a receipt of that tenant is consumed. A receipt is consumed
        once, by the pairing that proves the confirmed key, before expiry; only that pairing may repeat it within 15
        minutes (409 `tenant_handoff_invalid` otherwise). Requires the
        owner and a fresh multi-factor sign-in (at most 300 seconds old). 409 `tenant_handoff_worker_active` while the
        worker is not revoked or rejected, 409 `tenant_handoff_unbindable` for a worker that never bound a host key. A worker of another tenant or owner is 404.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disposition]
              properties:
                disposition: { type: string, enum: [export, quarantine] }
      responses:
        "201":
          description: The handoff is confirmed; the confirmation is shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [handoff_id, worker_id, disposition, expires_at, confirmation]
                    properties:
                      handoff_id: { type: string }
                      worker_id: { type: string }
                      disposition: { type: string, enum: [export, quarantine] }
                      expires_at: { type: string, format: date-time }
                      confirmation: { type: string }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/tenant-handoffs/verify:
    post:
      operationId: verifyWorkerTenantHandoff
      x-kombify-cli: { command: "workers tenant-handoff verify", hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by a one-time confirmation and a host-key proof, not a user agent tool
      tags: [Workers]
      summary: Check a handoff confirmation before the server removes anything
      description: >-
        Called by `techstack agent handoff` before it moves or removes any command evidence. The request carries the
        one-time confirmation and a DPoP proof signed by the server's host key and bound to the confirmation. 200
        only for an unconsumed, unexpired confirmation that the prior owner issued for exactly that key; otherwise
        409 `tenant_handoff_invalid`. Nothing is consumed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string }
      responses:
        "200":
          description: The confirmation is valid for this server
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified: { type: boolean }
                      handoff_id: { type: string }
                      disposition: { type: string, enum: [export, quarantine] }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/{id}/identity/rotate:
    post:
      operationId: rotateWorkerIdentityKey
      x-kombify-cli: { command: "workers identity rotate", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Rotate the kombify Guard host key
      description: >-
        Authenticated by the current key (access token plus proof). The new key proves possession with its own
        proof. The predecessor stays valid for a bounded overlap.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_public_key, new_key_proof]
              properties:
                new_public_key:
                  type: object
                  additionalProperties: false
                  required: [kty, crv, x]
                  properties:
                    kty: { type: string, enum: [OKP] }
                    crv: { type: string, enum: [Ed25519] }
                    x: { type: string }
                new_key_proof:
                  type: string
                  description: DPoP-shaped proof for this request signed by the new key.
                emergency:
                  type: boolean
                  description: End the predecessor key at once instead of after the short (two minute) overlap, for a Guard that suspects its key was copied.
      responses:
        "200":
          description: Key rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Access token or proof not accepted
        "409":
          description: The key changed during the rotation

  /api/v1/workers/{id}/posture:
    post:
      operationId: reportWorkerPosture
      x-kombify-cli: { command: "workers posture", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Report kombify Guard host security and backup observations
      description: >-
        The Guard's posture channel. A full report carries what the Guard observed
        through the privileged executor's read-only StackKits operations: the
        `stackkit.host-security-evidence/v1` document of `stackkit host security verify`
        and the receipt states of `stackkit backup status`. A check-in (`check_in: true`)
        carries nothing and only asks whether a fresh observation was requested. The
        identity is the authenticated worker's; the control plane recomputes the verdict
        from the controls, judges time by its own clock, and records a document it
        cannot read (unknown schema version, unknown control or state, bad freshness
        window) as `evidence_rejected`, which leaves no earlier pass standing. A
        StackKits release without the command is reported as `unsupported` and shows as
        `security.state: unknown` with `reason_code: stackkit_cli_unsupported`. The
        answer is the directive: `verify_requested` and the routine cadence, and while
        the owner's approval of automatic repair is active, `local_policy`: the signed
        grant of that policy version. Editions without posture answer `state: disabled`.
        The same channel carries the evidence of a repair the Guard ran on its own under
        a local policy while the control plane was unreachable (a body with
        `operation_id`, `GuardLocalOperationEvidence`). It is accepted only against the
        registered policy version it names (same tenant, worker and exact expiry, a
        credential generation no newer than the authenticating one, started inside that
        version's lifetime, for controls it covers, within the persisted cooldown,
        attempt budget and circuit breaker) and acknowledged only after it is recorded in
        the server's repair journal. An identical repeat is acknowledged again
        (`duplicate: true`); anything else is refused with a structured `reason` and
        leaves no record.
      security:
        - runtimeAgentAuth: []
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GuardPostureReport"
                - $ref: "#/components/schemas/GuardLocalOperationEvidence"
      responses:
        "200":
          description: The directive for the next observation, or the acknowledgement of local-policy evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
                          posture: { $ref: "#/components/schemas/GuardPostureDirective" }
                      - $ref: "#/components/schemas/GuardLocalOperationAcknowledgement"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Access token or proof not accepted" }
        "403": { description: "Local-policy evidence of a stale credential generation, or started after the policy version ended (`reason`: stale_generation, authority_expired)" }
        "409": { description: "Local-policy evidence refused (`reason`: local_policy_unregistered, local_policy_scope, local_evidence_invalid, repair_cooldown, repair_attempts_exhausted, repair_circuit_open, result_revision_conflict, result_revision_out_of_order, command_not_pending)" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/{id}/telemetry:
    post:
      operationId: ingestWorkerTelemetry
      x-kombify-cli: { command: "workers telemetry", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Send kombify Guard host and container telemetry
      description: >-
        Telemetry on the managed transport. A batch carries records of one source
        epoch with increasing sequence numbers: each record is one collection cycle of
        the data contract (host CPU, memory, swap, load, disk per mount, uptime and
        container resource usage; SERVER-CONNECTION-STANDARD section 9) or an explicit
        gap marker. The control plane repeats the contract filter, stamps tenant,
        worker and server from the authentication, stores the samples and acknowledges
        only what it stored (`acked_sequence`), so a Guard that lost an acknowledgement
        replays without duplicates and keeps everything else. Editions that store no
        telemetry answer `state: disabled` and the Guard stops collecting.
      security:
        - runtimeAgentAuth: []
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardTelemetryBatch"
      responses:
        "200":
          description: The acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      telemetry: { $ref: "#/components/schemas/GuardTelemetryAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: "Access token or proof not accepted" }
        "413": { description: "The batch exceeds its bound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/workers/{id}/reach:
    post:
      operationId: exchangeWorkerReach
      x-kombify-cli: { command: "workers reach", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers]
      summary: Exchange kombify Guard reach state with the control plane
      description: >-
        kombify Guard reach. A Guard with a bound host key (access token plus proof) reports its
        kombify.me relay connection and hands over the host proof the control plane requested for
        its Connect registration; the answer is the reach document: the overall state, the relay
        target once kombify.me holds the binding for the current generation, and at most one
        outstanding proof request with the exact claims to sign. The document carries no credential.
        Legacy bearer Guards receive `needs_host_key`; deployments without a Cloud connection
        receive `disabled`. A failure downstream is recorded and reported on the server read model,
        never returned as an error to the Guard.
      security:
        - runtimeAgentAuth: []
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                relay:
                  type: object
                  required: [state]
                  properties:
                    state:
                      type: string
                      enum: [connecting, connected, denied, stopped]
                    reason_code:
                      type: string
                      pattern: "^[a-z0-9_.-]{0,64}$"
                    generation:
                      type: integer
                      format: int64
                proofs:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    required: [audience, generation, proof]
                    properties:
                      audience:
                        type: string
                        enum: ["https://connect.kombify.io"]
                      generation:
                        type: integer
                        format: int64
                        minimum: 1
                      proof:
                        type: string
                        maxLength: 4096
      responses:
        "200":
          description: The reach document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Access token or proof not accepted
        "403":
          description: Identity revoked (guard_identity_revoked)
        "503":
          description: Reach is temporarily unavailable

  /v1/ril/servers/connect:
    post:
      operationId: connectRILServer
      x-kombify-cli: { command: "ril servers connect", hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers, RIL]
      summary: Create an idempotent TechStack runtime enrollment
      description: >-
        Creates server_id/runtime_agent_id and returns the Guard enrollment
        handoff for install-command, SSH connect, or managed kombify rollout.
        Provider or SSH bootstrap alone does not mark the server connected.
        The first accepted request creates credential generation 1. Replaying
        the same normalized request with the same Idempotency-Key returns the
        exact same opaque token; another key or payload conflicts and never
        rotates the credential.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 256
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerConnectRequest"
      responses:
        "200":
          description: Runtime enrollment created or returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkerEnrollmentResponse"
        "400":
          description: Missing or invalid Idempotency-Key or request
        "401":
          description: Caller is not authenticated
        "403":
          description: Caller is not authorized to connect a server
        "409":
          description: Idempotency key, request, or runtime identity conflicts with the active credential

  /v1/ril/servers/{id}/credential/rotate:
    post:
      operationId: rotateRILServerCredential
      x-kombify-cli: { command: "ril servers rotate-credential", args: [id], hidden: true }
      x-kombify-mcp: false # node agent protocol authenticated by machine credentials, not a user agent tool
      tags: [Workers, RIL]
      summary: Rotate or recover one runtime-agent credential
      description: >-
        Owner-authenticated, generation-fenced credential rotation. The
        expected generation and Idempotency-Key bind one transition. An exact
        replay returns the same new token; a stale generation, changed request,
        or reused key returns 409.
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 256
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCredentialRotateRequest"
      responses:
        "200":
          description: Credential rotated or exact rotation replay returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkerEnrollmentResponse"
        "400":
          description: Missing generation, Idempotency-Key, or invalid request
        "401":
          description: Caller is not authenticated
        "403":
          description: Caller does not own the server
        "404":
          description: Server or runtime agent not found
        "409":
          description: Stale generation or idempotency conflict

