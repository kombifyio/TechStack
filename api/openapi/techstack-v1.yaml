    put:
      operationId: setServerSecurityAutoRepair
      x-kombify-cli: { command: "servers security auto-repair set", args: [server_id] }
      x-kombify-confirmation: "This operation lets the kombify Guard repair the named host security controls without asking each time, until the approval expires."
      x-kombify-mcp: false # pre-authorizes host changes behind a step-up, not an agent tool
      tags: [Servers]
      summary: Approve or withdraw automatic repair of a small safe set of controls
      description: >-
        Off by default. An approval names controls from the safe set (`allowed_controls`:
        brute-force protection, the firewall policy, kernel parameters and automatic
        security updates; never the ssh controls), expires within 90 days and never
        renews itself. While it is in force the control plane repairs a named control
        that fresh evidence reports drifted, inside the same bounds as an operator
        repair. Requires the owner, the `techstack.servers.maintenance` entitlement
        and a fresh multi-factor sign-in. `enabled: false` withdraws the approval.
      parameters:
        - $ref: "#/components/parameters/serverId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityAutoRepairRequest"
