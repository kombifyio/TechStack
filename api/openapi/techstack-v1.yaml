  # ============================================================
  /api/v1/addons:
    get:
      operationId: listAddons
      tags: [Add-ons]
      summary: List available add-ons
      responses:
        "200":
          description: Add-on registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/addons/detect:
    post:
      operationId: detectAddons
      tags: [Add-ons]
      summary: Auto-detect applicable add-ons for a spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Detected add-ons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  # ============================================================
  # SANITIZED PRODUCT INVENTORY
  # ============================================================
  /api/v1/inventory/servers:
    get:
      operationId: listInventoryServers
      tags: [Inventory]
      summary: List sanitized server inventory for the authenticated owner
      description: >-
        Returns only servers owned by the authenticated subject in the trusted
        tenant context. Tenant and owner overrides are not accepted. Raw
        metadata, channel endpoints, provider-resource references, credentials,
        SSH material, tokens, and logs are never returned. The lease projection
        contains only an opaque identifier and state. Cursor pages share one
        authorization- and filter-bound collection watermark and exclude later
        inserts.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
      x-kombify-mcp:
        toolName: list_servers
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      responses:
        "200":
          description: Owner-scoped inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/InventoryServerList" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/ril/servers:
    $ref: "#/paths/~1api~1v1~1inventory~1servers"

  /api/v1/servers/summary:
    get:
      operationId: getRILServerSummary
      tags: [Inventory, RIL]
      summary: Read the authenticated owner's server-presence summary
      description: >-
        Returns only a count and presence flag under the same tenant and owner
        policy scope as the canonical inventory list. The optional tenant query
        exists for Gateway compatibility and must exactly match the tenant in
        the authenticated identity; a mismatch is rejected before any store
        read. No server, tenant, or subject identifiers are returned.
      parameters:
        - name: tenant
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Owner-scoped server presence; private-cacheable for 60 seconds
          headers:
            Cache-Control:
              schema: { type: string, example: "private, max-age=60" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RILServerSummary" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/ril/servers/summary:
    $ref: "#/paths/~1api~1v1~1servers~1summary"

  /api/v1/inventory/servers/{serverId}/health:
    get:
      operationId: getInventoryServerHealth
      tags: [Inventory]
      summary: Get freshness-qualified health for one owned server
      x-kombify-mcp:
        toolName: server_health
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - $ref: "#/components/parameters/serverId"
      responses:
        "200":
          description: Sanitized health evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/InventoryServerHealth" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/inventory/services:
    get:
      operationId: listInventoryServices
      tags: [Inventory]
      summary: List sanitized services for the authenticated owner's servers
      x-kombify-mcp:
        toolName: list_services
        requiredCapability: techstack.inventory.read
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - name: server_id
          in: query
          description: Optional exact owned server filter; a foreign server is returned as not found.
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor bound to the authenticated scope and exact server_id filter.
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Owner-scoped service inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/InventoryServiceList" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/inventory/servers/{serverId}/access-context:
    get:
      operationId: getInventoryServerAccessContext
      tags: [Inventory]
      summary: Get sanitized access context for one owned server
      description: >-
        Returns address metadata, channel state, and freshness-qualified service
        links only. It never returns endpoint references, access-profile
        references, route IDs, credentials, tokens, SSH users, ports, keys,
        commands, or logs. This surface requires inventory operate permission;
        read permission alone is insufficient.
      x-kombify-mcp:
        toolName: server_access_context
        requiredCapability: techstack.inventory.operate
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      parameters:
        - $ref: "#/components/parameters/serverId"
      responses:
        "200":
          description: Sanitized server access context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/InventoryServerAccessContext" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

