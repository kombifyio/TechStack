      parameters:
        - $ref: "#/components/parameters/stackId"
      responses:
        "200":
          description: Requirements spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stacks/{id}/unified:
    get:
      operationId: getStackUnified
