      tags: [Auth]
      summary: Start linking a kombify Cloud profile (PKCE sign-in)
      description: >-
        Self-hosted installs only. Mints a single-use PKCE state, stores it for 10 minutes, binds it to
        the calling browser with the `techstack_cloud_link` cookie and returns the hosted authorization
        URL that the browser opens (popup or full-page redirect). The callback accepts the sign-in only
        from the same browser, so the flow cannot be completed outside the browser that started it.
        Answers 409 on the SaaS edition and when no Cloud OIDC issuer is configured.
