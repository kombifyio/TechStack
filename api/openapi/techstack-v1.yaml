              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  # ============================================================
  # SERVICE RUNTIME REGISTRY
  # ============================================================
  /api/v1/services:
    get:
      operationId: listServiceRuntimes
      tags: [Services]
      summary: List canonical measured service runtime state
      parameters:
        - name: stack_id
          in: query
          schema:
            type: string
        - name: server_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Owner-scoped service runtime list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceRuntime"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/services/{serviceId}:
    get:
      operationId: getServiceRuntime
      tags: [Services]
      summary: Get desired, observed, health, access, and action capabilities for one service
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Service runtime
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ServiceRuntime"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/registry/services/{serviceId}/actions:
    post:
      operationId: runManagedServiceAction
      tags: [Services, Jobs]
      summary: Queue an owner-authorized StackKits service action
      description: >-
        Derives stack, server, agent, kit and service authority from fresh
        canonical inventory. Exact replays converge through a durable job
        receipt; the raw Idempotency-Key is never persisted. Mutations are
        followed by StackKits verify before measured state changes.
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceActionRequest"
      responses:
        "202":
          description: Action queued or exact durable replay returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServiceActionResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/registry/services/{serviceId}/logs:
    get:
      operationId: getManagedServiceLogs
      tags: [Services, Jobs]
      summary: Read the latest bounded, redacted StackKits service log page
      parameters:
        - $ref: "#/components/parameters/serviceId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Completed or empty service log page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServiceLogsResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "202":
          description: The requested log page is still being collected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServiceLogsResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ============================================================
  # WORKERS
  # ============================================================
  /api/v1/workers:
    get:
      operationId: listWorkers
      tags: [Workers]
      summary: List registered workers (filtered by owner)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Worker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/workers/register:
    post:
      operationId: registerWorker
      tags: [Workers]
      summary: Register worker via pairing token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Pairing token
                hostname:
                  type: string
                ip:
                  type: string
      responses:
        "200":
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Invalid pairing token

  /v1/ril/servers/connect:
    post:
      operationId: connectRILServer
      tags: [Workers, RIL]
      summary: Create an idempotent TechStack runtime enrollment
      description: >-
        Creates server_id/runtime_agent_id and returns the Guard enrollment
        handoff for install-command, SSH connect, or managed kombify rollout.
        Provider or SSH bootstrap alone does not mark the server connected.
        The first accepted request creates credential generation 1. Replaying
        the same normalized request with the same Idempotency-Key returns the
        exact same opaque token; another key or payload conflicts and never
        rotates the credential.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 256
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerConnectRequest"
      responses:
        "200":
          description: Runtime enrollment created or returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkerEnrollmentResponse"
        "400":
          description: Missing or invalid Idempotency-Key or request
        "401":
          description: Caller is not authenticated
        "403":
          description: Caller is not authorized to connect a server
        "409":
          description: Idempotency key, request, or runtime identity conflicts with the active credential

  /v1/ril/servers/{id}/credential/rotate:
    post:
      operationId: rotateRILServerCredential
      tags: [Workers, RIL]
      summary: Rotate or recover one runtime-agent credential
      description: >-
        Owner-authenticated, generation-fenced credential rotation. The
        expected generation and Idempotency-Key bind one transition. An exact
        replay returns the same new token; a stale generation, changed request,
        or reused key returns 409.
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 256
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCredentialRotateRequest"
      responses:
        "200":
          description: Credential rotated or exact rotation replay returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorkerEnrollmentResponse"
        "400":
          description: Missing generation, Idempotency-Key, or invalid request
        "401":
          description: Caller is not authenticated
        "403":
          description: Caller does not own the server
        "404":
          description: Server or runtime agent not found
        "409":
          description: Stale generation or idempotency conflict

  /api/v1/workers/{id}/heartbeat:
    post:
      operationId: heartbeatWorker
      tags: [Workers]
      summary: Runtime agent heartbeat
      description: Accepts either owner-authenticated legacy worker heartbeat or Guard Bearer heartbeat for runtime_agent_id liveness.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/workers/{id}/inventory:
    post:
      operationId: ingestWorkerInventory
      tags: [Workers, RIL]
      summary: Ingest Guard service inventory
      description: >-
        Guard-authenticated inventory ingestion for host health, channels,
        services, and endpoint matrix. StackKits is the source of truth for
        services; TechStack persists the data into worker, registry,
        monitoring, and RIL read models. The runtime-agent token and path bind
        the authoritative tenant, owner, stack, lease, server, and agent
        identities; payload identity fields cannot expand that authority.
      security:
        - runtimeAgentAuth: []
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInventoryRequest"
      responses:
        "200":
          description: Inventory applied or accepted as an exact idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "202":
          description: Valid inventory accepted without replacing a newer canonical Guard observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/workers/{id}/approve:
    post:
      operationId: approveWorker
      tags: [Workers]
      summary: Approve pending worker
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Worker approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /install.sh:
    get:
      operationId: getInstallScript
      tags: [Workers]
      summary: Worker bootstrap script
      security: []
      responses:
        "200":
          description: Shell script for worker installation
          content:
            text/plain:
              schema:
                type: string

  /install.ps1:
    get:
      operationId: getInstallScriptPS
      tags: [Workers]
      summary: Windows worker bootstrap script
      security: []
      responses:
        "200":
          description: PowerShell script for worker installation
          content:
            text/plain:
              schema:
                type: string

  # ============================================================
  # PRE-CHECKS
  # ============================================================
  /api/v1/workers/{id}/prechecks:
    post:
      operationId: runPreChecks
      tags: [Pre-Checks]
      summary: Run pre-checks on worker
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreCheckRequest"
      responses:
        "202":
          description: Pre-checks started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreCheckResponse"
    get:
      operationId: getWorkerPreChecks
      tags: [Pre-Checks]
      summary: Get pre-check results for worker
      parameters:
        - $ref: "#/components/parameters/resourceId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Pre-check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/prechecks/request/{id}:
    get:
      operationId: getPreCheckByRequest
      tags: [Pre-Checks]
      summary: Get pre-check results by request ID
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Pre-check results with pass/fail summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                  all_blocking_passed:
                    type: boolean

  /api/v1/prechecks/{id}/result:
    post:
      operationId: updatePreCheckResult
      tags: [Pre-Checks]
      summary: Update pre-check result (called by agent)
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                message:
                  type: string
                details:
                  type: object
                error:
                  type: string
                duration_ms:
                  type: integer
      responses:
        "200":
          description: Result updated

  # ============================================================
  # AGENTS
  # ============================================================
  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      summary: List connected gRPC agents
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: Paginated agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [Agents]
      summary: Get agent by ID with resources
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeAgent
      tags: [Agents]
      summary: Remove/deregister agent
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Agent removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  agentId:
                    type: string

  /api/v1/agents/{id}/command:
    post:
      operationId: sendAgentCommand
      tags: [Agents]
      summary: Send command to agent
      parameters:
        - $ref: "#/components/parameters/resourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, command]
              properties:
                type:
                  type: string
                command:
                  type: string
                args:
                  type: array
                  items:
                    type: string
      responses:
        "202":
          description: Command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  commandId:
                    type: string
                  agentId:
                    type: string
                  status:
                    type: string
                    example: queued

  /api/v1/agents/{id}/logs:
    get:
      operationId: getAgentLogs
      tags: [Agents]
      summary: Get recent agent logs
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Agent logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"

  /api/v1/agents/{id}/logs/stream:
    get:
      operationId: streamAgentLogs
      tags: [Agents]
      summary: Stream live agent logs via SSE
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Events: "history" (initial batch), "log" (new entries), "ping" (keepalive)

  # ============================================================
  # JOBS
  # ============================================================
  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [Jobs]
      summary: List jobs owned by the authenticated user
      description: |
        Returns the same owner-scoped job state used by the operator UI and
        automation clients. A job with `state: waiting` remains active and the
        current orchestrator process schedules its next check; it is not a
        failed provider action. If that schedule becomes stale after a process
        restart, use the exact-target `resumeStackEnrollment` operation.
      parameters:
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: stack_id
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Owner-scoped jobs and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Get the current state of one owned job
      description: |
        This is the canonical polling surface for the UI, API clients, MCP
        tools, and agents. `waiting_enrollment` exposes a non-terminal wait;
        access to the target remains unavailable until the job resumes and
        reaches a terminal success state.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{id}/stream:
    get:
      operationId: streamJob
      tags: [Jobs]
      summary: Stream job progress via SSE
      description: |
        Emits `progress` events whose JSON payload follows `JobProgress`.
        Waiting-state events include `wait_reason` and `next_resume_at` and
        remain non-terminal.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: SSE event stream for job progress
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/jobs/{id}/logs:
    get:
      operationId: getJobLogs
      tags: [Jobs]
      summary: Get job logs
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Job logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/jobs/stats:
    get:
      operationId: getJobStats
      tags: [Jobs]
      summary: Get job queue statistics
      responses:
        "200":
          description: Job queue stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  stats:
                    type: object
                    required:
                      [
                        total,
                        pending,
                        waiting,
                        running,
                        completed,
                        failed,
                        canceled,
                      ]
                    properties:
                      total: { type: integer, minimum: 0 }
                      pending: { type: integer, minimum: 0 }
                      waiting: { type: integer, minimum: 0 }
                      running: { type: integer, minimum: 0 }
                      completed: { type: integer, minimum: 0 }
                      failed: { type: integer, minimum: 0 }
                      canceled: { type: integer, minimum: 0 }

  # ============================================================
  # DISCOVERY
  # ============================================================
  /api/v1/discovery/networks:
    get:
      operationId: getNetworks
      tags: [Discovery]
      summary: Get local network interfaces
      responses:
        "200":
          description: Network interfaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      type: object

  /api/v1/discovery/scan:
    post:
      operationId: startScan
      tags: [Discovery]
      summary: Start network scan (async)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"

  /api/v1/discovery/scan/{id}:
    get:
      operationId: getScan
      tags: [Discovery]
      summary: Get scan status and results
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/discovery/scan/{id}/cancel:
    post:
      operationId: cancelScan
      tags: [Discovery]
      summary: Cancel running scan
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean

  /api/v1/discovery/scan/{id}/enrich:
    post:
      operationId: enrichScan
      tags: [Discovery]
      summary: Enrich scan results with additional data
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Enriched scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"

  /api/v1/discovery/devices:
    get:
      operationId: listDevices
      tags: [Discovery]
      summary: List caller-owned discovered devices
      description: Returns only devices produced by scans owned by the authenticated caller.
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/v1/discovery/devices/{id}:
    get:
      operationId: getDevice
      tags: [Discovery]
      summary: Get caller-owned discovered device
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Device details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/discovery/probe:
    post:
      operationId: probeDevice
      tags: [Discovery]
      summary: Deep probe a caller-owned device
      description: Non-admin callers may only probe IPs from their own discovery results; admins may probe arbitrary IPs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                ssh_user:
                  type: string
                ssh_key:
                  type: string
      responses:
        "200":
          description: Probe results
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/discovery/test-ssh:
    post:
      operationId: testSSH
      tags: [Discovery]
      summary: Test SSH connectivity to a device
      description: Non-admin callers may only test IPs from their own discovery results; admins may test arbitrary IPs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                port:
                  type: integer
                  default: 22
                user:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: SSH test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/discovery/cache:
    delete:
      operationId: clearDiscoveryCache
      tags: [Discovery]
      summary: Clear discovery cache (admin only)
      responses:
        "200":
          description: Cache cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/discovery/stats:
    get:
      operationId: getDiscoveryStats
      tags: [Discovery]
      summary: Get discovery statistics (admin only)
      responses:
        "200":
          description: Discovery stats
        "403":
          $ref: "#/components/responses/Forbidden"

  # ============================================================
  # FEATURES
  # ============================================================
  /api/v1/features:
    get:
      operationId: listFeatures
      tags: [Features]
      summary: List all features grouped by category
      responses:
        "200":
          description: Features by category
          content:
            application/json:
              schema:
                type: object
                properties:
                  security:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureState"
                  beta:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureState"
                  ux:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureState"

  /api/v1/trust/pairing-tokens:
    get:
      operationId: listPairingTokens
      tags: [Trust]
      summary: List pairing tokens
      responses:
        "200":
          description: Pairing token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      operationId: createPairingToken
      tags: [Trust]
      summary: Create pairing token for worker registration
      responses:
        "200":
          description: Created token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/client-pairing/issue:
    post:
      operationId: issueClientPairingEnvelope
      tags: [Client Binding]
      summary: Issue a short-lived ClientPairingEnvelope v1
      description: >-
        Requires an authenticated instance administrator. Available only for an
        HTTPS self-hosted instance with a configured tenant and native OIDC
        authority. Local single-owner mode fails closed.
      responses:
        "201":
          description: One-time pairing envelope; the raw code is returned only here
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPairingEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
        "403":
          description: Administrator or tenant binding required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
        "409":
          description: Local single-owner mode cannot create a team pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
        "503":
          description: Pairing authority is not safely configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"

  /api/v1/client-pairing/redeem:
    post:
      operationId: redeemClientPairingEnvelope
      tags: [Client Binding]
      summary: Atomically redeem a ClientPairingEnvelope v1 code
      description: >-
        The client verifies the HTTPS certificate fingerprint before sending
        this request. Success consumes the code exactly once and returns public
        metadata for the normal OIDC account flow; it never returns a session or
        duplicates the local owner identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPairingRedeemRequest"
      responses:
        "200":
          description: Code consumed and normal OIDC account handoff returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPairingRedeemResponse"
        "400":
          description: Malformed or unknown code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
        "409":
          description: Binding mismatch, replay, or unsupported local authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
        "410":
          description: Pairing code expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
        "503":
          description: Atomic redemption is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
