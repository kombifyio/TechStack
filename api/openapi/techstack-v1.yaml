      operationId: rebindServerNetwork
      x-kombify-cli: { command: "servers network rebind", args: [server_id] }
      x-kombify-confirmation: "This operation re-detects the server's address on the network it is on now, re-issues its signed local DNS record and re-applies its workspace."
      tags: [Servers]
      summary: Re-bind a moved server to the network it is on now
      description: >-
        Runs `stackkit network rebind` on the server through its kombify Guard: the
        node re-detects its LAN address, re-issues the signed LAN DNS custody record
        and regenerates and re-applies the workspace. The request takes no body.
        Requires the owner, the Inventory operate grant and the
        `techstack.servers.maintenance` entitlement, and a connected Guard (409
