  /api/v1/stacks/{id}/relocations:
    post:
      operationId: startWorkloadRelocation
      x-kombify-cli: { command: "stacks relocations start", args: [stack_id] }
      x-kombify-mcp:
        title: Move workloads to another server
        toolName: start_workload_relocation
        requiredCapability: techstack.inventory.write
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Stacks, Jobs]
      summary: Move Coolify projects or resources from one owned stack's server to another
      description: >-
        Starts a verified move of workloads from the source server (this stack, `source_agent_id`) to a destination
        server of another owned stack. The workloads stop on the source while they transfer and the source is kept
        until both nodes verify the transfer; it can be resumed with the abort operation. Select either whole
        `projects` or individual `resource_uuids`. The transfer secret stays in Wallet custody (`wallet_item_id`) and
        domain switches go only to test domains. Needs exactly one Idempotency-Key; a replay returns the same job.
        Refused with 409 when a target holds locked services or server maintenance runs.
      parameters:
        - $ref: "#/components/parameters/stackId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_agent_id, destination_stack_id, destination_agent_id, wallet_item_id, owner_approved]
              properties:
                source_agent_id: { type: string, description: Guard agent of the source server in this stack. }
                destination_stack_id: { type: string }
                destination_agent_id: { type: string, description: Guard agent of the destination server; must differ from the source. }
                projects:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items: { type: string, maxLength: 128 }
                  description: Whole Coolify projects to move. Mutually exclusive with resource_uuids.
                resource_uuids:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items: { type: string, maxLength: 128 }
                  description: Individual Coolify resources to move. Mutually exclusive with projects.
                wallet_item_id: { type: string, description: Wallet item id (itm_...) of the transfer secret; never the secret itself. }
                domain_switches:
                  type: array
                  maxItems: 64
                  items: { type: string, description: "OLD=NEW host names; NEW must be a test domain." }
                owner_approved: { type: boolean, enum: [true] }
      responses:
        "202":
          description: Relocation accepted or exact replay returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [job_id, kit_deployment_id, operation, source_retained]
                    properties:
                      job_id: { type: string }
                      kit_deployment_id: { type: string, description: The source stack. }
                      operation: { type: string, enum: [workload_relocation] }
                      source_retained: { type: boolean }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/stacks/{id}/relocations/{jobId}/resolve:
