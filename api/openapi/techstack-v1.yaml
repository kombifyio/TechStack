      x-kombify-cli: { command: "auth local setup", hidden: true }
      x-kombify-mcp: false # browser sign-in/session flow; agents authenticate through the Gateway
      tags: [Auth]
      summary: One-shot local owner setup
      description: Local setup verifies the operator's canonical bootstrap password. An authenticated retry with the same chosen owner credentials may finish a missing compatibility marker. Completed setup cannot replace the owner. A legacy cloud choice returns read-only navigation guidance without changing local setup or owner state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [local, cloud]
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  writeOnly: true
                  minLength: 8
                  description: Chosen local owner password; also proves the existing owner during an incomplete-setup retry.
                current_password:
                  type: string
                  writeOnly: true
                  description: Canonical bootstrap password obtained from the host-local owner bootstrap command. Required for an unclaimed local owner.
      responses:
        "200":
          description: Read-only cloud login navigation guidance
        "201":
          description: Local owner setup completed
        "401":
          description: Invalid or missing canonical owner proof
        "403":
          description: Setup completed, locked, or managed by SaaS
        "409":
          description: Canonical bootstrap changed concurrently

