        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/servers/{serverId}/reach:
    put:
      operationId: setServerPublicReach
      x-kombify-cli: { command: "servers reach set", args: [server_id] }
      x-kombify-confirmation: "This operation publishes a service of the server at a public kombify.me address that anyone on the internet can open."
      x-kombify-mcp: false # publishes a service to the internet behind a step-up, not an agent tool
      tags: [Servers]
      summary: Publish the server at a kombify.me address, or stop publishing it
      description: >-
        Nothing is published by default: a paired server has no public route and the relay carries no traffic. The
        owner enables it per server with an explicit `service` name and `target_port` (the origin is always the
        Guard host's loopback, never another machine) and may withdraw it at any time. The relay authenticates the
        Guard, not the visitor, so what answers on that port must protect itself. Enabling requires the owner,
        the `techstack.servers.maintenance` entitlement and a fresh multi-factor sign-in (reason
        `server_reach_step_up_required`); withdrawing is never gated. Responds with the reach section of the
        server read model; the reconciler then creates or withdraws the route.
      parameters:
        - $ref: "#/components/parameters/serverId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardPublicReachRequest"
