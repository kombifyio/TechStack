    get:
      operationId: getServerMaintenanceImpact
      x-kombify-cli: { command: "servers maintenance impact", args: [server_id] }
      x-kombify-mcp:
        requiredCapability: techstack.server.maintenance
        annotations: { readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false }
      tags: [Servers]
      summary: Preview service and stack impact before confirming OS maintenance
      description: >-
        Requires the signed maintenance entitlement and ownership of the server.
        Lists canonical service placement and stack membership, with reasons and
        inventory freshness and completeness. An empty services array means no
        affected services only when inventory.status is current. An incomplete,
        stale or unavailable inventory cannot authorize maintenance. The digest
        binds the server, operation and material dependency snapshot; ordinary
        observation timestamps do not invalidate unchanged impact. Responses are
        private and must not be cached.
      parameters:
        - $ref: "#/components/parameters/serverId"
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [os_update, reboot] }
      responses:
        "200":
          description: Current impact evidence, including incomplete inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServerMaintenanceImpact" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/servers/{serverId}/actions:
    post:
      operationId: runServerMaintenanceAction
      x-kombify-cli: { command: "servers maintenance run", args: [server_id] }
      x-kombify-mcp:
        requiredCapability: techstack.server.maintenance
        annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: false, openWorldHint: true }
      tags: [Servers, Jobs]
      summary: Queue an owned server OS update plan, OS update or reboot
      description: >-
        Requires the Edge-signed `techstack.servers.maintenance` entitlement,
        ownership of the server in the tenant, and current server-bound standing
        authority for delegated native MCP calls. These three ordinary actions
        require no fresh MFA or separate owner_approved assertion. Reboot and
        os_update require expected_impact_digest from the preview the user confirmed.
        Impact is compared atomically at admission and again at execution claim;
        changed or incomplete evidence sends no command and requires a refreshed
        preview and renewed confirmation with a new request key. The body is decoded
        strictly: exact lowercase keys, no duplicates, no unknown fields. A
        replay with the same Idempotency-Key returns the stored receipt before
        target validation. One reboot or OS update and, separately, one update
        plan may be active per server; a job not finished by its deadline
        fails with `deadline_exceeded` and frees its slot. The action is offered in
        `allowed_actions` only when the server agent advertises
        `stackkit.host-maintenance.v1`, and `reboot` only when the server also
        reports `host_boot_id`. Refusals are client-error-envelope/v1
        documents; 409 `reason_code` is one of control_plane_host,
        substrate_node, protected_demo_server, service_locked,
        maintenance_active, node_operation_active, plan_stale,
        agent_capability_missing, boot_id_unknown, agent_not_connected, heartbeat_stale,
        inventory_revision_stale, idempotency_key_reused, impact_confirmation_required,
        impact_changed or impact_unavailable; 403 carries
        entitlement_required or maintenance_origin_authority_denied.
      parameters:
        - $ref: "#/components/parameters/serverId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerMaintenanceRequest"
      responses:
        "202":
          description: Maintenance job queued or exact durable replay returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServerMaintenanceResponse" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/servers/{serverId}/actions/{jobId}:
    get:
      operationId: getServerMaintenanceJob
      x-kombify-cli: { command: "servers maintenance get", args: [server_id, job_id] }
      tags: [Servers, Jobs]
      summary: Read one maintenance job of an owned server
      description: >-
        Scoped like the POST: the Edge-signed `techstack.servers.maintenance`
        entitlement, the tenant, ownership of the server, and a job that
        belongs to this server and was requested by the caller. Anything else
        is 404. Maintenance jobs have their own ledger and are not served by
        `/api/v1/jobs/{id}`. There is no log endpoint: the job carries its
        outcome, and a failure carries its stable code with user guidance.
      parameters:
        - $ref: "#/components/parameters/serverId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: The maintenance job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServerMaintenanceJob" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/servers/{serverId}/actions/{jobId}/cancel:
    post:
      operationId: cancelServerMaintenanceJob
      x-kombify-cli: { command: "servers maintenance cancel", args: [server_id, job_id] }
      x-kombify-mcp: false
      tags: [Servers, Jobs]
      summary: Cancel an owned maintenance job before execution starts
      description: >-
        Uses the same tenant, entitlement, server and requesting-owner scope as
        the job read. Cancellation and execution claim use the same queued-state
        compare-and-set. Repeating a successful cancellation returns its receipt;
        a claimed or finished job returns maintenance_not_cancellable. Cancelling
        never claims to stop a command that has already reached the server.
      parameters:
        - $ref: "#/components/parameters/serverId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Cancelled job, including an exact cancellation replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ServerMaintenanceJob" }
                  meta: { $ref: "#/components/schemas/ResponseMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

