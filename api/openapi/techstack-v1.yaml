  # ============================================================
  # JOBS
  # ============================================================
  /api/v1/jobs:
    get:
      operationId: listJobs
      x-kombify-cli: { command: "jobs list" }
      tags: [Jobs]
      summary: List jobs owned by the authenticated user
      description: |
        Returns the same owner-scoped job state used by the operator UI and
        automation clients. A job with `state: waiting` remains active and the
        current orchestrator process schedules its next check; it is not a
        failed provider action. If that schedule becomes stale after a process
        restart, use the exact-target `resumeStackEnrollment` operation.
      parameters:
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: stack_id
          in: query
          required: false
          schema:
            type: string
        - name: service_id
          in: query
          required: false
          description: Return only jobs whose recorded service target matches this id.
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Owner-scoped jobs and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      x-kombify-cli: { command: "jobs get", args: [id] }
      tags: [Jobs]
      summary: Get the current state of one owned job
      description: |
        This is the canonical polling surface for the UI, API clients, MCP
        tools, and agents. `waiting_enrollment` exposes a non-terminal wait;
        access to the target remains unavailable until the job resumes and
        reaches a terminal success state.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{id}/stream:
    get:
      operationId: streamJob
      x-kombify-cli: { command: "jobs stream", args: [id], hidden: true }
      x-kombify-mcp: false # Server-Sent Events stream; the direct invoker cannot serve a stream
      tags: [Jobs]
      summary: Stream job progress via SSE
      description: |
        Emits `progress` events whose JSON payload follows `JobProgress`.
        Waiting-state events include `wait_reason` and `next_resume_at` and
        remain non-terminal.
      parameters:
        - $ref: "#/components/parameters/resourceId"
      responses:
        "200":
          description: SSE event stream for job progress
          content:
            text/event-stream:
              schema:
                type: string

