openapi: 3.1.0
info:
  title: kombify-TechStack Internal Runtime Lease API
  version: 1.0.0
  description: >-
    Private servicecall contract for the authoritative RuntimeLease boundary.
    Cloud may read a tenant-bound lease. TechStack derives the tenant from the
    signed on_behalf_of org and never accepts a client tenant override. Lease
    creation and provider execution remain unavailable until the separate
    TechStack-native provider-control boundary can admit them atomically.
servers:
  - url: http://techstack.internal
    description: Operator-configured private service origin
tags:
  - name: RuntimeLease
  - name: DomainRouting
  - name: RuntimeSummary
  - name: UsageBudgets
  - name: Household
security:
  - servicecallAuth: []
paths:
  /internal/v1/runtime/creation-pauses:
    get:
      operationId: getInternalRuntimeCreationPause
      tags: [RuntimeSummary]
      summary: Read authoritative account-scoped VM creation protection
      description: >-
        Cloud servicecall and stored membership authorization are required.
        Account scope comes from the authorized signed org, never query input.
        Provider and region are read filters, each supplied at most once.
        The immutable native operation and receipt ledger is authoritative;
        this projection is not a create permit. Status, stop, and delete retain
        their existing authorization. Expired cooldown admits one scoped trial;
        unknown outcomes require canonical existing-generation reconciliation.
      parameters:
        - name: provider_id
          in: query
          required: true
          schema: { type: string, examples: [ionos, centron] }
        - name: region
          in: query
          required: false
          description: Desired region filter; adapter resolves actual canonical placement, including package locations or configured pools. Empty selects existing default placement. Returned region may differ when provider placement overrides the request.
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Durable account/provider/region creation protection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateProtection" }
        "400":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/internal/stacks/domain-attach:
    post:
      operationId: ensureInternalStackDomainRouting
      tags: [DomainRouting]
      summary: Delegate a Cloud-managed domain to one exact stack runtime
      description: >-
        Cloud-only compatibility delegate for the canonical stack-routing
        application service. The signed token supplies tenant and owner authority;
        the request must identify the exact stack, server, and managed RuntimeLease.
        TechStack persists a revisioned routing overlay and never auto-selects a
        stack/server or creates a provider VM. A 202 result includes the real deploy
        job selected for the exact active foundation lease; applied remains false
        until runtime observation proves convergence.
      security:
        - cloudServiceBearer: []
      parameters:
        - $ref: "#/components/parameters/RoutingIdempotencyKey"
        - $ref: "#/components/parameters/RoutingIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalDomainAttachRequest"
      responses:
        "200":
          description: Desired routing state persisted without a pending rollout request.
          headers:
            ETag:
              description: Persisted routing revision.
              schema: { type: string, example: '"2"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalDomainAttachSuccess"
        "202":
          description: Desired routing state persisted; rollout is honestly pending.
          headers:
            ETag:
              description: Persisted routing revision.
              schema: { type: string, example: '"2"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalDomainAttachSuccess"
        "400":
          description: Invalid body, revision header, or mismatched revision inputs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "403":
          description: Invalid Cloud service identity or wrong stack owner/target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "404":
          description: Exact stack, server, or lease target was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "409":
          description: Idempotency-Key was already used for a different request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "412":
          description: Expected routing revision does not match current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "422":
          description: Exact IDs, tenant authority, domain, or provenance are invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "503":
          description: Routing persistence or service authentication is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }

  /api/internal/stacks/{stack_id}/ingress:
    get:
      operationId: getInternalStackIngress
      tags: [DomainRouting]
      summary: Resolve ingress for one exact stack/server/lease tuple
      description: >-
        Read-only Cloud reconciliation surface. The target tuple is mandatory and
        is validated against active RuntimeLease authority; TechStack never falls
        back to the first approved worker or another stack server.
      security:
        - cloudServiceBearer: []
      parameters:
        - name: stack_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: server_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: lease_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Exact target ingress address is available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalIngressSuccess" }
        "403":
          description: Invalid service identity or wrong stack owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "404":
          description: Exact target is missing or its IPv4 ingress is still pending (reason_code=ingress_ipv4_pending).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "422":
          description: Exact target query is incomplete or invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }
        "503":
          description: RuntimeLease authority is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPErrorEnvelope" }

  /api/v1/internal/vm-leases/{lease_id}:
    get:
      operationId: getInternalRuntimeLease
      tags: [RuntimeLease]
      summary: Read one RuntimeLease from the signed caller tenant
      description: >-
        The only product caller is Cloud. Tenant query parameters are rejected;
        the on_behalf_of org is the only tenant authority.
      parameters:
        - $ref: "#/components/parameters/LeaseId"
      responses:
        "200":
          description: Tenant-bound RuntimeLease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeLease"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "404":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/runtime/summary:
    get:
      operationId: getInternalRuntimeSummary
      tags: [RuntimeSummary]
      summary: Read the signed caller owner's servers and services in one round trip
      description: >-
        Private Cloud dashboard read model. Owner and tenant come only from the
        signed on_behalf_of identity; any query string or body is rejected. The
        payload is a projection of the public inventory read model
        (`InventoryServerList` and `InventoryServiceList` in techstack-v1.yaml)
        under the same inventory authorization policy, capped at 50 items each.
      responses:
        "200":
          description: Owner-scoped runtime summary
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, no-cache"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSummary"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/runtime/history:
    get:
      operationId: getInternalRuntimeHistory
      tags: [RuntimeSummary]
      summary: Read the signed caller owner's host-metric history
      description: >-
        Private Cloud monitoring read. Same servicecall boundary and owner
        scope as the runtime summary; the only accepted query parameter is
        `range`. One series per visible server (an empty series when no
        sample exists in the window). A point carries only the figures the
        Guard reported in that interval; gaps are never interpolated. Samples
        are bucketed at 60 s for 24 h and 900 s for 30 d, then aggregated to
        `step_seconds`. An unavailable store answers 503, never an empty list.
      parameters:
        - name: range
          in: query
          required: true
          schema: { type: string, enum: ["1h", "24h", "7d", "30d"] }
      responses:
        "200":
          description: Owner-scoped metric history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHistory"
        "400":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/runtime/events:
    get:
      operationId: getInternalRuntimeEvents
      tags: [RuntimeSummary]
      summary: Read the signed caller owner's recent server and service state changes
      description: >-
        Private Cloud monitoring read over the server and service transition
        timelines of the last 30 days, newest first. A first observation is a
        registration, not a change, and is not listed. Service `observed`
        transitions are reported as field `lifecycle`.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Owner-scoped state changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeEvents"
        "400":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/runtime/ports:
    get:
      operationId: getInternalRuntimePorts
      tags: [RuntimeSummary]
      summary: Read the signed caller owner's observed open ports per server
      description: >-
        Private Cloud monitoring read over the port inventory authority. A
        server whose Guard never reported listeners is `unknown` and an
        expired observation is `stale`; both omit `ports`. An observed host
        with no open port has an empty list.
      responses:
        "200":
          description: Owner-scoped open ports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePorts"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/runtime/backups:
    get:
      operationId: getInternalRuntimeBackups
      tags: [RuntimeSummary]
      summary: Read the signed caller owner's backup facts per server
      description: >-
        Private Cloud monitoring read. `state` is the Guard-observed freshness
        of the newest snapshot (it never proves a restore works; see
        `restore_drill`). `offsite_stored_bytes` is the measured size of the
        stack's whole off-site repository, not of one run. `recent` lists the
        newest backup run outcome per UTC day for the last days that had a run;
        a day without a run has no entry.
      responses:
        "200":
          description: Owner-scoped backup facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeBackups"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/runtime/updates:
    get:
      operationId: getInternalRuntimeUpdates
      tags: [RuntimeSummary]
      summary: Read the signed caller owner's pending updates per server
      description: >-
        Private Cloud monitoring read. `os` projects the operating-system
        update facts from the security evidence the server's Guard already
        reports: `pending_security_updates`, `reboot_required` and
        `last_unattended_run` are present only when that evidence states them;
        otherwise `state` is `unknown` with a reason code. `services` counts
        the services whose version was compared with a published release and
        lists those with a newer one; a service that was not compared is
        counted in `not_compared`, never as up to date.
      responses:
        "200":
          description: Owner-scoped update facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeUpdates"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/usage/budgets:
    get:
      operationId: getInternalUsageBudgets
      tags: [UsageBudgets]
      summary: Read the signed caller owner's managed-server usage for the Cloud budget panel
      description: >-
        Private Cloud read model behind GET /api/v1/usage/budgets. Same
        servicecall authentication as the runtime summary: owner and tenant
        come only from the signed on_behalf_of identity; any query string or
        body is rejected. `used` is the count of managed-server slots the owner
        holds, exactly as managed-runtime admission counts them. `limit`,
        `period` and `resets_at` are always null: a service call carries no
        Gateway-signed budget, so Cloud fills the limit from
        plan-entitlement-budgets.json. An unknown count answers 503, never 0.
      responses:
        "200":
          description: Owner-scoped budget usage
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, no-cache"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageBudgets"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/household/projection:
    post:
      operationId: projectInternalHouseholdMember
      tags: [Household]
      summary: Project a Cloud household member to the owner's homelab
      description: >-
        Companion Feed household (Feed contract v1). Cloud sends the owner-approved
        projection when the owner invites a household member or removes one. The
        service token carries scope `household:projection` and `on_behalf_of.sub`
        equal to `owner_subject` (a member may also remove themselves);
        `on_behalf_of.org_id` is optional and the tenant otherwise resolves from the
        owner's verified membership. `add` runs the StackKits identity operation
        HOUSEHOLD_INVITE on the owner's node and stores a HomelabIdentityRefV1
        reference with status `invited`; `remove` runs HOUSEHOLD_REMOVE
        (`stackkit user remove`) and deletes the reference. An invitation alone never
        links. Techstack keeps no queue: `pending` means the node could not take the
        command now and Cloud re-sends it, which is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdProjectionRequest"
      responses:
        "202":
          description: Projection outcome
          headers:
            Cache-Control:
              schema: { type: string, enum: ["no-store"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdProjectionResult"
        "400":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "401":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/household/links/begin:
    post:
      operationId: beginInternalHouseholdLink
      tags: [Household]
      summary: Read what a member needs to prove the Pocket ID identity
      description: >-
        Kombify Connect D10. Scope `household:link`, `on_behalf_of.sub` is the
        invited member. Returns the stack's Pocket ID issuer (from Techstack's own
        service inventory, never from a token), the OIDC client id and the scopes for
        an authorization-code login with PKCE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdLinkRequest"
      responses:
        "200":
          description: Login parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdLinkBegin"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "404":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/household/links/complete:
    post:
      operationId: completeInternalHouseholdLink
      tags: [Household]
      summary: Complete the link with the member's verified Pocket ID login
      description: >-
        Kombify Connect D10. Scope `household:link`, `on_behalf_of.sub` is the
        invited member. Techstack verifies the ID token (signature through the
        issuer's JWKS, issuer, audience, expiry, nonce) and requires the login to
        name the invited Pocket ID username, or else the invited e-mail address. The
        reference moves from `invited` to `linked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdLinkRequest"
      responses:
        "200":
          description: The linked reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomelabIdentityRef"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "404":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
  /api/v1/internal/household/links:
    get:
      operationId: listInternalHouseholdLinks
      tags: [Household]
      summary: List the owner's household references per stack
      description: >-
        Scope `household:links`. Recipient resolution for producers and Cloud
        (`homelab_linked`). Called on behalf of the owner or with no user it returns
        the whole household; on behalf of a member it returns only that member's own
        reference. `members` holds the linked people, `invited` the still unlinked.
      parameters:
        - name: owner_subject
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The owner's household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdLinks"
        "400":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "403":
          $ref: "#/components/responses/RuntimeLeaseDenied"
        "503":
          $ref: "#/components/responses/RuntimeLeaseDenied"
components:
  securitySchemes:
    servicecallAuth:
      type: apiKey
      in: header
      name: X-Kombify-Service-Auth
      description: >-
        Short-lived HS256 servicecall JWT. Cloud calls require non-empty
        on_behalf_of.sub and on_behalf_of.org_id claims.
    cloudServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived HS256 Cloud service JWT with iss=kombify-cloud,
        aud=kombify-techstack, stack:domain.attach scope, sub=owner, and
        org_id=tenant. This is a private compatibility boundary.
  parameters:
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RoutingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    RoutingIfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional optimistic-concurrency routing revision, for example `"2"`.
      schema: { type: string }
  responses:
    RuntimeLeaseDenied:
      description: Request denied before unsafe persistence or access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorEnvelope"
  schemas:
    CreateProtection:
      type: object
      required: [provider_id, region, state, reason_code, consecutive_failures, recovery, policy]
      properties:
        provider_id: { type: string }
        region: { type: string }
        state: { type: string, enum: [ready, paused, probe_in_flight, outcome_unknown] }
        reason_code: { type: string }
        consecutive_failures: { type: integer, minimum: 0 }
        retry_at: { type: string, format: date-time }
        recovery:
          type: string
          enum: [none, automatic_after_cooldown, wait_for_current_create, reconcile_existing_create]
        last_failure:
          type: object
          required: [code, at]
          properties:
            code: { type: string }
            at: { type: string, format: date-time }
        policy:
          type: object
          required: [threshold, window_seconds, cooldown_seconds]
          properties:
            threshold: { type: integer, const: 3 }
            window_seconds: { type: integer, const: 900 }
            cooldown_seconds: { type: integer, const: 900 }
    RuntimeSummary:
      type: object
      required: [version, generated_at, servers, services]
      properties:
        version: { type: string, enum: ["1"] }
        generated_at: { type: string, format: date-time }
        servers:
          type: object
          description: InventoryServerList projection (see techstack-v1.yaml).
        services:
          type: object
          description: InventoryServiceList projection with management_state (see techstack-v1.yaml).
    RuntimeMonitoringEnvelope:
      type: object
      required: [version, generated_at, scope_state]
      properties:
        version: { type: string, enum: ["1"] }
        generated_at: { type: string, format: date-time }
        scope_state: { type: string, enum: ["ok"] }
    RuntimeHistory:
      allOf:
        - $ref: "#/components/schemas/RuntimeMonitoringEnvelope"
        - type: object
          required: [range, step_seconds, servers]
          properties:
            range: { type: string, enum: ["1h", "24h", "7d", "30d"] }
            step_seconds: { type: integer }
            servers:
              type: array
              items:
                type: object
                required: [server_id, points]
                properties:
                  server_id: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      required: [t]
                      properties:
                        t: { type: string, format: date-time }
                        cpu: { type: number, minimum: 0, maximum: 100 }
                        memory: { type: number, minimum: 0, maximum: 100 }
                        disk: { type: number, minimum: 0, maximum: 100 }
    RuntimeEvents:
      allOf:
        - $ref: "#/components/schemas/RuntimeMonitoringEnvelope"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                type: object
                required: [at, kind, id, name, server_id, field, from, to]
                properties:
                  at: { type: string, format: date-time }
                  kind: { type: string, enum: ["server", "service"] }
                  id: { type: string }
                  name: { type: string }
                  server_id: { type: string }
                  field: { type: string, enum: ["health", "connection", "lifecycle"] }
                  from: { type: string }
                  to: { type: string }
                  reason_code: { type: string }
    RuntimePorts:
      allOf:
        - $ref: "#/components/schemas/RuntimeMonitoringEnvelope"
        - type: object
          required: [servers]
          properties:
            servers:
              type: array
              items:
                type: object
                required: [server_id, state, listeners_complete]
                properties:
                  server_id: { type: string }
                  state: { type: string, enum: ["observed", "stale", "unknown"] }
                  observed_at: { type: string, format: date-time }
                  listeners_complete: { type: boolean }
                  ports:
                    type: array
                    items:
                      type: object
                      required: [port, protocol, bind_address, exposure, exposed_state, desired]
                      properties:
                        port: { type: integer, minimum: 1, maximum: 65535 }
                        protocol: { type: string, enum: ["tcp", "udp"] }
                        bind_address: { type: string }
                        exposure: { type: string, enum: ["local", "lan", "remote-private", "public"] }
                        exposed_state: { type: string, enum: ["present", "missing", "unknown", "stale"] }
                        desired: { type: boolean }
    RuntimeBackups:
      allOf:
        - $ref: "#/components/schemas/RuntimeMonitoringEnvelope"
        - type: object
          required: [servers]
          properties:
            servers:
              type: array
              items:
                type: object
                required: [server_id, state, offsite_configured, recent]
                properties:
                  server_id: { type: string }
                  state: { type: string, enum: ["fresh", "stale", "unknown"] }
                  reason_code: { type: string }
                  last_snapshot_at: { type: string, format: date-time }
                  policy_max_age: { type: string }
                  restore_drill:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: ["verified", "stale", "unknown"] }
                      verified_at: { type: string, format: date-time }
                  offsite_configured: { type: boolean }
                  offsite_stored_bytes: { type: integer, minimum: 0 }
                  offsite_measured_at: { type: string, format: date-time }
                  schedule:
                    type: object
                    required: [cadence, enabled]
                    properties:
                      cadence: { type: string, enum: ["hourly", "daily", "weekly"] }
                      enabled: { type: boolean }
                      last_run_at: { type: string, format: date-time }
                  recent:
                    type: array
                    items:
                      type: object
                      required: [date, state]
                      properties:
                        date: { type: string, format: date }
                        state: { type: string, enum: ["completed", "failed"] }
    RuntimeUpdates:
      allOf:
        - $ref: "#/components/schemas/RuntimeMonitoringEnvelope"
        - type: object
          required: [servers]
          properties:
            servers:
              type: array
              items:
                type: object
                required: [server_id, os, services]
                properties:
                  server_id: { type: string }
                  os:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: ["reported", "unknown"] }
                      reason_code: { type: string }
                      pending_security_updates: { type: integer, minimum: 0 }
                      reboot_required: { type: boolean }
                      last_unattended_run: { type: string, format: date-time }
                  services:
                    type: object
                    required: [compared, not_compared, available]
                    properties:
                      compared: { type: integer, minimum: 0 }
                      not_compared: { type: integer, minimum: 0 }
                      available:
                        type: array
                        items:
                          type: object
                          required: [service_id, name, latest]
                          properties:
                            service_id: { type: string }
                            name: { type: string }
                            current: { type: string }
                            latest: { type: string }
    UsageBudgets:
      type: object
      required: [budgets]
      properties:
        budgets:
          type: array
          items:
            type: object
            required: [key, used, limit, unit, period, resets_at]
            properties:
              key: { type: string, enum: ["cloud.runtime.credits#managed_servers"] }
              used: { type: integer, minimum: 0 }
              limit: { type: "null" }
              unit: { type: string, enum: ["server"] }
              period: { type: "null" }
              resets_at: { type: "null" }
    InternalDomainAttachRequest:
      type: object
      required: [stack_id, server_id, lease_id, domain, cf_zone_id, dns_provider, source]
      additionalProperties: false
      properties:
        stack_id:
          type: string
          minLength: 1
        server_id:
          type: string
          minLength: 1
        lease_id:
          type: string
          minLength: 1
          description: Exact managed RuntimeLease; the Cloud delegate never targets an unleased local runtime.
        domain:
          type: string
          minLength: 1
        cf_zone_id:
          type: string
          minLength: 1
          description: Non-secret Cloudflare zone reference required by this Cloud compatibility delegate.
        dns_provider:
          type: string
          minLength: 1
        source:
          type: string
          minLength: 1
        external_domain_id: { type: string }
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: Body compatibility alias for If-Match; both must agree when supplied.
        ensure_rollout:
          type: boolean
          default: true

    InternalDomainAttachSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/InternalDomainAttachResult"
        meta:
          $ref: "#/components/schemas/HTTPResponseMeta"

    InternalDomainAttachResult:
      type: object
      required: [attachId, status, stack_id, server_id, lease_id, domain, revision, applied, routing]
      properties:
        attachId:
          type: string
          description: Real exact-target deploy job ID for a 202 response.
        status: { type: string, enum: [not_requested, pending, completed, failed] }
        stack_id: { type: string }
        server_id: { type: string }
        lease_id: { type: string }
        domain: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        applied: { type: boolean }
        reason_code: { type: string, description: Optional explicit rollout reason code. }
        routing:
          $ref: "#/components/schemas/StackRoutingView"

    StackRoutingView:
      type: object
      required: [desired, observed, rollout]
      properties:
        desired:
          type: object
          required: [stack_id, server_id, revision, mode, domain, provenance, rollout_status, created_at, updated_at]
          properties:
            stack_id: { type: string }
            server_id: { type: string }
            lease_id: { type: string }
            revision: { type: integer, format: int64, minimum: 1 }
            mode: { type: string, const: custom-domain }
            domain: { type: string }
            provenance:
              type: object
              required: [source, dns_provider]
              properties:
                source: { type: string }
                dns_provider: { type: string }
                zone_id: { type: string }
                external_domain_id: { type: string }
            rollout_status: { type: string, enum: [not_requested, pending, completed, failed] }
            rollout_job_id: { type: string }
            reason_code: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        observed:
          type: object
          required: [status, applied, applied_revision]
          properties:
            status:
              type: string
              enum: [unknown, pending, applied, failed]
              description: Independent DNS, TLS, and runtime convergence state; rollout completion alone remains pending.
            applied: { type: boolean }
            applied_revision: { type: integer, format: int64, minimum: 0 }
        rollout:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [not_requested, pending, completed, failed] }
            job_id: { type: string }
            reason_code: { type: string }
        idempotent_replay: { type: boolean }

    InternalIngressSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [ingress_ip, address, stack_id, server_id, lease_id]
          properties:
            ingress_ip: { type: string }
            address: { type: string }
            stack_id: { type: string }
            server_id: { type: string }
            lease_id: { type: string }
        meta:
          $ref: "#/components/schemas/HTTPResponseMeta"

    HTTPResponseMeta:
      type: object
      properties:
        request_id: { type: string }
        timestamp: { type: string, format: date-time }

    HTTPErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    RuntimeLease:
      type: object
      required:
        - id
        - subject
        - resource
        - desired_state
        - billing_mode
        - lifecycle_class
        - restart_policy
        - recreate_policy
        - valid_from
        - valid_until
      additionalProperties: false
      properties:
        id: { type: string }
        subject:
          $ref: "#/components/schemas/RuntimeLeaseSubject"
        resource:
          $ref: "#/components/schemas/RuntimeLeaseResource"
        desired_state:
          type: string
          enum: [running, stopped, archived]
        billing_mode:
          type: string
          enum: [subscription]
        lifecycle_class:
          type: string
          enum: [subscription]
        restart_policy:
          type: string
          enum: [none, on_unexpected_stop]
        recreate_policy:
          type: string
          enum: [never, manual, automatic_if_stateless]
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        renewed_at: { type: string, format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        metadata:
          type: object
          additionalProperties: { type: string }
    RuntimeLeaseSubject:
      type: object
      required: [kind, id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [user, org]
        id: { type: string }
        org_id: { type: string }
    RuntimeLeaseResource:
      type: object
      required: [provider_id]
      additionalProperties: false
      properties:
        provider_id: { type: string }
        engine_vm_id: { type: string }
        simulation_id: { type: string }
        vm_id: { type: string }
        region: { type: string }
    HouseholdProjectionRequest:
      type: object
      required: [owner_subject, member, action]
      additionalProperties: false
      properties:
        owner_subject: { type: string }
        member:
          type: object
          required: [subject, email, display_name]
          additionalProperties: false
          properties:
            subject: { type: string, description: Auth0 subject of the member }
            email: { type: string }
            display_name: { type: string }
        action: { type: string, enum: [add, remove] }
    HouseholdProjectionResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [projected, none, pending]
          description: >-
            projected: the invite or removal was issued to the node. none: the
            owner has no homelab. pending: the node could not take it now, retry.
        stack_id: { type: string }
        username: { type: string, description: Pocket ID username on the node }
        link_status: { type: string, enum: [invited, linked] }
        activation_url:
          type: string
          description: >-
            One-time passkey enrolment link the node issued with an add. Returned
            once and never stored; hand it to the invited person.
        activation_expires_at: { type: string, format: date-time }
        stacks:
          type: array
          items: { type: string }
          description: Stacks the member was removed from (action remove).
        reason_code: { type: string }
        retryable: { type: boolean }
    HouseholdLinkRequest:
      type: object
      required: [owner_subject]
      additionalProperties: false
      properties:
        owner_subject: { type: string }
        stack_id: { type: string, description: Required when the member is invited on several stacks }
        id_token: { type: string, description: Pocket ID ID token (links/complete only) }
        nonce: { type: string, description: Nonce used in the login (links/complete only) }
    HouseholdLinkBegin:
      type: object
      required: [stack_id, username, issuer, client_id, scope]
      properties:
        stack_id: { type: string }
        username: { type: string }
        issuer: { type: string, description: The stack's Pocket ID origin }
        client_id: { type: string, description: Public OIDC client registered on the node's Pocket ID }
        scope: { type: string }
    HomelabIdentityRef:
      type: object
      required: [stack_id, idp, username, role, cloud_subject, status]
      properties:
        stack_id: { type: string }
        idp: { type: string, enum: [pocket-id, tinyauth] }
        username: { type: string }
        role: { type: string, enum: [owner, member] }
        cloud_subject: { type: string }
        status: { type: string, enum: [invited, linked] }
        linked_at: { type: string, format: date-time }
    HouseholdLinks:
      type: object
      required: [owner_subject, stacks]
      properties:
        owner_subject: { type: string }
        stacks:
          type: array
          items:
            type: object
            required: [stack_id, members, invited]
            properties:
              stack_id: { type: string }
              members:
                type: array
                items: { $ref: "#/components/schemas/HomelabIdentityRef" }
              invited:
                type: array
                items: { $ref: "#/components/schemas/HomelabIdentityRef" }
    InternalErrorEnvelope:
      type: object
      required: [error_code, reason_code, required_features, missing_features, retryable, user_guidance]
      additionalProperties: true
      properties:
        error_code: { type: string }
        reason_code: { type: string }
        required_features:
          type: array
          items: { type: string }
        missing_features:
          type: array
          items: { type: string }
        retryable: { type: boolean }
        user_guidance:
          $ref: "#/components/schemas/UserGuidance"
    UserGuidance:
      type: object
      required: [title, body, next_steps]
      additionalProperties: false
      properties:
        title: { type: string }
        body: { type: string }
        next_steps:
          type: array
          minItems: 1
          items: { type: string }
