// kombify Techstack Agent Protocol
// gRPC with mTLS for secure, bidirectional agent communication

syntax = "proto3";

package techstack.agent.v1;

option go_package = "github.com/kombifyio/techstack/pkg/api/agentpb";

// AgentService handles communication between Core and Agents
service AgentService {
  // Register authenticates and registers an agent with the core
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // Heartbeat maintains connection and reports agent status
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // CommandStream is a bidirectional stream for real-time commands
  rpc CommandStream(stream AgentMessage) returns (stream CoreMessage);
  
  // ReportStatus sends detailed status updates from agent to core
  rpc ReportStatus(StatusReport) returns (StatusAck);

  // RunPreChecks executes pre-deployment checks on the agent (H6a)
  rpc RunPreChecks(PreCheckRequest) returns (PreCheckResponse);

  // PushMetrics receives batched metric samples from agents (Monitoring 2.0)
  rpc PushMetrics(MetricsBatch) returns (PushAck);

  // --- Runtime Intelligence Layer (RIL) RPCs ---

  // GetSystemInfo returns a full snapshot of the server's state.
  rpc GetSystemInfo(SystemInfoRequest) returns (SystemInfoResponse);

  // ReportHealEvent reports an autonomous self-heal action taken by the watchdog.
  rpc ReportHealEvent(HealEventReport) returns (HealEventAck);

  // ReportDetection reports a detected issue that requires user attention.
  rpc ReportDetection(DetectionReport) returns (DetectionAck);

  // StreamLogs opens a server-side stream of log entries for a given service.
  rpc StreamLogs(StreamLogsRequest) returns (stream LogEntry);

  // GetUpdateCandidates returns available OS/package/container updates.
  rpc GetUpdateCandidates(UpdateCandidatesRequest) returns (UpdateCandidatesResponse);

  // ReportUserNotification carries one user-authored smart-home notice (the
  // opt-in `user_notification` agent-channel class, SERVER-CONNECTION-STANDARD
  // section 9). The node holds no notifications-engine credential: Core
  // authenticates the agent, enforces the text bound and the per-node rate
  // limit, resolves the recipients and dispatches the Feed item itself.
  rpc ReportUserNotification(UserNotification) returns (UserNotificationAck);
}

// =============================================================================
// IaC-First Command Enums (Sprint 3: Infrastructure as Code Operations)
// =============================================================================

// TofuOperation defines the OpenTofu operations that can be executed
enum TofuOperation {
  TOFU_OPERATION_UNSPECIFIED = 0;
  TOFU_OPERATION_INIT = 1;      // Initialize working directory
  TOFU_OPERATION_PLAN = 2;      // Create execution plan
  TOFU_OPERATION_APPLY = 3;     // Apply changes to infrastructure
  TOFU_OPERATION_DESTROY = 4;   // Destroy managed infrastructure
  TOFU_OPERATION_OUTPUT = 5;    // Read outputs from state
}

// TerramateOperation defines Terramate orchestration operations (Day-2)
enum TerramateOperation {
  TERRAMATE_OPERATION_UNSPECIFIED = 0;
  TERRAMATE_OPERATION_RUN = 1;          // Run commands across stacks
  TERRAMATE_OPERATION_SYNC_DRIFT = 2;   // Synchronize drift detection
  TERRAMATE_OPERATION_LIST_CHANGED = 3; // List changed stacks
}

// StackKitOperation is the closed public lifecycle command set that Core may
// ask an enrolled agent to run. It deliberately carries no arbitrary argv.
enum StackKitOperation {
  STACKKIT_OPERATION_UNSPECIFIED = 0;
  STACKKIT_OPERATION_VALIDATE = 1;
  STACKKIT_OPERATION_GENERATE = 2;
  STACKKIT_OPERATION_APPLY = 3;
  STACKKIT_OPERATION_VERIFY = 4;
  STACKKIT_OPERATION_UPGRADE = 5;
  STACKKIT_OPERATION_DRIFT_DETECT = 6;
  // Retired (kept for wire compatibility): Standard drift reconcile is never
  // dispatched for a Techstack-managed deployment. Validation rejects it;
  // managed deployments reconcile through ADVANCED_DRIFT_RECONCILE.
  STACKKIT_OPERATION_DRIFT_RECONCILE = 7;
  STACKKIT_OPERATION_PLAN = 8;
  STACKKIT_OPERATION_INIT = 9;
  STACKKIT_OPERATION_SERVICE_START = 10;
  STACKKIT_OPERATION_SERVICE_STOP = 11;
  STACKKIT_OPERATION_SERVICE_RESTART = 12;
  STACKKIT_OPERATION_SERVICE_LOGS = 13;
  STACKKIT_OPERATION_REMOVE = 14;
  // Bind a pre-allocated, secret-free public address prefix into a derived
  // StackSpec before generation. The Agent still builds fixed CLI argv.
  STACKKIT_OPERATION_ADDRESS_BIND = 15;
  // Run one backup for the stack. Backups reach the node over this closed
  // command set, not over an inbound HTTP call: the Guard transport is an
  // outbound long poll authenticated by a per-agent token, so there is no
  // inbound path and no fleet-wide secret on a customer machine.
  STACKKIT_OPERATION_BACKUP_RUN = 16;
  // Read the node's view of the backup repository. It is reporting only: the
  // storage quota is measured control-plane side at the object store, because
  // the node figure is the logical size of one generation.
  STACKKIT_OPERATION_BACKUP_STATUS = 17;
  // Verify and stage one exact owner-signed snapshot through StackKits'
  // native v2 backup lifecycle. The live volumes are never activated by this
  // operation; staged restore evidence is sufficient for a recovery drill.
  STACKKIT_OPERATION_BACKUP_RESTORE = 18;
  STACKKIT_OPERATION_OWNER_ACTIVATION_STATUS = 19;
  STACKKIT_OPERATION_OWNER_ACTIVATION_ISSUE = 20;
  STACKKIT_OPERATION_HOUSEHOLD_LIST = 21;
  STACKKIT_OPERATION_HOUSEHOLD_INVITE = 22;
  // Configure the owner-bound native v2 backup repository for the applied
  // plan. StackKits requires it before the first backup run and after a
  // backup policy or authority change; it is idempotent for an unchanged
  // owner, authority and policy.
  STACKKIT_OPERATION_BACKUP_CONFIGURE = 23;
  // Import the Techstack installation's Advanced issuer trust bundle
  // (stackkit.advanced-trust-bundle/v1, field advanced_trust_bundle) into the
  // node's Owner-bound trust store. Every managed rollout runs it after INIT so
  // the host verifies Techstack-issued Advanced capabilities offline.
  STACKKIT_OPERATION_ADVANCED_TRUST_IMPORT = 24;
  // Advanced Mode operations (ADR-0045). Each carries one Techstack-issued
  // capability (field advanced_capability) that allows the
  // stackkit.advanced-operations/v1 catalog operation named below. Core issues
  // one capability per operator operation: a change-set flow uses the same
  // capability for its create and its apply or reconcile, because StackKits
  // binds a change set to the capability that created it. The Agent renders
  // the argv from the catalog of the exact pinned release; catalog entries
  // that are not available are refused on both sides.
  // terramate.change-set.create: an Owner-signed change set from the candidate
  // StackSpec (candidate_spec_json, or the workspace StackSpec when empty).
  STACKKIT_OPERATION_ADVANCED_CHANGE_SET_CREATE = 25;
  // terramate.change-set.apply: apply change_set_id pinned by
  // change_set_sha256 with the same candidate through the governed transaction.
  STACKKIT_OPERATION_ADVANCED_CHANGE_SET_APPLY = 26;
  // drift.reconcile.advanced: reconcile through change_set_id and prove a clean
  // per-stack drift report afterwards.
  STACKKIT_OPERATION_ADVANCED_DRIFT_RECONCILE = 27;
  // rollback.coordinated: coordinated rollback of the local Terramate stacks
  // to rollback_target_ref (an executor-state snapshot id or a change-set id).
  STACKKIT_OPERATION_ADVANCED_ROLLBACK = 28;
  // restore.drill: stage and verify a restore of a new snapshot, or of
  // snapshot_anchor_id when set, without activation.
  STACKKIT_OPERATION_ADVANCED_RESTORE_DRILL = 29;
  // Host maintenance (StackKits stackkit.host-maintenance/v1). The node's OS,
  // not a stack: these carry no StackSpec, workspace binding or capability
  // document, and need the agent capability stackkit.host-maintenance.v1.
  // `stackkit host updates plan`: read-only pending-update plan and digest.
  STACKKIT_OPERATION_HOST_UPDATE_PLAN = 30;
  // `stackkit host updates apply`: install exactly the plan named by
  // host_plan_digest.
  STACKKIT_OPERATION_HOST_UPDATE_APPLY = 31;
  // `stackkit host reboot`: schedule a guarded reboot after a fixed delay.
  STACKKIT_OPERATION_HOST_REBOOT = 32;
  // `stackkit host security repair --apply`: restore the named drifted host
  // security controls (host_security_controls) without cutting the management
  // path. A host operation needing the agent capability
  // stackkit.host-security.v1; it carries no stack inputs.
  STACKKIT_OPERATION_HOST_SECURITY_REPAIR = 33;
  // Source-bound application adoption; never creates or recreates a runtime.
  STACKKIT_OPERATION_APPLICATION_INSPECT = 34;
  STACKKIT_OPERATION_APPLICATION_ADOPT = 35;
  STACKKIT_OPERATION_APPLICATION_VERIFY = 36;
  STACKKIT_OPERATION_APPLICATION_RELEASE = 37;
  STACKKIT_OPERATION_APPLICATION_CONTROL = 38;
  // Sealed host delivery of the managed off-site backup target (Wallet host
  // delivery). The node, not the control plane, holds the custody and issues
  // its own backup-target binding.
  // `stackkit backup target recipient`: prove the node's separate encryption
  // recipient key, answering recipient_challenge. Carries no secret.
  STACKKIT_OPERATION_BACKUP_TARGET_RECIPIENT = 39;
  // `stackkit backup target import --sealed`: open sealed_delivery into the
  // node's encrypted custody and let the node issue its binding.
  STACKKIT_OPERATION_BACKUP_TARGET_IMPORT = 40;
  // `... import --sealed --rebind`: renew an expired node-issued binding over
  // identical custody from a fresh sealed_delivery.
  STACKKIT_OPERATION_BACKUP_TARGET_REBIND = 41;
  // One step of the Modern Homelab Cloud-node hand-off: Core relays a public
  // document between the Home node and the Cloud node. The closed step set and
  // its argv live in the Agent; the step selects the pinned CLI command.
  STACKKIT_OPERATION_FEDERATION_HANDOFF = 42;
  // Explicit authenticated cache preparation for the retained generation's
  // attested source release. Never runs Upgrade, Apply, or changes its plan.
  STACKKIT_OPERATION_PREPARE_SOURCE_GENERATION = 43;
  // Home network move (agent capability stackkit.network.v1). The server was
  // carried to another network: `stackkit network rebind --yes --json`
  // re-detects the LAN address, re-issues the signed LAN DNS custody record and
  // regenerates and re-applies the workspace.
  STACKKIT_OPERATION_NETWORK_REBIND = 44;
  // `stackkit network status --json`: read-only view of the node's network
  // facts and of its LAN DNS binding.
  STACKKIT_OPERATION_NETWORK_STATUS = 45;
  // public-tls.origin-certificate.request (ADR-0047): the node generates the
  // origin key pair, keeps it, and returns only the CSR for origin_hosts.
  // Capability-gated like the other ADVANCED_* operations.
  STACKKIT_OPERATION_ADVANCED_ORIGIN_CERTIFICATE_REQUEST = 46;
  // public-tls.origin-certificate.install (ADR-0047): verify and install the
  // PEM certificate Cloudflare issued for the pending CSR (origin_certificate_pem,
  // public data) against the node-held key.
  STACKKIT_OPERATION_ADVANCED_ORIGIN_CERTIFICATE_INSTALL = 47;
  // Node-owned Home Assistant connector setup. Only closed metadata crosses
  // Guard; native credentials and Owner custody remain on the node.
  STACKKIT_OPERATION_APPLICATION_CONNECTOR = 48;
  // Read the exact original setup receipt against current local custody and
  // deployment. Never issues, revokes, bootstraps an IdP or replays setup.
  STACKKIT_OPERATION_APPLICATION_CONNECTOR_VERIFY = 49;
  // Promote a verified node-owned staged result, or reconcile its original journal.
  STACKKIT_OPERATION_BACKUP_RESTORE_ACTIVATE = 50;
  STACKKIT_OPERATION_BACKUP_RESTORE_RECOVER = 51;
  // Remove one household subject from the node's Pocket ID
  // (`stackkit user remove <username> --owner-approve --json`). It requires
  // Owner approval and household_username; StackKits refuses owner and admin
  // identities itself.
  STACKKIT_OPERATION_HOUSEHOLD_REMOVE = 52;
  // Wallet items on the node (StackKits pkg/hostdelivery). The kombify Wallet,
  // not the control plane, seals each value to the node's host delivery
  // recipient key; Techstack carries the node's public statement to the Wallet
  // and the ciphertext back.
  // `stackkit host delivery recipient`: prove the node's host delivery
  // recipient key, answering recipient_challenge, and pin the Wallet's
  // delivering key (delivery_authority_key) for its generation. No secret.
  STACKKIT_OPERATION_HOST_DELIVERY_RECIPIENT = 53;
  // `stackkit wallet-item import`: open sealed_delivery, addressed to
  // delivery_tenant_ref, into the node's encrypted Wallet item custody.
  STACKKIT_OPERATION_WALLET_ITEM_IMPORT = 54;
  // `stackkit setup ai-provider`: offer an external OpenAI-compatible
  // provider (ai_provider_base_url) in Private AI with the key of the
  // delivered Wallet item wallet_item_ref, or remove it (ai_provider_disable).
  // The StackSpec and bundle carry only the URL and an opaque key reference.
  STACKKIT_OPERATION_AI_PROVIDER_SETUP = 55;
  // `stackkit user apps <household_username>`: replace the node apps a
  // household member may sign into with household_apps (empty = none) or, when
  // household_apps_set is false, open all apps. Owner approval required.
  STACKKIT_OPERATION_HOUSEHOLD_UPDATE_APPS = 56;
  // PaaS workload relocation (StackKits `stackkit relocate`, Coolify engine).
  // Each acts only on the node it runs on; Core carries the secret-free plan
  // between source and destination and never a transfer secret: send and
  // receive read it from the move's Wallet item (wallet_item_ref,
  // delivery_tenant_ref) that the Wallet delivered to both nodes.
  // `relocate plan --project ... --json` on the source (read-only).
  STACKKIT_OPERATION_RELOCATE_PLAN = 57;
  // `relocate check --plan - --json` on the destination (read-only).
  STACKKIT_OPERATION_RELOCATE_CHECK = 58;
  // `relocate drain --plan - --owner-approve --json` on the source: stops the
  // plan's applications and services; databases keep running.
  STACKKIT_OPERATION_RELOCATE_DRAIN = 59;
  // `relocate drain --undo --owner-approve --json`: the rollback of a move.
  STACKKIT_OPERATION_RELOCATE_UNDRAIN = 60;
  // `relocate send`: back up and share once with the destination.
  STACKKIT_OPERATION_RELOCATE_SEND = 61;
  // `relocate receive`: download from relocation_source_address and restore,
  // with optional relocation_set_domains switches.
  STACKKIT_OPERATION_RELOCATE_RECEIVE = 62;
  // `stackkit host ssh apply --tenant-ref <delivery_tenant_ref> --owner-approve`:
  // apply one Wallet ssh-ca-trust, ssh-ca-revoke or ssh-host-certificate
  // delivery (sealed_delivery on stdin) to the node's sshd. Every SSH delivery
  // carries public material only: a CA public key with its principal map, or
  // a host certificate.
  STACKKIT_OPERATION_HOST_SSH_APPLY = 63;
  // Read the locally Owner-signed move receipt and observe current runtime.
  STACKKIT_OPERATION_RELOCATE_STATUS = 64;
  // Permanently abort a checked move only before any destination restore effects.
  STACKKIT_OPERATION_RELOCATE_ABORT = 65;
  // Author a bounded use-case configuration candidate without applying runtime changes.
  STACKKIT_OPERATION_USE_CASE_CONFIGURE = 66;
  // Author a retained-data candidate for one workload or an exact catalog use case.
  STACKKIT_OPERATION_USE_CASE_REMOVE = 68;
  // Apply one Cloud owner/person generation under the node lifecycle lock.
  STACKKIT_OPERATION_HOUSEHOLD_PROJECT = 69;
}

enum StackKitDriftMode {
  STACKKIT_DRIFT_MODE_UNSPECIFIED = 0;
  // Retired (kept for wire compatibility): every Techstack-managed deployment
  // runs Advanced Mode, so validation rejects STANDARD.
  STACKKIT_DRIFT_MODE_STANDARD = 1;
  STACKKIT_DRIFT_MODE_ADVANCED = 2;
}

// RegisterRequest is sent when an agent first connects
message RegisterRequest {
  string agent_id = 1;           // Unique agent identifier (derived from cert CN)
  string hostname = 2;           // Machine hostname
  string os = 3;                 // Operating system (linux, darwin)
  string arch = 4;               // Architecture (amd64, arm64)
  string version = 5;            // Agent binary version
  repeated string capabilities = 6; // Supported features
}

message RegisterResponse {
  bool accepted = 1;
  string assigned_id = 2;        // Core-assigned agent ID
  string cluster_secret = 3;     // Shared secret for additional auth
  AgentConfig config = 4;        // Initial configuration
}

message AgentConfig {
  int32 heartbeat_interval_seconds = 1;
  int32 status_report_interval_seconds = 2;
  map<string, string> environment = 3;
  repeated string enabled_features = 4;
}

// Heartbeat messages
message HeartbeatRequest {
  string agent_id = 1;
  int64 timestamp_unix = 2;
  ResourceUsage resources = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  int64 server_timestamp_unix = 2;
  repeated PendingCommand pending_commands = 3;
}

message ResourceUsage {
  double cpu_percent = 1;
  int64 memory_used_bytes = 2;
  int64 memory_total_bytes = 3;
  int64 disk_used_bytes = 4;
  int64 disk_total_bytes = 5;
}

// Command streaming
message AgentMessage {
  string agent_id = 1;
  oneof payload {
    CommandResult command_result = 2;
    LogEntry log_entry = 3;
    ServiceStatus service_status = 4;
    TofuResult tofu_result = 5;           // IaC-First: OpenTofu execution result
    StackKitResult stackkit_result = 6;   // Typed StackKits lifecycle result
  }
}

message CoreMessage {
  string message_id = 1;
  oneof payload {
    ExecuteCommand execute = 2;
    DeployService deploy = 3;
    ConfigUpdate config_update = 4;
    ShutdownRequest shutdown = 5;
    TofuCommand tofu_command = 6;         // IaC-First: OpenTofu operation
    TerramateCommand terramate_command = 7; // IaC-First: Terramate orchestration (Day-2)
    StackKitCommand stackkit_command = 8; // Typed StackKits lifecycle operation
  }
}

message ExecuteCommand {
  string command_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> environment = 4;
  string working_directory = 5;
  int32 timeout_seconds = 6;
}

message CommandResult {
  string command_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  int64 started_at_unix = 5;
  int64 finished_at_unix = 6;
}

message DeployService {
  string service_id = 1;
  string service_type = 2;      // docker, systemd, binary
  string image = 3;             // Docker image or binary path
  map<string, string> environment = 4;
  repeated string ports = 5;
  repeated VolumeMount volumes = 6;
}

message VolumeMount {
  string source = 1;
  string destination = 2;
  bool readonly = 3;
}

message ConfigUpdate {
  AgentConfig new_config = 1;
}

message ShutdownRequest {
  string reason = 1;
  bool graceful = 2;
  int32 timeout_seconds = 3;
}

message LogEntry {
  int64 timestamp_unix = 1;
  string level = 2;             // debug, info, warn, error
  string message = 3;
  map<string, string> fields = 4;
}

message ServiceStatus {
  string service_id = 1;
  string state = 2;             // starting, running, stopped, error
  bool healthy = 3;
  string health_message = 4;
  int64 uptime_seconds = 5;
}

message PendingCommand {
  string command_id = 1;
  string type = 2;
  int32 priority = 3;
}

// Status reporting
message StatusReport {
  string agent_id = 1;
  int64 timestamp_unix = 2;
  NodeStatus node = 3;
  repeated ServiceStatus services = 4;
  NetworkStatus network = 5;
}

message NodeStatus {
  string state = 1;             // healthy, degraded, critical
  ResourceUsage resources = 2;
  int64 uptime_seconds = 3;
  string kernel_version = 4;
  int32 running_containers = 5;
}

message NetworkStatus {
  string public_ip = 1;
  string private_ip = 2;
  string tailscale_ip = 3;
  bool vpn_connected = 4;
  repeated string open_ports = 5;
}

message StatusAck {
  bool received = 1;
  int64 next_report_in_seconds = 2;
}

// =============================================================================
// IaC-First Messages (Sprint 3: OpenTofu & Terramate Agent Commands)
// =============================================================================

// TofuCommand sends an OpenTofu operation to an agent for execution.
// The agent executes tofu commands in the specified working directory.
message TofuCommand {
  string command_id = 1;              // Unique command identifier for tracking
  TofuOperation operation = 2;        // Operation to perform (INIT, PLAN, APPLY, etc.)
  string working_directory = 3;       // Directory containing tofu configuration
  bytes hcl_content = 4;              // Optional: HCL configuration to deploy (creates main.tf)
  bytes tfvars_json = 5;              // Optional: Variable values as JSON (creates terraform.tfvars.json)
  int32 timeout_seconds = 6;          // Maximum execution time (default: 300s)
  map<string, string> environment = 7; // Additional environment variables for tofu
  bool auto_approve = 8;              // Skip interactive approval (for apply/destroy)
  repeated string targets = 9;        // Optional: Specific resources to target (-target flag)
}

// TofuResult returns the outcome of an OpenTofu operation.
message TofuResult {
  string command_id = 1;              // Reference to the TofuCommand.command_id
  bool success = 2;                   // True if operation completed successfully
  string stdout = 3;                  // Standard output from tofu command
  string stderr = 4;                  // Standard error from tofu command
  map<string, string> outputs = 5;    // Tofu outputs (for OUTPUT operation or after APPLY)
  int32 resources_changed = 6;        // Number of resources added/changed/destroyed
  string plan_summary = 7;            // Human-readable plan summary (for PLAN operation)
  int32 exit_code = 8;                // Process exit code
  int64 started_at_unix = 9;          // Timestamp when execution started
  int64 finished_at_unix = 10;        // Timestamp when execution completed
  string state_hash = 11;             // Hash of the resulting state file (for drift detection)
}

// TerramateCommand sends a Terramate orchestration operation to an agent (Day-2 feature).
// Terramate provides stack orchestration and drift detection capabilities.
message TerramateCommand {
  string command_id = 1;              // Unique command identifier for tracking
  TerramateOperation operation = 2;   // Operation to perform (RUN, SYNC_DRIFT, etc.)
  string working_directory = 3;       // Terramate project root directory
  repeated string args = 4;           // Additional arguments for the terramate command
  int32 timeout_seconds = 5;          // Maximum execution time (default: 600s)
  map<string, string> environment = 6; // Additional environment variables
  repeated string tags = 7;           // Filter stacks by tags (--tags flag)
  bool changed_only = 8;              // Only operate on changed stacks (--changed flag)
}

// TerramateResult returns the outcome of a Terramate operation.
message TerramateResult {
  string command_id = 1;              // Reference to the TerramateCommand.command_id
  bool success = 2;                   // True if operation completed successfully
  string stdout = 3;                  // Standard output from terramate command
  string stderr = 4;                  // Standard error from terramate command
  int32 exit_code = 5;                // Process exit code
  repeated string changed_stacks = 6; // List of stacks that have changes (for LIST_CHANGED)
  repeated DriftReport drift_reports = 7; // Drift detection results (for SYNC_DRIFT)
  int64 started_at_unix = 8;          // Timestamp when execution started
  int64 finished_at_unix = 9;         // Timestamp when execution completed
}

// DriftReport contains drift detection information for a single stack.
message DriftReport {
  string stack_path = 1;              // Path to the stack
  bool has_drift = 2;                 // True if drift was detected
  string drift_summary = 3;           // Human-readable drift summary
  repeated string drifted_resources = 4; // List of resources with drift
}

// StackKitReleasePin identifies the exact published artifact that both Core
// and Agent must already have admitted independently.
message StackKitReleasePin {
  string version = 1;
  string platform_os = 2;
  string platform_arch = 3;
  string archive_sha256 = 4;
  string release_index_sha256 = 5;
}

// StackKitCommand carries only typed lifecycle inputs. The Agent resolves its
// local release pin and cache, verifies that they match release, and invokes
// that exact binary. There is no command string, argv, environment, or shell.
message StackKitCommand {
  string command_id = 1;
  StackKitOperation operation = 2;
  string working_directory = 3;
  string spec_path = 4;
  string output_directory = 5;
  int32 timeout_seconds = 6;
  StackKitReleasePin release = 7;
  bool offline = 8;
  bool dry_run = 9;
  string target_release = 10;
  StackKitDriftMode drift_mode = 11;
  bool owner_approved = 12;
  string local_site_ref = 13;
  string local_node_ref = 14;
  string local_execution_channel_ref = 15;
  string stackkit = 16;
  string stack_name = 17;
  string domain = 18;
  string expected_spec_hash = 19;
  // Bounded provider-free stackkit.inventory/v1 document materialized by
  // Guard before the fixed lifecycle operation.
  bytes inventory_json = 20;
  string service_key = 21;
  int32 log_tail = 22;
  string log_cursor = 23;
  // Canonical ResolvedPlan digest admitted by the control plane. Apply must
  // compare it under StackKits' node lifecycle/output lock before mutation.
  string expected_plan_hash = 24;
  // StackKits-owned StackSpec/ResolvedPlan stackId expected in the selected
  // workspace. Service operations must compare it before reading or mutating.
  string stackkit_instance_id = 25;
  // Exact ResolvedPlan workload ref selected for Owner-approved removal.
  string workload_ref = 26;
  // Secret-free DNS label allocated by the managed address authority.
  string address_prefix = 27;
  // Relative derived StackSpec written by the pinned StackKits address binder.
  string bound_spec_path = 28;
  // Complete approved canonical StackSpec (at most 2 MiB). INIT persists it
  // through the pinned CLI's candidate-input/CAS path. The Advanced
  // ADVANCED_CHANGE_SET_CREATE, ADVANCED_CHANGE_SET_APPLY and
  // ADVANCED_DRIFT_RECONCILE operations pass it as --candidate-spec; when it
  // is empty they use the workspace StackSpec at spec_path. Every other
  // operation rejects it. The agent never reconstructs desired intent.
  bytes candidate_spec_json = 29;
  // Content-addressed owner-signed snapshot selected for BACKUP_RESTORE.
  // The CLI resolves the repository snapshot and fixed staging path from this
  // anchor; callers cannot supply a raw repository id or destination path.
  string snapshot_anchor_id = 30;
  // INIT only: the stack Owner's signed-in account email. StackKits requires a
  // real email for --owner-source=local on a fresh node (the PocketID owner);
  // a node that already holds Owner custody keeps its established identity.
  string owner_email = 31;
  string household_username = 32;
  string household_email = 33;
  string household_display_name = 34;
  // ADVANCED_TRUST_IMPORT only: the exact canonical
  // stackkit.advanced-trust-bundle/v1 bytes (public keys only, at most
  // 64 KiB). The agent pins their SHA-256 when it invokes the CLI.
  bytes advanced_trust_bundle = 35;
  // One canonical stackkit.advanced-capability/v1 document (at most 64 KiB)
  // issued for this command's operator operation. Required by the
  // capability-gated ADVANCED_* operations (25 to 29, 44, 45) and rejected by every
  // other operation. The Agent writes it to a 0600 file in the working
  // directory for --capability and removes the file afterwards.
  bytes advanced_capability = 36;
  // ADVANCED_CHANGE_SET_APPLY and ADVANCED_DRIFT_RECONCILE: the change set
  // ADVANCED_CHANGE_SET_CREATE returned and the SHA-256 of its stored bytes,
  // both sha256:<64 hex>.
  string change_set_id = 37;
  string change_set_sha256 = 38;
  // ADVANCED_ROLLBACK: the sha256 executor-state snapshot id or change-set id
  // to roll back to (a change-set id selects its pre-apply checkpoint).
  string rollback_target_ref = 39;
  // HOST_UPDATE_APPLY only: the sha256:<64 hex> plan digest a completed
  // HOST_UPDATE_PLAN returned; StackKits installs exactly that plan or refuses.
  string host_plan_digest = 40;
  // HOST_SECURITY_REPAIR only: the control ids to restore (at least one, at
  // most the closed stackkit.host-security-evidence/v1 set, no duplicates).
  repeated string host_security_controls = 41;
  // APPLICATION_* only: immutable full Docker container identity. Adopt
  // binds the exact reviewed source assessment; operation id is replay-safe.
  string application_container_id = 42;
  string application_plan_digest = 43;
  string application_operation_id = 44;
  // APPLICATION_CONTROL only: start, stop, or restart.
  string application_action = 45;
  // BACKUP_TARGET_IMPORT and BACKUP_TARGET_REBIND only: one sealed
  // stackkit.sealed-host-delivery/v1 envelope (ciphertext only, at most
  // 64 KiB, short-lived and single-use). It is bound to the tenant, node,
  // binding generation, operation, recipient key and expiry; only the node's
  // StackKits opens it. The agent hands it to the pinned CLI on stdin.
  bytes sealed_delivery = 46;
  // The tenant a sealed delivery is addressed to (non-secret).
  string delivery_tenant_ref = 47;
  // BACKUP_TARGET_RECIPIENT only: the fresh value the node must echo in its
  // signed recipient statement (non-secret, at most 128 bytes).
  string recipient_challenge = 48;
  // FEDERATION_HANDOFF only. handoff_step is one of member-admit, member-join,
  // member-certify, member-import, peer-request, peer-enroll, peer-install,
  // binding-adopt, link-requirement, link-bind. handoff_ref and handoff_ref2 are the step's
  // references (node, peer, Home key id, origin server name or Home root
  // digest); each is empty unless the step takes it. handoff_document is the
  // public JSON the previous step produced (at most 128 KiB); it never carries
  // a private key or custody directory content.
  string handoff_step = 49;
  string handoff_ref = 50;
  bytes handoff_document = 51;
  string handoff_ref2 = 52;
  // PLAN and BACKUP_TARGET_RECIPIENT only: inspect an already applied
  // generation through its installed attested historical source for managed
  // same-custody renewal. Never authorizes historical Apply or Restore.
  bool source_generation_inspection = 53;
  // ADVANCED_ORIGIN_CERTIFICATE_REQUEST only: the managed kombify.me hostnames
  // the origin certificate covers (every name ends in .kombify.me).
  repeated string origin_hosts = 54;
  // ADVANCED_ORIGIN_CERTIFICATE_INSTALL only: the PEM leaf certificate
  // (public data, at most 64 KiB). Never a private key.
  bytes origin_certificate_pem = 55;
  // APPLICATION_CONNECTOR[_VERIFY] only: bounded, closed metadata document
  // stackkit.home-assistant-connector-request/v1. application_operation_id
  // retains the original setup identity even for a new read command_id.
  bytes application_connector_request_json = 56;
  // Exact owner-signed staged result; no repository ID or filesystem path.
  string restore_result_id = 57;
  // Stable node activation identity, independent of transport retries and recover job IDs.
  string activation_operation_id = 58;
  // RECOVER only: immutable original admission A. release remains the verified
  // current execution B; the current CLI may only delegate this original journal.
  StackKitReleasePin original_recovery_release = 59;
  // HOST_DELIVERY_RECIPIENT only: the delivering authority's Ed25519 public
  // key (unpadded standard base64) and key id the node pins for its current
  // generation. Public values; both empty keeps the pinned authority.
  string delivery_authority_key = 60;
  string delivery_authority_key_id = 61;
  // AI_PROVIDER_SETUP only: the provider's https base URL and the Wallet item
  // (itm_...) delivered to the node that holds its key, or ai_provider_disable
  // to remove the provider. Never a key value.
  string ai_provider_base_url = 62;
  string wallet_item_ref = 63;
  bool ai_provider_disable = 64;
  // HOUSEHOLD_INVITE and HOUSEHOLD_UPDATE_APPS only: the grantable node app
  // ids (ai, automation, dev, documents, files, game, mail, marketplace,
  // media, network, photos, remote, smart-home) passed as one --app each.
  // household_apps_set distinguishes an explicit empty list (none) from no
  // restriction (all apps).
  repeated string household_apps = 65;
  bool household_apps_set = 66;
  // RELOCATE_PLAN and RELOCATE_SEND only: the Coolify projects to move.
  repeated string relocation_projects = 67;
  // RELOCATE_CHECK and RELOCATE_DRAIN only: the secret-free plan
  // RELOCATE_PLAN returned (at most 1 MiB), handed to the CLI on stdin.
  bytes relocation_plan_json = 68;
  // RELOCATE_SEND and RELOCATE_RECEIVE only: the bare host or IP address the
  // destination reaches the source's share on.
  string relocation_source_address = 69;
  // RELOCATE_RECEIVE only: OLD=NEW domain switches of the restored resources.
  repeated string relocation_set_domains = 70;
  // RELOCATE_PLAN and RELOCATE_SEND only: exact individual application UUIDs.
  // Projects and UUID selectors are mutually exclusive; dependencies remain included.
  repeated string relocation_resource_uuids = 71;
  // Shared semantic move identity on send and receive, scoped to one durable job.
  string relocation_transfer_id = 72;
  // USE_CASE_CONFIGURE only: strict public catalog intent. Guard chooses every argv and candidate path.
  bytes use_case_configuration_json = 73;
  // USE_CASE_REMOVE only: strict retained-data selector and catalog membership.
  bytes use_case_removal_json = 75;
  // HOUSEHOLD_PROJECT only: opaque owner/person digest, positive generation,
  // and add/remove intent. Older pinned binaries reject this operation.
  string household_projection_key = 76;
  uint64 household_projection_revision = 77;
  string household_projection_action = 78;
}

// StackKitResult transports the normalized stackkit.command-result/v1 JSON
// envelope and the StackKits rollout-event JSONL records as distinct typed
// fields. stderr is redacted by the Agent before transport.
message StackKitResult {
  string command_id = 1;
  bool success = 2;
  int32 exit_code = 3;
  bytes command_result_json = 4;
  string command_result_schema_version = 5;
  repeated bytes events_jsonl = 6;
  string events_schema_version = 7;
  string stderr = 8;
  int64 started_at_unix = 9;
  int64 finished_at_unix = 10;
  StackKitReleasePin release = 11;
  // The Agent sets this only when the exact pinned StackKits CLI successfully
  // returned native backup evidence after StackKits performed its local Owner
  // custody verification. Techstack does not possess that Owner public key.
  bool pinned_cli_evidence_verified = 12;
  // SHA-256 of command_result_json, binding the attestation to the exact bytes
  // transported on the authenticated Agent result channel.
  string pinned_cli_evidence_sha256 = 13;
  // Raw approved owner activation/invitation response. This field is valid
  // only for explicitly approved identity mutations and must be consumed by
  // the synchronous request path without job, ledger, event, or log storage.
  bytes sensitive_result_json = 14;
  // ADVANCED_CHANGE_SET_CREATE only: sha256:<64 hex> of the stored change-set
  // record the create result names (data.path), computed by the Agent. Apply
  // and Advanced reconcile pin these exact bytes with --expect-sha256.
  string advanced_change_set_sha256 = 15;
  // FEDERATION_HANDOFF only: the public document the step produced for the
  // other node, read by the Agent from the pinned CLI's own output.
  bytes handoff_document = 16;
}

// =============================================================================
// Pre-Check Messages (Sprint 2: H6a - Pre-Check Execution on Agents)
// =============================================================================

// PreCheckRequest is sent from Core to Agent to execute pre-deployment checks.
message PreCheckRequest {
  string request_id = 1;                    // Unique request identifier for tracking
  repeated PreCheckDefinition checks = 2;   // List of checks to execute
  int32 timeout_seconds = 3;                // Overall timeout for all checks
}

// PreCheckDefinition describes a single pre-check to run.
message PreCheckDefinition {
  string type = 1;                // Check type: "docker_version", "gpu_available", "disk_space", "ram_available", "port_available"
  string description = 2;         // Human-readable description
  string min_version = 3;         // Minimum version (e.g., for docker_version)
  bool blocking = 4;              // If true, failure blocks deployment
  map<string, string> params = 5; // Check-specific parameters (e.g., {"min_gb": "50"} for disk_space)
}

// PreCheckResponse contains results from all executed checks.
message PreCheckResponse {
  string request_id = 1;                  // Reference to the request
  repeated PreCheckResult results = 2;    // Results for each check
  bool all_blocking_passed = 3;           // Convenience: true if all blocking checks passed
  int64 executed_at_unix = 4;             // Timestamp when checks were executed
}

// PreCheckResult is the outcome of a single pre-check.
message PreCheckResult {
  string type = 1;                  // Reference to PreCheckDefinition.type
  string status = 2;                // "passed", "failed", "skipped", "warning"
  string message = 3;               // Human-readable result message
  map<string, string> details = 4;  // Check-specific details (e.g., {"version": "24.0.7"})
  string error = 5;                 // Error message if failed
}

// =============================================================================
// Monitoring 2.0 Messages (Agent-based metrics collection)
// =============================================================================

// MetricType classifies the semantic type of a metric sample.
enum MetricType {
  METRIC_GAUGE = 0;       // Point-in-time value (e.g., CPU%, memory usage)
  METRIC_COUNTER = 1;     // Monotonically increasing counter (e.g., bytes sent)
  METRIC_HISTOGRAM = 2;   // Distribution (e.g., request latencies)
}

// MetricSample is a single metric data point.
message MetricSample {
  string name = 1;                    // Metric name (e.g., "node_cpu_usage_percent")
  double value = 2;                   // Metric value
  map<string, string> labels = 3;     // Dimensional labels (e.g., {"core": "0", "mode": "user"})
  MetricType type = 4;                // Semantic type for storage/query
  int64 timestamp_unix = 5;           // Unix timestamp in milliseconds
}

// MetricsBatch contains a batch of metric samples from an agent.
message MetricsBatch {
  string agent_id = 1;               // Agent that collected these metrics
  int64 timestamp_unix = 2;          // Batch creation timestamp (Unix ms)
  repeated MetricSample samples = 3; // Metric samples in this batch
}

// PushAck is the response to a PushMetrics call.
message PushAck {
  bool accepted = 1;                  // Whether the batch was accepted
  int32 samples_accepted = 2;        // Number of samples stored
  string error = 3;                   // Error message if rejected
}

// =============================================================================
// Runtime Intelligence Layer (RIL) Messages
// =============================================================================

// SystemInfoRequest asks the agent for a full system snapshot.
message SystemInfoRequest {
  string agent_id = 1;
}

// SystemInfoResponse is a comprehensive snapshot of the server state.
message SystemInfoResponse {
  string agent_id = 1;
  string hostname = 2;
  string os_name = 3;
  string os_version = 4;
  string kernel_version = 5;
  string arch = 6;
  int64 uptime_seconds = 7;
  ResourceUsage resources = 8;
  repeated InstalledPackage packages = 9;
  repeated RunningService services = 10;
  repeated ContainerInfo containers = 11;
  repeated string open_ports = 12;
  int64 collected_at_unix = 13;
}

// InstalledPackage describes an installed OS or container package.
message InstalledPackage {
  string name = 1;
  string version = 2;
  string manager = 3;              // apt, yum, apk, snap, docker
}

// RunningService describes a running systemd unit or similar.
message RunningService {
  string name = 1;
  string status = 2;               // running, stopped, failed, inactive
  string type = 3;                 // systemd, docker, podman, binary
  int64 pid = 4;
  int64 uptime_seconds = 5;
  int64 memory_bytes = 6;
  double cpu_percent = 7;
  int32 restart_count = 8;
}

// ContainerInfo describes a running Docker/Podman container.
message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  string status = 4;               // running, paused, stopped, restarting
  int64 created_at_unix = 5;
  int64 memory_bytes = 6;
  double cpu_percent = 7;
  repeated string ports = 8;
}

// --- Self-Heal Watchdog Messages ---

// HealEventSeverity classifies the severity of a heal event.
enum HealEventSeverity {
  HEAL_SEVERITY_INFO = 0;
  HEAL_SEVERITY_WARNING = 1;
  HEAL_SEVERITY_CRITICAL = 2;
}

// HealEventReport is sent by the watchdog after auto-remediation.
message HealEventReport {
  string agent_id = 1;
  string recipe_name = 2;          // e.g., "service-restart", "disk-cleanup"
  string trigger_reason = 3;       // Why the recipe triggered
  bool auto_executed = 4;          // true if auto-exec, false if detection-only
  bool success = 5;
  string action_taken = 6;         // Human-readable description of the action
  string rollback_available = 7;   // Description of rollback option
  string error_message = 8;        // Error if success=false
  HealEventSeverity severity = 9;
  int64 timestamp_unix = 10;
  map<string, string> metadata = 11;
}

// HealEventAck acknowledges receipt of a heal event.
message HealEventAck {
  bool received = 1;
  string event_id = 2;             // Core-assigned event ID for audit
}

// --- Detection Engine Messages ---

// DetectionReport is sent when the agent detects an issue needing user attention.
message DetectionReport {
  string agent_id = 1;
  string engine = 2;               // "update-scanner", "error-matcher", etc.
  string type = 3;                 // "update", "error_fix", "resource", "drift", "security"
  string severity = 4;             // "info", "warning", "critical"
  string title = 5;
  string description = 6;
  string suggested_action = 7;
  bytes evidence_json = 8;         // Raw evidence data
  int64 timestamp_unix = 9;
}

// DetectionAck acknowledges a detection report.
message DetectionAck {
  bool received = 1;
  string action_card_id = 2;       // ID of the created ActionCard
}

// --- Log Streaming Messages ---

// StreamLogsRequest opens a log stream for a specific service.
message StreamLogsRequest {
  string agent_id = 1;
  string service_name = 2;         // Empty = all services
  string severity_filter = 3;      // Minimum severity: debug, info, warn, error
  int64 since_unix = 4;            // Only logs after this timestamp
  int32 tail_lines = 5;            // Number of historical lines (0 = live only)
}

// --- Update Candidates Messages ---

// UpdateCandidatesRequest asks the agent for available updates.
message UpdateCandidatesRequest {
  string agent_id = 1;
}

// UpdateCandidatesResponse lists available updates.
message UpdateCandidatesResponse {
  string agent_id = 1;
  repeated UpdateCandidate candidates = 2;
  int64 checked_at_unix = 3;
}

// UpdateCandidate describes a single available update.
message UpdateCandidate {
  string package_name = 1;
  string current_version = 2;
  string available_version = 3;
  string manager = 4;              // apt, yum, docker, snap
  string severity = 5;             // none, low, medium, high, critical
  repeated string cve_ids = 6;     // Related CVE identifiers
  string changelog_url = 7;
}

// --- User Notification Messages (smart-home notices) ---

// UserNotification is one notice a Home Assistant automation author wrote. It
// carries only that text: never entity states, presence, locks, cameras or
// sensor history.
message UserNotification {
  string agent_id = 1;
  string automation_id = 2;        // Collapse key: one Feed item per automation
  string text = 3;                 // At most 280 characters
  string audience = 4;             // "me", "household" or "member"
  string member_username = 5;      // Pocket ID username, only for audience "member"
  string source = 6;               // "home_assistant"
}

// UserNotificationAck answers a UserNotification. A refusal is structured, not
// a transport error, so the node can show the automation author the reason.
message UserNotificationAck {
  bool accepted = 1;
  string status = 2;               // "accepted" or "refused"
  string refusal_code = 3;         // text_too_long, rate_limited, audience_invalid, no_recipients, ...
  int32 retry_after_seconds = 4;   // Set with rate_limited
  int32 recipients = 5;            // Number of Feed recipients dispatched
}
