allowBuilds:
  "@sentry/cli": true
  browser-tabs-lock: false
  esbuild: true
  sharp: true
  workerd: true
# Vite+ (D-2026-10-30-06): one pinned version of the toolchain. `vite` is the
# vite-plus-core build of Vite 8 (bundled Vite 8.3.5 at 1.4.0) and `vp dev`,
# `vp build` and `vp test` need every package that imports `vite` to resolve to it.
# Move both entries together with the other fleet repositories.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
# The vite-plus-core alias is version 1.x of the Vite 8 line, so peers that declare
# `vite ^8` (SvelteKit, vite-plugin-svelte, @tailwindcss/vite, vitest) would otherwise warn.
peerDependencyRules:
  allowedVersions:
    vite: "*"
overrides:
  # A transitive `vite` (the Svelte and Tailwind plugins) must be the instance the build uses.
  vite: "catalog:"
  vite-plus: "catalog:"
  # kombify-vendor:start (generated by scripts/kombify-vendor-packages.mjs; do not edit)
  "@kombify/notifications": "file:third_party/npm/cloud-notifications-0.3.137.tgz"
  "@kombiverselabs/ai-sdk": "file:third_party/npm/ai-sdk-0.14.11.tgz"
  "@kombiverselabs/cloud-notifications": "file:third_party/npm/cloud-notifications-0.3.137.tgz"
  "@kombiverselabs/design": "file:third_party/npm/design-0.11.5.tgz"
  "@kombiverselabs/embed": "file:third_party/npm/embed-0.14.11.tgz"
  "@kombiverselabs/execution-contracts": "file:third_party/npm/execution-contracts-0.14.11.tgz"
  "@kombiverselabs/onboarding-core": "file:third_party/npm/onboarding-core-0.11.5.tgz"
  "@kombiverselabs/speechkit-voiceagent-client": "file:third_party/npm/speechkit-voiceagent-client-0.77.16.tgz"
  "@kombiverselabs/ui": "file:third_party/npm/ui-0.11.5.tgz"
  # kombify-vendor:end
  cookie@<0.7.0: ">=0.7.2"
  # Force-patch transitive dev-tool vulns (vitest/wrangler/miniflare -> ws/undici).
  # GHSA-96hv-2xvq-fx4p (ws DoS), GHSA-vmh5-mc38-953g / vxpw-j846-p89q / hm92-r4w5-c3mj (undici).
  ws@>=8.0.0 <8.21.0: ">=8.22.0"
  undici@>=7.0.0 <7.28.0: ">=7.30.1"
  # jsdom@29.1.1 uses undici/lib/handler/wrap-handler.js, which was removed in
  # undici 8.x, so jsdom's undici must stay on the 7.x line. 7.28.0 (released
  # since the original 7.27.2 pin) patches the three 2026-07 high advisories
  # while keeping wrap-handler.js. jsdom is dev-only (not shipped).
  "jsdom>undici": ">=7.28.0 <8.0.0"
  # 2026-07-24 high advisories (platform-3nbia): brace-expansion DoS
  # (GHSA-3jxr-9vmj-r5cp), js-yaml merge-key DoS (GHSA-52cp-r559-cp3m;
  # GHSA-2883-xcg3-v3hh needs 4.3.2),
  # sharp <0.35.0.
  brace-expansion@1: 5.0.12
  brace-expansion@5: 5.0.12
  postcss@<=8.5.17: ">=8.5.29"
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2 <5.0.0"
  sharp@<0.35.0: ">=0.35.5"
minimumReleaseAgeExclude:
  # First-party packages are published from the governed Kombify delivery lane.
  - "@kombiverselabs/*"
